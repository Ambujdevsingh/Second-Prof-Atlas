<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Second Prof Atlas · MBBS Phase II</title>
<meta name="description" content="Free MBBS 2nd-year learning platform: Pathology, Microbiology, Pharmacology, Community Medicine and FMT with flowcharts, exam radar, quizzes, planner and AI tutor.">
<meta name="theme-color" content="#1F4FD1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F4FD1'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EII%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head><body>
<style>
/* Layout: app shell — slim stain-rack sidebar + scrolling study desk; phone gets bottom tab bar.
   Palette from the histology bench: hematoxylin ink, eosin pink, crystal violet, capsule teal. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F3F6FB; --ink:#0F1222; --muted:#3F4660; --line:#D5DCE8;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E8EFFF;
  --path:#C2185B; --path-soft:#FDECF3; --micro:#6534D6; --micro-soft:#F1EBFF; --pharm:#00796B; --pharm-soft:#E2F5F2;
  --cm:#2E7D32; --cm-soft:#E8F5E9; --fmt:#B45309; --fmt-soft:#FFF3E3;
  --good:#1E7B34; --warn:#B26A00; --bad:#C62828; --star:#E09600;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgba(15,18,34,.05), 0 4px 14px rgba(15,18,34,.06);
  color-scheme:light;
}
/* Single bright theme by request: white pages, coloured subject accents. */

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:1.0625rem; line-height:1.65; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display); line-height:1.15; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,3.2vw,2.4rem); font-weight:800}
h2{font-size:1.35rem; font-weight:700}
h3{font-size:1.08rem; font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--f-mono); font-size:.78rem; letter-spacing:.04em; text-transform:uppercase}
.muted{color:var(--muted)}

/* shell */
.app{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100%}
.side{background:#FAFBFE;position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px)); overflow:auto; border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:18px}
.brand{display:flex; gap:10px; align-items:center; text-decoration:none}
.brand-mark{width:38px; height:38px; border-radius:10px; background:conic-gradient(from 200deg, var(--path), var(--micro), var(--pharm), var(--path)); display:grid; place-items:center; color:#fff; font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.brand b{font-family:var(--f-display); font-size:1.08rem; display:block; line-height:1.1}
.brand small{color:var(--muted); font-size:.78rem}
.nav{display:flex; flex-direction:column; gap:2px}
.nav .grp{margin:12px 8px 4px; color:var(--muted)}
.nav a{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; text-decoration:none; color:var(--ink); font-size:.95rem}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft); color:var(--accent); font-weight:700}
.dot{width:10px; height:10px; border-radius:50%; flex:none}
.xpcard{margin-top:auto; background:var(--sunk); border-radius:var(--r); padding:12px; display:flex; flex-direction:column; gap:6px}
.bar{height:8px; border-radius:6px; background:var(--line); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:6px; transition:width .4s}
.main{min-width:0; padding-block:22px 110px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.topbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.search{position:relative; flex:1; min-width:200px}
.search input{width:100%; padding:10px 14px 10px 38px; border:1px solid var(--line); border-radius:999px; background:var(--surface)}
.search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted)}
.results{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); z-index:20; max-height:60vh; overflow:auto}
.results a{display:block; padding:10px 14px; text-decoration:none; border-bottom:1px solid var(--line)}
.results a:hover{background:var(--sunk)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--sunk); font-size:.82rem; white-space:nowrap}
.streak{font-family:var(--f-mono); font-size:.85rem; padding:6px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line)}
.tabbar{display:none}

/* surfaces */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow)}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:10px}
.between{justify-content:space-between}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:700; font-size:.92rem; text-decoration:none; transition:transform .12s, background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.pri:hover{filter:brightness(1.08); background:var(--accent)}
.btn.sm{padding:5px 10px; font-size:.82rem; border-radius:8px}
.btn.ghost{border-color:transparent; background:transparent}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-size:.85rem; font-weight:700; color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); width:100%}
textarea{resize:vertical; min-height:96px}
.eyebrow{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* subject theming */
[data-s="path"]{--sc:var(--path); --ss:var(--path-soft)}
[data-s="micro"]{--sc:var(--micro); --ss:var(--micro-soft)}
[data-s="pharm"]{--sc:var(--pharm); --ss:var(--pharm-soft)}
[data-s="cm"]{--sc:var(--cm); --ss:var(--cm-soft)}
[data-s="fmt"]{--sc:var(--fmt); --ss:var(--fmt-soft)}
.subj{position:relative; display:flex; flex-direction:column; gap:10px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; overflow:hidden}
.subj::after{content:""; position:absolute; right:-28px; top:-28px; width:96px; height:96px; border-radius:50%; background:var(--ss)}
.subj > *{position:relative; z-index:1}
.subj::after{z-index:0}
.subj .bar>i{background:var(--sc)}
.subj:hover{border-color:var(--sc)}
.tag{display:inline-block; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.06em; padding:2px 7px; border-radius:6px; font-weight:700}
.tag.L{background:var(--path-soft); color:var(--path)}
.tag.S{background:var(--micro-soft); color:var(--micro)}
.tag.D{background:var(--pharm-soft); color:var(--pharm)}
.tag.N{background:var(--fmt-soft); color:var(--fmt)}
.stars{color:var(--star); letter-spacing:1px; font-size:.85rem; white-space:nowrap}
.stars i{color:var(--line); font-style:normal}

/* hero */
.hero{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:18px; align-items:stretch}
.hero-main{background:linear-gradient(180deg,var(--accent-soft),#FFFFFF 70%); color:var(--ink); border:1px solid var(--line); border-top:6px solid transparent; border-image:linear-gradient(90deg,var(--path),var(--micro),var(--pharm),var(--cm),var(--fmt)) 1; border-radius:0; padding:24px; display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden}
.hero-main .cells{position:absolute; inset:0; pointer-events:none; opacity:.10; color:var(--accent)}
.hero-main h1{color:var(--accent)}
.hero-main > *{position:relative}
.hero-main p{max-width:52ch; opacity:.92}
.hero-main .btn{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.hero-main .btn.ghost{background:var(--surface); color:var(--accent); border:1.5px solid var(--accent)}

/* roadmap trail */
.trail{display:flex; flex-direction:column; gap:0; position:relative; padding:6px 0}
.stop{display:grid; grid-template-columns:56px minmax(0,1fr); gap:14px; align-items:start; position:relative; padding-bottom:18px; text-decoration:none}
.stop::before{content:""; position:absolute; left:27px; top:46px; bottom:-2px; width:3px; background:repeating-linear-gradient(var(--line) 0 6px, transparent 6px 11px)}
.stop:last-child::before{display:none}
.stop .node{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:3px solid var(--sc); font-family:var(--f-display); font-weight:800; font-size:1.15rem; color:var(--sc)}
.stop.done .node{background:var(--sc); color:#FFFFFF}
.stop .body{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0}
.stop:hover .body{border-color:var(--sc)}
.heat{display:flex; gap:3px}
.heat i{width:14px; height:6px; border-radius:3px; background:var(--line)}
.heat i.on{background:var(--sc)}

/* chapter */
.ch-head{display:flex; flex-direction:column; gap:10px; padding:22px; border-radius:16px; background:var(--ss); border:1px solid var(--line)}
.ch-head .crumbs{font-size:.88rem}
.ch-head .crumbs a{color:var(--sc); font-weight:700; text-decoration:none}
.tabs{display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); padding:8px 0; position:sticky; top:env(safe-area-inset-top,0px); z-index:6; background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.tabs button{border:none; background:transparent; padding:8px 14px; border-radius:9px; font-weight:700; color:var(--muted)}
.tabs button.on{background:var(--surface); color:var(--ink); box-shadow:inset 0 -3px 0 var(--sc, var(--accent))}
.concepts{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; counter-reset:c}
.concepts li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px}
.concepts li::before{counter-increment:c; content:counter(c); width:26px; height:26px; border-radius:50%; background:var(--ss); color:var(--sc); display:grid; place-items:center; font-weight:800; font-family:var(--f-display); font-size:.9rem}
.topic{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line)}
.topic:last-child{border-bottom:none}
.topic .acts{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.inline-ai{grid-column:1/-1}

/* flowchart */
.flow{display:flex; flex-direction:column; align-items:center; gap:0; padding:8px 0}
.fbox{background:var(--surface); border:2px solid var(--sc, var(--accent)); border-radius:12px; padding:10px 16px; text-align:center; max-width:560px; width:100%; font-weight:700; transition:filter .3s}
.fbox.key{background:var(--sc, var(--accent)); color:#FFFFFF}
.arrow{width:2px; height:22px; background:var(--sc, var(--accent)); position:relative; flex:none}
.arrow::after{content:""; position:absolute; bottom:-2px; left:50%; transform:translateX(-50%); border:6px solid transparent; border-top:8px solid var(--sc, var(--accent)); border-bottom:0}
.fbranch{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; width:100%; max-width:900px}
.fcol{background:var(--ss, var(--sunk)); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0; transition:filter .3s}
.fcol > .fh{font-family:var(--f-display); font-weight:800; color:var(--sc, var(--accent))}
.fcol > .fl{font-size:.9rem; background:var(--surface); border-radius:8px; padding:6px 8px}
.fcol .fbranch{grid-template-columns:1fr}
.recall .fbox:not(.shown), .recall .fcol:not(.shown){filter:blur(6px); cursor:pointer; user-select:none}

/* flashcards */
.deck{display:flex; flex-direction:column; align-items:center; gap:14px}
.fcard{width:100%; max-width:560px; aspect-ratio:16/10; max-height:340px; perspective:1200px; cursor:pointer; border:none; background:none; padding:0}
.fcard .in{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; padding:22px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; text-align:center; border:1px solid var(--line); overflow:auto}
.fcard .front{background:var(--surface); font-family:var(--f-display); font-size:1.25rem; font-weight:700}
.fcard .back{background:var(--ss, var(--accent-soft)); transform:rotateY(180deg); font-size:1.05rem}

/* quiz */
.q{display:flex; flex-direction:column; gap:12px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); font-weight:400}
.opt b{font-family:var(--f-mono); color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 12%, var(--surface))}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 10%, var(--surface))}
.explain{background:var(--sunk); border-radius:10px; padding:12px 14px; font-size:.95rem}
.timer{font-family:var(--f-mono); font-size:1.1rem; font-weight:700}
.score{font-family:var(--f-display); font-size:3rem; font-weight:800; line-height:1}

/* AI */
.ai-out{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; min-height:60px; overflow-wrap:anywhere}
.ai-out:empty{display:none}
.ai-out h1,.ai-out h2,.ai-out h3,.ai-out h4{margin:14px 0 6px; font-size:1.05rem}
.ai-out p{margin:6px 0}
.ai-out ul,.ai-out ol{margin:6px 0; padding-left:22px}
.ai-out li{margin:3px 0}
.ai-out code{font-family:var(--f-mono); background:var(--sunk); padding:1px 5px; border-radius:4px; font-size:.88em}
.ai-out table{border-collapse:collapse; margin:8px 0; font-size:.92rem}
.ai-out .tbl{overflow-x:auto}
.ai-out th,.ai-out td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top}
.ai-out th{background:var(--sunk)}
.thinking{display:inline-flex; gap:8px; align-items:center; color:var(--muted)}
.thinking i{width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite alternate}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes pulse{from{opacity:.25; transform:scale(.8)} to{opacity:1; transform:scale(1)}}
.aibadge{display:inline-flex; gap:6px; align-items:center; font-size:.8rem; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:700}
.aibadge.off{background:var(--sunk); color:var(--muted)}
.tool{display:flex; flex-direction:column; gap:8px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.tool:hover{border-color:var(--accent)}
.tool .ic{width:40px; height:40px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent)}
.chat{display:flex; flex-direction:column; gap:10px}
.msg{max-width:92%; padding:10px 14px; border-radius:14px}
.msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px}
.msg.bot.ai-out{max-width:92%}
.mic{width:120px; height:120px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 0 0 0 var(--accent-soft)}
.mic.live{animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent)}100%{box-shadow:0 0 0 26px transparent}}
.note{font-size:.88rem; color:var(--muted)}
.notice{border-left:4px solid var(--warn); background:var(--sunk); padding:10px 14px; border-radius:8px; font-size:.92rem}

/* plan */
.day{display:grid; grid-template-columns:86px minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
.day.today{background:var(--accent-soft); border-radius:10px; padding:10px; border:none}
.day .d{font-family:var(--f-mono); font-size:.8rem}
.task{display:flex; gap:8px; align-items:flex-start; padding:3px 0}
.task input{margin-top:5px; accent-color:var(--accent)}
.task.done span{text-decoration:line-through; color:var(--muted)}
.check{display:flex; gap:8px; align-items:center; font-size:.92rem}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--accent); color:#FFFFFF; padding:10px 18px; border-radius:999px; font-weight:700; z-index:60; box-shadow:var(--shadow)}
.ring{--p:0; width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--sc,var(--accent)) calc(var(--p)*1%), var(--line) 0); display:grid; place-items:center; flex:none}
.ring span{width:50px; height:50px; border-radius:50%; background:var(--surface); display:grid; place-items:center; font-family:var(--f-mono); font-size:.8rem; font-weight:700}
.tablewrap{overflow-x:auto}
table.plain{border-collapse:collapse; width:100%; font-size:.93rem}
table.plain th,table.plain td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
table.plain th{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
canvas#confetti{position:fixed; inset:0; pointer-events:none; z-index:70}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .tabbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px)); justify-content:space-around}
  .tabbar .tabmore{border:none; background:none; font:inherit}
  .tabbar a, .tabbar .tabmore{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.7rem; text-decoration:none; color:var(--muted); padding:4px 8px; border-radius:8px; font-weight:700}
  .tabbar a.on{color:var(--accent)}
  .tabbar .tabmore{font-size:.7rem; color:var(--muted); padding:4px 8px; flex-direction:column; align-items:center; gap:2px; font-weight:700}
  .topic{grid-template-columns:minmax(0,1fr)}
  .topic .acts{justify-content:flex-start}
  .day{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ---- usability layer ---- */
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.concepts li{grid-template-columns:30px minmax(0,1fr) auto; align-items:start; transition:background .2s, border-color .2s}
.concepts li.got{background:var(--ss); border-color:var(--sc)}

core:["Acute inflammation = vascular events (transient vasoconstriction → vasodilatation → increased permeability → stasis) + cellular events (margination, rolling, adhesion, transmigration, chemotaxis, phagocytosis).","Rolling = selectins; firm adhesion = integrins (ICAM-1, VCAM-1); transmigration = PECAM-1 (CD31).","Mediators: histamine (immediate permeability), PGs (pain, fever via PGE2), leukotrienes (LTB4 chemotaxis; LTC4/D4/E4 bronchospasm), cytokines IL-1/TNF (fever, acute phase), C3a/C5a, bradykinin (pain).","Granuloma = epithelioid cells (activated macrophages) ± Langhans giant cells, lymphocyte rim, ± caseation. Seen in TB, leprosy, sarcoid, fungal, syphilis (gumma), cat-scratch.","Primary TB: Ghon focus + hilar node = Ghon complex. Secondary TB: apical (Simon/Assmann foci), cavitation.","Healing: first intention (clean incised wound, minimal granulation tissue, thin scar) vs second intention (large gap, more granulation tissue, wound contraction by myofibroblasts)."],
flow:{t:"Sequence of acute inflammation",n:["Injury / microbes detected","Transient arteriolar vasoconstriction","Vasodilatation (histamine, NO) → redness, heat","Increased permeability → exudate → swelling","Stasis → leukocyte margination","Rolling (selectins) → Adhesion (integrins) → Transmigration (PECAM-1)","Chemotaxis (C5a, LTB4, IL-8, bacterial products)","Phagocytosis & killing (O₂-dependent MPO system)",{b:[["Resolution"],["Abscess / scar"],["Chronic inflammation"]]}]},
hy:["First vascular response in acute inflammation?::Transient vasoconstriction of arterioles","Molecule responsible for leukocyte rolling?::Selectins (E-, P-, L-selectin)","Most important chemotactic agents?::C5a, LTB4, IL-8, N-formyl peptides","Epithelioid cells are derived from?::Activated macrophages (IFN-γ driven)","Langhans giant cell nuclei arrangement?::Horseshoe at the periphery (foreign body cells: scattered)","Myofibroblasts cause?::Wound contraction in healing by second intention","Principal mediator of fever?::IL-1 and TNF → PGE2 in hypothalamus","Ghon complex?::Subpleural Ghon focus + caseating hilar lymph node"],
mcq:[["Rolling of leukocytes on endothelium is mediated mainly by:",["Integrins","Selectins","PECAM-1","Immunoglobulins"],1,"Selectins cause weak, transient binding (rolling); integrins give firm adhesion."],["Epithelioid cells in a granuloma are modified:",["Lymphocytes","Neutrophils","Macrophages","Fibroblasts"],2,"Epithelioid cells are activated macrophages with abundant pink cytoplasm."],["Healing by first intention is seen in:",["Infected ulcer","Clean surgical incision","Large burn","Abscess cavity"],1,"Clean, approximated wound edges heal by primary union with a thin scar."]]},

core:["Neoplasm = abnormal mass with excessive, uncoordinated growth that persists after the stimulus stops.","Benign vs malignant: differentiation, rate of growth, local invasion, metastasis (the single best criterion of malignancy).","Hallmarks: self-sufficient growth signals, insensitivity to growth inhibitors, evasion of apoptosis, limitless replication (telomerase), angiogenesis, invasion/metastasis, metabolic reprogramming (Warburg), immune evasion.","Oncogenes (gain of function, one allele): RAS, MYC, ERBB2, BCR-ABL. Tumour suppressors (loss, two hits): RB (13q14, G1→S brake), p53 (17p13, 'guardian of the genome').","Chemical carcinogenesis: initiation (irreversible mutation) → promotion (reversible proliferation) → progression.","Grading = degree of differentiation; staging (TNM) = extent of spread. Staging has more prognostic value.","Diagnosis: histopathology (gold standard), FNAC, frozen section, IHC, flow cytometry, molecular tests, tumour markers."],
flow:{t:"Invasion–metastasis cascade",n:["Transformed clone grows","Loosening of cells (loss of E-cadherin)","Degradation of basement membrane & ECM (MMPs, cathepsins)","Attachment to new ECM (laminin, fibronectin receptors)","Migration & intravasation into vessels","Tumour emboli shielded by platelets","Extravasation at distant site","Colonisation, angiogenesis (VEGF)",{k:"Metastatic deposit: lymphatic (carcinoma), haematogenous (sarcoma), transcoelomic (ovary)"}]},

mcq:[["The single most reliable criterion of malignancy is:",["Pleomorphism","High mitotic rate","Metastasis","Necrosis"],2,"Only malignant tumours metastasise (except a few locally aggressive ones like BCC that rarely do)."],["E6 protein of HPV inactivates:",["RB","p53","BRCA1","APC"],1,"E6 degrades p53; E7 binds RB."],["Ectopic ACTH production is most commonly seen in:",["Squamous cell ca lung","Small cell ca lung","Adenocarcinoma lung","Carcinoid of appendix"],1,"Small cell (neuroendocrine) carcinoma produces ACTH and ADH."]]},

core:["Down syndrome: trisomy 21, mostly maternal meiotic non-disjunction; flat facies, simian crease, ASD/AVSD, duodenal atresia, ↑ ALL/AML-M7, early Alzheimer's.","Klinefelter: 47,XXY → tall, hypogonadism, gynaecomastia, infertility, Barr body present. Turner: 45,X → short stature, webbed neck, streak ovaries, coarctation of aorta, no Barr body.","Inheritance: AD (structural proteins: Marfan, ADPKD, familial hypercholesterolaemia, FAP), AR (enzymes: CF, PKU, sickle cell, thalassaemia, storage diseases), X-linked recessive (haemophilia, DMD, G6PD).","Lysosomal storage: Gaucher (glucocerebrosidase; 'crumpled tissue paper' cells), Niemann-Pick (sphingomyelinase; foamy cells, cherry-red spot), Tay-Sachs (hexosaminidase A; cherry-red spot, no organomegaly), Pompe (acid maltase; cardiomegaly).","Kwashiorkor: protein lack with adequate calories → oedema, fatty liver, flaky-paint skin, flag sign hair. Marasmus: calorie lack → severe wasting, no oedema.","TORCH: Toxoplasma, Others (syphilis, VZV, parvovirus B19), Rubella, CMV, HSV."],

core:["Morphologic classification: microcytic hypochromic (IDA, thalassaemia, sideroblastic, ACD), normocytic (haemolytic, aplastic, acute blood loss, ACD), macrocytic (megaloblastic: B12/folate; non-megaloblastic: liver disease, alcohol).","IDA: ↓ ferritin (best single test), ↑ TIBC, ↓ transferrin saturation, ↓ serum iron, pencil cells. In India think nutritional deficiency, hookworm, menstrual loss.","Megaloblastic: macro-ovalocytes, hypersegmented neutrophils (earliest sign), megaloblasts in marrow, nuclear-cytoplasmic asynchrony. B12 deficiency adds neurological damage (SACD).","Haemolysis signs: ↑ unconjugated bilirubin, ↑ LDH, ↑ reticulocytes, ↓ haptoglobin, urinary urobilinogen.","Sickle cell: HbS (β6 Glu→Val); sickling on deoxygenation → vaso-occlusive crises, autosplenectomy, protection against falciparum malaria.","β-thalassaemia major: ↑ HbF, target cells, hair-on-end/crew-cut skull X-ray, transfusion-dependent with iron overload. Trait: HbA2 >3.5%, Mentzer index <13."],

core:["Screen: platelet count, BT (platelet function), PT (extrinsic: VII, common), aPTT (intrinsic: XII, XI, IX, VIII, common).","ITP: autoantibodies against GP IIb/IIIa; ↓ platelets, ↑ BT, normal PT/aPTT, ↑ megakaryocytes in marrow.","TTP: ADAMTS13 deficiency → large vWF multimers; pentad of fever, thrombocytopenia, MAHA (schistocytes), renal and neurological dysfunction.","Haemophilia A (VIII) and B (IX): X-linked recessive; ↑ aPTT, normal PT & BT; haemarthrosis.","vWD: most common inherited bleeding disorder (AD); ↑ BT and may ↑ aPTT; defective ristocetin aggregation.","DIC: consumption of platelets & factors → ↑ PT, ↑ aPTT, ↓ platelets, ↓ fibrinogen, ↑ D-dimer, schistocytes. Causes: sepsis, APL, obstetric (abruptio placentae, amniotic fluid embolism), snake bite, trauma."],

core:["Atherosclerosis (response-to-injury): endothelial injury → LDL accumulation & oxidation → monocyte entry → foam cells → platelet adhesion → PDGF, FGF → smooth muscle migration & proliferation → fibrofatty plaque with fibrous cap.","Risk factors: modifiable (dyslipidaemia, hypertension, smoking, diabetes, obesity), non-modifiable (age, male sex, family history). Most affected: abdominal aorta > coronaries > popliteal > ICA > circle of Willis.","MI timeline: 4–12 h coagulative necrosis begins → 12–24 h contraction bands → 1–3 d neutrophils → 3–7 d macrophages (weakest, rupture risk) → 7–10 d granulation tissue → 2–8 wk scar.","Cardiac markers: Troponin I/T most specific (up 3–4 h, stays 7–10 d). CK-MB up 3–4 h, normal by 48–72 h, so it is useful for re-infarction.","Rheumatic fever: group A streptococcal pharyngitis → molecular mimicry (M protein). Aschoff bodies with Anitschkow (caterpillar) cells; mitral > aortic; fish-mouth stenosis; MacCallum plaque. Jones criteria.","Infective endocarditis: acute (S. aureus, normal valves, IV drug users → tricuspid) vs subacute (Strep viridans, damaged valves). Signs: Osler nodes, Janeway lesions, Roth spots, splinter haemorrhages."],
flow:{t:"Pathogenesis of atherosclerosis",n:["Chronic endothelial injury (hyperlipidaemia, HTN, smoking, DM)","↑ Permeability, leukocyte adhesion molecules (VCAM-1)","LDL enters intima & is oxidised","Monocytes → macrophages engulf ox-LDL → foam cells (fatty streak)","Platelet adhesion; PDGF, FGF, TGF-β released","Smooth muscle migration & proliferation, ECM, collagen","Fibrofatty atheroma with fibrous cap & necrotic core",{b:[["Rupture → thrombosis → MI/stroke"],["Haemorrhage into plaque"],["Calcification"],["Aneurysm"],["Embolism"]]}]},

core:["COPD = chronic bronchitis + emphysema. Chronic bronchitis: productive cough ≥3 months in 2 consecutive years; Reid index >0.4 ('blue bloaters').","Emphysema: centriacinar (smokers, upper lobes) vs panacinar (α1-antitrypsin deficiency, lower lobes). 'Pink puffers'.","Asthma: reversible bronchospasm, Th2/IgE; Curschmann spirals, Charcot-Leyden crystals, eosinophils, thick basement membrane.","Bronchiectasis: permanent dilatation of bronchi from obstruction + infection (CF, Kartagener, post-TB); copious foul sputum.","Lobar pneumonia (S. pneumoniae) stages: congestion → red hepatisation → grey hepatisation → resolution.","Lung cancer: adenocarcinoma is most common overall (peripheral, women & non-smokers); squamous cell (central, smokers, PTHrP hypercalcaemia, cavitation); small cell (central, ACTH, SIADH, Lambert-Eaton). Pancoast tumour → Horner syndrome."],

core:["S. aureus: Gram+ cocci in clusters, catalase+, coagulase+, golden colonies, mannitol fermenting. Toxins: α-haemolysin, PVL, TSST-1, enterotoxin (food poisoning in 1–6 h), exfoliative toxin (SSSS). MRSA carries mecA (PBP2a) → vancomycin/linezolid.","Streptococcus pyogenes (group A, β-haemolytic, bacitracin sensitive): pharyngitis, impetigo, cellulitis; non-suppurative sequelae: rheumatic fever, PSGN. Group B (S. agalactiae): CAMP+, neonatal sepsis/meningitis.","Pneumococcus: lanceolate diplococci, capsule (Quellung), α-haemolytic, draughtsman colonies, optochin sensitive, bile soluble, inulin fermenting (vs viridans: optochin resistant, bile insoluble).","C. diphtheriae: club-shaped rods with metachromatic (Babes-Ernst) granules, Chinese-letter arrangement; Loeffler serum slope (rapid), potassium tellurite agar (black colonies); toxin via β-phage (lysogenic conversion) inhibits EF-2. Elek test = in-vitro toxigenicity.","B. anthracis: large Gram+ bacilli in chains (bamboo stick), Medusa-head colonies, inverted fir-tree in gelatin stab, polypeptide (D-glutamate) capsule, McFadyean reaction. Woolsorters' disease (inhalational).","C. tetani: drumstick spores (terminal, round), tetanospasmin blocks GABA/glycine release at inhibitory interneurons → spastic paralysis. C. perfringens: Nagler reaction (α-toxin lecithinase), reverse CAMP, gas gangrene. C. botulinum: blocks acetylcholine release → flaccid paralysis."],

core:["Neisseria: Gram− kidney-shaped diplococci, oxidase+. Meningococcus ferments glucose + maltose, has capsule; gonococcus ferments glucose only, no capsule. Culture: chocolate agar, Thayer-Martin.","E. coli pathotypes: ETEC (traveller's diarrhoea; LT & ST toxins), EPEC (infant diarrhoea), EHEC O157:H7 (Shiga-like toxin, HUS; sorbitol non-fermenter on SMAC), EIEC (dysentery), EAEC. Commonest cause of UTI.","Salmonella Typhi: motile, non-lactose fermenter, H2S+, Vi capsule. Diagnosis by week: 1st week blood culture (best), 2nd week Widal, 3rd week stool/urine culture; bone marrow culture most sensitive. Carriers in gall bladder.","Shigella: non-motile NLF; S. dysenteriae type 1 makes Shiga toxin. Low infective dose (10–100 bacilli).","V. cholerae: comma-shaped, darting motility, TCBS (yellow colonies), cholera toxin ↑ cAMP → rice-water stools. El Tor: VP+, haemolytic, polymyxin B resistant, agglutinates chick RBCs; Classical: opposite.","Pseudomonas: oxidase+, non-fermenter, pyocyanin (blue-green), grape-like odour; burns, ventilator pneumonia, CF. Haemophilus influenzae needs X (haemin) and V (NAD) factors; satellitism around S. aureus."],

core:["M. tuberculosis: acid-fast (mycolic acid), slow growth (generation time ~18 h); LJ medium (dry, rough, buff, 'breadcrumb' colonies in 2–8 wk); niacin+, nitrate reduction+, heat-labile catalase. Ziehl-Neelsen stain uses 20% H2SO4.","Lab diagnosis of TB: smear (ZN, fluorescent auramine), culture (LJ, liquid MGIT), CBNAAT/GeneXpert (MTB + rifampicin resistance in 2 h), LPA, IGRA.","Tuberculin (Mantoux): 5 TU PPD intradermal, read at 48–72 h; induration ≥10 mm positive; shows infection/sensitisation, not active disease.","M. leprae: not cultivable on artificial media (mouse footpad, armadillo); 5% H2SO4 for ZN; lepromin test is prognostic, not diagnostic (Mitsuda reaction at 3–4 wk).","T. pallidum: thin spirochaete, seen by dark-ground microscopy; non-cultivable. Non-treponemal tests (VDRL, RPR) for screening and follow-up; treponemal tests (TPHA, FTA-ABS) for confirmation.","Chlamydia: obligate intracellular, elementary body (infective) and reticulate body (replicating). Serotypes A–C trachoma, D–K genital, L1–L3 LGV. Weil-Felix uses Proteus OX antigens for rickettsiae."],
flow:{t:"Lab diagnosis of pulmonary TB (current Indian practice)",n:["Presumptive TB: cough ≥2 wk, fever, weight loss",{b:[["Sputum ×2 for microscopy","ZN / fluorescent stain"],["NAAT: CBNAAT / Truenat","MTB + rifampicin resistance"]]},{b:[["MTB detected, Rif sensitive","Drug-sensitive TB regimen"],["Rif resistant","LPA / liquid culture DST","MDR/RR-TB regimen"]]},{k:"Culture on LJ / MGIT remains gold standard"}]},

mcq:[["Mycobacterium leprae is decolourised with:",["20% H2SO4","5% H2SO4","1% H2SO4","Acid alcohol 3%"],1,"M. leprae is less acid-fast, so 5% acid is used."],["Organism with no cell wall:",["Chlamydia","Mycoplasma","Rickettsia","Treponema"],1,"Mycoplasma lacks peptidoglycan; it has sterols in its membrane."],["Non-treponemal test for syphilis:",["TPHA","FTA-ABS","VDRL","TPI"],2,"VDRL uses cardiolipin antigen."]]},

topics:[["Replication of viruses",1,""],["Cultivation of viruses",4,""],["Interaction between viruses (interference)",1,""],["Inclusion bodies",2,""],["Bacteriophage: morphology, life cycle",1,""],["Herpes virus: classification, infection, pathogenesis, lab diagnosis",0,""],["Cytomegalovirus (CMV) and EBV",0,"S"],["Oncogenic viruses: enumerate",0,""],["Viruses associated with human cancer",0,""]],
core:["Replication steps: adsorption → penetration → uncoating → biosynthesis (eclipse phase) → assembly/maturation → release (lysis or budding).","Cultivation: animal inoculation (suckling mice), embryonated egg (chorioallantoic membrane: pocks of variola/HSV; amniotic & allantoic cavities: influenza; yolk sac: chlamydia, rickettsia), tissue culture (primary, diploid, continuous cell lines). Detection: CPE, haemadsorption, interference, transformation.","Inclusion bodies: Negri (rabies, cytoplasmic, hippocampus/Purkinje), Guarnieri (vaccinia, cytoplasmic), Cowdry type A (herpes, intranuclear), owl's eye (CMV, intranuclear), Henderson-Paterson (molluscum).","Herpes family: HSV-1, HSV-2, VZV, CMV, EBV, HHV-6/7, HHV-8; latency (HSV in sensory ganglia, VZV in dorsal root ganglia, EBV in B cells, CMV in monocytes).","EBV: infectious mononucleosis, Burkitt lymphoma, nasopharyngeal carcinoma, Hodgkin; heterophile (Paul-Bunnell) test. CMV: commonest congenital viral infection, owl's eye inclusions, retinitis in AIDS.","Oncogenic viruses: DNA (HPV, HBV, EBV, HHV-8, Merkel cell polyomavirus), RNA (HTLV-1, HCV)."],

core:["OPV (Sabin): live, oral, intestinal + humoral immunity, cheap, herd effect, risk of VAPP/cVDPV. IPV (Salk): killed, injectable, humoral only, no VAPP. India now gives bOPV + fractional IPV.","Antigenic drift: point mutations in HA/NA → minor changes → epidemics (influenza A & B). Antigenic shift: genetic reassortment → new subtype → pandemics (influenza A only).","Orthomyxo (influenza): segmented genome, HA and NA on separate spikes, smaller. Paramyxo (measles, mumps, RSV, parainfluenza): non-segmented, larger, HN or F proteins, syncytia.","Dengue: flavivirus, Aedes aegypti; DENV 1–4; severe dengue with secondary infection by another serotype (antibody-dependent enhancement). Tests: NS1 antigen (day 1–5), IgM ELISA (after day 5). JE: Culex, pigs amplifiers, ardeid birds reservoir.","Rabies: bullet-shaped rhabdovirus; travels along nerves; Negri bodies; diagnosis by corneal impression smear / skin biopsy (IF), RT-PCR. Post-exposure: wound wash with soap 15 min, vaccine (cell culture, Essen/ID Thai Red Cross), RIG for category III.","HIV: retrovirus with reverse transcriptase; gp120 binds CD4. Diagnosis: ELISA/rapid tests (3 different strategies in India), Western blot (rarely now), p24 antigen, viral load (RT-PCR), CD4 count. Opportunistic: Pneumocystis, TB, Candida, Cryptococcus, Toxoplasma, CMV, MAC."],
flow:{t:"Influenza variation",n:["Influenza A has HA & NA antigens",{b:[["Point mutations in HA/NA genes","Antigenic DRIFT","Gradual, minor change","Influenza A and B","Seasonal epidemics, yearly vaccine update"],["Reassortment of genome segments (human + avian/swine)","Antigenic SHIFT","Abrupt, major change → new subtype","Influenza A only","Pandemics (1918 H1N1, 2009 H1N1)"]]}]},

mcq:[["Pandemics of influenza are due to:",["Antigenic drift","Antigenic shift","Point mutation","Defective interfering particles"],1,"Reassortment produces a new HA/NA subtype."],["Which polio vaccine gives intestinal (mucosal) immunity?",["IPV","OPV","Both equally","Neither"],1,"Live oral vaccine multiplies in gut and induces secretory IgA."],["Best test for dengue on day 2 of fever:",["IgG ELISA","IgM ELISA","NS1 antigen","Widal"],2,"NS1 is detectable early; IgM appears after day 5."]]},

topics:[["Entamoeba histolytica: morphology, culture, life cycle, pathogenesis, clinical",2,"L"],["Amoebic vs bacillary dysentery",2,"D"],["Giardia lamblia",1,"S"],["Trichomonas vaginalis",1,"S"],["Leishmania donovani: morphology, culture, life cycle, pathogenesis, lab diagnosis, clinical",4,"L"],["Chagas' disease",0,"S"],["Plasmodium: life cycle, clinical features, pathogenesis, lab diagnosis",5,"L"],["Complications of P. falciparum",4,""],["Toxoplasma gondii: morphology, life cycle, pathogenesis, lab diagnosis",4,"L"],["T. solium vs T. saginata",2,"D"],["Hydatid cyst and Casoni test",1,"S"],["Ascaris lumbricoides: morphology, life cycle, pathogenesis, lab diagnosis, clinical",4,"L"],["Hookworm (Ancylostoma duodenale)",5,"L"],["NIH swab",1,"S"],["W. bancrofti: morphology, life cycle, pathogenesis, lab diagnosis",0,"L"],["Enumerate: viviparous, oviparous, ovo-viviparous nematodes; parasites infecting intestine; larva migrans; bile-stained eggs; eggs that float / do not float in saturated salt",2,""]],
core:["E. histolytica: cyst (quadrinucleate, infective) and trophozoite (ingested RBCs, invasive). Flask-shaped ulcers in caecum; amoebic liver abscess with 'anchovy sauce' pus. Charcot-Leyden crystals in stool.","Plasmodium life cycle: sporozoites (mosquito bite) → liver (exo-erythrocytic schizogony; hypnozoites in vivax & ovale) → RBC (erythrocytic schizogony) → gametocytes → mosquito (sexual cycle, sporogony). Man = intermediate host; female Anopheles = definitive host.","Falciparum: multiple ring forms, appliqué/accolé forms, banana-shaped gametocytes; complications: cerebral malaria, severe anaemia, blackwater fever, ARDS, hypoglycaemia, renal failure, algid malaria. Diagnosis: thick & thin smear (gold standard), RDT (HRP-2, pLDH).","Leishmania donovani: amastigote (LD body) in man, promastigote in sandfly (Phlebotomus argentipes). Kala-azar: fever, massive splenomegaly, hyperpigmentation; diagnosis by splenic aspirate (most sensitive), bone marrow, rK39 strip test; culture in NNN medium.","Hookworm: filariform larva penetrates skin; adults suck blood → iron-deficiency anaemia, ground itch. Ascaris: largest intestinal nematode, Loeffler's syndrome during lung migration, intestinal obstruction, bile-stained fertilised eggs.","T. solium (pork, armed scolex with hooks, causes cysticercosis; man can be intermediate host) vs T. saginata (beef, unarmed scolex). Hydatid (Echinococcus granulosus): dog definitive, man accidental intermediate; liver cyst; Casoni test is obsolete, serology/USG used."],
flow:{t:"Malaria parasite life cycle",n:["Female Anopheles bite injects sporozoites","Liver: exo-erythrocytic schizogony",{b:[["Merozoites released into blood"],["Hypnozoites (P. vivax, P. ovale) → relapse"]]},"RBC: ring → trophozoite → schizont → merozoites (fever paroxysm on rupture)","Some become male & female gametocytes","Mosquito ingests gametocytes → gametes → zygote → ookinete → oocyst","Sporozoites reach salivary glands",{k:"Man = intermediate host; mosquito = definitive host"}]},
hy:["Infective form of E. histolytica?::Mature quadrinucleate cyst","Anchovy-sauce pus?::Amoebic liver abscess","LD bodies?::Amastigotes of Leishmania donovani in macrophages","Vector of kala-azar?::Sandfly, Phlebotomus argentipes","Most sensitive diagnostic aspirate in kala-azar?::Splenic aspirate","Banana-shaped gametocytes?::Plasmodium falciparum","Relapse in malaria is due to?::Hypnozoites (P. vivax, P. ovale)","Parasite that causes cysticercosis?::Taenia solium (eggs ingested)","Bile-stained eggs?::Ascaris, Trichuris, Taenia, Clonorchis, Fasciola (non-bile-stained: hookworm, Enterobius, H. nana)","NIH swab is used for?::Enterobius vermicularis eggs (perianal)","Nocturnal periodicity of microfilaria?::W. bancrofti; collect blood 10 pm–4 am","Hookworm causes?::Iron-deficiency anaemia from blood sucking"],
mcq:[["Hypnozoites are found in:",["P. falciparum","P. malariae","P. vivax","P. knowlesi"],2,"P. vivax and P. ovale form dormant liver hypnozoites."],["Vector of kala-azar in India:",["Anopheles","Culex","Phlebotomus argentipes","Aedes"],2,"Sandfly transmits L. donovani."],["Man acts as intermediate host in:",["Ascaris","T. saginata","Cysticercosis by T. solium","Hookworm"],2,"Ingesting T. solium eggs makes man the intermediate host (cysticercosis)."]]},

core:["Morphological classification: yeasts (Cryptococcus), yeast-like (Candida: pseudohyphae), moulds/filamentous (dermatophytes, Aspergillus), dimorphic (Histoplasma, Blastomyces, Coccidioides, Sporothrix, Talaromyces: mould at 25 °C, yeast at 37 °C).","Lab diagnosis: KOH mount (skin, hair, nail), India ink (Cryptococcus capsule), LPCB for mould morphology, culture on Sabouraud dextrose agar, antigen tests (cryptococcal antigen, galactomannan), histopathology (PAS, GMS).","Dermatophytes: Trichophyton (skin, hair, nail), Microsporum (skin, hair), Epidermophyton (skin, nail). Wood's lamp fluorescence in some Microsporum.","Mycetoma (Madura foot): triad of painless swelling, sinuses, grains. Eumycetoma (fungal, black/white grains) vs actinomycetoma (bacterial, Nocardia/Actinomadura, more responsive to drugs).","Candida albicans: germ tube test positive, chlamydospores on cornmeal agar; thrush, vulvovaginitis, intertrigo, invasive candidiasis.","Cryptococcus neoformans: capsulated yeast, pigeon droppings, meningitis in AIDS; India ink, CrAg latex test. Aspergillus: acute-angle septate hyphae; ABPA, aspergilloma (fungal ball), invasive. Pneumocystis: AIDS (CD4 <200), GMS stain, cotrimoxazole."],

core:["UTI: E. coli is commonest. Collect clean-catch midstream urine; process within 1 h or refrigerate. Significant bacteriuria (Kass): ≥10⁵ CFU/mL. Semi-quantitative culture by calibrated loop on CLED/MacConkey.","Meningitis by age: neonates (Group B strep, E. coli, Listeria), children (pneumococcus, meningococcus, Hib), adults (pneumococcus, meningococcus), immunocompromised (Cryptococcus, Listeria). CSF: Gram stain, culture, latex agglutination, CBNAAT for TB.","STDs (syndromic approach): urethral discharge (gonococcus, chlamydia), genital ulcer (syphilis: painless; chancroid: painful; herpes; LGV; donovanosis), vaginal discharge (trichomonas, candida, bacterial vaginosis: clue cells, whiff test).","Antibiotic susceptibility: Kirby-Bauer disc diffusion (standard, CLSI/EUCAST zone diameters on Mueller-Hinton agar); Stokes method compares test organism with a control strain on the same plate; MIC by broth dilution/E-test.","Hospital infection control: hand hygiene (5 moments), biomedical waste segregation by colour code, standard precautions."],
flow:{t:"Urine culture workflow",n:["Clean-catch midstream urine (or catheter port aspirate)","Transport within 1 h / refrigerate 4 °C","Wet mount: pus cells > 10/HPF; Gram stain","Semi-quantitative culture with calibrated loop (CLED / MacConkey / blood agar)",{b:[["≥ 10⁵ CFU/mL single organism","Significant bacteriuria → ID + AST"],["< 10⁴ mixed growth","Likely contamination → repeat sample"]]}]},

core:["Bioavailability = fraction of unchanged drug reaching systemic circulation (IV = 100%). Reduced by poor absorption and first-pass metabolism (nitroglycerine, propranolol, lignocaine, morphine).","First-order kinetics: constant FRACTION eliminated per unit time; t½ constant; most drugs. Zero-order: constant AMOUNT per unit time (saturation): alcohol, high-dose phenytoin, aspirin (high dose).","t½ = 0.693 × Vd / CL. Steady state is reached in 4–5 half-lives; a drug is almost eliminated in 4–5 half-lives.","Enzyme inducers (↓ effect of other drugs): rifampicin, phenytoin, carbamazepine, phenobarbitone, griseofulvin, chronic alcohol, smoking. Inhibitors (↑ toxicity): ketoconazole, erythromycin, cimetidine, ciprofloxacin, grapefruit juice, valproate.","Receptor types: ligand-gated ion channel (nicotinic, GABA-A; milliseconds), GPCR (muscarinic, adrenergic; seconds), enzyme-linked/kinase (insulin; minutes), nuclear receptors (steroids, thyroid; hours, act via gene transcription).","Teratogens: thalidomide (phocomelia), isotretinoin, valproate (neural tube defect), phenytoin (fetal hydantoin), warfarin (nasal hypoplasia), ACE inhibitors (renal), tetracyclines (teeth), lithium (Ebstein anomaly). Critical period: 3–8 weeks (organogenesis).","Pharmacovigilance in India: PvPI (Pharmacovigilance Programme of India) under IPC, Ghaziabad; ADRs reported on suspected ADR form; causality by WHO-UMC / Naranjo scale."],

{id:"pharm2", t:"Autonomic Nervous System", paper:"Paper I",
topics:[["Classification of cholinergic drugs; anticholinesterases and their uses",1,""],["Myasthenia gravis",2,"S"],["Anticholinergic drugs: classification; PA, MOA, uses, ADR of atropine",2,"L"],["Anticholinesterase (OP) poisoning",0,"S"],["Adrenergic drugs: classification and uses; amphetamine, dopamine",0,"S"],["α-blockers: classification, uses",4,""],["β-blockers: classification, ADR, uses",4,""],["Drugs for glaucoma: open-angle & closed-angle",5,"L"]],
core:["Cholinergic agonists: choline esters (ACh, bethanechol), alkaloids (pilocarpine). Anticholinesterases: reversible (neostigmine, physostigmine, pyridostigmine, edrophonium, donepezil) and irreversible (organophosphates, carbamates).","Myasthenia gravis: antibodies against nicotinic ACh receptors. Diagnosis: edrophonium (Tensilon) test, ice-pack test. Treatment: pyridostigmine/neostigmine, steroids, azathioprine, thymectomy. Myasthenic vs cholinergic crisis.","Atropine: muscarinic antagonist. Uses: pre-anaesthetic medication, OP poisoning, bradycardia/heart block, mydriatic-cycloplegic, antispasmodic. ADR: dry mouth, blurred vision, tachycardia, urinary retention, hyperthermia; 'dry as a bone, red as a beet, mad as a hatter'.","OP poisoning: SLUDGE + miosis, fasciculations, bradycardia. Treat: decontaminate, atropine till atropinisation (dry secretions), pralidoxime early (before ageing), diazepam for convulsions.","β-blockers: non-selective (propranolol, timolol), cardioselective β1 (atenolol, metoprolol, bisoprolol, esmolol), with α-block (labetalol, carvedilol). Uses: hypertension, angina, post-MI, CHF (carvedilol, bisoprolol, metoprolol), arrhythmia, thyrotoxicosis, migraine prophylaxis, glaucoma, anxiety tremors. Avoid in asthma, variant angina, heart block.","Glaucoma drugs: ↓ aqueous production (timolol, acetazolamide/dorzolamide, brimonidine) or ↑ outflow (latanoprost – uveoscleral; pilocarpine – trabecular). Acute angle closure: IV mannitol + acetazolamide + pilocarpine + timolol, then laser iridotomy. Atropine is contraindicated."],
flow:{t:"Management of organophosphate poisoning",n:["Suspected OP poisoning: miosis, SLUDGE, fasciculations, bradycardia","ABC, oxygen; remove clothes, wash skin; gastric lavage if early",{b:[["Atropine 1.8–3 mg IV, double every 5 min","Target: clear chest, HR > 80, SBP > 80, dry axillae, pupils not pinpoint"],["Pralidoxime (2-PAM) early, before 'ageing'","Reactivates AChE, reverses nicotinic effects"],["Diazepam for seizures","Ventilate if respiratory failure"]]},{k:"Atropine treats muscarinic effects only; it does not reverse muscle paralysis"}]},

core:["H1 antihistamines: first generation (sedating, anticholinergic: chlorpheniramine, promethazine, diphenhydramine) vs second generation (non-sedating: cetirizine, loratadine, fexofenadine). Uses: allergy, urticaria, motion sickness (promethazine), cough.","NSAIDs inhibit COX → ↓ PGs. Non-selective (aspirin, ibuprofen, diclofenac), preferential COX-2 (nimesulide, meloxicam), selective COX-2 (celecoxib, etoricoxib), paracetamol (weak peripheral anti-inflammatory).","Aspirin: irreversible COX acetylation. Low dose (75–150 mg) antiplatelet via ↓ TXA2; analgesic 300–600 mg; anti-inflammatory 3–5 g/day. ADR: gastric ulcer, bleeding, Reye's syndrome in children, salicylism, bronchospasm. Poisoning: alkaline diuresis, haemodialysis.","Migraine: acute (NSAIDs, triptans: 5-HT1B/1D agonists, ergotamine) vs prophylaxis (propranolol, flunarizine, topiramate, amitriptyline, valproate).","Gout: acute (NSAIDs, colchicine, steroids) vs chronic (allopurinol, febuxostat: xanthine oxidase inhibitors; probenecid: uricosuric). Do not start allopurinol in an acute attack.","Asthma: relievers (salbutamol, ipratropium) and controllers (inhaled steroids: budesonide, fluticasone; LABA: salmeterol, formoterol; montelukast; theophylline; omalizumab). Status asthmaticus: O2, nebulised salbutamol + ipratropium, IV hydrocortisone, IV magnesium sulphate, ± aminophylline, ventilation."],
flow:{t:"Stepwise asthma therapy",n:["Diagnosed bronchial asthma",{b:[["Mild intermittent","SABA (salbutamol) as needed / low-dose ICS-formoterol PRN"],["Persistent","Daily low-dose ICS (budesonide)"],["Not controlled","ICS + LABA (formoterol / salmeterol)"],["Severe","High-dose ICS-LABA + LAMA / montelukast / anti-IgE"]]},{k:"Acute severe (status asthmaticus): O₂ + nebulised salbutamol + ipratropium + IV hydrocortisone + IV MgSO₄"}]},

{id:"pharm4", t:"Hormones & Related Drugs", paper:"Paper I",
topics:[["Antithyroid drugs: classification, MOA, ADR, uses; propylthiouracil vs carbimazole; radioactive iodine; thyroid storm",3,""],["Oral hypoglycaemics: classify; MOA, uses, ADR of sulfonylureas and metformin",4,""],["Management of type 2 DM",0,""],["Corticosteroids: classification, MOA, uses, ADR, contraindications",4,""],["Diabetic ketoacidosis",2,""],["5-α reductase inhibitors (finasteride)",0,"S"],["Sildenafil",0,""],["HRT",0,""],["SERMs",4,""],["Letrozole, mifepristone",1,"S"],["Oral contraceptives: classification, MOA, ADR, uses, CI",3,""],["Tocolytics",0,""],["Bisphosphonates: MOA, ADR, uses, classification",5,""]],
core:["Antithyroid: thioamides (carbimazole, methimazole, PTU) block TPO; PTU also blocks peripheral T4→T3 and is preferred in 1st trimester and thyroid storm. ADR: agranulocytosis. Others: iodides (Lugol's, pre-op), radioactive I-131, β-blockers.","Thyroid storm: propranolol, PTU, then Lugol's iodine 1 h after PTU, hydrocortisone, cooling, supportive care.","Metformin: ↓ hepatic gluconeogenesis via AMPK; no hypoglycaemia, weight neutral; ADR lactic acidosis, B12 deficiency, GI upset; first-line in T2DM. Sulfonylureas (glimepiride, gliclazide): close K-ATP channels → insulin release; ADR hypoglycaemia, weight gain. Others: DPP-4 inhibitors (gliptins), SGLT2 inhibitors (gliflozins), pioglitazone, GLP-1 agonists.","DKA: IV normal saline first, regular insulin infusion 0.1 U/kg/h, potassium replacement (when K⁺ <5.3), add dextrose when glucose ~250 mg/dL, bicarbonate only if pH <6.9.","Corticosteroids: short (hydrocortisone), intermediate (prednisolone, methylprednisolone), long-acting (dexamethasone, betamethasone; no mineralocorticoid). ADR: Cushingoid features, hyperglycaemia, osteoporosis, peptic ulcer, infections, HPA suppression (taper after >2–3 weeks).","SERMs: tamoxifen (antagonist in breast, agonist in endometrium/bone → endometrial ca, DVT), raloxifene (osteoporosis, no endometrial stimulation), clomiphene (ovulation induction). Letrozole: aromatase inhibitor. Mifepristone: progesterone antagonist (MTP with misoprostol).","Bisphosphonates (alendronate, risedronate, zoledronate): inhibit osteoclasts (farnesyl pyrophosphate synthase). Take empty stomach, upright 30 min. ADR: oesophagitis, osteonecrosis of jaw, atypical femur fracture. Uses: osteoporosis, Paget's, hypercalcaemia of malignancy, bone metastases."],
flow:{t:"Type 2 DM drug pathway",n:["Diagnosis of T2DM + lifestyle modification","Metformin first-line (unless contraindicated)",{b:[["Established ASCVD / CKD / heart failure","Add SGLT2 inhibitor or GLP-1 agonist"],["Cost / no comorbidity","Add sulfonylurea or DPP-4 inhibitor or pioglitazone"]]},"HbA1c not at target after 3 months → triple therapy",{k:"Still uncontrolled → basal insulin (glargine) ± prandial insulin"}]},
hy:["Antithyroid drug preferred in first trimester and thyroid storm?::Propylthiouracil","Serious ADR of thioamides?::Agranulocytosis (check WBC if sore throat/fever)","First-line oral drug in T2DM?::Metformin","Metformin long-term deficiency?::Vitamin B12","Glucocorticoid with no mineralocorticoid activity?::Dexamethasone / betamethasone","Fluid of choice at start of DKA?::0.9% normal saline","SERM used for osteoporosis without endometrial risk?::Raloxifene","Bisphosphonate given IV once yearly?::Zoledronic acid","Mini-pill contains?::Progestin only","Tocolytics?::Nifedipine, atosiban, ritodrine/terbutaline, MgSO4, indomethacin"],

{id:"pharm5", t:"Skeletal Muscle Relaxants & Local Anaesthetics", paper:"Paper I",
topics:[["Skeletal muscle relaxants: classification",0,""],["d-Tubocurarine",0,"S"],["Succinylcholine",0,"S"],["Pancuronium",0,"S"],["Dantrolene",0,"S"],["Local anaesthetics: classification, MOA, ADR, uses",0,""],["Lignocaine",0,"S"]],
core:["Peripherally acting: non-depolarising (competitive) blockers (d-tubocurarine, pancuronium, vecuronium, atracurium, rocuronium) and depolarising (succinylcholine). Directly acting: dantrolene. Centrally acting: baclofen, diazepam, tizanidine.","Succinylcholine: fastest onset, shortest action (5 min), metabolised by pseudocholinesterase. Phase I block (fasciculations) not reversed by neostigmine. ADR: hyperkalaemia, muscle pain, malignant hyperthermia, prolonged apnoea in pseudocholinesterase deficiency.","Non-depolarising blockers are reversed by neostigmine (with glycopyrrolate) or sugammadex (rocuronium/vecuronium). Atracurium undergoes Hofmann elimination (safe in liver/kidney failure).","Dantrolene blocks ryanodine receptor (RyR1) Ca²⁺ release → drug of choice for malignant hyperthermia.","Local anaesthetics block voltage-gated Na⁺ channels from inside (unionised form crosses membrane). Esters (procaine, cocaine, tetracaine, benzocaine) vs amides (lignocaine, bupivacaine, ropivacaine). Order of block: small myelinated (pain, temperature) first, motor last.","Lignocaine: surface, infiltration, nerve block, spinal; also class IB antiarrhythmic (ventricular arrhythmias post-MI). Adrenaline prolongs action (avoid in end-arteries: fingers, penis). Bupivacaine is most cardiotoxic."],
flow:{t:"Neuromuscular blockers",n:["Drug acting at nicotinic NM receptor",{b:[["Competitive (non-depolarising)","d-TC, pancuronium, vecuronium, atracurium, rocuronium","Flaccid paralysis without fasciculation","Reversed by neostigmine / sugammadex"],["Depolarising","Succinylcholine","Fasciculations → paralysis","Not reversed by neostigmine (may worsen)"]]}]},
hy:["Muscle relaxant metabolised by pseudocholinesterase?::Succinylcholine","Relaxant undergoing Hofmann elimination?::Atracurium / cisatracurium","Drug of choice for malignant hyperthermia?::Dantrolene","Selective reversal agent for rocuronium?::Sugammadex","Most cardiotoxic local anaesthetic?::Bupivacaine","LA that causes vasoconstriction by itself?::Cocaine","Why add adrenaline to LA?::Vasoconstriction → prolongs action, ↓ systemic toxicity, ↓ bleeding","Lignocaine antiarrhythmic class?::Class IB"],
mcq:[["Drug of choice for malignant hyperthermia:",["Baclofen","Dantrolene","Diazepam","Succinylcholine"],1,"Dantrolene blocks Ca²⁺ release from sarcoplasmic reticulum."],["Prolonged apnoea after succinylcholine suggests:",["Hyperkalaemia","Pseudocholinesterase deficiency","Myasthenia","Hypothermia"],1,"Atypical/deficient enzyme slows its breakdown."],["Local anaesthetics act by blocking:",["K⁺ channels","Ca²⁺ channels","Voltage-gated Na⁺ channels","GABA receptors"],2,"They block Na⁺ channels from the inner side."]]},

{id:"pharm6", t:"Central Nervous System", paper:"Paper I",
topics:[["Sedative-hypnotics: classify; MOA, ADR, uses, PA of diazepam; BZD vs barbiturates",4,"L"],["Purpose of PAM and drug used",4,"S"],["Methyl alcohol poisoning treatment",0,"S"],["Antiepileptics: classify; MOA, ADR, uses of carbamazepine, sodium valproate, phenytoin",4,"L"],["Status epilepticus",0,"S"],["Antiparkinsonism: classification; levodopa MOA/ADR/uses; levodopa + carbidopa; on-off effect",4,"L"],["Antipsychotics (neuroleptics): classify; MOA, uses, ADR",4,"L"],["Clozapine",0,"S"],["Bipolar disorder: lithium carbonate",0,"S"],["Antidepressants: TCA and SSRIs",0,""],["Opioid analgesics: classify; morphine MOA, ADR, uses; naloxone",4,"L"]],
core:["Benzodiazepines ↑ frequency of GABA-A Cl⁻ channel opening (barbiturates ↑ duration; at high doses act directly). BZDs: wider safety margin, less enzyme induction, less dependence, specific antagonist (flumazenil). Uses: anxiety, insomnia, status epilepticus, alcohol withdrawal, pre-anaesthesia.","Antiepileptics: GTCS (valproate, phenytoin, carbamazepine), absence (ethosuximide, valproate), myoclonic (valproate), partial (carbamazepine, oxcarbazepine), infantile spasms (ACTH, vigabatrin). Phenytoin: gum hypertrophy, hirsutism, zero-order kinetics, fetal hydantoin. Valproate: hepatotoxicity, neural tube defects, weight gain. Carbamazepine: SJS (HLA-B*1502), hyponatraemia, enzyme inducer.","Status epilepticus: IV lorazepam (or diazepam/midazolam) → IV phenytoin/fosphenytoin or valproate or levetiracetam → anaesthesia (propofol, thiopentone).","Parkinsonism: levodopa + carbidopa (peripheral decarboxylase inhibitor ↓ dose, nausea, arrhythmia; pyridoxine interaction avoided), dopamine agonists (pramipexole, ropinirole), MAO-B inhibitors (selegiline, rasagiline), COMT inhibitors (entacapone), amantadine, anticholinergics (trihexyphenidyl; drug-induced parkinsonism). Long-term: wearing-off and on-off phenomena, dyskinesia.","Antipsychotics: typical (chlorpromazine, haloperidol; D2 block → EPS, hyperprolactinaemia) vs atypical (clozapine, olanzapine, risperidone, quetiapine, aripiprazole; 5-HT2A + D2 → fewer EPS, metabolic syndrome). Clozapine: refractory schizophrenia; agranulocytosis, seizures. NMS treated with dantrolene/bromocriptine.","Lithium: narrow therapeutic range 0.6–1.2 mEq/L; ADR tremor, hypothyroidism, nephrogenic DI, Ebstein anomaly; thiazides/NSAIDs raise levels.","Morphine: μ-agonist; analgesia, euphoria, respiratory depression, miosis, constipation, emesis, histamine release. Uses: severe pain, MI, acute LVF (pulmonary oedema). Contraindicated in head injury, bronchial asthma. Naloxone reverses toxicity (triad: coma, pinpoint pupils, respiratory depression)."],
flow:{t:"Status epilepticus protocol",n:["Seizure > 5 min or recurrent without recovery","ABC, O₂, check glucose (give thiamine + dextrose if low)","0–10 min: IV lorazepam 0.1 mg/kg (or diazepam / IM midazolam)","10–30 min: IV fosphenytoin / phenytoin 20 mg/kg OR valproate OR levetiracetam","Still seizing (refractory): ICU, intubate",{k:"Anaesthetic infusion: midazolam / propofol / thiopentone with EEG monitoring"}]},
hy:["BZD vs barbiturate on GABA-A?::BZD ↑ frequency; barbiturate ↑ duration of Cl⁻ channel opening","BZD antagonist?::Flumazenil","Antidote of methanol poisoning?::Fomepizole (or ethanol) + haemodialysis + folinic acid; NaHCO3 for acidosis","Antiepileptic with gingival hyperplasia?::Phenytoin","Drug of choice for absence seizures?::Ethosuximide (valproate if mixed)","Why carbidopa with levodopa?::Inhibits peripheral dopa decarboxylase → more levodopa reaches brain, fewer side effects","Antipsychotic with agranulocytosis risk?::Clozapine (monitor counts)","Drug for neuroleptic malignant syndrome?::Dantrolene / bromocriptine","Therapeutic range of lithium?::0.6–1.2 mEq/L","Opioid antagonist for overdose?::Naloxone","SSRIs example and ADR?::Fluoxetine, sertraline; sexual dysfunction, GI upset, serotonin syndrome with MAOIs"],
mcq:[["Benzodiazepines act by increasing:",["Duration of Cl⁻ channel opening","Frequency of Cl⁻ channel opening","Glutamate release","Na⁺ channel block"],1,"BZDs increase the frequency; barbiturates the duration."],["Drug of choice for absence seizures:",["Phenytoin","Carbamazepine","Ethosuximide","Phenobarbitone"],2,"Ethosuximide blocks T-type Ca²⁺ channels."],["Triad of coma, pinpoint pupils and respiratory depression is treated with:",["Flumazenil","Naloxone","Atropine","Physostigmine"],1,"This is opioid toxicity."]]},

core:["ACE inhibitors (enalapril, ramipril, lisinopril): ↓ angiotensin II and ↑ bradykinin. Uses: HTN, CHF, post-MI, diabetic nephropathy. ADR: dry cough, angioedema, hyperkalaemia, first-dose hypotension; contraindicated in pregnancy and bilateral renal artery stenosis. ARBs (losartan, telmisartan) have no cough.","CHF: diuretics (symptom relief), ACEI/ARB/ARNI (sacubitril-valsartan), β-blockers, spironolactone, SGLT2 inhibitors (mortality benefit); digoxin for symptoms/AF; hydralazine + nitrate.","Digoxin: inhibits Na⁺/K⁺-ATPase → ↑ intracellular Ca²⁺ → positive inotropy; vagal → ↓ AV conduction. Narrow therapeutic index. Toxicity ↑ with hypokalaemia; signs: nausea, xanthopsia, bigeminy, any arrhythmia. Treat: stop drug, K⁺, lignocaine/phenytoin, digoxin-specific Fab.","Antiarrhythmics (Vaughan-Williams): I Na⁺ block (IA quinidine, IB lignocaine, IC flecainide), II β-blockers, III K⁺ block (amiodarone, sotalol), IV CCB (verapamil, diltiazem). Amiodarone ADR: pulmonary fibrosis, thyroid dysfunction, corneal deposits, photosensitivity.","Nitrates: release NO → ↑ cGMP → venodilatation (↓ preload). ADR: headache, tolerance (nitrate-free interval). CCBs: dihydropyridines (amlodipine, nifedipine: vascular) vs non-DHP (verapamil, diltiazem: cardiac).","Acute MI (MONA-BASH): Morphine, O2 if hypoxic, Nitrates, Aspirin + clopidogrel/ticagrelor, β-blocker, ACE inhibitor, Statin, Heparin; reperfusion by PCI or thrombolysis (streptokinase, tenecteplase, alteplase) within 12 h.","HTN in pregnancy: methyldopa, labetalol, nifedipine; avoid ACEI/ARB. Hypertensive emergency: IV labetalol, nitroprusside, nicardipine, esmolol; reduce BP by ≤25% in first hour.","Diuretics: loop (furosemide: Na-K-2Cl in thick ascending limb; high ceiling; ototoxicity, hypokalaemia), thiazides (DCT; hyperglycaemia, hyperuricaemia, hypokalaemia), K⁺-sparing (spironolactone: aldosterone antagonist, gynaecomastia), osmotic (mannitol: cerebral oedema, glaucoma), carbonic anhydrase inhibitors (acetazolamide)."],
flow:{t:"Choosing an antihypertensive",n:["Confirmed hypertension + lifestyle change",{b:[["Diabetes / CKD with proteinuria","ACE inhibitor or ARB"],["Elderly / black / isolated systolic","CCB (amlodipine) or thiazide"],["Post-MI / angina / HF","β-blocker + ACEI"],["Pregnancy","Methyldopa / labetalol / nifedipine (no ACEI)"],["BPH","α1-blocker add-on"]]},"Not controlled → ACEI/ARB + CCB + thiazide",{k:"Resistant HTN → add spironolactone"}]},
hy:["Dry cough with ACE inhibitors is due to?::Accumulation of bradykinin (and substance P)","Antihypertensives safe in pregnancy?::Methyldopa, labetalol, nifedipine","Antidote for digoxin toxicity?::Digoxin-specific Fab antibody fragments","Electrolyte that predisposes to digoxin toxicity?::Hypokalaemia","Antiarrhythmic causing pulmonary fibrosis and thyroid dysfunction?::Amiodarone","Drug of choice for PSVT termination?::Adenosine (IV bolus)","Most potent diuretic class?::Loop diuretics (furosemide)","Diuretic causing gynaecomastia?::Spironolactone","Nitrate tolerance is avoided by?::Nitrate-free interval of 8–12 h","Nicorandil MOA?::K⁺-ATP channel opener + nitrate-like NO donor"],
mcq:[["Dry cough is a side effect of:",["Losartan","Enalapril","Amlodipine","Atenolol"],1,"ACE inhibitors raise bradykinin; ARBs do not."],["Digoxin inhibits:",["Na⁺/K⁺-ATPase","Ca²⁺ channels","β1 receptors","PDE-3"],0,"This raises intracellular Ca²⁺ through Na⁺/Ca²⁺ exchange."],["Antihypertensive contraindicated in pregnancy:",["Methyldopa","Labetalol","Enalapril","Nifedipine"],2,"ACE inhibitors cause fetal renal damage."]]},

{id:"pharm8", t:"Drugs Affecting Blood", paper:"Paper II",
topics:[["Oral / parenteral iron: uses",0,""],["Acute iron poisoning",0,""],["Folic acid",0,""],["Vitamin K",0,""],["Anticoagulants: classification; MOA, ADR, uses of heparin and warfarin; LMWH",4,""],["Streptokinase",0,"S"],["Antiplatelet drugs: classify; uses, ADR, MOA of aspirin and clopidogrel",0,""],["GP IIb/IIIa receptor antagonists",0,"S"],["Hypolipidaemic drugs: classify; MOA, ADR, uses of statins (atorvastatin)",0,""]],
core:["Oral iron (ferrous sulphate, 200 mg/day elemental in deficiency; continue 3–6 months after Hb normal). Parenteral (iron sucrose, ferric carboxymaltose, iron dextran) for intolerance, malabsorption, late pregnancy. Acute iron poisoning: desferrioxamine.","Heparin: activates antithrombin III → inactivates thrombin (IIa) and Xa; monitored by aPTT; antidote protamine sulphate; ADR bleeding, HIT, osteoporosis. LMWH (enoxaparin): mainly anti-Xa, SC, predictable, no routine monitoring, less HIT.","Warfarin: vitamin K antagonist (VKORC1) → ↓ II, VII, IX, X; monitor INR (target 2–3); antidote vitamin K (± FFP/PCC); teratogenic; many interactions. New oral anticoagulants: dabigatran (thrombin), rivaroxaban/apixaban (Xa).","Fibrinolytics: streptokinase (antigenic, allergy, hypotension), alteplase, tenecteplase. Antidote: tranexamic acid.","Antiplatelets: aspirin (COX-1), clopidogrel/prasugrel/ticagrelor (P2Y12 ADP receptor), GP IIb/IIIa blockers (abciximab, eptifibatide, tirofiban), dipyridamole/cilostazol (PDE).","Statins: HMG-CoA reductase inhibitors → ↑ LDL receptors → ↓ LDL. Given at night (short-acting). ADR: myopathy/rhabdomyolysis (↑ with fibrates, macrolides, azoles), hepatotoxicity; contraindicated in pregnancy. Others: ezetimibe, fibrates (↓ TG), niacin (flushing), PCSK9 inhibitors."],
flow:{t:"Heparin vs warfarin at a glance",n:["Need anticoagulation",{b:[["Rapid onset needed (DVT/PE start, ACS, pregnancy)","Heparin / LMWH","Acts via antithrombin III","Monitor aPTT (UFH)","Antidote: protamine","Safe in pregnancy"],["Long-term oral","Warfarin","Vitamin K antagonist (II, VII, IX, X)","Monitor INR 2–3","Antidote: vitamin K, FFP/PCC","Teratogenic"]]},{k:"Overlap heparin with warfarin for ≥5 days until INR therapeutic for 2 days"}]},

mcq:[["Heparin acts by:",["Inhibiting vitamin K epoxide reductase","Activating antithrombin III","Blocking P2Y12","Activating plasminogen"],1,"Heparin accelerates antithrombin's inactivation of thrombin and Xa."],["Antidote for warfarin overdose:",["Protamine","Vitamin K","Desferrioxamine","Naloxone"],1,"Vitamin K restores synthesis of clotting factors."],["Statins inhibit:",["Lipoprotein lipase","HMG-CoA reductase","PCSK9","Cholesterol absorption"],1,"They block the rate-limiting enzyme of cholesterol synthesis."]]},

core:["PPIs (omeprazole, pantoprazole): irreversibly inhibit H⁺/K⁺-ATPase; prodrug activated in acid; take 30 min before breakfast. ADR: hypomagnesaemia, B12 deficiency, fractures, C. difficile, ↑ pneumonia risk.","H. pylori triple therapy (14 days): PPI + clarithromycin + amoxicillin (or metronidazole). Quadruple: PPI + bismuth + tetracycline + metronidazole.","GERD: lifestyle (raise head end, avoid late meals), PPIs most effective, H2 blockers, prokinetics, antacids.","Antiemetics: 5-HT3 antagonists (ondansetron: chemotherapy, post-op; QT prolongation), D2 blockers (metoclopramide: also prokinetic; EPS; domperidone does not cross BBB), H1 blockers (promethazine, motion sickness), anticholinergic (hyoscine: motion sickness), NK1 antagonist (aprepitant), dexamethasone.","Low-osmolarity WHO ORS (245 mOsm/L): Na 75, Cl 65, K 20, citrate 10, glucose 75 mmol/L; works via SGLT1 glucose-sodium co-transport. Add zinc 20 mg/day for 14 days in children (10 mg <6 months).","Racecadotril: enkephalinase inhibitor → antisecretory antidiarrhoeal without affecting motility. Loperamide: opioid, reduces motility (avoid in dysentery and in young children)."],
flow:{t:"Peptic ulcer management",n:["Dyspepsia / confirmed peptic ulcer","Test for H. pylori (urea breath test, stool antigen, biopsy urease)",{b:[["H. pylori positive","Triple therapy 14 days: PPI + clarithromycin + amoxicillin","Confirm eradication after 4 weeks"],["NSAID-induced","Stop NSAID","PPI 8 weeks","If NSAID must continue: PPI / misoprostol cover"]]},{k:"Bleeding ulcer: IV PPI + endoscopic therapy"}]},

mcq:[["Ondansetron blocks:",["D2 receptors","5-HT3 receptors","H1 receptors","NK1 receptors"],1,"5-HT3 antagonism at CTZ and vagal afferents."],["Total osmolarity of WHO low-osmolar ORS:",["311","245","200","290"],1,"Reduced osmolarity ORS is 245 mOsm/L."],["Racecadotril acts by inhibiting:",["Enkephalinase","Opioid receptors","Cl⁻ channels directly","Gut motility"],0,"It protects endogenous enkephalins, which reduce secretion."]]},

core:["By mechanism: cell wall synthesis (β-lactams, vancomycin), protein synthesis 30S (aminoglycosides, tetracyclines) and 50S (macrolides, chloramphenicol, clindamycin, linezolid), DNA gyrase (fluoroquinolones), folate synthesis (sulfonamides, trimethoprim), membrane (polymyxins), RNA polymerase (rifampicin).","Penicillin G: drug of choice for syphilis, streptococcal infections; ADR hypersensitivity (anaphylaxis — test dose), Jarisch-Herxheimer reaction. Amoxicillin + clavulanic acid extends spectrum to β-lactamase producers.","Cephalosporins: 1st (cefazolin: surgical prophylaxis), 2nd (cefuroxime), 3rd (ceftriaxone: meningitis, typhoid, gonorrhoea; ceftazidime: Pseudomonas), 4th (cefepime), 5th (ceftaroline: MRSA).","Aminoglycosides (gentamicin, amikacin): concentration-dependent killing, post-antibiotic effect, once-daily dosing; ototoxicity and nephrotoxicity, NM blockade; ineffective against anaerobes.","Tetracyclines (doxycycline): rickettsia, chlamydia, cholera, brucella, acne; ADR teeth discolouration and bone deposition (avoid <8 y, pregnancy), photosensitivity, Fanconi syndrome with outdated drug. Chloramphenicol: gray baby syndrome, aplastic anaemia.","Fluoroquinolones (ciprofloxacin, levofloxacin): DNA gyrase/topoisomerase IV; tendinitis, QT prolongation, cartilage damage in children. Vancomycin: MRSA, oral for C. difficile; red man syndrome (slow infusion), nephrotoxicity.","Typhoid: ceftriaxone (severe), azithromycin (uncomplicated), cefixime; fluoroquinolone resistance common in India. Uncomplicated UTI: nitrofurantoin, fosfomycin, cotrimoxazole (if local resistance low)."],

{id:"pharm11", t:"Antimicrobials II: TB, Fungal, Viral, Malaria, Parasites", paper:"Paper II · Chemotherapy",
topics:[["Antitubercular drugs: classification; isoniazid & rifampicin MOA, ADR, uses; doses; category regimens; MDR-TB; MAC",4,"L"],["Antifungal drugs: classification; amphotericin B, griseofulvin, ketoconazole",4,"L"],["Antiviral drugs: classification; acyclovir, zidovudine; first & second line ART; PEP; perinatal prophylaxis",4,"L"],["Antimalarial drugs: classification, objectives; chloroquine, mefloquine, primaquine; ACT regimens",4,"L"],["Antiamoebic drugs: metronidazole",0,""],["Anthelmintics: mebendazole, albendazole; DEC, ivermectin, praziquantel",0,"S"]],
core:["First-line TB (NTEP, daily FDC): intensive phase 2 months HRZE, continuation 4 months HRE (6 months total). Isoniazid: mycolic acid synthesis inhibitor; ADR peripheral neuropathy (give pyridoxine), hepatitis. Rifampicin: RNA polymerase; orange urine, hepatitis, flu-like syndrome, enzyme induction. Pyrazinamide: hyperuricaemia, hepatotoxicity. Ethambutol: optic neuritis (red-green colour vision).","MDR-TB: resistance to at least H and R. Current all-oral regimens include bedaquiline, linezolid, levofloxacin/moxifloxacin, clofazimine, cycloserine (BPaLM/longer regimens per national guidelines).","Antifungals: polyenes (amphotericin B binds ergosterol → pores; nephrotoxicity, infusion reactions; liposomal form less toxic), azoles (inhibit ergosterol synthesis via 14-α demethylase; ketoconazole: enzyme inhibitor, gynaecomastia), griseofulvin (dermatophytes, binds microtubules; take with fatty meal), echinocandins (caspofungin), terbinafine (squalene epoxidase).","Antivirals: acyclovir (guanosine analogue, activated by viral thymidine kinase; HSV, VZV). HIV ART: NRTIs (zidovudine → anaemia; tenofovir → renal; lamivudine), NNRTIs (efavirenz, nevirapine), integrase inhibitors (dolutegravir), protease inhibitors. India first-line: TLD (tenofovir + lamivudine + dolutegravir).","HIV PEP: start within 72 h (ideally 2 h), 28 days of TLD. PMTCT: lifelong ART for mother; infant nevirapine prophylaxis.","Antimalarials: chloroquine (vivax blood schizonticide; heme polymerisation inhibition; retinopathy), primaquine (radical cure of vivax: hypnozoites, 0.25 mg/kg × 14 d; single dose gametocidal for falciparum; haemolysis in G6PD deficiency), ACT for falciparum (India: artesunate + sulfadoxine-pyrimethamine; NE states: artemether-lumefantrine). Severe malaria: IV artesunate.","Metronidazole: amoebiasis, giardiasis, trichomoniasis, anaerobes, C. difficile; metallic taste, disulfiram-like reaction. Albendazole: broad-spectrum (ascaris, hookworm, neurocysticercosis); ivermectin (strongyloides, filaria, scabies); praziquantel (tapeworms, flukes); DEC (filariasis)."],
flow:{t:"Drug-sensitive TB treatment (adult, NTEP)",n:["Microbiologically or clinically diagnosed TB + UDST / CBNAAT",{b:[["Rifampicin sensitive","Intensive phase: H R Z E × 2 months","Continuation phase: H R E × 4 months","Pyridoxine with INH","Monitor LFT, vision, sputum"],["Rifampicin resistant","Refer for DST & LPA","MDR/RR-TB regimen (bedaquiline, linezolid, FQ…)"]]},{k:"Weight-band daily fixed-dose combinations; DOT/99DOTS adherence support"}]},
hy:["INH neuropathy prevention?::Pyridoxine (vitamin B6) 10–25 mg/day","Anti-TB drug causing optic neuritis?::Ethambutol (red-green colour blindness)","Anti-TB drug causing orange-red urine?::Rifampicin","Drug for radical cure of P. vivax?::Primaquine (check G6PD)","Treatment of severe malaria?::IV artesunate","ACT in most of India?::Artesunate + sulfadoxine-pyrimethamine (AS+SP)","Acyclovir activation enzyme?::Viral thymidine kinase","Zidovudine major ADR?::Bone marrow suppression (anaemia)","Time window for HIV PEP?::Within 72 hours, best within 2 hours; 28 days","Amphotericin B major ADR?::Nephrotoxicity (hypokalaemia, hypomagnesaemia)","Griseofulvin absorption increases with?::Fatty meal","Drug of choice for neurocysticercosis?::Albendazole (with steroids)"],
mcq:[["Peripheral neuropathy with isoniazid is prevented by:",["Thiamine","Pyridoxine","Folic acid","Vitamin B12"],1,"INH increases pyridoxine excretion."],["Drug used for radical cure of vivax malaria:",["Chloroquine","Artesunate","Primaquine","Quinine"],2,"Primaquine kills liver hypnozoites."],["Amphotericin B acts by:",["Inhibiting ergosterol synthesis","Binding ergosterol to form pores","Inhibiting microtubules","Inhibiting glucan synthesis"],1,"Polyenes bind ergosterol in fungal membranes."]]},

{id:"pharm12", t:"Anticancer, Immunosuppressants & Miscellaneous", paper:"Paper II",
topics:[["Anticancer drugs: classification; cisplatin, methotrexate",0,""],["Immunosuppressants: classification; cyclosporine",0,""],["Chelating agents: BAL, CaNa2 EDTA, penicillamine, desferrioxamine",2,""],["Vitamins A and C",2,""],["Vaccines: BCG",2,""]],
core:["Anticancer classes: alkylating agents (cyclophosphamide – haemorrhagic cystitis, prevented by mesna; cisplatin), antimetabolites (methotrexate, 5-FU, 6-MP), plant alkaloids (vincristine – neuropathy; vinblastine; paclitaxel; etoposide), antibiotics (doxorubicin – cardiotoxicity; bleomycin – pulmonary fibrosis), targeted (imatinib, trastuzumab, rituximab), hormonal (tamoxifen, letrozole).","Cisplatin: cross-links DNA; nephrotoxicity (prevent by hydration, amifostine), ototoxicity, severe vomiting (ondansetron + aprepitant), neuropathy.","Methotrexate: inhibits dihydrofolate reductase; uses ALL, choriocarcinoma, RA (weekly), psoriasis, ectopic pregnancy; ADR myelosuppression, mucositis, hepatotoxicity; rescue with folinic acid (leucovorin).","Cyclosporine: binds cyclophilin → inhibits calcineurin → ↓ IL-2 transcription; uses transplant, psoriasis; ADR nephrotoxicity, hypertension, gum hyperplasia, hirsutism. Tacrolimus binds FKBP-12.","Chelators: BAL/dimercaprol (arsenic, mercury, lead with EDTA; contraindicated in iron, cadmium), CaNa2 EDTA (lead), penicillamine (copper – Wilson; lead), desferrioxamine (iron), succimer (lead in children).","Vitamin A: night blindness, xerophthalmia (India: 1 lakh IU at 9 months, then 2 lakh IU every 6 months till 5 years); excess → raised ICP, teratogen. Vitamin C: scurvy, ↑ iron absorption.","BCG: live attenuated M. bovis (Danish 1331 strain), 0.05 mL intradermal at birth (0.1 mL after 4 weeks), left upper arm; protects against severe forms (TB meningitis, miliary) in children."],

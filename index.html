/* Topic-wise explained flowcharts. Node = [label, explanation]; branch = {b:[[head,node,...],...]}; key = {k:[label,explanation]}. */
const FLOWS=[];
FLOWS.push(
/* ===================== PATHOLOGY ===================== */
{id:"p-injury",s:"path",ch:"path1",t:"Cell injury: from stimulus to cell death",sum:"How a cell responds when it is damaged, and how we tell reversible from irreversible injury.",
n:[["Injurious stimulus","Anything that disturbs cell homeostasis: hypoxia (commonest), toxins, microbes, immune reactions, genetic defects, nutritional imbalance, physical agents."],
["Biochemical targets hit","Five key mechanisms: ATP depletion, mitochondrial damage, Ca²⁺ influx, reactive oxygen species (ROS) and membrane / DNA damage. Several usually act together."],
["ATP falls → Na⁺/K⁺ pump fails","Without ATP the sodium pump stops; Na⁺ and water enter the cell. Anaerobic glycolysis rises → lactic acid → low pH → chromatin clumping."],
{b:[[["Mild or brief injury","If the stimulus is removed early, the cell can return to normal."],["Cell swelling (hydropic change)","Earliest light-microscopy change: pale, swollen cytoplasm from water entry."],["Fatty change","Triglyceride droplets accumulate, mainly in liver, heart and kidney (e.g. alcohol, hypoxia)."],["Reversible injury","Blebs, ER dilation and mitochondrial swelling seen on electron microscopy, but membranes still intact."]],
[["Severe or persistent injury","Point of no return: inability to restore mitochondrial function and severe membrane damage."],["Membrane damage + Ca²⁺ flood","Calcium activates phospholipases, proteases, endonucleases and ATPases that digest the cell."],["Nuclear changes","Pyknosis (shrinkage), karyorrhexis (fragmentation), karyolysis (fading) — the hallmark of irreversible injury."]]]},
{b:[[["Necrosis","Death of groups of cells with membrane rupture; enzymes leak out and inflammation follows."],["Types","Coagulative (infarcts), liquefactive (brain, abscess), caseous (TB), fat (pancreatitis), fibrinoid (vasculitis), gangrenous."]],
[["Apoptosis","Programmed, energy-dependent death of single cells; membranes stay intact, so no inflammation."],["Outcome","Apoptotic bodies are eaten by macrophages (efferocytosis) without damage to neighbours."]]]}],
terms:[["Hydropic change","Cell swelling due to water influx; the first sign of injury."],["Pyknosis","Shrunken, dense nucleus."],["Karyorrhexis","Fragmented nucleus."],["Karyolysis","Fading of the nucleus from DNase activity."],["Efferocytosis","Phagocytosis of apoptotic cells."]],
exam:"For a 10-mark answer on cell injury, draw this flow and add a table of reversible vs irreversible features."},

{id:"p-apoptosis",s:"path",ch:"path1",t:"Apoptosis: intrinsic & extrinsic pathways",sum:"Two routes that converge on caspases to dismantle a cell cleanly.",
n:[{b:[[["Intrinsic (mitochondrial) pathway","Triggered by DNA damage, growth-factor withdrawal, misfolded proteins. The commonest pathway."],["BH3-only sensors activated","Proteins like BIM, BID, PUMA sense stress and tip the balance."],["BAX / BAK form pores","Pro-apoptotic proteins make the mitochondrial outer membrane leaky. BCL-2 and BCL-XL normally prevent this."],["Cytochrome c released","Cytochrome c leaves the mitochondria into the cytosol."],["Apoptosome → caspase-9","Cytochrome c + APAF-1 form the apoptosome, which activates initiator caspase-9."]],
[["Extrinsic (death receptor) pathway","Triggered when a ligand binds a death receptor on the cell surface."],["Fas–FasL or TNF–TNFR1 binding","Receptors cluster and recruit adaptor protein FADD."],["Caspase-8 activated","Initiator caspase-8 is activated (FLIP can block it)."]]]},
["Executioner caspases 3, 6, 7","Both pathways converge here. Caspases cleave the cytoskeleton and activate DNase."],
["Morphology","Cell shrinkage, chromatin condensation, membrane blebbing, apoptotic bodies; eosinophilic cytoplasm with dense nuclear fragments."],
{k:["Phagocytosis without inflammation","Phosphatidylserine flips to the outer membrane — an 'eat me' signal for macrophages."]}],
terms:[["BCL-2","Anti-apoptotic protein; overexpressed in follicular lymphoma t(14;18)."],["Caspase","Cysteine protease that cleaves after aspartate."],["APAF-1","Apoptotic protease activating factor-1, forms the apoptosome."],["Phosphatidylserine","Membrane lipid that signals 'eat me' when flipped outward."]],
exam:"Examiners love the difference table between apoptosis and necrosis. Add this pathway diagram for full marks."},

{id:"p-inflam",s:"path",ch:"path2",t:"Acute inflammation: leukocyte journey",sum:"How neutrophils leave the blood and reach the site of injury.",
n:[["Injury or microbes detected","Tissue macrophages, mast cells and endothelium sense danger through receptors such as Toll-like receptors."],
["Vascular changes","Brief arteriolar constriction, then vasodilatation (histamine, NO) causing redness and heat; increased permeability causes exudate and swelling."],
["Stasis","Fluid loss concentrates red cells and slows flow, pushing leukocytes to the vessel wall."],
["Margination","White cells move from the central axial stream to the periphery next to the endothelium."],
["Rolling","Weak, transient binding via selectins (E-, P-selectin on endothelium; L-selectin on leukocytes)."],
["Firm adhesion","Chemokines activate leukocyte integrins (LFA-1, VLA-4) that bind ICAM-1 and VCAM-1."],
["Transmigration (diapedesis)","Leukocytes squeeze between endothelial cells using PECAM-1 (CD31), usually in post-capillary venules."],
["Chemotaxis","Movement along a gradient of C5a, LTB4, IL-8 and bacterial N-formyl peptides."],
["Phagocytosis & killing","Recognition (opsonins C3b, IgG), engulfment, then killing by the oxygen-dependent MPO–H2O2–halide system."],
{b:[[["Resolution","Complete restoration when injury is mild and tissue can regenerate."]],[["Abscess","Pus collection when pyogenic bacteria persist."]],[["Scar / fibrosis","When tissue cannot regenerate or there is extensive damage."]],[["Chronic inflammation","When the stimulus persists (e.g. TB)."]]]}],
terms:[["Exudate","Protein-rich fluid with cells; SG > 1.020."],["Selectins","Adhesion molecules causing rolling."],["Integrins","Adhesion molecules causing firm attachment."],["Opsonin","Molecule coating microbes to aid phagocytosis (C3b, IgG)."],["LTB4","Leukotriene B4, a strong chemotactic agent."]],
exam:"Draw this sequence for the LAQ 'Vascular and cellular events of acute inflammation' and name the molecules at each step."},

{id:"p-granuloma",s:"path",ch:"path2",t:"Tubercular granuloma formation",sum:"How the body walls off M. tuberculosis through a type IV reaction.",
n:[["Inhaled droplet nuclei","M. tuberculosis reaches alveoli and is engulfed by alveolar macrophages."],
["Bacilli survive inside macrophages","Mycobacteria block phagosome–lysosome fusion and multiply (first ~3 weeks, no immunity yet)."],
["Antigen presentation","Dendritic cells carry antigen to lymph nodes and present it with MHC-II to CD4⁺ T cells."],
["TH1 response (IL-12 driven)","CD4⁺ TH1 cells release IFN-γ — the key cytokine of protection."],
["Macrophage activation","IFN-γ activates macrophages: they kill bacilli better (NO, ROS) and turn into epithelioid cells."],
["Epithelioid cells & giant cells","Activated macrophages with abundant pink cytoplasm; some fuse to form Langhans giant cells with horseshoe nuclei."],
["Lymphocyte cuff & fibroblasts","A rim of lymphocytes and fibroblasts surrounds the cluster, walling off the infection."],
{k:["Caseating granuloma","Central cheesy necrosis forms; this is the tubercle. Healing occurs by fibrosis and calcification."]}],
terms:[["Epithelioid cell","Activated macrophage resembling epithelial cells."],["Langhans giant cell","Multinucleate cell with peripheral horseshoe nuclei."],["Caseation","Cheese-like necrosis typical of TB."],["Ghon complex","Ghon focus plus caseous hilar lymph node (primary TB)."]],
exam:"For 'Pathogenesis of tuberculosis' show this flow, then add primary vs secondary TB and the fate of the Ghon complex."},

{id:"p-healing",s:"path",ch:"path2",t:"Wound healing: primary vs secondary intention",sum:"The stages by which a skin wound repairs itself.",
n:[["Wound created","Tissue and vessels are cut or torn."],
["Haemostasis (minutes)","Vasoconstriction, platelet plug and fibrin clot; the clot forms a scaffold."],
["Inflammation (day 1–3)","Neutrophils arrive within 24 h; macrophages by day 3 clear debris and release growth factors (TGF-β, PDGF, VEGF)."],
["Proliferation (day 3–14)","Granulation tissue forms: new capillaries (angiogenesis), fibroblasts and loose matrix. Epithelium covers the surface."],
["Remodelling (weeks–months)","Type III collagen is replaced by stronger type I collagen; wound strength reaches about 70–80% of normal by 3 months."],
{b:[[["Primary intention","Clean incised wound with edges apposed (surgical incision)."],["Little granulation tissue","Small gap fills quickly."],["Thin linear scar","Epithelium bridges the gap in 24–48 h."]],
[["Secondary intention","Large wound with tissue loss or infection."],["Abundant granulation tissue","Fills the defect from below."],["Wound contraction","Myofibroblasts pull edges together."],["Larger scar","Slower healing, more fibrosis."]]]},
{k:["Complications","Infection, dehiscence, hypertrophic scar, keloid, contracture, incisional hernia."]}],
terms:[["Granulation tissue","New capillaries, fibroblasts and inflammatory cells in loose matrix; pink and granular."],["Myofibroblast","Fibroblast with contractile smooth-muscle features."],["Keloid","Scar growing beyond the wound margin."],["Dehiscence","Wound bursting open."]],
exam:"Write first vs second intention as a table and list factors affecting healing (infection, nutrition, steroids, diabetes)."},

{id:"p-thrombo",s:"path",ch:"path3",t:"Thrombosis → embolism → infarction",sum:"From clot formation in a vessel to tissue death downstream.",
n:[{b:[[["Endothelial injury","Exposes collagen and tissue factor; e.g. MI, vasculitis, hypertension, smoking."]],[["Abnormal flow","Stasis (veins, atrial fibrillation) or turbulence (aneurysm) brings platelets to the wall."]],[["Hypercoagulability","Inherited (factor V Leiden) or acquired (cancer, pregnancy, OCPs, immobility)."]]]},
["Thrombus forms","Platelets adhere and aggregate; coagulation adds fibrin. Ante-mortem thrombi show lines of Zahn."],
{b:[[["Propagation","Thrombus grows along the vessel."]],[["Dissolution","Fibrinolysis clears a fresh thrombus."]],[["Organisation & recanalisation","Ingrowth of cells and new channels partly restore flow."]],[["Embolisation","Part breaks away and travels."]]]},
["Embolus lodges downstream","Venous emboli (deep leg veins) go to the lungs; arterial emboli (heart, aorta) go to brain, kidney, spleen, limbs."],
["Ischaemia","Reduced blood supply causes hypoxia, nutrient lack and waste build-up."],
{b:[[["White (pale) infarct","Solid organs with end arteries: heart, kidney, spleen."]],[["Red (haemorrhagic) infarct","Dual supply or loose tissue, venous occlusion: lung, intestine, ovarian torsion."]]]},
{k:["Coagulative necrosis then scar","Most infarcts show coagulative necrosis (brain shows liquefactive) and heal by fibrosis."]}],
terms:[["Virchow's triad","Endothelial injury, abnormal flow, hypercoagulability."],["Lines of Zahn","Alternating layers of platelets/fibrin and RBCs in an ante-mortem thrombus."],["Paradoxical embolism","Venous embolus crossing to arterial side through an ASD/PFO."],["Infarct","Area of ischaemic necrosis."]],
exam:"Commonly asked: 'Define thrombosis. Describe pathogenesis and fate of a thrombus.' Use the top half of this chart."},

{id:"p-shock",s:"path",ch:"path3",t:"Shock: stages and pathogenesis",sum:"Why tissues fail when circulation collapses.",
n:[{b:[[["Hypovolaemic","Loss of blood or fluid (haemorrhage, burns, vomiting)."]],[["Cardiogenic","Pump failure (MI, arrhythmia, tamponade)."]],[["Septic","Infection causes vasodilatation and leaky vessels."]],[["Anaphylactic / neurogenic","Allergy or spinal injury causes massive vasodilatation."]]]},
["Fall in tissue perfusion","Cardiac output or vascular tone drops, so organs receive too little oxygen."],
["Stage 1: non-progressive (compensated)","Baroreceptors trigger sympathetic surge, catecholamines, RAAS and ADH; heart rate rises and blood is diverted to brain and heart."],
["Stage 2: progressive","Compensation fails; anaerobic metabolism causes lactic acidosis, which relaxes arterioles and pools blood; cells begin to die."],
["Stage 3: irreversible","Severe cell and organ damage; lysosomal enzymes leak; myocardial depressant factors; even restoring volume cannot save the patient."],
{k:["Multi-organ dysfunction","Shock lung (ARDS), acute tubular necrosis, ischaemic bowel, DIC, centrilobular liver necrosis, brain damage."]}],
terms:[["MODS","Multiple organ dysfunction syndrome."],["Lactic acidosis","Acid build-up from anaerobic glycolysis."],["Warm shock","Early septic shock with warm, flushed skin from vasodilatation."]],
exam:"For the LAQ on shock, give classification, this three-stage flow and the morphological changes in each organ."},

{id:"p-carcino",s:"path",ch:"path5",t:"Multistep carcinogenesis",sum:"How a normal cell accumulates mutations and becomes a metastatic cancer.",
n:[["Carcinogen exposure","Chemical (tobacco, aflatoxin), physical (UV, radiation) or viral (HPV, HBV, EBV)."],
["Initiation","Permanent, irreversible DNA mutation in a cell. A single exposure can initiate."],
["Promotion","Promoters (hormones, phorbol esters, chronic inflammation) make initiated cells proliferate; reversible if removed."],
{b:[[["Oncogene activation","Gain of function: RAS, MYC, ERBB2 (HER2), BCR-ABL push the cell to divide."]],[["Tumour suppressor loss","Loss of brakes: RB (G1→S checkpoint), p53 (DNA damage response); needs two hits."]],[["Apoptosis evasion","BCL-2 overexpression, p53 loss."]],[["Telomerase","Allows unlimited divisions (immortality)."]]]},
["Progression","More mutations and genomic instability create aggressive subclones."],
["Angiogenesis","VEGF from tumour cells builds new vessels; tumours cannot grow beyond 1–2 mm without them."],
["Invasion","Loss of E-cadherin, breakdown of basement membrane by MMPs, migration into stroma."],
{k:["Metastasis","Spread via lymphatics (carcinomas), blood (sarcomas) or body cavities (ovary). The defining feature of malignancy."]}],
terms:[["Proto-oncogene","Normal growth gene that can become an oncogene."],["Knudson two-hit","Both alleles of a tumour suppressor must be lost."],["MMP","Matrix metalloproteinase, digests extracellular matrix."],["Genomic instability","Tendency to accumulate mutations (e.g. defective DNA repair)."]],
exam:"Use this for 'Molecular basis of cancer' and add the hallmarks of cancer as a list."},

{id:"p-ida",s:"path",ch:"path7",t:"Iron deficiency anaemia: how it develops",sum:"The sequence from negative iron balance to microcytic anaemia.",
n:[["Negative iron balance","Blood loss (hookworm, menorrhagia, GI bleeding), poor diet, increased need (pregnancy, growth) or malabsorption."],
["Stage 1: storage depletion","Marrow and liver iron stores fall first; serum ferritin drops (<15 µg/L). Hb still normal."],
["Stage 2: iron-deficient erythropoiesis","Serum iron falls, TIBC rises, transferrin saturation <16%, free erythrocyte protoporphyrin rises."],
["Stage 3: frank anaemia","Hb falls; red cells become microcytic (MCV < 80 fL) and hypochromic (MCH low)."],
["Peripheral smear","Microcytic hypochromic cells, anisopoikilocytosis, pencil cells, target cells."],
["Clinical features","Fatigue, pallor, koilonychia (spoon nails), angular cheilitis, glossitis, pica, Plummer-Vinson syndrome."],
{k:["Treatment response","Oral iron raises reticulocytes in 5–10 days and Hb by about 1 g/dL per week; continue 3–6 months to refill stores."]}],
terms:[["Ferritin","Storage form of iron; best single test for iron deficiency."],["TIBC","Total iron-binding capacity; rises in iron deficiency."],["Koilonychia","Spoon-shaped nails."],["Mentzer index","MCV/RBC count; >13 favours IDA over thalassaemia trait."]],
exam:"Write the three stages with lab values; examiners give marks for ferritin, TIBC and transferrin saturation."},

{id:"p-dic",s:"path",ch:"path9",t:"DIC: consumption and bleeding",sum:"Why patients clot and bleed at the same time.",
n:[{b:[[["Tissue factor release","Obstetric complications (abruptio placentae, amniotic fluid embolism), APL, trauma, adenocarcinoma."]],[["Endothelial injury","Sepsis (endotoxin), burns, snake bite, heat stroke."]]]},
["Widespread activation of coagulation","Thrombin is generated throughout the circulation."],
["Microthrombi in small vessels","Fibrin deposits block microcirculation in kidney, brain, lungs and skin."],
{b:[[["Ischaemic organ damage","Renal failure, confusion, ARDS, skin necrosis."],["Microangiopathic haemolysis","RBCs are sheared on fibrin strands → schistocytes."]],
[["Consumption of platelets & factors","Platelets, fibrinogen, V and VIII get used up."],["Secondary fibrinolysis","Plasmin breaks clots → fibrin degradation products and D-dimer, which also act as anticoagulants."],["Bleeding","Oozing from venepuncture sites, petechiae, GI and wound bleeding."]]]},
{k:["Lab picture","↓ platelets, ↑ PT, ↑ aPTT, ↓ fibrinogen, ↑ D-dimer, schistocytes on smear. Treat the cause; give platelets, FFP, cryoprecipitate."]}],
terms:[["D-dimer","Fragment produced when plasmin degrades cross-linked fibrin."],["Schistocyte","Fragmented red cell (helmet cell)."],["FDP","Fibrin degradation products."],["APL","Acute promyelocytic leukaemia (AML-M3)."]],
exam:"A favourite short note. Draw this flow, list causes in two columns and finish with the lab table."},

{id:"p-mi",s:"path",ch:"path10",t:"Atherosclerosis to myocardial infarction",sum:"How a plaque becomes a heart attack and what happens to the muscle over time.",
n:[["Stable atheromatous plaque","Fibrofatty plaque with a lipid core and fibrous cap narrows the coronary artery (angina on exertion)."],
["Plaque disruption","Thin-capped, lipid-rich 'vulnerable' plaques rupture or erode, often due to inflammation and shear stress."],
["Platelet aggregation & thrombus","Exposed collagen and lipid trigger a thrombus that suddenly occludes the artery."],
["Ischaemia","Within 60 seconds ATP falls and contraction stops; injury is reversible for about 20–40 minutes."],
["Irreversible necrosis","After 20–40 min of severe ischaemia, cells begin to die from the subendocardium outward (wavefront)."],
{b:[[["0–12 h","Usually no gross change; waviness of fibres; coagulative necrosis begins at 4–12 h."]],[["1–3 days","Neutrophil infiltrate; mottled yellow-tan infarct."]],[["3–7 days","Macrophages remove dead cells; softest stage — risk of rupture."]],[["1–2 weeks","Granulation tissue at the margins."]],[["2–8 weeks","Collagen scar forms."]]]},
{k:["Complications","Arrhythmias (commonest early cause of death), heart failure, cardiogenic shock, rupture, papillary muscle rupture, mural thrombus, ventricular aneurysm, Dressler syndrome."]}],
terms:[["Troponin I/T","Most specific marker of myocardial necrosis; rises 3–4 h, stays 7–10 days."],["CK-MB","Returns to normal in 2–3 days; used for re-infarction."],["Contraction band necrosis","Seen at the edge of reperfused infarcts."],["Dressler syndrome","Autoimmune pericarditis weeks after MI."]],
exam:"For 'Myocardial infarction' combine this flow with a table of morphological changes by time and a list of cardiac markers."},

{id:"p-rhd",s:"path",ch:"path10",t:"Rheumatic fever to rheumatic heart disease",sum:"Molecular mimicry after a sore throat that scars heart valves.",
n:[["Group A streptococcal pharyngitis","Untreated throat infection with Streptococcus pyogenes (not skin infection)."],
["Latent period of 2–3 weeks","Antibodies and T cells develop against streptococcal M protein."],
["Molecular mimicry","Anti-M protein antibodies cross-react with cardiac myosin, valve glycoproteins, joint and brain antigens."],
["Acute rheumatic fever","Major Jones criteria: carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules."],
["Pancarditis","Aschoff bodies with Anitschkow (caterpillar) cells in all three layers; fibrinous pericarditis; verrucous vegetations on valve closure lines."],
["Recurrent attacks","Each new streptococcal infection reactivates the process; secondary penicillin prophylaxis prevents this."],
{k:["Chronic RHD","Valve fibrosis and commissural fusion: mitral stenosis (fish-mouth valve) is commonest; MacCallum plaque in left atrium; complications include AF, thrombi, IE."]}],
terms:[["Aschoff body","Pathognomonic granuloma of rheumatic carditis."],["Anitschkow cell","Activated macrophage with caterpillar-like chromatin."],["ASO titre","Anti-streptolysin O antibody, evidence of recent strep infection."],["Fish-mouth valve","Stenotic mitral valve from commissural fusion."]],
exam:"For the RHD long answer, write etiopathogenesis with this flow, then Jones criteria and morphology of acute vs chronic stages."}
);

FLOWS.push(
{id:"p-b12",s:"path",ch:"path7",t:"Vitamin B12 absorption & megaloblastic anaemia",sum:"Where B12 absorption can fail and what the deficiency does.",
n:[["Dietary B12","Only in animal foods (meat, eggs, milk); strict vegetarians are at risk."],
["Stomach: released by acid & pepsin","B12 binds R-binder (haptocorrin) from saliva."],
["Duodenum: pancreatic proteases free B12","B12 now binds intrinsic factor (IF) secreted by gastric parietal cells."],
["Terminal ileum: IF–B12 absorbed","Cubilin receptors take up the complex. Ileal resection or Crohn's disease blocks this."],
["Transport & storage","Transcobalamin II carries B12; liver stores last 3–5 years, so deficiency develops slowly."],
{b:[[["Pernicious anaemia","Autoimmune gastritis destroys parietal cells; anti-IF and anti-parietal cell antibodies."]],[["Other causes","Gastrectomy, fish tapeworm, bacterial overgrowth, metformin, vegan diet."]]]},
["Defective DNA synthesis","B12 is needed to regenerate tetrahydrofolate; thymidine synthesis slows and nuclei mature late (nuclear–cytoplasmic asynchrony)."],
{b:[[["Blood","Macro-ovalocytes, hypersegmented neutrophils, pancytopenia; megaloblasts in marrow; ineffective erythropoiesis (↑ LDH, ↑ bilirubin)."]],[["Nerves","Raised methylmalonic acid damages myelin → subacute combined degeneration of the cord (B12 only, not folate)."]]]}],
terms:[["Intrinsic factor","Glycoprotein from parietal cells needed for B12 absorption."],["Megaloblast","Large red-cell precursor with immature nucleus."],["SACD","Subacute combined degeneration of dorsal and lateral columns."],["Schilling test","Old test to locate the cause of B12 malabsorption."]],
exam:"For megaloblastic anaemia, describe B12 and folate metabolism, then causes, blood/marrow picture and lab diagnosis."},

{id:"p-cirrhosis",s:"path",ch:"path13",t:"Cirrhosis and portal hypertension",sum:"How chronic liver injury scars the liver and backs up portal blood.",
n:[["Chronic liver injury","Alcohol, chronic HBV/HCV, NAFLD, autoimmune, Wilson disease, haemochromatosis."],
["Hepatocyte death & inflammation","Kupffer cells release cytokines (TGF-β, PDGF)."],
["Stellate (Ito) cell activation","Vitamin A–storing cells become myofibroblasts and lay down collagen in the space of Disse."],
["Bridging fibrosis + regenerative nodules","Fibrous septa link portal tracts and central veins; surviving hepatocytes form nodules. This is cirrhosis."],
["Increased resistance to portal flow","Distorted vasculature and sinusoidal capillarisation raise portal pressure (> 10 mmHg)."],
{b:[[["Portosystemic shunts","Oesophageal varices (bleeding), caput medusae, haemorrhoids."]],[["Splenomegaly","Congestive splenomegaly causes hypersplenism and thrombocytopenia."]],[["Ascites","Portal hypertension + low albumin + RAAS activation."]],[["Hepatic encephalopathy","Ammonia bypasses the liver through shunts."]]]},
{k:["Liver failure features","Jaundice, low albumin, prolonged PT, spider naevi, palmar erythema, gynaecomastia; risk of hepatocellular carcinoma."]}],
terms:[["Space of Disse","Space between sinusoid endothelium and hepatocytes."],["Caput medusae","Dilated periumbilical veins."],["Micronodular","Nodules < 3 mm (alcohol)."],["Macronodular","Nodules > 3 mm (post-viral)."]],
exam:"For cirrhosis: definition, etiology, pathogenesis (this flow), classification and complications."},

{id:"p-nephrotic",s:"path",ch:"path14",t:"Nephrotic syndrome pathophysiology",sum:"Why a leaky glomerular filter causes oedema and high cholesterol.",
n:[["Podocyte / GBM injury","Minimal change disease (children), membranous nephropathy, FSGS, diabetic nephropathy, amyloidosis."],
["Loss of charge & size barrier","Effaced podocyte foot processes and damaged GBM let albumin through."],
["Massive proteinuria (> 3.5 g/day)","Urine is frothy; selective proteinuria (albumin only) suggests minimal change disease."],
["Hypoalbuminaemia (< 3 g/dL)","Liver synthesis cannot keep up with urinary loss."],
{b:[[["Low oncotic pressure","Fluid moves into tissues."],["Generalised oedema","Periorbital puffiness, then anasarca."]],[["Liver makes more lipoproteins","Compensatory synthesis rises."],["Hyperlipidaemia & lipiduria","Oval fat bodies and fatty casts in urine."]]]},
{k:["Complications","Infections (loss of immunoglobulins), thrombosis (loss of antithrombin III, renal vein thrombosis), protein malnutrition."]}],
terms:[["Podocyte","Visceral epithelial cell with foot processes."],["Selective proteinuria","Loss of low-molecular-weight proteins like albumin."],["Anasarca","Generalised massive oedema."],["Oval fat body","Lipid-laden tubular cell in urine."]],
exam:"Contrast nephritic vs nephrotic as a table; this flow earns pathogenesis marks."},

{id:"p-dm",s:"path",ch:"path16",t:"Diabetes mellitus: pathogenesis of complications",sum:"How chronic hyperglycaemia damages vessels, nerves and organs.",
n:[{b:[[["Type 1 DM","Autoimmune destruction of β-cells (HLA-DR3/DR4, anti-GAD) → absolute insulin deficiency."]],[["Type 2 DM","Insulin resistance (obesity, visceral fat) + progressive β-cell dysfunction."]]]},
["Chronic hyperglycaemia","Persistently high glucose exposes all tissues to sugar."],
{b:[[["AGE formation","Non-enzymatic glycation of proteins crosslinks collagen and activates inflammation."]],[["Polyol pathway","Aldose reductase turns glucose into sorbitol in nerves and lens → osmotic damage, cataract."]],[["PKC activation","Increases VEGF, TGF-β and vascular permeability."]],[["Oxidative stress","ROS damage endothelium."]]]},
{b:[[["Microvascular","Hyaline arteriolosclerosis and basement-membrane thickening."],["Retinopathy","Microaneurysms, exudates, neovascularisation."],["Nephropathy","Kimmelstiel-Wilson nodules; microalbuminuria first."],["Neuropathy","Symmetric distal sensory loss; diabetic foot."]],
[["Macrovascular","Accelerated atherosclerosis."],["Coronary artery disease","MI is the commonest cause of death."],["Stroke & peripheral vascular disease","Gangrene of the lower limb."]]]},
{k:["Acute complications","Diabetic ketoacidosis (Type 1), hyperosmolar hyperglycaemic state (Type 2), hypoglycaemia from treatment."]}],
terms:[["AGE","Advanced glycation end-product."],["HbA1c","Glycated haemoglobin, reflects 2–3 month glucose control; ≥ 6.5% diagnostic."],["Kimmelstiel-Wilson lesion","Nodular glomerulosclerosis."],["Insulin resistance","Reduced tissue response to insulin."]],
exam:"The DM long answer: classification, pathogenesis of type 1 and 2, this complications flow, morphology and diagnosis criteria."},

/* ===================== MICROBIOLOGY ===================== */
{id:"m-pathogenesis",s:"micro",ch:"micro1",t:"Bacterial pathogenesis: steps of infection",sum:"What a bacterium must do to cause disease.",
n:[["Transmission & entry","Contact, droplet, airborne, faeco-oral, vector or vertical routes bring the organism to a portal of entry."],
["Adhesion","Pili/fimbriae and adhesins bind host receptors (e.g. E. coli P-fimbriae to uroepithelium)."],
["Colonisation & multiplication","Bacteria multiply using iron-capturing siderophores and evade normal flora competition."],
{b:[[["Invasion","Spread into tissues using enzymes: hyaluronidase, collagenase, streptokinase."]],[["Immune evasion","Capsule (anti-phagocytic), IgA protease, protein A, antigenic variation, intracellular survival."]]]},
{b:[[["Exotoxins","Secreted proteins with specific actions: diphtheria, tetanus, cholera, botulinum."]],[["Endotoxin (LPS)","Released from Gram-negative walls; fever, shock, DIC."]]]},
{k:["Tissue damage & disease","Direct damage + damage from the host's own immune response; outcome depends on dose, virulence and host immunity."]}],
terms:[["Virulence","Degree of pathogenicity."],["Adhesin","Bacterial molecule that binds host cells."],["Siderophore","Iron-binding molecule."],["Superantigen","Toxin that activates many T cells non-specifically (TSST-1)."]],
exam:"Use for 'Virulence factors of bacteria' and add examples of each factor."},

{id:"m-hiv",s:"micro",ch:"micro7",t:"HIV life cycle & pathogenesis",sum:"How HIV enters CD4 cells and destroys the immune system.",
n:[["Transmission","Sexual (commonest), blood and needles, mother-to-child (in utero, delivery, breastfeeding)."],
["Attachment","gp120 binds CD4, then co-receptor CCR5 (early) or CXCR4 (late)."],
["Fusion & entry","gp41 mediates fusion of viral and cell membranes."],
["Reverse transcription","Reverse transcriptase converts viral RNA to DNA (error-prone → drug resistance). Target of NRTIs and NNRTIs."],
["Integration","Integrase inserts viral DNA into host genome (provirus). Target of dolutegravir."],
["Transcription & assembly","Host machinery makes viral RNA and proteins; protease cleaves polyproteins (target of protease inhibitors)."],
["Budding","New virions bud from the cell and infect more CD4 cells."],
{b:[[["Acute HIV","2–6 weeks: flu-like illness, high viral load; antibody may be negative (window period)."]],[["Clinical latency","Years of slow CD4 decline; virus active in lymph nodes."]],[["AIDS","CD4 < 200/µL or AIDS-defining illness: TB, PCP, cryptococcal meningitis, toxoplasmosis, CMV, Kaposi."]]]}],
terms:[["gp120","Envelope glycoprotein binding CD4."],["Provirus","Integrated viral DNA."],["Viral load","HIV RNA copies per mL; monitors ART."],["Window period","Time before antibodies are detectable."]],
exam:"For the HIV LAQ: structure, transmission, this pathogenesis flow, clinical stages and lab diagnosis (NACO strategies)."},

{id:"m-hbv",s:"micro",ch:"micro7",t:"Hepatitis B: course and serology timeline",sum:"Which marker appears when, and how to read the pattern.",
n:[["Exposure","Blood, sexual or perinatal transmission; incubation 1–6 months."],
["HBsAg appears","First marker (before symptoms); means current infection."],
["HBeAg & HBV DNA","Mark active replication and high infectivity."],
["IgM anti-HBc","Appears with symptoms; marker of acute infection and the only marker in the window period."],
{b:[[["Recovery (adults ~95%)","HBsAg disappears → window period → anti-HBs appears = immunity."],["Anti-HBe","Signals falling infectivity."]],[["Chronic infection","HBsAg persists > 6 months; IgG anti-HBc."],["Risks","Cirrhosis and hepatocellular carcinoma. 90% of infected neonates become chronic."]]]},
{k:["Vaccinated person","Anti-HBs only (no anti-HBc), because the vaccine contains only HBsAg."]}],
terms:[["Dane particle","Complete infectious HBV virion."],["Window period","Gap between HBsAg loss and anti-HBs appearance."],["HBeAg","Marker of high infectivity."],["Australia antigen","Old name for HBsAg."]],
exam:"Draw the serology timeline and a table of marker patterns; very commonly asked."},

{id:"m-cholera",s:"micro",ch:"micro4",t:"Cholera: how the toxin causes rice-water stools",sum:"A toxin that switches on intestinal salt and water secretion.",
n:[["Ingestion of contaminated water","High infective dose (10⁸) because the organism is acid-sensitive."],
["Reaches small intestine","Darting motility (flagellum) and mucinase help it penetrate mucus."],
["Adhesion via TCP","Toxin co-regulated pilus attaches to enterocytes; no invasion."],
["Cholera toxin (A + 5B)","B subunits bind GM1 ganglioside; A subunit enters the cell."],
["ADP-ribosylation of Gs","Gs protein is locked 'on' → adenylate cyclase permanently active → ↑ cAMP."],
["Cl⁻ secretion via CFTR, ↓ Na⁺ absorption","Water follows salt into the gut lumen."],
{k:["Rice-water stools & dehydration","Up to 1 L/hour of isotonic fluid loss; treat with ORS (works because glucose-Na⁺ co-transport is intact) and IV Ringer lactate."]}],
terms:[["TCP","Toxin co-regulated pilus."],["GM1 ganglioside","Receptor for cholera toxin."],["CFTR","Chloride channel."],["TCBS agar","Selective medium; yellow colonies of V. cholerae."]],
exam:"Draw this mechanism for 'Pathogenesis of cholera' and add lab diagnosis (VR medium, TCBS)."},

{id:"m-rabies",s:"micro",ch:"micro7",t:"Rabies: from bite to brain, and PEP",sum:"Why post-exposure prophylaxis must be immediate.",
n:[["Bite or scratch by rabid animal","Dogs cause most human rabies in India; virus is in saliva."],
["Local multiplication in muscle","Virus multiplies at the wound site (incubation 1–3 months; shorter for head/face bites)."],
["Enters peripheral nerves","Binds nicotinic ACh receptors and moves to the CNS by retrograde axonal transport. Antibodies cannot reach it here."],
["CNS infection","Spreads in brain; Negri bodies in hippocampus and Purkinje cells."],
["Centrifugal spread","Travels out to salivary glands, skin, cornea (basis of corneal impression smear)."],
{k:["Clinical rabies is fatal","Hydrophobia, aerophobia, furious or paralytic forms. Prevention is everything."]},
{b:[[["Category I","Touching/feeding, licks on intact skin","No PEP"]],[["Category II","Nibbling, minor scratches without bleeding","Wound wash + vaccine"]],[["Category III","Bites/scratches with bleeding, licks on broken skin or mucosa","Wound wash + vaccine + rabies immunoglobulin"]]]}],
terms:[["Negri body","Eosinophilic cytoplasmic inclusion in neurons."],["Hydrophobia","Painful pharyngeal spasms on attempting to drink."],["RIG","Rabies immunoglobulin, infiltrated into the wound."],["Essen schedule","IM vaccine on days 0, 3, 7, 14 (and 28)."]],
exam:"For rabies: pathogenesis flow, clinical features, lab diagnosis and the WHO category table for PEP."},

{id:"m-typhoid",s:"micro",ch:"micro4",t:"Typhoid fever pathogenesis",sum:"Why typhoid is a systemic illness and how diagnosis changes by week.",
n:[["Ingestion of S. Typhi","Contaminated food or water; carriers (gall bladder) spread it."],
["Invades M cells of Peyer's patches","Crosses the ileal mucosa without causing diarrhoea at first."],
["Primary bacteraemia","Spreads to liver, spleen, bone marrow, where it multiplies inside macrophages (incubation 7–14 days)."],
["Secondary bacteraemia","Released in large numbers → step-ladder fever, relative bradycardia, rose spots, splenomegaly."],
["Gall bladder seeding","Bacilli re-enter the gut via bile and re-infect Peyer's patches."],
["Peyer's patch ulceration","Longitudinal ulcers; in week 3 they may bleed or perforate."],
{k:["Diagnosis by week (BASU)","Week 1 blood culture, week 2 Widal (antibodies), week 3 stool, week 4 urine; bone marrow culture is most sensitive."]}],
terms:[["M cell","Specialised epithelial cell over Peyer's patches."],["Rose spots","Blanching pink macules on the trunk."],["Vi antigen","Capsular antigen of S. Typhi; basis of a vaccine."],["Chronic carrier","Excretes bacilli > 1 year, often from gall bladder."]],
exam:"Pathogenesis + lab diagnosis of enteric fever is a classic LAQ; this flow plus a Widal interpretation note covers it."},

{id:"m-immune",s:"micro",ch:"micro2",t:"Immune response to a new antigen",sum:"From antigen entry to antibodies and memory.",
n:[["Antigen enters","Microbe or vaccine antigen enters tissues."],
["Antigen-presenting cell","Dendritic cells capture, process and carry antigen to lymph nodes."],
{b:[[["MHC-II presentation","Extracellular antigens to CD4⁺ helper T cells."]],[["MHC-I presentation","Intracellular (viral) antigens to CD8⁺ cytotoxic T cells."]]]},
{b:[[["TH1","IFN-γ → macrophage activation (cell-mediated immunity)."]],[["TH2","IL-4, IL-5 → B cells, IgE, eosinophils."]],[["CD8⁺ CTL","Kills infected cells via perforin and granzymes."]]]},
["B cell activation","B cells bind antigen and receive T-cell help (CD40L, cytokines)."],
["Plasma cells & antibodies","Primary response: IgM first after 1–2 week lag, then IgG by class switching."],
{k:["Memory cells","Secondary response is faster, larger, mainly IgG with higher affinity — the basis of booster doses."]}],
terms:[["APC","Antigen-presenting cell."],["MHC","Major histocompatibility complex."],["Class switching","Change from IgM to IgG/IgA/IgE."],["Affinity maturation","Antibodies bind more tightly over time."]],
exam:"Use for 'Primary vs secondary immune response' and add a graph of antibody titre vs time."},

{id:"m-dengue",s:"micro",ch:"micro7",t:"Dengue: from bite to severe dengue",sum:"Why second infections can be more dangerous.",
n:[["Aedes aegypti bite","Day-biting mosquito breeding in clean stored water."],
["Febrile phase (days 1–3)","High fever, headache, retro-orbital pain, myalgia; NS1 antigen detectable."],
["Critical phase (days 3–7)","As fever falls, plasma leakage may begin: rising haematocrit, falling platelets."],
["Secondary infection, different serotype","Non-neutralising antibodies from the first infection help virus enter macrophages (antibody-dependent enhancement)."],
["Cytokine storm & endothelial leak","TNF, IL-6 and others increase vascular permeability."],
{b:[[["Dengue with warning signs","Abdominal pain, vomiting, mucosal bleed, liver enlargement, rising HCT with falling platelets."]],[["Severe dengue","Shock from plasma leakage, severe bleeding or organ damage."]]]},
{k:["Recovery phase","Fluid reabsorbed; watch for fluid overload. Diagnosis: NS1 (day 1–5), IgM ELISA (after day 5)."]}],
terms:[["ADE","Antibody-dependent enhancement."],["NS1","Non-structural protein 1, early antigen."],["Haematocrit","Rises with plasma leakage."],["Breteau index","Positive containers per 100 houses."]],
exam:"Write WHO classification, this pathogenesis and the lab tests by day of illness."}
);

FLOWS.push(
/* ===================== PHARMACOLOGY ===================== */
{id:"ph-chol",s:"pharm",ch:"pharm2",t:"Cholinergic transmission & drug targets",sum:"Each step of acetylcholine signalling and the drug acting there.",
n:[["Choline uptake into nerve ending","Na⁺-choline transporter; blocked by hemicholinium."],
["ACh synthesis","Choline acetyltransferase joins choline + acetyl-CoA."],
["Storage in vesicles","Vesicular transporter (blocked by vesamicol)."],
["Release by Ca²⁺-triggered exocytosis","Botulinum toxin cleaves SNARE proteins and blocks release → flaccid paralysis."],
{b:[[["Muscarinic receptors (M1–M3)","Glands, heart, smooth muscle."],["Agonists","Pilocarpine, bethanechol."],["Antagonists","Atropine, glycopyrrolate, ipratropium, tropicamide."]],[["Nicotinic receptors","NM at skeletal muscle; NN at ganglia."],["NM blockers","d-tubocurarine, vecuronium (competitive); succinylcholine (depolarising)."]]]},
["ACh broken down by acetylcholinesterase","Ends the signal within milliseconds."],
{b:[[["Reversible anticholinesterases","Neostigmine, pyridostigmine (myasthenia), physostigmine (crosses BBB), donepezil (Alzheimer)."]],[["Irreversible (organophosphates)","Phosphorylate the enzyme; 'ageing' makes it permanent."]]]},
{k:["OP poisoning treatment","Atropine for muscarinic effects + pralidoxime early to reactivate the enzyme before ageing."]}],
terms:[["SLUDGE","Salivation, lacrimation, urination, defecation, GI upset, emesis."],["Ageing","Loss of an alkyl group making OP–enzyme bond permanent."],["Myasthenic crisis","Weakness from too little drug; cholinergic crisis from too much."]],
exam:"Use for 'Classify anticholinesterases' and 'Treatment of OP poisoning'."},

{id:"ph-adrenergic",s:"pharm",ch:"pharm2",t:"Adrenergic receptors: effects and drugs",sum:"Match each receptor to its effect and to agonists/antagonists.",
n:[["Noradrenaline / adrenaline released","From sympathetic nerves and adrenal medulla."],
{b:[[["α1 (Gq)","Vasoconstriction, mydriasis, bladder sphincter contraction."],["Agonist","Phenylephrine"],["Blocker","Prazosin (HTN), tamsulosin (BPH)"]],[["α2 (Gi)","↓ Noradrenaline release (presynaptic), ↓ BP centrally."],["Agonist","Clonidine, methyldopa, brimonidine"]],[["β1 (Gs)","↑ Heart rate & force, ↑ renin."],["Agonist","Dobutamine"],["Blocker","Atenolol, metoprolol, bisoprolol"]],[["β2 (Gs)","Bronchodilatation, vasodilatation, uterine relaxation, glycogenolysis."],["Agonist","Salbutamol, terbutaline, formoterol"],["Non-selective blocker","Propranolol (avoid in asthma)"]]]},
["Termination","Re-uptake (uptake-1, blocked by cocaine & TCAs) and metabolism by MAO and COMT."],
{k:["Clinical choice","Anaphylaxis: adrenaline IM; septic shock: noradrenaline; cardiogenic shock: dobutamine; asthma: salbutamol."]}],
terms:[["Gq / Gs / Gi","G-proteins: Gq ↑ Ca²⁺, Gs ↑ cAMP, Gi ↓ cAMP."],["Uptake-1","Neuronal re-uptake of noradrenaline."],["Cardioselective","β1-selective blockers."]],
exam:"A receptor table plus this flow answers 'Classify adrenergic drugs with uses'."},

{id:"ph-aa",s:"pharm",ch:"pharm3",t:"Arachidonic acid pathway & NSAIDs",sum:"Where NSAIDs, steroids and montelukast act.",
n:[["Membrane phospholipids","Cell injury or stimulation activates phospholipase A2."],
["Phospholipase A2 → arachidonic acid","Glucocorticoids inhibit PLA2 indirectly (via lipocortin/annexin-1) — so they block both arms."],
{b:[[["Cyclo-oxygenase (COX-1, COX-2)","Blocked by NSAIDs; aspirin irreversibly; celecoxib selectively COX-2."],["PGE2, PGI2","Pain, fever, vasodilatation, gastric protection (PGE2), renal blood flow."],["TXA2 (platelets)","Aggregation, vasoconstriction; low-dose aspirin blocks it."]],
[["5-Lipoxygenase","Blocked by zileuton."],["LTB4","Neutrophil chemotaxis."],["LTC4, D4, E4","Bronchospasm, mucus; receptor blocked by montelukast."]]]},
{k:["Why NSAIDs cause side effects","↓ PGE2 → gastric ulcers; ↓ renal PGs → fluid retention; shunting to leukotrienes → aspirin-induced asthma."]}],
terms:[["PLA2","Phospholipase A2."],["COX-2","Inducible enzyme in inflammation."],["Annexin-1","Steroid-induced protein that inhibits PLA2."],["Reye's syndrome","Liver and brain injury with aspirin in children with viral illness."]],
exam:"Draw this for 'Mechanism of action of NSAIDs' and 'Uses and adverse effects of aspirin'."},

{id:"ph-insulin",s:"pharm",ch:"pharm4",t:"Insulin release & oral antidiabetic targets",sum:"How a β-cell secretes insulin and where each drug works.",
n:[["Glucose enters β-cell (GLUT2)","Glucokinase starts metabolism."],
["ATP rises","More ATP from glucose metabolism."],
["K-ATP channel closes","Sulfonylureas (glimepiride, gliclazide) close this channel directly → risk of hypoglycaemia."],
["Depolarisation → Ca²⁺ influx","Voltage-gated calcium channels open."],
["Insulin granules released","GLP-1 agonists and DPP-4 inhibitors amplify glucose-dependent release (low hypoglycaemia risk)."],
{b:[[["Liver","Metformin ↓ gluconeogenesis via AMPK."]],[["Muscle & fat","Pioglitazone (PPAR-γ) ↑ insulin sensitivity."]],[["Kidney","SGLT2 inhibitors (gliflozins) cause glycosuria."]],[["Gut","Acarbose slows carbohydrate digestion."]]]},
{k:["Choice","Metformin first-line; add SGLT2/GLP-1 for heart or kidney disease; insulin if uncontrolled."]}],
terms:[["K-ATP channel","ATP-sensitive potassium channel (SUR1 subunit)."],["Incretin","Gut hormone (GLP-1) enhancing insulin release after meals."],["AMPK","AMP-activated protein kinase."]],
exam:"For 'Classify oral hypoglycaemic agents', draw this and add ADRs: hypoglycaemia (SU), lactic acidosis (metformin)."},

{id:"ph-raas",s:"pharm",ch:"pharm7",t:"RAAS and antihypertensive drug sites",sum:"Follow the hormone cascade and see where each drug blocks it.",
n:[["Low BP / low Na⁺ / sympathetic drive","Sensed by the kidney's juxtaglomerular cells; β1 stimulation also releases renin (β-blockers block this)."],
["Renin cleaves angiotensinogen","Aliskiren directly inhibits renin."],
["Angiotensin I","Inactive decapeptide."],
["ACE converts to angiotensin II","ACE inhibitors (enalapril, ramipril) block this; ACE also breaks down bradykinin → dry cough."],
["Angiotensin II acts on AT1 receptors","ARBs (losartan, telmisartan) block AT1; no cough."],
{b:[[["Vasoconstriction","↑ Peripheral resistance."]],[["Aldosterone release","Na⁺ and water retention; spironolactone blocks it."]],[["ADH & thirst","↑ Volume."]],[["Cardiac remodelling","Hypertrophy and fibrosis."]]]},
{k:["Result","↑ Blood pressure. Other classes: thiazides (↓ volume), CCBs like amlodipine (vasodilatation), α1 blockers, central α2 agonists."]}],
terms:[["Juxtaglomerular cells","Renin-secreting cells of the afferent arteriole."],["Bradykinin","Vasodilator peptide broken down by ACE."],["AT1 receptor","Angiotensin II type 1 receptor."]],
exam:"Draw for 'Classify antihypertensives' and 'ACE inhibitors: MOA, uses, ADRs'."},

{id:"ph-coag",s:"pharm",ch:"pharm8",t:"Coagulation cascade & anticoagulant sites",sum:"Where heparin, warfarin, the newer oral anticoagulants and fibrinolytics act.",
n:[{b:[[["Intrinsic pathway","XII → XI → IX → VIII; measured by aPTT."]],[["Extrinsic pathway","Tissue factor + VII; measured by PT/INR."]]]},
["Factor X activated (Xa)","Rivaroxaban, apixaban (direct); LMWH and fondaparinux (via antithrombin)."],
["Prothrombin (II) → thrombin (IIa)","Dabigatran (direct); unfractionated heparin (via antithrombin, inhibits IIa and Xa)."],
["Fibrinogen → fibrin clot","Thrombin also activates platelets."],
["Warfarin","Blocks vitamin K epoxide reductase → liver makes non-functional II, VII, IX, X (and proteins C, S). Takes days to act."],
["Plasmin dissolves clot","Fibrinolytics (streptokinase, alteplase, tenecteplase) convert plasminogen to plasmin; tranexamic acid blocks this."],
{k:["Antidotes","Heparin → protamine; warfarin → vitamin K / FFP / PCC; dabigatran → idarucizumab; fibrinolytic bleeding → tranexamic acid."]}],
terms:[["Antithrombin III","Natural anticoagulant enhanced by heparin."],["INR","International normalised ratio; target 2–3 on warfarin."],["Vitamin K–dependent factors","II, VII, IX, X."]],
exam:"For anticoagulants: classification, this flow, heparin vs warfarin table and antidotes."},

{id:"ph-digoxin",s:"pharm",ch:"pharm7",t:"Digoxin: mechanism and toxicity",sum:"Why digoxin strengthens the heart and why low K⁺ makes it dangerous.",
n:[["Digoxin binds Na⁺/K⁺-ATPase","Competes with K⁺ at the pump; so hypokalaemia increases binding and toxicity."],
["Intracellular Na⁺ rises","The pump can no longer expel sodium."],
["Na⁺/Ca²⁺ exchanger slows","Less Ca²⁺ leaves the cell."],
["More Ca²⁺ stored in sarcoplasmic reticulum","More Ca²⁺ released with each beat."],
["Positive inotropy","Stronger contraction; useful in heart failure with AF."],
["Vagal effect","Slows SA node and AV conduction → controls ventricular rate in AF."],
{k:["Toxicity","Nausea, vomiting, xanthopsia (yellow vision), bigeminy, any arrhythmia, AV block. Treat: stop drug, correct K⁺, digoxin-specific Fab fragments."]}],
terms:[["Inotropy","Force of contraction."],["Narrow therapeutic index","Small gap between effective and toxic dose (0.5–0.9 ng/mL target)."],["Xanthopsia","Yellow vision."]],
exam:"For 'Digitalis in CHF', give MOA (this flow), uses, toxicity and its management."},

{id:"ph-levodopa",s:"pharm",ch:"pharm6",t:"Levodopa pathway in Parkinsonism",sum:"Why carbidopa and other add-ons are given with levodopa.",
n:[["Oral levodopa","Dopamine itself cannot cross the blood–brain barrier; its precursor levodopa can."],
{b:[[["Peripheral decarboxylation","Dopa decarboxylase in gut and blood converts most levodopa to dopamine → nausea, hypotension, arrhythmia."],["Carbidopa blocks this","Peripheral decarboxylase inhibitor (does not enter brain); cuts dose by 75%. Pyridoxine would increase peripheral conversion."]],[["Peripheral COMT","Converts levodopa to 3-O-methyldopa."],["Entacapone blocks this","Prolongs levodopa action; reduces wearing-off."]]]},
["Crosses BBB","Amino acid transporter (competition with dietary protein)."],
["Converted to dopamine in brain","Replenishes striatal dopamine."],
["Dopamine broken down by MAO-B","Selegiline, rasagiline inhibit MAO-B and prolong action."],
{k:["Long-term problems","Wearing-off, on-off phenomenon, dyskinesia, hallucinations. Dopamine agonists (pramipexole) are alternatives in younger patients."]}],
terms:[["Dopa decarboxylase","Enzyme converting levodopa to dopamine."],["On-off phenomenon","Sudden swings between mobility and immobility."],["COMT","Catechol-O-methyltransferase."]],
exam:"Asked as 'Why levodopa + carbidopa?' — this flow answers it completely."},

{id:"ph-att",s:"pharm",ch:"pharm11",t:"Antitubercular drugs: sites of action",sum:"How the first-line drugs attack M. tuberculosis.",
n:[["M. tuberculosis population","Rapidly dividing (cavity), slow (inside macrophages), semi-dormant (caseous tissue)."],
{b:[[["Isoniazid (H)","Inhibits mycolic acid synthesis (InhA); bactericidal for rapidly dividing bacilli."],["ADR","Peripheral neuropathy (give pyridoxine), hepatitis."]],[["Rifampicin (R)","Inhibits DNA-dependent RNA polymerase; kills all populations incl. semi-dormant."],["ADR","Orange urine, hepatitis, flu-like syndrome; strong enzyme inducer."]],[["Pyrazinamide (Z)","Active in acidic intracellular environment; sterilising in the first 2 months."],["ADR","Hepatotoxicity, hyperuricaemia."]],[["Ethambutol (E)","Inhibits arabinosyl transferase (cell wall); bacteriostatic, prevents resistance."],["ADR","Optic neuritis (red-green colour vision)."]]]},
["Intensive phase: HRZE × 2 months","Rapid kill and prevention of resistance."],
["Continuation phase: HRE × 4 months","Sterilises remaining bacilli."],
{k:["Rifampicin resistance","Detected by CBNAAT; switch to MDR/RR-TB regimen (bedaquiline, linezolid, fluoroquinolone)."]}],
terms:[["Bactericidal","Kills bacteria."],["Sterilising activity","Kills semi-dormant persisters, preventing relapse."],["MDR-TB","Resistant to at least isoniazid and rifampicin."]],
exam:"Classify ATT, draw this, then add the NTEP regimen and ADR table."},

/* ===================== COMMUNITY MEDICINE ===================== */
{id:"cm-natural",s:"cm",ch:"cm1",t:"Natural history of disease & prevention",sum:"The course of a disease and where each level of prevention fits.",
n:[["Agent–host–environment interact","Epidemiological triad; disease needs all three."],
["Pre-pathogenesis phase","Person exposed to risk factors but no disease yet."],
{b:[[["Primordial prevention","Stop risk factors from emerging (healthy lifestyle norms, tobacco control laws)."]],[["Primary prevention","Health promotion + specific protection (immunisation, iodised salt, chemoprophylaxis)."]]]},
["Early pathogenesis","Subclinical changes; disease detectable by tests (iceberg below the surface)."],
["Secondary prevention","Early diagnosis & treatment: screening (Pap smear, BP check), case finding."],
["Clinical disease","Signs and symptoms appear."],
["Tertiary prevention","Disability limitation (treatment to prevent complications) and rehabilitation (physical, vocational, social)."],
{k:["Outcomes","Recovery, disability, carrier state, chronic disease or death."]}],
terms:[["Epidemiological triad","Agent, host, environment."],["Iceberg phenomenon","Hidden subclinical cases outnumber visible cases."],["Specific protection","Measures against a particular disease (vaccine)."]],
exam:"Draw Leavell & Clark's diagram with levels of prevention; give one example of each."},

{id:"cm-screen",s:"cm",ch:"cm2",t:"Evaluating a screening test",sum:"Read a 2×2 table and calculate test performance.",
n:[["Apply test to population","Compare test result with a gold standard (true disease status)."],
{b:[[["True positive (a)","Test +, disease +"]],[["False positive (b)","Test +, disease −"]],[["False negative (c)","Test −, disease +"]],[["True negative (d)","Test −, disease −"]]]},
{b:[[["Sensitivity = a/(a+c)","Ability to detect those WITH disease; high sensitivity rules OUT (SnNout)."]],[["Specificity = d/(b+d)","Ability to identify those WITHOUT disease; high specificity rules IN (SpPin)."]]]},
{b:[[["PPV = a/(a+b)","Chance that a positive test is truly diseased; rises with prevalence."]],[["NPV = d/(c+d)","Chance that a negative test is truly disease-free."]]]},
{k:["Choosing a test","Screening needs high sensitivity (miss few cases); confirmation needs high specificity (few false positives)."]}],
terms:[["Gold standard","Best available reference test."],["Prevalence","Proportion with disease at a point in time."],["Yield","Number of previously unrecognised cases detected."]],
exam:"Numerical questions are common: practise filling the 2×2 table first, then calculate."},

{id:"cm-epidemic",s:"cm",ch:"cm2",t:"Investigation of an epidemic",sum:"The standard 10 steps in order.",
n:[["1. Verify the diagnosis","Clinical exam and lab confirmation of cases."],
["2. Confirm the epidemic","Compare current cases with the usual (expected) frequency."],
["3. Define population at risk","Map the area and get a population count (denominator)."],
["4. Rapid search for cases","Case definition; active and passive case finding; line listing."],
["5. Data analysis by time, place, person","Epidemic curve, spot map, attack rates by age/sex."],
["6. Formulate hypothesis","Likely source, mode of transmission, exposure."],
["7. Test hypothesis","Analytical study (case-control / cohort)."],
["8. Evaluate ecological factors","Sanitation, water, vectors, food handling."],
["9. Further investigation of population at risk","Follow-up to find additional cases and high-risk groups."],
{k:["10. Write the report","Background, findings, control measures and recommendations."]}],
terms:[["Epidemic curve","Graph of cases by date of onset; shows common-source vs propagated pattern."],["Attack rate","Cases ÷ population at risk during an epidemic."],["Line list","Table of cases with key variables."]],

["Livor mortis (hypostasis)","Blood settles in dependent parts: appears at 1–2 h, fixed by 6–8 h. Colour clues: cherry-red (CO), bright red (cyanide), brown (nitrites)."],

/* Offline model answers. A(chapterId, topicIndex, {r: textbook refs, s:[bigIdea, analogy, [points], hook], sh: short answer,
   m: [[heading, [points]] | [heading, [[th..],[td..]...]] (table)], l: {i: intro, x: extra sections, f: diagram text, c: conclusion}}).
   Written in original words following standard textbooks; not copied text. */
const ANS={};
function A(ch,k,o){ANS[ch+":"+k]=o;}
const R_PATH="Robbins & Cotran Basic Pathology; Harsh Mohan Textbook of Pathology";

/* ===== Pathology 1: Cell injury, adaptation & death ===== */
A("path1",0,{r:R_PATH+" — Cell injury chapter",
s:["Cell injury happens when a stress is too strong for the cell to adapt to.","Like a factory during a power cut: machines (pumps) stop, water floods in, and if the cut is long the building is damaged beyond repair.",["Commonest cause is lack of oxygen (hypoxia).","Main mechanisms: less ATP, mitochondrial damage, calcium entry, free radicals, membrane and DNA damage.","Early injury is reversible: swelling and fatty change.","Late injury is irreversible: membranes rupture and the nucleus breaks down.","The cell then dies by necrosis or apoptosis."],"Hypoxia → ATP falls → pump fails → swelling → if prolonged → death."],
sh:"Cell injury is the sequence of events when cells are exposed to stress beyond their adaptive capacity. Causes include hypoxia (commonest), physical, chemical, infectious, immunological, genetic and nutritional agents. Mechanisms are ATP depletion, mitochondrial damage, Ca²⁺ influx, free radicals and membrane/DNA damage. It may be reversible (cell swelling, fatty change) or irreversible (membrane damage, pyknosis, karyorrhexis, karyolysis) leading to necrosis or apoptosis.",
m:[["Definition","Cell injury: alterations in a cell when the stress exceeds its capacity to adapt; may be reversible or irreversible."],
["Etiology",["Oxygen deprivation: hypoxia, ischaemia (commonest)","Physical agents: trauma, heat, cold, radiation, electric shock","Chemicals & drugs: CCl4, alcohol, paracetamol overdose","Infectious agents: bacteria, viruses, toxins","Immunological reactions: autoimmunity, hypersensitivity","Genetic defects and nutritional imbalance"]],
["Mechanisms (pathogenesis)",["ATP depletion → Na⁺/K⁺ pump failure → cell swelling; anaerobic glycolysis → lactic acid → ↓ pH","Mitochondrial damage → mitochondrial permeability transition, cytochrome c leak","Influx of Ca²⁺ → activates phospholipases, proteases, endonucleases, ATPases","Free radicals (ROS) → lipid peroxidation, protein and DNA damage","Membrane damage → loss of selective permeability, lysosomal enzyme leak","DNA and protein damage → apoptosis"]],
["Reversible vs irreversible",["Reversible: cell swelling (hydropic change), fatty change, blebs, ER dilation, mild mitochondrial swelling","Irreversible: severe mitochondrial damage with amorphous densities, membrane rupture, lysosome rupture, nuclear changes (pyknosis, karyorrhexis, karyolysis)"]]],
l:{i:"Cells normally maintain a steady state (homeostasis). When a stress is mild they adapt (hypertrophy, hyperplasia, atrophy, metaplasia); when the stress exceeds this capacity, cell injury follows. Two features mark the point of no return: inability to reverse mitochondrial dysfunction and profound disturbance of membrane function.",
x:[["Morphology",["Light microscopy (reversible): swollen pale cells, small clear vacuoles (hydropic/vacuolar degeneration), fat droplets in hepatocytes","Electron microscopy: plasma membrane blebs, loss of microvilli, swollen mitochondria, dilated ER with detached ribosomes, myelin figures","Irreversible: intensely eosinophilic cytoplasm, nuclear pyknosis → karyorrhexis → karyolysis"]],
["Examples",["Ischaemia–reperfusion injury: restoring blood flow worsens damage by ROS and Ca²⁺ overload","Chemical injury: CCl4 → CCl3• free radical in liver (via cytochrome P450) → fatty liver and necrosis","Paracetamol overdose → NAPQI → glutathione depletion → centrilobular necrosis"]]],
f:"Stimulus (hypoxia, toxin, microbe…)\n   ↓\nATP ↓ · mitochondrial damage · Ca²⁺ influx · ROS · membrane/DNA damage\n   ↓\nREVERSIBLE: cell swelling, fatty change\n   ↓ (persistent / severe)\nIRREVERSIBLE: membrane rupture, nuclear changes\n   ↓                 ↓\nNECROSIS        APOPTOSIS",
c:"Cell injury is a continuum from reversible changes to cell death; early removal of the stimulus allows recovery, while persistent injury ends in necrosis or apoptosis."}});

A("path1",1,{r:R_PATH+" — Intracellular accumulations; Liver",
s:["Fatty liver is fat (triglyceride) piling up inside liver cells.","Like a warehouse whose trucks stop running: goods (fat) keep arriving but nothing ships out.",["Commonest cause: alcohol; also obesity, diabetes (NAFLD).","Fat builds up when more comes in, less is burnt, or the liver cannot export it.","Liver becomes large, yellow and greasy.","Usually reversible if the cause is removed."],"Alcohol + obesity + diabetes = yellow greasy liver."],
sh:"Fatty liver (steatosis) is abnormal accumulation of triglycerides within hepatocytes. Causes: alcohol (commonest), obesity, diabetes, starvation, protein malnutrition (kwashiorkor), drugs, toxins (CCl4), hypoxia. Grossly the liver is enlarged, yellow and greasy; microscopically hepatocytes contain fat vacuoles (micro- or macrovesicular) stained by Oil Red O/Sudan on frozen sections. It is usually reversible.",
m:[["Definition","Steatosis: abnormal intracellular accumulation of triglycerides in parenchymal cells, most often in the liver."],
["Causes",["Alcohol abuse (commonest)","Non-alcoholic fatty liver disease: obesity, diabetes, metabolic syndrome","Protein-energy malnutrition (kwashiorkor), starvation","Toxins and drugs: CCl4, steroids, tetracyclines","Hypoxia, acute fatty liver of pregnancy, Reye's syndrome"]],
["Pathogenesis",["↑ free fatty acids reaching the liver (starvation, diabetes, steroids)","↓ fatty acid oxidation (hypoxia, mitochondrial injury)","↑ esterification to triglycerides (alcohol)","↓ apoprotein synthesis → triglycerides cannot leave as lipoproteins (CCl4, malnutrition)"]],
["Morphology",["Gross: enlarged, soft, yellow, greasy liver","Micro: clear vacuoles pushing nucleus to periphery (macrovesicular, 'signet ring') or many small droplets (microvesicular: pregnancy, Reye's)","Special stains on frozen section: Oil Red O, Sudan III/IV (fat is dissolved in routine processing)"]]],
l:{i:"Fat metabolism in hepatocytes involves uptake of free fatty acids, their oxidation or esterification to triglycerides, and export as lipoproteins combined with apoproteins. A defect anywhere in this pathway causes triglycerides to accumulate.",
x:[["Fatty change in other organs",["Heart: 'tigered effect' (thrush-breast) in chronic anaemia/hypoxia","Kidney: fat in tubular cells"]],
["Fate and significance",["Reversible when the cause is removed","May progress to steatohepatitis, fibrosis and cirrhosis (alcohol, NASH)","Microvesicular steatosis (pregnancy, Reye's) can cause acute liver failure"]]],
f:"Free fatty acids (diet, adipose)\n   ↓ uptake into hepatocyte\nFFA → oxidation (mitochondria)  |  FFA → triglyceride\n                                    ↓ + apoprotein\n                               Lipoprotein → blood\nBlock at any step (alcohol, hypoxia, CCl4, malnutrition) → TG accumulates = FATTY LIVER",
c:"Fatty liver is a common, usually reversible accumulation of triglyceride; its importance lies in its causes and its potential to progress to cirrhosis."}});

A("path1",2,{r:R_PATH+" — Cell death",
s:["Necrosis is uncontrolled death of a group of cells in living tissue.","Like a building collapsing: walls burst, contents spill out and neighbours (immune cells) rush in.",["Cell membranes break and enzymes leak.","Always causes inflammation.","Different organs show different patterns.","Coagulative necrosis is the commonest type."],"CLiCk Fat Fib Gang: Coagulative, Liquefactive, Caseous, Fat, Fibrinoid, Gangrenous."],
sh:"Necrosis is the morphological changes after cell death in living tissue, caused by enzymatic digestion and protein denaturation, with membrane rupture and inflammation. Types: coagulative (infarcts of heart, kidney), liquefactive (brain infarct, abscess), caseous (tuberculosis), fat (acute pancreatitis), fibrinoid (vasculitis, malignant hypertension) and gangrenous. Nuclear changes are pyknosis, karyorrhexis and karyolysis.",
m:[["Definition","Necrosis: spectrum of morphological changes following cell death in living tissue, due to progressive degradative action of enzymes on lethally injured cells."],
["Mechanism",["Denaturation of proteins","Enzymatic digestion by lysosomal enzymes of the dead cell (autolysis) and leukocytes (heterolysis)","Membrane rupture → leak of contents → inflammation"]],
["Types",[["Type","Example","Key feature"],["Coagulative","MI, renal infarct","Ghost outlines of cells preserved"],["Liquefactive","Brain infarct, abscess","Tissue turns liquid"],["Caseous","Tuberculosis","Cheesy, amorphous, granuloma around"],["Fat","Acute pancreatitis","Chalky white saponification"],["Fibrinoid","Vasculitis, malignant HTN","Pink fibrin-like vessel wall"],["Gangrenous","Limb, bowel","Coagulative ± liquefactive (wet)"]]],
["Microscopic features",["Increased eosinophilia of cytoplasm","Nuclear: pyknosis (shrinkage), karyorrhexis (fragmentation), karyolysis (fading)","Dystrophic calcification may follow"]]],
l:{i:"Necrosis is pathological cell death affecting groups of cells; unlike apoptosis it is always accompanied by inflammation because cell contents leak through the ruptured membrane.",
x:[["Fate",["Phagocytosis and resolution","Healing by fibrosis (scar)","Dystrophic calcification","Liquefaction to form a cyst or abscess"]]],
f:"Lethal injury → denaturation + enzymatic digestion → membrane rupture → enzyme leak (↑ troponin, ALT) → inflammation\nPatterns: coagulative · liquefactive · caseous · fat · fibrinoid · gangrenous",
c:"The pattern of necrosis gives a clue to the cause (e.g., caseous = TB, fat = pancreatitis) and leaked enzymes are used clinically as markers of tissue damage."}});

A("path1",3,{r:R_PATH+" — Apoptosis",
s:["Apoptosis is a cell's planned, tidy suicide.","Like a person packing their room into neat boxes before moving out, so cleaners take it away without a mess.",["Needs energy (ATP) and is gene-controlled.","Affects single cells.","Two pathways: mitochondrial (intrinsic) and death receptor (extrinsic).","Both activate caspases.","No inflammation."],"Apoptosis = A-Popped quietly; Necrosis = Noisy."],
sh:"Apoptosis is programmed cell death in which cells activate enzymes (caspases) that degrade their own DNA and proteins, forming apoptotic bodies that are phagocytosed without inflammation. Physiological examples: embryogenesis, hormone-dependent involution (endometrium), thymic deletion of self-reactive T cells. Pathological: DNA damage, viral hepatitis (Councilman bodies), tumours. Pathways: intrinsic (mitochondrial, BCL-2 family, cytochrome c) and extrinsic (Fas/TNF receptor).",
m:[["Definition","Apoptosis: a pathway of cell death induced by a tightly regulated suicide program, in which cells activate enzymes that degrade their own nuclear DNA and proteins."],
["Causes",["Physiological: embryogenesis, menstrual endometrium, involution of breast after weaning, deletion of self-reactive lymphocytes, neutrophil death after inflammation","Pathological: DNA damage (radiation, drugs), misfolded proteins (ER stress), viral infections (hepatitis — Councilman bodies), cytotoxic T-cell killing, duct obstruction atrophy"]],
["Mechanism",["Intrinsic (mitochondrial): stress → BH3 sensors → BAX/BAK pores → cytochrome c → apoptosome → caspase-9","Extrinsic: FasL–Fas or TNF–TNFR1 → FADD → caspase-8","Execution: caspases 3, 6, 7 → DNA fragmentation, cytoskeleton breakdown","Clearance: phosphatidylserine exposed → phagocytosis"]],
["Morphology",["Cell shrinkage, dense eosinophilic cytoplasm","Chromatin condensation (pyknosis) and fragmentation","Cytoplasmic blebs → apoptotic bodies","No inflammation","DNA ladder pattern on gel electrophoresis"]]],
l:{i:"Apoptosis eliminates unwanted, damaged or potentially harmful cells without disturbing surrounding tissue. Its regulation is critical: too little apoptosis contributes to cancer and autoimmunity; too much contributes to neurodegeneration and ischaemic injury.",
x:[["Regulators",["Anti-apoptotic: BCL-2, BCL-XL, MCL-1 (BCL-2 over-expressed in follicular lymphoma, t(14;18))","Pro-apoptotic: BAX, BAK; sensors BIM, BID, PUMA, NOXA","p53 triggers apoptosis after DNA damage"]],
["Clinical relevance",["Cancer: evasion of apoptosis (p53 loss, BCL-2 gain)","Autoimmunity: defective Fas (autoimmune lymphoproliferative syndrome)","Neurodegeneration: excess apoptosis"]]],
f:"INTRINSIC: DNA damage / GF withdrawal → BH3 sensors → BAX/BAK → cytochrome c → APAF-1 apoptosome → caspase-9 ┐\nEXTRINSIC: FasL/TNF → death receptor → FADD → caspase-8 ──────────────────────────────────────┤\n                                                                      → caspases 3/6/7 → apoptotic bodies → phagocytosis (no inflammation)",
c:"Apoptosis is a regulated, energy-dependent, non-inflammatory form of cell death essential for normal development and protection against cancer."}});

A("path1",4,{r:R_PATH+" — Necrosis; Gangrene",
s:["Gangrene is death of a large area of tissue, often with bacterial rotting on top.","Dry gangrene is like a mummified fruit; wet gangrene is like rotting fruit in a damp bag.",["Usually due to loss of blood supply.","Dry: arteries blocked, tissue dries and turns black.","Wet: veins also blocked, infection, foul smell.","Gas gangrene: Clostridium makes gas in muscles."],"Dry = Diabetes/arterial; Wet = Waterlogged (venous + infection)."],
sh:"Gangrene is necrosis (usually coagulative) of tissue with superadded putrefaction. Dry gangrene follows arterial occlusion (atherosclerosis, Buerger's, diabetes) in limbs: dry, shrunken, black with a clear line of demarcation. Wet gangrene occurs in moist tissues (bowel, lung, mouth) with venous obstruction and infection: swollen, foul-smelling, no clear demarcation, toxaemia. Gas gangrene is caused by Clostridium perfringens with crepitus.",
m:[["Definition","Gangrene: a form of necrosis of tissue with superadded putrefaction (bacterial decomposition)."],
["Types",["Dry gangrene: limbs; arterial occlusion; slow; mummification","Wet gangrene: bowel (strangulated hernia, volvulus), lung, mouth (cancrum oris), diabetic foot; venous blockage + infection","Gas gangrene: Clostridium perfringens in deep contaminated wounds; muscle necrosis with gas bubbles","Fournier's gangrene: scrotum; Noma: face in malnourished children"]],
["Comparison",[["Feature","Dry","Wet"],["Site","Limbs","Bowel, lung, mouth, limbs (diabetic)"],["Cause","Arterial occlusion","Venous + arterial, infection"],["Appearance","Dry, shrunken, black","Swollen, soft, foul-smelling"],["Line of demarcation","Clear","Poor/absent"],["Spread","Slow","Rapid"],["Prognosis","Better","Poor (septicaemia)"]]]],
l:{i:"Gangrene combines ischaemic necrosis with bacterial putrefaction. Haemoglobin breaks down to iron sulphide, giving the black colour.",
x:[["Morphology",["Dry: blackened shrivelled tissue; line of demarcation formed by inflammation and granulation tissue between living and dead tissue","Wet: oedematous, bluish-black, liquefactive necrosis with bacteria","Microscopy: coagulative necrosis with inflammatory zone at the margin"]],["Management principles",["Dry: amputation at the line of demarcation","Wet/gas: urgent debridement or amputation, antibiotics, hyperbaric O₂ for gas gangrene"]]],
f:"Arterial occlusion → ischaemic coagulative necrosis → drying → DRY GANGRENE (clear demarcation)\nVenous + arterial block + bacteria → liquefaction → WET GANGRENE (toxaemia)",
c:"Gangrene type depends on the vessels involved, moisture and infection; wet gangrene is more dangerous because of rapid spread and sepsis."}});

A("path1",5,{r:R_PATH+" — Cellular adaptations",
s:["Hyperplasia means more cells; metaplasia means one adult cell type changes into another.","Hyperplasia is hiring more workers; metaplasia is replacing office staff with security guards because the area became dangerous.",["Both are adaptations to stress.","Hyperplasia: endometrium, BPH, breast in pregnancy.","Metaplasia: smoker's bronchus (columnar → squamous), Barrett oesophagus (squamous → columnar).","Both are reversible but may lead to cancer if persistent."],"Hyper = more; Meta = change."],
sh:"Hyperplasia is an increase in the number of cells in an organ due to proliferation (physiological: puberty breast, endometrium; pathological: endometrial hyperplasia, BPH). Metaplasia is reversible replacement of one differentiated adult cell type by another (squamous metaplasia in smoker's bronchus; columnar metaplasia in Barrett oesophagus). Both are adaptive; persistent stimuli can predispose to malignancy.",
m:[["Definitions",["Hyperplasia: increase in the number of cells resulting in increased organ size","Metaplasia: reversible change in which one differentiated cell type is replaced by another type"]],
["Comparison",[["Feature","Hyperplasia","Metaplasia"],["Change","Number of cells ↑","Type of cell changes"],["Mechanism","Growth factor–driven proliferation","Reprogramming of stem cells"],["Physiological example","Breast at puberty, endometrium (proliferative), liver regeneration","Cervical transformation zone"],["Pathological example","Endometrial hyperplasia, BPH, skin warts","Smoker's bronchus, Barrett oesophagus, vitamin A deficiency"],["Cells involved","Dividing cells only","Stem/reserve cells"],["Cancer risk","Endometrial hyperplasia → carcinoma","Barrett → adenocarcinoma, squamous → SCC"]]]],
l:{i:"Adaptations are reversible changes in size, number, phenotype or function of cells in response to changes in their environment.",x:[["Other adaptations",["Hypertrophy: increase in cell size (heart in hypertension, uterus in pregnancy)","Atrophy: decrease in size (disuse, denervation, ageing)"]],["Clinical note",["Metaplasia sacrifices function: squamous epithelium in bronchus loses mucus and cilia"]]],f:"Stress → adaptation:  ↑ number = HYPERPLASIA | ↑ size = HYPERTROPHY | ↓ size = ATROPHY | change type = METAPLASIA → (persistent) dysplasia → neoplasia",c:"Hyperplasia and metaplasia are both adaptive and reversible, but both can be fertile soil for cancer if the stimulus persists."}});

A("path1",6,{r:R_PATH+" — Cell death",
s:["Necrosis is accidental, messy death of groups of cells; apoptosis is planned, tidy death of single cells.","Necrosis is a bomb blast; apoptosis is a controlled demolition.",["Necrosis: swelling, membrane burst, inflammation.","Apoptosis: shrinkage, intact membrane, no inflammation.","Necrosis is always pathological; apoptosis can be normal."],"N = Noisy (inflammation); A = Asleep quietly."],
sh:"Necrosis is always pathological death of groups of cells with swelling, membrane rupture, random DNA breakdown (smear) and inflammation. Apoptosis is programmed, energy-dependent death of single cells with shrinkage, intact membrane, chromatin condensation, internucleosomal DNA cleavage (ladder pattern), apoptotic bodies and no inflammation; it can be physiological or pathological.",
m:[["Differences",[["Feature","Necrosis","Apoptosis"],["Cells","Groups of cells","Single cells"],["Cell size","Swelling","Shrinkage"],["Nucleus","Pyknosis → karyorrhexis → karyolysis","Chromatin condensation, fragmentation"],["Plasma membrane","Disrupted","Intact; altered (phosphatidylserine out)"],["Cellular contents","Enzymatic digestion, leak out","Intact; in apoptotic bodies"],["Inflammation","Present","Absent"],["Energy","Not required (ATP depletion)","ATP required"],["DNA on gel","Smear","Ladder pattern (180–200 bp)"],["Role","Always pathological","Physiological or pathological"],["Example","MI, TB, pancreatitis","Embryogenesis, viral hepatitis (Councilman bodies)"]]]],
l:{i:"Cells die by two main routes; distinguishing them is a favourite exam question.",x:[["Newer forms",["Necroptosis: programmed necrosis via RIPK1/RIPK3","Pyroptosis: inflammasome/caspase-1 mediated, releases IL-1","Ferroptosis: iron-dependent lipid peroxidation"]]],f:"Injury → severe/ATP gone → NECROSIS (swell, burst, inflame)\nInjury → regulated, ATP present → APOPTOSIS (shrink, bodies, phagocytosed)",c:"Necrosis is uncontrolled and inflammatory; apoptosis is regulated and silent."}});

A("path1",7,{r:R_PATH+" — Gangrene",
s:["Dry gangrene dries up; wet gangrene rots.","Dry = raisin; wet = rotten tomato.",["Dry: arterial block, limbs, slow, clear line.","Wet: venous block + infection, bowel/lung, fast, toxic."],"Dry is Distinct (clear line); Wet is Widespread."],
sh:"Dry gangrene follows arterial occlusion in limbs; tissue is dry, shrunken, black with a clear line of demarcation, spreads slowly and has a better prognosis. Wet gangrene occurs in moist tissues (bowel, lung, mouth, diabetic foot) with venous obstruction and infection; it is swollen, foul, poorly demarcated, spreads rapidly with toxaemia and poor prognosis.",
m:[["Differences",[["Feature","Dry gangrene","Wet gangrene"],["Common site","Limbs (toes, feet)","Bowel, lung, mouth, diabetic foot"],["Mechanism","Arterial occlusion","Venous obstruction ± arterial; infection"],["Macroscopy","Dry, shrunken, black (mummified)","Moist, swollen, soft, foul smell"],["Putrefaction","Limited","Marked"],["Line of demarcation","Present, clear","Absent/ill-defined"],["Spread","Slow","Rapid"],["Bacteria","Few","Many (incl. anaerobes)"],["Systemic effects","Minimal","Toxaemia, septicaemia"],["Prognosis","Better","Poor"],["Examples","Atherosclerosis, Buerger's, ergot, Raynaud's","Strangulated hernia, volvulus, intussusception, noma"]]]],
l:{i:"Both are necrosis with putrefaction; the difference lies in blood vessels involved, moisture and bacterial load.",x:[],f:"Arterial only + dry → DRY | Venous + moist + bacteria → WET",c:"Wet gangrene is a surgical emergency because of rapid spread and sepsis."}});

A("path1",8,{r:R_PATH+" — Pathological calcification",
s:["Dystrophic calcification is calcium in dead tissue with normal blood calcium; metastatic is calcium in normal tissue because blood calcium is high.","Dystrophic = chalk settling on a broken wall; metastatic = chalk everywhere because there is too much chalk dust in the air.",["Dystrophic: atheroma, damaged valves, TB, psammoma bodies.","Metastatic: hyperparathyroidism, bone destruction, vitamin D excess.","Metastatic prefers lungs, kidneys, stomach, blood vessels (alkaline sites)."],"Dystrophic = Dead tissue; Metastatic = More calcium."],
sh:"Dystrophic calcification is deposition of calcium salts in dead or degenerating tissue with normal serum calcium (atheroma, damaged heart valves, caseous TB, infarcts, psammoma bodies). Metastatic calcification occurs in normal tissues due to hypercalcaemia (hyperparathyroidism, bone metastases, myeloma, vitamin D toxicity, renal failure, sarcoidosis), mainly in interstitial tissues of lungs, kidneys, gastric mucosa and blood vessels.",
m:[["Differences",[["Feature","Dystrophic","Metastatic"],["Definition","Calcium in abnormal (dead/degenerated) tissue","Calcium in normal tissue"],["Serum calcium","Normal","High (hypercalcaemia)"],["Mechanism","Membrane-bound vesicles/phospholipids nucleate calcium phosphate","Excess Ca × PO4 product precipitates"],["Sites","Atheroma, valves, TB, infarcts, tumours (psammoma), fat necrosis","Lungs, kidneys (nephrocalcinosis), gastric mucosa, systemic arteries, pulmonary veins"],["Causes","Local tissue damage","Hyperparathyroidism, bone destruction, vitamin D excess, renal failure, milk-alkali syndrome"],["Function","Usually incidental; may cause valve dysfunction","May impair lung/kidney function"]]],
["Staining","Basophilic granular deposits on H&E; von Kossa (black) and Alizarin red stains."]],
l:{i:"Pathological calcification is abnormal deposition of calcium salts with small amounts of iron, magnesium and other minerals.",x:[["Psammoma bodies","Laminated concentric calcified bodies seen in papillary thyroid carcinoma, serous ovarian tumours, meningioma, mesothelioma."]],f:"Dead tissue + normal Ca → DYSTROPHIC\nNormal tissue + high Ca → METASTATIC",c:"Serum calcium level is the key point of difference."}});

A("path1",9,{r:R_PATH+" — Adaptations; Neoplasia (dysplasia)",
s:["Metaplasia is a normal cell type in the wrong place; dysplasia is disordered, abnormal-looking growth.","Metaplasia: neat bricks of a different type; dysplasia: bricks of odd shapes laid crookedly.",["Metaplasia is an adaptation, fully reversible.","Dysplasia is a pre-cancerous change, reversible only when mild.","Severe dysplasia through full thickness = carcinoma in situ."],"Meta = Mature change; Dys = Disorder."],
sh:"Metaplasia is reversible replacement of one mature cell type by another (smoker's bronchus, Barrett oesophagus); cells look normal for the new type. Dysplasia is disordered growth with loss of uniformity and architectural orientation: pleomorphism, hyperchromatic nuclei, increased mitoses, loss of polarity. It is pre-neoplastic; full-thickness dysplasia is carcinoma in situ.",

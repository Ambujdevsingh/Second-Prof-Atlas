FA["ph-chol"]={sh:"Cholinergic transmission involves choline uptake, ACh synthesis by choline acetyltransferase, vesicular storage, Ca²⁺-dependent release, action on muscarinic (M1–M3) and nicotinic (NM, NN) receptors, and rapid hydrolysis by acetylcholinesterase. Drugs act at each step: hemicholinium (uptake), vesamicol (storage), botulinum toxin (release), muscarinic agonists/antagonists, neuromuscular blockers, and anticholinesterases (reversible: neostigmine, physostigmine; irreversible: organophosphates).",
m:[["Classification of cholinergic drugs",["Choline esters: acetylcholine, methacholine, carbachol, bethanechol","Alkaloids: pilocarpine, muscarine, arecoline","Anticholinesterases — reversible: carbamates (physostigmine, neostigmine, pyridostigmine, rivastigmine), acridine (tacrine), others (edrophonium, donepezil, galantamine)","Irreversible: organophosphates (parathion, malathion, dyflos), carbamates (carbaryl, propoxur)"]],
["Uses of anticholinesterases",["Myasthenia gravis: pyridostigmine, neostigmine; edrophonium for diagnosis","Reversal of non-depolarising blockade: neostigmine + glycopyrrolate","Glaucoma: physostigmine, echothiophate (rare)","Belladonna/atropine poisoning: physostigmine","Alzheimer's disease: donepezil, rivastigmine, galantamine","Postoperative urinary retention, paralytic ileus: neostigmine"]],
["OP poisoning management",["Decontamination, airway, oxygen","Atropine 2–4 mg IV repeated until atropinisation","Pralidoxime early (before ageing)","Diazepam for convulsions; ventilatory support"]]],
li:"Acetylcholine is the transmitter at all autonomic ganglia, parasympathetic postganglionic endings, sympathetic sweat glands and the neuromuscular junction.",
lc:"Knowing each step of cholinergic transmission explains the actions and uses of a large group of drugs and the treatment of OP poisoning.",r:R_PHARM+" — Cholinergic system",
rq:[["S","Treatment of organophosphorus poisoning.","Remove clothes, wash skin, gastric lavage; atropine until secretions dry and HR > 80; pralidoxime 1–2 g IV early; diazepam for seizures; ventilation; watch for intermediate syndrome."],
["V","Why is physostigmine preferred in atropine poisoning?","It is a tertiary amine that crosses the blood–brain barrier and reverses central anticholinergic effects."],
["S","Myasthenia gravis — drug treatment.","Pyridostigmine (longer acting) or neostigmine; steroids, azathioprine, mycophenolate; IVIG/plasmapheresis in crisis; thymectomy. Edrophonium test differentiates myasthenic from cholinergic crisis."],
["V","What is 'ageing' of AChE?","Loss of an alkyl group from the phosphorylated enzyme, making inhibition irreversible so oximes no longer work."]]};
FA["ph-adrenergic"]={sh:"Adrenergic receptors are G-protein coupled: α1 (Gq: vasoconstriction, mydriasis), α2 (Gi: ↓ NA release, central ↓ BP), β1 (Gs: ↑ heart rate and force, renin release), β2 (Gs: bronchodilatation, vasodilatation, uterine relaxation), β3 (lipolysis, bladder relaxation). Drugs: α1 agonist phenylephrine; α2 agonists clonidine, methyldopa; β1 agonist dobutamine; β2 agonists salbutamol; blockers prazosin (α1), atenolol (β1), propranolol (non-selective).",
m:[["Receptor effects",[["Receptor","Mechanism","Main effects"],["α1","Gq → IP3/Ca²⁺","Vasoconstriction, mydriasis, sphincter contraction"],["α2","Gi → ↓ cAMP","↓ NA release, ↓ sympathetic outflow, ↓ insulin"],["β1","Gs → ↑ cAMP","↑ HR, contractility, AV conduction, renin"],["β2","Gs → ↑ cAMP","Bronchodilatation, vasodilatation, tocolysis, glycogenolysis, K⁺ into cells"],["β3","Gs","Lipolysis, detrusor relaxation"]]],
["Clinical uses of adrenergic agonists",["Anaphylaxis: adrenaline 0.5 mg IM","Septic shock: noradrenaline","Cardiogenic shock: dobutamine","Asthma/COPD: salbutamol, formoterol","Nasal decongestion: oxymetazoline","Preterm labour: terbutaline/ritodrine","Hypertension: clonidine, methyldopa (pregnancy)"]]],
li:"Catecholamines act through α and β receptors whose distribution determines the effect of each drug.",
lc:"Receptor selectivity guides the choice of adrenergic agonists and blockers.",r:R_PHARM+" — Adrenergic system",
rq:[["S","β-blockers: classification and uses.","Non-selective: propranolol, timolol; β1-selective: atenolol, metoprolol, bisoprolol, esmolol; with α-block: labetalol, carvedilol. Uses: hypertension, angina, MI, CHF, arrhythmias, thyrotoxicosis, migraine prophylaxis, glaucoma, anxiety, essential tremor."],
["S","Adverse effects and contraindications of β-blockers.","Bradycardia, heart block, bronchospasm, cold extremities, fatigue, masking hypoglycaemia, rebound on withdrawal. Avoid in asthma, heart block, Prinzmetal angina, decompensated heart failure."],
["V","Drug of choice in anaphylactic shock?","Adrenaline 0.5 mg (0.5 mL of 1:1000) IM."],
["V","Why is dopamine used in low dose for renal perfusion?","At 1–2 µg/kg/min it acts on D1 receptors causing renal and mesenteric vasodilatation (benefit now doubtful)."]]};
FA["ph-aa"]={sh:"Arachidonic acid released from membrane phospholipids by phospholipase A2 is converted by cyclo-oxygenase (COX-1, COX-2) to prostaglandins, prostacyclin and thromboxane, and by 5-lipoxygenase to leukotrienes. NSAIDs inhibit COX (aspirin irreversibly), reducing pain, fever and inflammation but causing gastric injury, renal effects and bleeding. Steroids indirectly inhibit PLA2; montelukast blocks leukotriene receptors.",
m:[["Classification of NSAIDs",["Non-selective COX inhibitors: salicylates (aspirin), propionic acids (ibuprofen, naproxen), acetic acids (diclofenac, indomethacin), oxicams (piroxicam), fenamates (mefenamic acid), pyrazolones (metamizole)","Preferential COX-2: nimesulide, meloxicam, aceclofenac","Selective COX-2: celecoxib, etoricoxib","Analgesic-antipyretic with weak anti-inflammatory action: paracetamol"]],
["Aspirin",["MOA: irreversible acetylation of COX","Doses: antiplatelet 75–150 mg; analgesic 300–600 mg; anti-inflammatory 3–5 g/day","Uses: MI, stroke prevention, rheumatic fever, pain, fever","ADR: gastritis, peptic ulcer, bleeding, Reye's syndrome, salicylism (tinnitus), bronchospasm, hypersensitivity","Poisoning: alkaline diuresis, haemodialysis"]]],
li:"Eicosanoids are local mediators of inflammation, pain, fever, platelet function and bronchial tone.",
lc:"The arachidonic acid pathway explains both the benefits and the adverse effects of NSAIDs.",r:R_PHARM+" — NSAIDs",
rq:[["V","Why does low-dose aspirin prevent thrombosis?","Irreversible inhibition of platelet COX-1 blocks TXA2 for the 7–10 day life of the platelet, while endothelial PGI2 recovers."],
["S","Reye's syndrome.","Acute encephalopathy with fatty liver in children given aspirin during viral illness (influenza, varicella); aspirin is avoided under 12–16 years."],
["D","Non-selective NSAIDs vs selective COX-2 inhibitors.","Non-selective: GI ulcers, antiplatelet effect. COX-2: fewer GI effects, no antiplatelet effect, ↑ thrombotic CV risk."],
["V","Drug of choice for fever in children?","Paracetamol."]]};
FA["ph-insulin"]={sh:"Glucose enters β-cells via GLUT2, raises ATP, closes K-ATP channels, depolarises the cell, opens Ca²⁺ channels and releases insulin. Sulfonylureas close K-ATP channels directly; GLP-1 agonists and DPP-4 inhibitors enhance glucose-dependent release. Metformin reduces hepatic gluconeogenesis (AMPK), pioglitazone improves insulin sensitivity (PPAR-γ), SGLT2 inhibitors cause glycosuria, acarbose slows carbohydrate digestion. Metformin is first-line in type 2 diabetes.",
m:[["Classification of oral antidiabetic drugs",["Insulin secretagogues: sulfonylureas (glimepiride, gliclazide, glipizide), meglitinides (repaglinide)","Biguanide: metformin","Thiazolidinedione: pioglitazone","α-glucosidase inhibitors: acarbose, voglibose","DPP-4 inhibitors: sitagliptin, vildagliptin, teneligliptin","SGLT2 inhibitors: dapagliflozin, empagliflozin","GLP-1 agonists (injectable/oral): liraglutide, semaglutide"]],
["Sulfonylureas",["MOA: block K-ATP channel (SUR1) → insulin release","ADR: hypoglycaemia (glibenclamide worst), weight gain","Contraindicated in type 1 DM, pregnancy, severe renal/hepatic disease"]],
["Metformin",["MOA: ↓ hepatic gluconeogenesis via AMPK; ↑ peripheral uptake; ↓ intestinal absorption","No hypoglycaemia, weight neutral/loss, improves lipids","ADR: GI upset, metallic taste, B12 deficiency, lactic acidosis (rare; avoid in eGFR < 30, hypoxia, contrast)","Uses: first-line T2DM, PCOS, prediabetes"]]],
li:"Oral antidiabetic drugs target different steps in glucose homeostasis and are combined in type 2 diabetes.",
lc:"Choice depends on efficacy, hypoglycaemia risk, weight effect, comorbidities and cost.",r:R_PHARM+" — Antidiabetic drugs",
rq:[["S","Management of type 2 diabetes.","Lifestyle + metformin; add SGLT2/GLP-1 in ASCVD, CKD or HF; otherwise sulfonylurea, DPP-4 or pioglitazone; insulin if uncontrolled; monitor HbA1c every 3 months."],
["V","Antidiabetic drug that causes weight loss?","GLP-1 agonists (also SGLT2 inhibitors, metformin modestly)."],
["S","Diabetic ketoacidosis management.","IV normal saline, regular insulin infusion 0.1 U/kg/h, K⁺ replacement, add dextrose at glucose ~250 mg/dL, bicarbonate only if pH < 6.9, treat precipitating cause."],
["V","Why is metformin stopped before contrast studies?","Contrast nephropathy can raise metformin levels and cause lactic acidosis."]]};
FA["ph-raas"]={sh:"The renin–angiotensin–aldosterone system raises blood pressure: renin converts angiotensinogen to angiotensin I, ACE converts it to angiotensin II, which acts on AT1 receptors causing vasoconstriction, aldosterone release, ADH secretion and cardiac remodelling. Drugs: β-blockers ↓ renin, aliskiren blocks renin, ACE inhibitors block ACE (and raise bradykinin → cough), ARBs block AT1, spironolactone blocks aldosterone.",
m:[["Classification of antihypertensives",["Diuretics: thiazides (hydrochlorothiazide, chlorthalidone), loop, K⁺-sparing","ACE inhibitors: enalapril, ramipril, lisinopril","ARBs: losartan, telmisartan; renin inhibitor: aliskiren","Calcium channel blockers: amlodipine, nifedipine, diltiazem, verapamil","β-blockers: atenolol, metoprolol; α+β: labetalol, carvedilol","α1-blockers: prazosin; central α2 agonists: clonidine, methyldopa","Vasodilators: hydralazine, minoxidil, sodium nitroprusside"]],
["ACE inhibitors",["MOA: ↓ angiotensin II, ↓ aldosterone, ↑ bradykinin","Uses: hypertension, CHF, post-MI, diabetic nephropathy","ADR: dry cough, angioedema, hyperkalaemia, first-dose hypotension, foetopathy","Contraindications: pregnancy, bilateral renal artery stenosis"]],
["Special situations",["Pregnancy: methyldopa, labetalol, nifedipine","Hypertensive emergency: IV labetalol, nitroprusside, nicardipine; lower BP ≤ 25% in first hour","Diabetes/CKD: ACEI or ARB"]]],
li:"Hypertension is the commonest cardiovascular disorder; drug therapy targets cardiac output and peripheral resistance.",
lc:"The RAAS is the target of several antihypertensive classes with organ-protective benefits.",r:R_PHARM+" — Antihypertensives",
rq:[["V","Why do ACE inhibitors cause dry cough?","Accumulation of bradykinin and substance P (ACE also degrades kinins)."],
["S","Treatment of hypertension in pregnancy.","Methyldopa, labetalol, nifedipine (oral); hydralazine/labetalol IV in severe cases; MgSO4 for eclampsia; avoid ACEI, ARB, diuretics."],
["D","ACE inhibitors vs ARBs.","ACEI: block ACE, ↑ bradykinin → cough/angioedema. ARB: block AT1 receptor, no bradykinin rise, no cough; both teratogenic and cause hyperkalaemia."],
["S","Hypertensive emergency.","Severe BP rise (> 180/120) with acute organ damage; IV labetalol, nicardipine, sodium nitroprusside, esmolol; reduce by ≤ 25% in first hour."]]};
FA["ph-coag"]={sh:"Coagulation proceeds via intrinsic (aPTT) and extrinsic (PT) pathways to factor Xa, thrombin and fibrin. Heparin (via antithrombin III) inhibits IIa and Xa; LMWH and fondaparinux mainly Xa; rivaroxaban/apixaban directly inhibit Xa; dabigatran inhibits thrombin; warfarin blocks vitamin K epoxide reductase, reducing factors II, VII, IX, X. Fibrinolytics activate plasminogen. Antidotes: protamine (heparin), vitamin K/FFP/PCC (warfarin), idarucizumab (dabigatran), tranexamic acid (fibrinolytics).",
m:[["Classification of anticoagulants",["Parenteral: unfractionated heparin, LMWH (enoxaparin), fondaparinux, direct thrombin inhibitors (bivalirudin, argatroban)","Oral: vitamin K antagonists (warfarin, acenocoumarol), direct Xa inhibitors (rivaroxaban, apixaban), direct thrombin inhibitor (dabigatran)"]],
["Heparin vs warfarin",[["Feature","Heparin","Warfarin"],["Route","IV/SC","Oral"],["Onset","Immediate","3–5 days"],["Mechanism","Activates antithrombin III","Vitamin K antagonist"],["Monitoring","aPTT","PT/INR (2–3)"],["Antidote","Protamine sulphate","Vitamin K, FFP, PCC"],["Pregnancy","Safe","Teratogenic"],["ADR","Bleeding, HIT, osteoporosis","Bleeding, skin necrosis, teratogenicity"]]],
["Uses",["DVT and PE treatment and prophylaxis","Atrial fibrillation (stroke prevention)","Acute coronary syndrome","Prosthetic valves (warfarin)"]]],
li:"Anticoagulants prevent formation and extension of thrombi; they do not dissolve existing clots.",
lc:"Matching the drug to its site in the cascade explains its monitoring test and antidote.",r:R_PHARM+" — Anticoagulants",
rq:[["V","Antidote for heparin overdose?","Protamine sulphate (1 mg per 100 units heparin)."],
["S","LMWH advantages over unfractionated heparin.","Predictable SC absorption, longer half-life, once/twice daily, no routine aPTT monitoring, less HIT and osteoporosis; mainly anti-Xa."],
["S","Drug interactions of warfarin.","Increased effect: NSAIDs, aspirin, cotrimoxazole, metronidazole, fluconazole, amiodarone, cimetidine. Decreased: rifampicin, phenytoin, carbamazepine, barbiturates, vitamin K–rich foods."],
["V","Why overlap heparin with warfarin?","Warfarin acts slowly and initially lowers protein C, causing a transient hypercoagulable state."]]};
FA["ph-digoxin"]={sh:"Digoxin inhibits myocardial Na⁺/K⁺-ATPase, raising intracellular Na⁺, which slows Na⁺/Ca²⁺ exchange and increases intracellular Ca²⁺ stores, producing positive inotropy. It also increases vagal tone, slowing AV conduction. Uses: heart failure with AF, rate control in AF. It has a narrow therapeutic index; toxicity (nausea, xanthopsia, arrhythmias) is increased by hypokalaemia and treated by stopping the drug, correcting K⁺ and digoxin-specific Fab.",
m:[["Pharmacological actions",["Heart: ↑ force of contraction, ↓ HR, ↓ AV conduction, ↑ ventricular automaticity (toxicity)","Kidney: diuresis in CHF (improved output)","CNS: CTZ stimulation → nausea, vomiting; visual disturbances"]],
["Uses",["CHF with atrial fibrillation","Control of ventricular rate in AF/flutter","Symptomatic heart failure despite optimal therapy (no mortality benefit)"]],
["Toxicity",["Early: anorexia, nausea, vomiting, diarrhoea","Visual: yellow vision (xanthopsia), blurred vision","Cardiac: ventricular bigeminy, VT, AV block, any arrhythmia","Predisposing: hypokalaemia, hypomagnesaemia, hypercalcaemia, renal failure, elderly, quinidine/verapamil/amiodarone","Treatment: stop digoxin, K⁺ supplement, lignocaine/phenytoin for ventricular arrhythmias, atropine for block, digoxin Fab antibodies"]]],
li:"Cardiac glycosides from Digitalis have been used in heart failure for over 200 years.",
lc:"Digoxin improves symptoms but not survival in heart failure; its narrow safety margin demands careful monitoring.",r:R_PHARM+" — Drugs for CHF",
rq:[["S","Drugs used in CHF.","Diuretics; ACEI/ARB/ARNI (sacubitril-valsartan); β-blockers (carvedilol, bisoprolol, metoprolol); aldosterone antagonists; SGLT2 inhibitors; digoxin; hydralazine + nitrate; inotropes (dobutamine) in acute failure."],
["V","Electrolyte that increases digoxin toxicity?","Hypokalaemia."],
["V","Antidote for digoxin toxicity?","Digoxin-specific Fab antibody fragments."],
["S","Why is digoxin useful in AF?","It slows AV nodal conduction through vagal stimulation, controlling ventricular rate."]]};
FA["ph-levodopa"]={sh:"Parkinsonism results from loss of nigrostriatal dopaminergic neurons. Levodopa, a dopamine precursor, crosses the blood–brain barrier and is converted to dopamine in the brain. Carbidopa inhibits peripheral dopa decarboxylase, reducing dose and peripheral side effects; entacapone (COMT inhibitor) and selegiline/rasagiline (MAO-B inhibitors) prolong its action. Long-term problems include wearing-off, on-off phenomenon and dyskinesias.",
m:[["Classification of antiparkinsonian drugs",["Dopamine precursor: levodopa (+ carbidopa/benserazide)","Dopamine agonists: pramipexole, ropinirole, bromocriptine, rotigotine","MAO-B inhibitors: selegiline, rasagiline","COMT inhibitors: entacapone, tolcapone","Dopamine releaser/NMDA antagonist: amantadine","Central anticholinergics: trihexyphenidyl, benztropine (drug-induced parkinsonism)"]],
["Levodopa",["MOA: converted to dopamine in striatum","ADR early: nausea, vomiting, postural hypotension, arrhythmia","ADR late: dyskinesias, wearing-off, on-off, hallucinations, psychosis","Interactions: pyridoxine (↓ effect without carbidopa), MAO-A inhibitors (hypertensive crisis), antipsychotics (antagonism), dietary protein (↓ absorption)"]],
["Why carbidopa",["Blocks peripheral decarboxylation → more levodopa reaches brain","Dose reduced by ~75%","Fewer GI and cardiovascular side effects","Pyridoxine interaction abolished"]]],
li:"Parkinson's disease is a degenerative disorder with tremor, rigidity, bradykinesia and postural instability due to striatal dopamine deficiency.",
lc:"Levodopa with carbidopa remains the most effective therapy; adjuncts smooth its response.",r:R_PHARM+" — Antiparkinsonian drugs",
rq:[["V","Why can't dopamine be given for Parkinsonism?","It does not cross the blood–brain barrier."],
["S","On-off phenomenon.","Sudden unpredictable fluctuations between mobility (on) and immobility (off) in long-term levodopa therapy, related to fluctuating plasma levels and receptor changes."],
["V","Drug for drug-induced (antipsychotic) parkinsonism?","Central anticholinergic such as trihexyphenidyl (levodopa is ineffective)."],
["S","Dopamine agonists — advantages.","Longer action, no conversion needed, fewer motor fluctuations, used early in young patients; ADR: nausea, hallucinations, impulse-control disorders, sleep attacks."]]};
FA["ph-att"]={sh:"First-line antitubercular drugs are isoniazid (mycolic acid synthesis), rifampicin (RNA polymerase), pyrazinamide (sterilising in acid pH) and ethambutol (arabinosyl transferase). Under NTEP, drug-sensitive TB is treated with HRZE for 2 months (intensive) and HRE for 4 months (continuation) using daily weight-band FDCs. MDR-TB (resistant to H and R) needs bedaquiline, linezolid and fluoroquinolone–based regimens.",
m:[["Classification",["First-line: isoniazid (H), rifampicin (R), pyrazinamide (Z), ethambutol (E), streptomycin (S)","Second-line: fluoroquinolones (levofloxacin, moxifloxacin), bedaquiline, linezolid, clofazimine, cycloserine, delamanid/pretomanid, injectables (amikacin)"]],
["Isoniazid",["MOA: inhibits mycolic acid synthesis (via InhA after KatG activation)","Bactericidal for rapidly dividing bacilli","ADR: peripheral neuropathy (pyridoxine), hepatitis, SLE-like syndrome","Acetylator polymorphism"]],
["Rifampicin",["MOA: inhibits DNA-dependent RNA polymerase (rpoB)","Kills all populations","ADR: orange-red secretions, hepatitis, flu-like syndrome, thrombocytopenia","Potent enzyme inducer (OCPs, warfarin, ART interactions)"]],
["NTEP regimen",["Intensive phase: HRZE × 8 weeks","Continuation: HRE × 16 weeks","Daily FDCs by weight band; pyridoxine; DOT/99DOTS","Rifampicin resistance on CBNAAT → MDR/RR-TB regimen"]]],
li:"Combination therapy kills different bacillary populations and prevents emergence of resistance.",
lc:"Adherence to the full regimen is the key to cure and to preventing drug-resistant TB.",r:R_PHARM+" — Antitubercular drugs",
rq:[["S","Adverse effects of first-line ATT.","H: neuropathy, hepatitis. R: hepatitis, orange urine, flu syndrome, interactions. Z: hepatotoxicity, hyperuricaemia, arthralgia. E: optic neuritis (red-green colour vision). S: ototoxicity, nephrotoxicity."],
["V","Why give pyridoxine with isoniazid?","INH increases pyridoxine excretion, causing peripheral neuropathy."],
["S","MDR-TB.","Resistance to at least isoniazid and rifampicin; diagnosed by CBNAAT/LPA/DST; treated with all-oral regimens (bedaquiline, pretomanid, linezolid, moxifloxacin — BPaLM) or longer regimens per national guidelines."],
["V","ATT drug safe in renal failure without dose change?","Rifampicin (also isoniazid); ethambutol needs dose adjustment."]]};

/* ---- Community Medicine ---- */
FA["cm-natural"]={sh:"The natural history of disease is the course of a disease from pre-pathogenesis (agent–host–environment interaction) through pathogenesis (early, clinical, advanced disease) to recovery, disability or death. Levels of prevention fit along it: primordial (prevent risk factors), primary (health promotion, specific protection), secondary (early diagnosis and treatment) and tertiary (disability limitation and rehabilitation).",
m:[["Levels of prevention with examples",[["Level","Mode of intervention","Example"],["Primordial","Prevent emergence of risk factors","Healthy lifestyle education, tobacco control laws"],["Primary","Health promotion; specific protection","Nutrition, sanitation; immunisation, iodised salt"],["Secondary","Early diagnosis and treatment","Screening (Pap smear, BP), case finding, contact tracing"],["Tertiary","Disability limitation; rehabilitation","Treating complications; physiotherapy, vocational training"]]],
["Epidemiological triad",["Agent: biological, chemical, physical, nutritional","Host: age, sex, genetics, immunity, behaviour","Environment: physical, biological, social"]]],
li:"Leavell and Clark described the natural history of disease and linked each phase to a level of prevention.",
lc:"The earlier in the natural history we intervene, the greater the benefit.",r:R_CM+" — Concept of health and disease",
rq:[["V","Immunisation is which level of prevention?","Primary (specific protection)."],
["S","Iceberg phenomenon.","Clinically apparent cases are the tip; the submerged part includes subclinical, undiagnosed and carrier states; important in hypertension, diabetes, TB."],
["V","Example of primordial prevention?","Preventing children from taking up smoking or junk-food habits through policy and education."],
["S","Modes of intervention in tertiary prevention.","Disability limitation (stopping progression, preventing complications) and rehabilitation (medical, vocational, social, psychological)."]]};
FA["cm-screen"]={sh:"A screening test is evaluated against a gold standard using a 2×2 table. Sensitivity = TP/(TP+FN) (ability to detect diseased), specificity = TN/(TN+FP) (ability to detect non-diseased), PPV = TP/(TP+FP) and NPV = TN/(TN+FN). PPV increases with prevalence. Screening needs high sensitivity; confirmatory tests need high specificity.",
m:[["Definitions",["Screening: search for unrecognised disease in apparently healthy people by rapid tests","Sensitivity: true positive rate","Specificity: true negative rate","PPV/NPV: probability that a positive/negative result is correct","Yield: amount of previously unrecognised disease detected"]],
["Criteria for screening (Wilson & Jungner)",["Disease is an important health problem","Natural history understood; recognisable latent stage","Suitable, acceptable, safe test","Effective treatment available","Cost-effective; continuing process"]],
["Example calculation",["Of 100 diseased, test detects 90 → sensitivity 90%","Of 900 non-diseased, 810 test negative → specificity 90%","PPV = 90/(90+90) = 50% at prevalence 10%"]]],
li:"Screening aims at secondary prevention by detecting disease early.",
lc:"A good screening test is sensitive, specific, cheap and acceptable, and its predictive values depend on prevalence.",r:R_CM+" — Screening for disease",
rq:[["V","Formula for sensitivity?","TP / (TP + FN)."],
["V","Effect of prevalence on PPV?","PPV increases as prevalence increases."],
["D","Screening vs diagnostic test.","Screening: apparently healthy, many people, cheap, high sensitivity, not a basis for treatment. Diagnostic: symptomatic individuals, more expensive, high specificity, basis for treatment."],
["S","Types of screening.","Mass screening, high-risk (selective) screening, multiphasic screening, opportunistic (case finding)."]]};
FA["cm-epidemic"]={sh:"Investigation of an epidemic follows ten steps: verify diagnosis, confirm existence of epidemic, define population at risk, rapid search for all cases (case definition, line list), analyse data by time, place and person (epidemic curve, spot map, attack rates), formulate hypothesis, test hypothesis (analytical study), evaluate ecological factors, further investigation of the population at risk, and write the report with control measures.",
m:[["Objectives",["Define magnitude and involvement by time, place, person","Find the source and mode of transmission","Identify high-risk groups","Recommend control and prevention"]],
["Key tools",["Case definition (clinical + lab + time/place/person)","Line listing","Epidemic curve: common-source (single sharp peak) vs propagated (multiple peaks)","Spot map","Attack rate = new cases / population at risk"]],
["Control measures",["Eliminate source (water, food)","Interrupt transmission (chlorination, vector control)","Protect susceptibles (immunisation, chemoprophylaxis)","Health education and surveillance"]]],
li:"An epidemic is the occurrence of cases in excess of normal expectancy in a community.",
lc:"Systematic investigation leads to rapid control of the outbreak and prevention of future ones.",r:R_CM+" — Principles of epidemiology",
rq:[["V","First step in epidemic investigation?","Verification of the diagnosis."],
["D","Common-source vs propagated epidemic curve.","Common-source: single exposure, sharp rise and fall within one incubation period (food poisoning). Propagated: person-to-person, gradual rise, multiple waves (measles, hepatitis A)."],
["S","Attack rate and secondary attack rate.","Attack rate: cases in population at risk during the epidemic. Secondary attack rate: cases among susceptible contacts within the incubation period after exposure to a primary case — measures infectiousness."],
["V","What is a spot map?","A map marking the location of each case to show clustering and possible source."]]};
FA["cm-water"]={sh:"Large-scale water purification consists of storage (natural sedimentation, reduction of bacteria), filtration (slow sand: biological, Schmutzdecke; rapid sand: coagulation with alum, mechanical, backwashing) and disinfection by chlorination. Break-point chlorination ensures free residual chlorine of 0.5 mg/L after one hour of contact, tested by the orthotoluidine test.",
m:[["Slow vs rapid sand filter",[["Feature","Slow sand","Rapid sand"],["Rate of filtration","2–3 m³/m²/day","200 m³/m²/day"],["Area","Large","Small"],["Pre-treatment","Plain sedimentation","Coagulation (alum) + sedimentation"],["Cleaning","Scraping top layer","Backwashing"],["Purification","Biological (Schmutzdecke)","Mechanical/chemical"],["Bacterial removal","99.9%","98–99%"]]],
["Chlorination",["Kills pathogens, oxidises iron/manganese, removes taste and odour","Chlorine demand satisfied first; break-point chlorination gives free residual","Free residual chlorine 0.5 mg/L after 1 h contact","Super-chlorination and dechlorination for heavily polluted water","Orthotoluidine test (free + combined chlorine) or OTA test"]]],
li:"Safe drinking water prevents water-borne diseases such as cholera, typhoid, hepatitis A and E.",
lc:"Storage, filtration and chlorination together make water microbiologically safe.",r:R_CM+" — Environment and health",
rq:[["V","Vital layer of slow sand filter?","Schmutzdecke (biological slime layer)."],
["S","Disinfection of a well.","Calculate water volume, estimate bleaching powder needed (2.5 g raises 1 m³ water by 1 mg/L available chlorine), make paste, add, wait 1 h, check residual 0.5 mg/L by orthotoluidine test; repeat weekly (double-pot method for households)."],
["V","Available chlorine in bleaching powder?","About 33%."],
["S","Household purification methods.","Boiling (rolling boil 5–10 min), chlorine tablets/bleaching powder solution, filtration (ceramic candle), SODIS (solar), alum."]]};

/* ---- FMT ---- */
FA["f-pm"]={sh:"Post-mortem changes help estimate time since death. Immediate: loss of circulation, respiration and reflexes; primary flaccidity. Early: algor mortis (cooling ~0.5–1 °F/h), livor mortis (appears 1–2 h, fixed 6–8 h), rigor mortis (starts 1–2 h, complete ~12 h, passes 18–36 h). Late: decomposition (greenish discoloration of right iliac fossa at 12–18 h, marbling, bloating, maggots), and modifications — adipocere (moist) or mummification (dry).",
m:[["Signs of death",["Immediate: insensibility, cessation of respiration and circulation","Early: eye changes (loss of corneal reflex, tache noire, segmentation of retinal vessels), pallor, primary flaccidity, cooling, hypostasis, rigor","Late: decomposition, adipocere, mummification"]],
["Rigor mortis",["Cause: ATP depletion → actin–myosin cross-bridges fixed","Order (Nysten's rule): heart first, then eyelids, face, neck, upper limbs, trunk, lower limbs; passes in same order","Duration in India: begins 1–2 h, complete by 12 h, passes off by 18–36 h (shorter in summer)","Conditions: heat stiffening, cold stiffening, gas stiffening; cadaveric spasm"]],
["Estimating time since death",["Temperature (rectal), hypostasis, rigor, decomposition","Stomach contents, bladder","Vitreous potassium, entomology (larval stage)","Combine methods; give a range"]]],
li:"Thanatology studies death and post-mortem changes; estimating the post-mortem interval is a routine medicolegal duty.",
lc:"Each change has a variable timetable affected by climate and body build, so multiple methods are combined.",r:R_FMT+" — Thanatology",
rq:[["D","Rigor mortis vs cadaveric spasm.","Rigor: all muscles, after 1–2 h, due to ATP loss, can be broken, no medicolegal significance of last act. Spasm: group of voluntary muscles, instantaneous at death, cannot be simulated or broken easily, shows last act (suicide weapon in hand)."],
["D","Post-mortem hypostasis vs bruise.","Hypostasis: dependent parts, uniform, no swelling, blood within vessels, disappears on pressure early. Bruise: any site, swelling, blood in tissues, colour changes, does not shift."],
["V","First external sign of decomposition?","Greenish discoloration of skin over right iliac fossa (caecum)."],
["S","Adipocere.","Saponification of body fat in warm moist conditions into a soapy, waxy, rancid-smelling substance over weeks; preserves features and injuries — helps identification."]]};
FA["f-hanging"]={sh:"Hanging is a form of asphyxial death caused by suspension of the body by a ligature around the neck, the constricting force being the body weight. Death may result from venous and arterial occlusion, airway obstruction, vagal inhibition or cervical fracture (judicial). The ligature mark is oblique, above the thyroid cartilage, non-continuous with a gap at the knot and has a parchment-like base. Dribbling of saliva is the surest sign of ante-mortem hanging. Most hangings are suicidal.",
m:[["Types",["Typical (knot at occiput) vs atypical (knot elsewhere)","Complete vs partial (body partly supported)","Judicial hanging: drop causes C2 fracture (hangman's fracture)"]],
["Mechanism of death",["Asphyxia from airway compression","Venous congestion (jugular occlusion at 2 kg)","Cerebral ischaemia (carotid occlusion at 5 kg, vertebral at 30 kg)","Vagal inhibition (reflex cardiac arrest)","Fracture-dislocation of cervical spine"]],
["Hanging vs ligature strangulation",[["Feature","Hanging","Strangulation"],["Manner","Usually suicidal","Usually homicidal"],["Mark position","Above thyroid","At/below thyroid"],["Direction","Oblique","Horizontal"],["Continuity","Incomplete at knot","Complete, encircling"],["Base","Parchment, pale","Bruised, abraded"],["Saliva dribbling","Present","Absent"],["Hyoid fracture","Uncommon","Rare; thyroid cartilage common"],["Struggle marks","Absent","Present"]]]],
li:"Hanging is one of the commonest methods of suicide in India; its findings must be distinguished from homicidal strangulation.",
lc:"Careful examination of the ligature mark and associated signs distinguishes ante-mortem hanging from strangulation or post-mortem suspension.",r:R_FMT+" — Asphyxial deaths",
rq:[["V","Surest sign of ante-mortem hanging?","Dribbling of saliva from the angle of the mouth opposite the knot."],
["S","Mechanism of death in hanging.","Asphyxia, cerebral ischaemia from carotid/vertebral occlusion, venous congestion, vagal inhibition, cervical fracture in judicial hanging."],
["D","Hanging vs strangulation.","See comparison table: manner, mark level, direction, continuity, base, saliva, fractures, struggle."],
["V","Force needed to occlude carotid arteries?","About 5 kg (jugular veins 2 kg, trachea 15 kg, vertebral arteries 30 kg)."]]};
FA["f-methanol"]={sh:"Methanol is oxidised by alcohol dehydrogenase to formaldehyde and by aldehyde dehydrogenase to formic acid, which causes high anion-gap metabolic acidosis and damages the optic nerve and basal ganglia. Features: headache, vomiting, abdominal pain, blurred 'snowfield' vision, blindness, Kussmaul breathing, coma. Treatment: fomepizole or ethanol to block alcohol dehydrogenase, sodium bicarbonate, folinic acid and haemodialysis.",
m:[["Sources",["Spurious/illicit liquor (hooch tragedies)","Industrial solvents, varnish, antifreeze, methylated spirit"]],
["Toxicity",["Fatal dose 60–240 mL; latent period 12–24 h (ethanol co-ingestion prolongs)","Formic acid inhibits cytochrome oxidase → retinal and optic nerve damage, putaminal necrosis","Metabolic acidosis with high anion gap and osmolar gap"]],
["Management",["Gastric lavage within 1 h","Fomepizole (or ethanol 10% IV/oral) to block ADH","Sodium bicarbonate for acidosis","Folinic acid/folate to metabolise formate","Haemodialysis for severe acidosis, visual signs, high levels"]],
["Post-mortem findings",["Cyanosis, congested organs, odour of formalin","Cerebral oedema, haemorrhagic necrosis of putamen","Preserve viscera, blood and vitreous"]]],
li:"Methanol poisoning occurs in clusters after consumption of adulterated liquor and has high mortality.",
lc:"Early blocking of alcohol dehydrogenase and dialysis save sight and life.",r:R_FMT+" — Toxicology (alcohols)",
rq:[["V","Toxic metabolite of methanol?","Formic acid."],
["V","Mechanism of ethanol as antidote?","Competes for alcohol dehydrogenase (higher affinity), preventing methanol conversion."],
["D","Methanol vs ethanol poisoning.","Methanol: latent period, severe acidosis, visual loss, needs fomepizole/dialysis. Ethanol: CNS depression, hypoglycaemia, no blindness, supportive care."],
["S","Hooch tragedy — medicolegal duties.","Inform police and health authorities, preserve samples (blood with fluoride, vitreous, viscera), document, treat cluster cases, issue MLC."]]};
FA["f-firearm"]={sh:"The range of a firearm discharge is estimated from features at the entry wound. Contact shots show muzzle imprint, stellate tears over bone, burning and soot inside the wound, cherry-red tissue. Close shots (within flame range) show burning, singeing, blackening and tattooing. Near shots show tattooing ± blackening. Distant shots show only a round hole with abrasion and grease collars. Entry wounds are smaller with inverted margins; exit wounds are larger, irregular and everted.",
m:[["Range of fire",[["Range","Features"],["Contact","Muzzle imprint, stellate tear over bone, soot in wound, CO (cherry-red)"],["Close (flame range)","Burning, singeing of hair, blackening, tattooing"],["Near (powder range)","Tattooing ± blackening, no burning"],["Distant","Only bullet: round hole, abrasion and grease collars"]]],
["Entry vs exit wound",[["Feature","Entry","Exit"],["Size","Smaller than bullet calibre","Larger, irregular"],["Margins","Inverted","Everted"],["Abrasion/grease collar","Present","Absent"],["Burning, tattooing","May be present","Absent"],["Bleeding","Less","More"]]],
["Medicolegal aspects",["Range helps distinguish suicide (contact/close, accessible sites) from homicide (distant, inaccessible)","Preserve clothing; gunshot residue tests; X-ray to locate projectile","Recover bullet without damaging rifling marks"]]],
li:"Firearm injuries are produced by projectiles discharged by explosive propellants; the wound pattern reflects range and weapon.",
lc:"Careful description of the entry wound and clothing is essential for reconstructing the shooting.",r:R_FMT+" — Firearm injuries",
rq:[["D","Entry vs exit wound.","Entry: small, inverted, abrasion and grease collars, burning/tattooing at close range. Exit: large, everted, irregular, no collars."],
["V","Tattooing is due to?","Embedded unburnt and partially burnt gunpowder particles; cannot be wiped off."],
["S","Smooth-bore vs rifled weapons.","Smooth-bore (shotgun): multiple pellets, wad, spread increases with range. Rifled: single bullet with rifling marks, spinning, greater range and penetration."],
["V","What is a 'key-hole' wound?","Tangential bullet strike on skull producing a combined entry-exit wound."]]};

/* Chapter overviews: CHSUM[id] = [overview paragraph, exam focus line] — original summaries following standard textbooks. */
const CHSUM={
path1:["This chapter explains how cells respond to stress. Mild stress triggers adaptation (hypertrophy, hyperplasia, atrophy, metaplasia). Stronger stress causes injury, which is reversible at first (cell swelling, fatty change) and becomes irreversible once mitochondria and membranes fail. Cells then die by necrosis, which is messy and inflammatory, or by apoptosis, which is tidy and programmed. Calcification and pigments are the 'footprints' left in damaged tissue.","Exam focus: cell injury mechanisms (LAQ), apoptosis, the necrosis types, and the five classic difference questions."],
path2:["Inflammation is the body's protective response that brings plasma proteins and leukocytes to injured tissue. Acute inflammation is fast and neutrophil-driven, controlled by vascular changes and chemical mediators. Chronic inflammation is prolonged, dominated by macrophages and lymphocytes, and its special form, granulomatous inflammation, underlies tuberculosis, leprosy and sarcoidosis. Repair follows by regeneration or scarring, through healing by first or second intention.","Exam focus: acute inflammation (5★ LAQ), mediators, tuberculosis (5★ LAQ), granulomas and wound healing."],
path3:["Haemodynamic disorders arise from disturbed fluid balance and blood flow. Oedema results from imbalance of Starling forces; congestion is passive pooling of venous blood. Thrombosis follows Virchow's triad, and thrombi may embolise to cause infarction. Shock is circulatory failure with tissue hypoperfusion that progresses through compensated, progressive and irreversible stages.","Exam focus: oedema, shock (LAQ), chronic venous congestion of lung, liver and spleen, thrombosis and embolism."],
path4:["Immunopathology covers diseases caused by the immune system: hypersensitivity reactions (types I–IV), autoimmune diseases such as SLE, transplant rejection, and immunodeficiency, chiefly HIV/AIDS. Amyloidosis, the deposition of misfolded proteins in β-pleated sheets, is included here because many types arise from immune or inflammatory disorders.","Exam focus: amyloidosis (LAQ), AIDS (LAQ), hypersensitivity, SLE and transplant rejection."],
path5:["Neoplasia is uncontrolled, autonomous growth caused by accumulated genetic damage. The chapter covers nomenclature, benign versus malignant behaviour, the molecular hallmarks of cancer (oncogenes, tumour suppressors, apoptosis evasion), chemical, physical and viral carcinogens, how tumours invade and metastasise, how cancers affect the host (paraneoplastic syndromes), and how they are graded, staged and diagnosed.","Exam focus: neoplasia definition and benign vs malignant (5★ LAQ), paraneoplastic syndromes, tumour markers, lab diagnosis, p53 and RB."],
path6:["Genetic disorders range from single-gene (Mendelian) diseases to chromosomal disorders like Down, Klinefelter and Turner syndromes. Lysosomal storage diseases illustrate how one missing enzyme causes multi-organ disease. Paediatric and nutritional topics include protein-energy malnutrition (kwashiorkor vs marasmus) and congenital TORCH infections.","Exam focus: storage disorders (5★), Down syndrome, kwashiorkor vs marasmus and TORCH."],
path7:["Anaemia is a reduced oxygen-carrying capacity of blood. It is classified by red cell size (microcytic, normocytic, macrocytic) and by mechanism (blood loss, decreased production, increased destruction). Iron deficiency and megaloblastic anaemia are the most common nutritional anaemias in India, while haemolytic anaemias include hereditary defects (spherocytosis, G6PD, sickle cell, thalassaemia) and acquired causes.","Exam focus: anaemia classification with IDA and megaloblastic anaemia (LAQ), haemolytic anaemia, thalassaemia and sickle cell."],
path8:["White cell disorders include reactive changes (leukaemoid reaction, infectious mononucleosis) and neoplasms: acute and chronic leukaemias, Hodgkin and non-Hodgkin lymphomas, and plasma cell neoplasms such as multiple myeloma. Diagnosis relies on blood counts, smear, marrow, immunophenotyping and cytogenetics (Philadelphia chromosome, t(15;17), t(8;14)).","Exam focus: CML, AML, Hodgkin lymphoma, multiple myeloma (all LAQs), leukaemoid reaction and Burkitt lymphoma."],
path9:["Bleeding disorders result from defects in vessels, platelets or clotting factors. Platelet counts, bleeding time, PT and aPTT localise the defect. Key conditions are ITP, TTP, haemophilia, von Willebrand disease and DIC, which combines thrombosis with bleeding. Blood transfusion and its complications complete the chapter.","Exam focus: DIC (4★), ITP vs TTP, haemophilia and transfusion reactions."],
path10:["Atherosclerosis is the central disease of arteries, causing ischaemic heart disease, stroke and aneurysms. The heart chapter covers myocardial infarction and its markers, rheumatic heart disease, infective endocarditis, congenital heart disease (tetralogy of Fallot) and cardiomyopathies, along with vasculitides such as polyarteritis nodosa.","Exam focus: atherosclerosis (5★ LAQ), myocardial infarction (LAQ), rheumatic heart disease (LAQ) and cardiac markers."],
path11:["Respiratory pathology covers obstructive diseases (chronic bronchitis, emphysema, asthma, bronchiectasis), restrictive and occupational lung diseases (pneumoconioses), infections (lobar pneumonia, TB, lung abscess), ARDS and lung tumours, especially bronchogenic carcinoma with its paraneoplastic syndromes.","Exam focus: COPD (LAQ), bronchogenic carcinoma (LAQ), pneumoconiosis and lobar pneumonia."],
path12:["Gastrointestinal pathology spans salivary glands (pleomorphic adenoma), oesophagus (Barrett, carcinoma), stomach (gastritis, peptic ulcer, carcinoma), small and large intestine (malabsorption, IBD, intestinal TB and typhoid, carcinoid, colorectal carcinoma) and the eye tumour retinoblastoma.","Exam focus: IBD (Crohn's vs UC), peptic ulcer, colorectal carcinoma, pleomorphic adenoma and retinoblastoma."],
path13:["Liver pathology begins with jaundice and liver function tests, then covers viral hepatitis (HBV serology), alcoholic and fatty liver disease, cirrhosis with portal hypertension, metabolic disorders (Wilson, haemochromatosis) and hepatocellular carcinoma. Gall bladder stones, cholecystitis and pancreatitis are also included.","Exam focus: jaundice and LFTs (LAQ), cirrhosis (LAQ), hepatitis B markers, HCC and gallstones."],
path14:["Renal pathology centres on glomerular diseases, classified clinically as nephritic or nephrotic syndromes, plus tubular (ATN), cystic (polycystic kidney) and neoplastic diseases (renal cell carcinoma, Wilms tumour). The male genital tract section covers testicular tumours, BPH and carcinoma prostate.","Exam focus: glomerulonephritis and nephritic vs nephrotic (LAQ), RPGN, RCC, Wilms tumour, ATN and prostate."],
path15:["The female genital tract chapter covers cervical intraepithelial neoplasia and carcinoma cervix (HPV), endometrial hyperplasia and carcinoma, leiomyoma, ovarian tumours (especially teratoma) and gestational trophoblastic disease. The breast section covers fibroadenoma, phyllodes tumour and carcinoma breast with its risk factors and classification.","Exam focus: carcinoma breast (5★ LAQ), leiomyoma, teratoma, CIN and hydatidiform mole."],
path16:["This chapter brings together skin tumours (BCC, SCC, melanoma), endocrine diseases (thyroiditis, goitre, Graves, diabetes mellitus, adrenal disorders), bone tumours (osteosarcoma, GCT, Ewing), soft tissue tumours, CNS lesions (meningitis, meningioma, schwannoma) and cytology techniques (Pap smear, FNAC).","Exam focus: diabetes mellitus (5★ LAQ, very likely), skin cancers, goitre, bone tumours and CNS tumours."],
path17:["Clinical pathology is the laboratory side of medicine: routine urine examination with casts and crystals, CSF and body fluid analysis (transudate vs exudate), semen analysis and haematology techniques (ESR, PCV, indices, bone marrow). Blood banking covers grouping, cross-matching and component therapy.","Exam focus: urine casts, CSF findings in meningitis, transudate vs exudate and blood components."],
path18:["This chapter covers the pathology of common tropical infections (leprosy spectrum, typhoid, malaria, mucormycosis) and environmental and nutritional diseases: obesity, vitamin deficiencies (A, D, B12, C), effects of tobacco and alcohol, and radiation injury.","Exam focus: leprosy classification, typhoid pathology and vitamin deficiencies."],
micro1:["General bacteriology describes bacterial structure (cell wall, capsule, flagella, spores), growth, sterilisation and disinfection, culture media, bacterial genetics (transformation, transduction, conjugation) and the basis of pathogenicity, including exotoxins and endotoxin.","Exam focus: exotoxin vs endotoxin, gene transfer, sterilisation methods and Gram-positive vs negative wall."],
micro2:["Immunology explains innate and acquired immunity, antigens and antibodies, antigen–antibody reactions used in diagnosis (precipitation, agglutination, CFT, ELISA, immunofluorescence), complement, the cells of the immune system, hypersensitivity, transplantation, immunodeficiency and vaccines.","Exam focus: ELISA, complement, monoclonal antibodies, primary vs secondary response and hypersensitivity."],
micro3:["Gram-positive bacteria include staphylococci (S. aureus, MRSA), streptococci (group A, group B, pneumococcus), Corynebacterium diphtheriae, Bacillus anthracis and the clostridia (tetanus, gas gangrene, botulism). Each is studied by morphology, culture, pathogenesis and lab diagnosis.","Exam focus: Staph aureus, pneumococcus, Bacillus anthracis, C. diphtheriae and C. tetani."],
micro4:["Gram-negative organisms include Neisseria (meningitis, gonorrhoea), the enterobacteria (E. coli, Shigella, Salmonella), Vibrio cholerae, Pseudomonas, Haemophilus, Bordetella, Brucella and H. pylori. Enteric fever and cholera are key public-health infections in India.","Exam focus: Salmonella and Widal, E. coli, Shigella, Neisseria and Vibrio cholerae."],
micro5:["Mycobacteria (M. tuberculosis, M. leprae) are acid-fast, slow-growing intracellular pathogens with distinctive lab diagnosis (ZN stain, LJ medium, CBNAAT). Spirochaetes (Treponema, Leptospira, Borrelia), Mycoplasma and Chlamydia are 'atypical' organisms with special staining and serological tests.","Exam focus: M. tuberculosis (LAQ), syphilis serology (VDRL), Chlamydia and lepromin test."],
micro6:["General virology covers viral structure, replication, cultivation (eggs, cell lines, animals), interference, inclusion bodies and bacteriophages. DNA viruses include herpesviruses (HSV, VZV, CMV, EBV), and the chapter introduces oncogenic viruses.","Exam focus: cultivation of viruses, inclusion bodies, herpes viruses and oncogenic viruses."],
micro7:["RNA viruses of importance include poliovirus (OPV vs IPV), influenza (antigenic shift and drift), paramyxoviruses, arboviruses (dengue, JE), rabies and hepatitis viruses. HIV, a retrovirus, causes AIDS; its lab diagnosis and opportunistic infections are high-yield.","Exam focus: orthomyxo vs paramyxo, antigenic shift vs drift, OPV vs IPV, HIV, rabies and hepatitis B."],
micro8:["Parasitology covers protozoa (Entamoeba, Giardia, Trichomonas, Leishmania, Plasmodium, Toxoplasma) and helminths (tapeworms, hydatid, Ascaris, hookworm, filaria). Life cycles, pathogenesis and laboratory diagnosis are studied for each.","Exam focus: Plasmodium life cycle and falciparum complications, Leishmania, hookworm, Ascaris and E. histolytica."],
micro9:["Mycology describes fungal classification (yeasts, moulds, dimorphic), lab diagnosis (KOH, India ink, SDA culture) and important infections: dermatophytes, mycetoma, candidiasis, cryptococcosis, aspergillosis, histoplasmosis, mucormycosis and Pneumocystis.","Exam focus: classification and lab diagnosis, dermatophytes, candidiasis and cryptococcosis."],
micro10:["Applied microbiology organises infections by organ system: urinary tract infections, meningitis, sexually transmitted infections, sepsis, respiratory and diarrhoeal infections, along with antimicrobial susceptibility testing.","Exam focus: UTI lab diagnosis, meningitis, STIs and disc diffusion testing."],
micro11:["This chapter covers other important bacteria and zoonoses: rickettsiae and scrub typhus, Leptospira, Borrelia, Listeria, Nocardia and Actinomyces, non-sporing anaerobes and Coxiella, with emphasis on fevers common in India.","Exam focus: scrub typhus, leptospirosis and actinomycosis vs nocardiosis."],
micro12:["Other viruses include measles, mumps, rubella, rotavirus, poxviruses, HPV, hepatitis C, D and E, SARS-CoV-2 and emerging infections such as Nipah, Zika and KFD. Prions, infectious proteins, are also included.","Exam focus: MMR viruses, hepatitis E, HPV and emerging infections."],
micro13:["Hospital infection control is a core competency: types of healthcare-associated infections, hand hygiene, standard and transmission-based precautions, needle-stick injury management, mechanisms of antimicrobial resistance and antimicrobial stewardship.","Exam focus: HAI types, hand hygiene, needle-stick injury protocol and AMR mechanisms."],
pharm1:["General pharmacology explains what the body does to drugs (absorption, distribution, metabolism, excretion — pharmacokinetics) and what drugs do to the body (receptors, dose–response — pharmacodynamics). It also covers routes, factors modifying drug action, adverse effects, drug interactions, teratogenicity and pharmacovigilance.","Exam focus: factors modifying drug action, bioavailability, first- and zero-order kinetics and enzyme induction."],
pharm2:["The autonomic nervous system drugs act on cholinergic (muscarinic, nicotinic) and adrenergic (α, β) receptors. Key drugs include anticholinesterases, atropine, adrenaline, α-blockers and β-blockers, plus drugs for glaucoma and treatment of OP poisoning.","Exam focus: drugs for glaucoma (5★ LAQ), β-blockers, α-blockers and atropine."],
pharm3:["Autacoids are local hormones: histamine, serotonin and eicosanoids. NSAIDs inhibit prostaglandin synthesis; aspirin has unique antiplatelet use. The chapter also covers migraine, gout, rheumatoid arthritis (DMARDs) and respiratory drugs for cough and bronchial asthma.","Exam focus: NSAIDs and aspirin (5★ LAQ), migraine, bronchial asthma (LAQ) and gout."],
pharm4:["Hormone pharmacology covers thyroid and antithyroid drugs, insulin and oral antidiabetic drugs, corticosteroids, sex hormones and their antagonists (SERMs, OCPs), and drugs acting on bone (bisphosphonates).","Exam focus: oral hypoglycaemics, corticosteroids, SERMs, OCPs and bisphosphonates (5★)."],
pharm5:["Skeletal muscle relaxants act peripherally at the neuromuscular junction (competitive and depolarising blockers), directly on muscle (dantrolene) or centrally. Local anaesthetics block sodium channels to stop nerve conduction; lignocaine is the prototype.","Exam focus: succinylcholine, d-tubocurarine, dantrolene and lignocaine."],
pharm6:["CNS pharmacology includes sedative-hypnotics, antiepileptics, antiparkinsonian drugs, antipsychotics, antidepressants, mood stabilisers (lithium) and opioid analgesics, along with their adverse effects and treatment of poisoning.","Exam focus: benzodiazepines, antiepileptics, antiparkinsonian drugs, antipsychotics and opioids (all LAQs)."],
pharm7:["Cardiovascular drugs treat hypertension, angina, heart failure and arrhythmias. Key groups are ACE inhibitors and ARBs, β-blockers, calcium channel blockers, nitrates, diuretics and digoxin. Drug therapy of myocardial infarction is a common question.","Exam focus: antihypertensives (5★ LAQ), antianginals, CHF and digitalis, and drug therapy in MI."],
pharm8:["Drugs affecting blood include haematinics (iron, folic acid, B12), anticoagulants (heparin, warfarin, newer oral agents), fibrinolytics, antiplatelet drugs and hypolipidaemic agents (statins).","Exam focus: anticoagulants (heparin vs warfarin), antiplatelets and statins."],
pharm9:["GIT pharmacology covers drugs for peptic ulcer (PPIs, H2 blockers, H. pylori regimens), GERD, antiemetics (ondansetron, metoclopramide), oral rehydration and antidiarrhoeals, laxatives and drugs for IBD.","Exam focus: peptic ulcer treatment, H. pylori regimen, antiemetics and ORS."],
pharm10:["Antimicrobials are classified by mechanism and spectrum. This chapter covers sulfonamides and cotrimoxazole, quinolones, β-lactams (penicillins, cephalosporins) with β-lactamase inhibitors, tetracyclines, chloramphenicol, aminoglycosides, macrolides and vancomycin, with emphasis on typhoid and UTI therapy.","Exam focus: classification by mechanism, penicillins, cephalosporins, aminoglycosides and fluoroquinolones."],
pharm11:["Chemotherapy of specific infections covers antitubercular regimens (NTEP), antileprosy MDT, antifungals, antivirals and ART for HIV, antimalarials including ACT, antiamoebics and anthelmintics.","Exam focus: antitubercular drugs, antifungals, antivirals, antimalarials (all 5★ LAQs)."],
pharm12:["Anticancer drugs are classified by mechanism (alkylating agents, antimetabolites, natural products, targeted therapy, hormones). Immunosuppressants, chelating agents, vitamins and vaccines complete the chapter.","Exam focus: methotrexate, cisplatin, cyclosporine and chelating agents."],
pharm13:["General anaesthetics produce reversible loss of consciousness. Inhalational agents are compared by MAC and blood–gas solubility; IV agents (propofol, thiopentone, ketamine, etomidate) are chosen by patient condition. Pre-anaesthetic medication prepares the patient.","Exam focus: IV anaesthetics, ketamine, MAC and pre-anaesthetic medication."],
pharm14:["This chapter covers insulin preparations and newer antidiabetics, management of hypoglycaemia, pituitary hormones and analogues, oxytocin and other uterine stimulants used in PPH, sex hormones, and drugs for calcium and bone metabolism.","Exam focus: insulin preparations, oxytocin and PPH drugs, and desmopressin."],
pharm15:["Clinical pharmacology covers drug development and clinical trial phases, essential medicines (NLEM), prescription writing and rational prescribing, prescribing in special groups (pregnancy, children, elderly), therapeutic drug monitoring and antiseptics/disinfectants.","Exam focus: phases of clinical trials, essential medicines, prescription writing and TDM."],
cm1:["Community medicine begins with concepts of health: definitions and dimensions of health, determinants and indicators of health, the natural history of disease and levels of prevention, which form the framework for all public-health action.","Exam focus: levels of prevention (LAQ), indicators of health and natural history of disease."],
cm2:["Epidemiology is the study of distribution and determinants of health events. This chapter covers measures of disease frequency, study designs (descriptive, case-control, cohort, RCT), association and causation, screening tests and epidemic investigation.","Exam focus: case-control vs cohort, RCT, screening test calculations and epidemic investigation."],
cm3:["Biostatistics provides tools to summarise and interpret health data: measures of central tendency and dispersion, the normal distribution, sampling methods, tests of significance and errors in hypothesis testing.","Exam focus: normal distribution, sampling methods and choice of statistical test."],
cm4:["Communicable disease epidemiology and national programmes cover TB (NTEP), malaria and vector-borne diseases (NCVBDC), dengue, HIV (NACP), leprosy (NLEP), polio eradication, measles, diarrhoeal diseases and rabies.","Exam focus: NTEP, malaria programme, leprosy, HIV and AFP surveillance."],
cm5:["Non-communicable diseases (hypertension, diabetes, cancer, obesity) are now the main cause of death in India. Nutrition covers protein-energy malnutrition, micronutrient deficiencies and national nutrition programmes.","Exam focus: micronutrient deficiencies (vitamin A, iodine, iron), PEM and NCD screening."],
cm6:["Environmental and occupational health covers safe water (purification and chlorination), air pollution, biomedical waste management, occupational diseases such as pneumoconiosis and lead poisoning, and the ESI Act.","Exam focus: water purification, chlorination, biomedical waste rules and pneumoconiosis."],
cm7:["Maternal and child health covers MCH indicators, antenatal care, family planning methods, demography and fertility indicators, and maternal and child health programmes such as RMNCH+A, JSY and JSSK.","Exam focus: contraceptive methods, MMR/IMR, demographic cycle and ANC."],
cm8:["Health care delivery covers the national immunisation schedule, cold chain and AEFI, the three-tier primary health care system (sub-centre, PHC, CHC), Ayushman Bharat, health education and disaster management.","Exam focus: immunisation schedule, cold chain, PHC norms and triage."],
cm9:["This chapter covers the social and managerial side of public health: sociology and socio-economic scales, health planning and policy, management techniques, the National Health Mission, international health agencies, and health of special groups such as the elderly and people with mental illness.","Exam focus: Kuppuswamy scale, NHM, PERT and mental health programme."],
fmt1:["Legal procedures cover inquest, courts and their powers, summons, types of evidence including dying declarations, and examination of witnesses. Since July 2024 the BNS, BNSS and BSA have replaced the IPC, CrPC and Evidence Act; students should know both old and new section numbers.","Exam focus: inquest, dying declaration vs dying deposition and types of witnesses."],
fmt2:["Medical ethics and law cover the NMC, professional misconduct, consent, medical negligence (civil and criminal), res ipsa loquitur, privileged communication and euthanasia — the legal duties every doctor must know.","Exam focus: consent (LAQ), medical negligence (LAQ) and privileged communication."],
fmt3:["Identification establishes who a person is, living or dead: age estimation from teeth and ossification, sex determination from skeleton, fingerprints, DNA profiling and identification of mutilated remains.","Exam focus: age estimation (LAQ), sex from pelvis and skull, and dactylography."],
fmt4:["Thanatology studies death and post-mortem changes — cooling, hypostasis, rigor mortis, decomposition, adipocere and mummification — used to estimate the time since death, along with autopsy and exhumation procedures.","Exam focus: rigor mortis vs cadaveric spasm, hypostasis and estimation of time since death (LAQ)."],
fmt5:["Mechanical injuries include abrasions, contusions, lacerations, incised and stab wounds; firearm injuries are interpreted by range of fire and entry vs exit wounds. Head injuries, grievous hurt and thermal injuries complete the chapter.","Exam focus: classification of wounds, firearm injuries (LAQ) and grievous hurt."],
fmt6:["Asphyxial deaths result from interference with oxygenation: hanging, ligature and manual strangulation, smothering, choking and drowning. Distinguishing hanging from strangulation and proving ante-mortem drowning are key medicolegal tasks.","Exam focus: hanging (LAQ), hanging vs strangulation and drowning (diatom test)."],
fmt7:["Sexual offences and infant deaths cover the legal definition of rape (BNS 63/64), examination of survivor and accused, the POCSO Act, signs of live birth and the hydrostatic test, infanticide and battered baby syndrome.","Exam focus: examination in rape (LAQ), POCSO and signs of live birth."],
fmt8:["General toxicology covers classification and diagnosis of poisoning, the doctor's duties in poisoning cases, gastric lavage, antidotes, enhanced elimination and preservation of viscera for chemical analysis.","Exam focus: preservation of viscera (LAQ), gastric lavage and universal antidote."],
fmt9:["Specific poisons important in India include organophosphates, aluminium phosphide, methanol, snake bite, datura, arsenic, lead, corrosives, opium and cannabis, and plant poisons — with clinical features, treatment and post-mortem findings.","Exam focus: OP poisoning (LAQ), snake bite (LAQ), aluminium phosphide and methanol."],
fmt10:["Forensic psychiatry deals with criminal responsibility of the mentally ill (BNS 22, McNaughten rule) and the Mental Healthcare Act 2017. The reproduction section covers impotence, pregnancy, delivery and abortion law (MTP Act 2021, PCPNDT Act); forensic science covers stain and DNA analysis.","Exam focus: insanity and criminal responsibility, MTP Act and blood/seminal stain tests."],
fmt11:["Pharmaceutical, environmental and social toxicology covers paracetamol, salicylate and sedative poisoning, carbon monoxide and cyanide, alcohol and its medicolegal aspects (blood alcohol, drunkenness examination), and drug abuse under the NDPS Act.","Exam focus: drunkenness examination, CO poisoning and paracetamol poisoning."]
};

let SAMPLE=null, WEBAI=false, AISTATE="checking";
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==="function");
const AI_URL=window.ATLAS_AI_URL||"/api/ai";
(async()=>{
  if(IN_CLAUDE){try{SAMPLE=await window.claude.use("sample");}catch(e){SAMPLE=null;}}
  else if(/^https?:$/.test(location.protocol)){try{const r=await fetch(AI_URL,{cache:"no-store"});if(r.ok){const j=await r.json();WEBAI=!!j.ok;}}catch(e){WEBAI=false;}}
  AISTATE=(SAMPLE||WEBAI)?"ready":"off";$$(".aibadge").forEach(b=>b.outerHTML=aiBadge());
})();
/* one call path for both hosts: Claude app (sample) or a website (/api/ai) */
async function blobB64(b){const buf=new Uint8Array(await b.arrayBuffer());let s="";for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return btoa(s);}
async function callAI(input,{signal,onText,tier,chat,images}={}){
  if(SAMPLE){const o={signal};if(onText)o.onText=onText;if(tier)o.modelTier=tier;if(chat||images)o.cache=false;if(images)o.images=images;return SAMPLE(input,o);}
  const messages=typeof input==="string"?[{role:"user",content:input}]:input;
  const imgs=images?await Promise.all(images.map(async b=>({media_type:b.type||"image/jpeg",data:await blobB64(b)}))):undefined;
  let r;try{r=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages,images:imgs}),signal});}
  catch(e){throw {code:signal&&signal.aborted?"cancelled":"upstream_error"};}
  if(!r.ok)throw {code:r.status===429?"rate_limited":r.status===413?"prompt_too_large":"upstream_error"};
  const rd=r.body.getReader(),dec=new TextDecoder();let text="";
  try{for(;;){const {done,value}=await rd.read();if(done)break;const d=dec.decode(value,{stream:true});if(d){text+=d;onText&&onText({text,delta:d});}}}
  catch(e){throw {code:signal&&signal.aborted?"cancelled":"upstream_error",text};}
  if(!text.trim())throw {code:"empty_completion"};
  return {text,truncated:false};
}
function parseJSONish(t){try{return JSON.parse(t);}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1]);}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}throw {code:"invalid_json",text:t};}
const aiBadge=()=>AISTATE==="ready"?'<span class="aibadge">● AI tutor connected</span>':AISTATE==="checking"?'<span class="aibadge off">Connecting AI…</span>':`<span class="aibadge off">${IN_CLAUDE?"AI needs permission":"AI not set up"}</span>`;
const RULES=()=>`You are "Atlas", a warm, precise MBBS tutor for Indian Phase II (2nd Professional) students preparing for university exams at Era's Lucknow Medical College (Era University, CBME curriculum). Subjects: Pathology, Microbiology, Pharmacology, plus Community Medicine and Forensic Medicine & Toxicology.
Ground every answer in the CHAPTER NOTES given (they are the app's book content). Where you go beyond them, rely only on standard textbooks (Robbins, Harsh Mohan, Ananthanarayan & Paniker, Apurba Sastry, KD Tripathi, Park, Narayan Reddy) and current Indian national guidelines (NTEP, NCVBDC, UIP, BNS/BNSS/BSA). If you are unsure of a fact, say so instead of guessing.
Style: short headings, bullet points, **bold** key terms, a mnemonic or flow (A → B → C) when it helps, and an "Exam tip" line on how to write it in the paper (LAQ / short note / viva). ${S.lang==="hinglish"?"Write in friendly Hinglish (Hindi-English mix in Roman script); keep all medical terms in English.":"Write in clear, simple English."} Use markdown; no HTML.`;
function ctx(c){if(!c)return"";const s=SUB[c.s];return `\n\nCHAPTER NOTES — ${s.name} › ${c.t} (${c.paper})\nExam-priority topics: ${c.topics.map(t=>`${t[0]}${t[1]?` [${t[1]}★]`:""}${t[2]?` (${TYPE[t[2]]})`:""}`).join("; ")}\nKey concepts:\n${c.core.map(x=>"- "+x).join("\n")}\nHigh-yield facts:\n${c.hy.map(x=>{const h=hy(x);return "- "+h.q+" — "+h.a;}).join("\n")}`;}
const thinking=(m="Thinking")=>`<span class="thinking"><i></i><i></i><i></i> ${m}…</span>`;
const offMsg=()=>AISTATE==="checking"?`<p>Connecting to the AI tutor… try again in a few seconds.</p>`:IN_CLAUDE?`<p><b>AI features run on your own Claude account.</b> Choose <b>Allow</b> when this page asks to use Claude. Chapters, flowcharts, flashcards, quizzes, the question bank and the study planner all work without AI.</p>`:`<p><b>The AI tutor is not switched on for this website yet.</b> Everything else works: chapters, flowcharts, flashcards, quizzes, mock tests from the question bank and the study planner.</p>`;
const CTL={};
function errMsg(e){switch(e&&e.code){case"cancelled":return"";case"not_granted":case"sampling_disabled":case"not_declared":case"capability_disabled":case"capability_removed":return"AI is not allowed for this page right now. Allow Claude for this page to use the AI tools.";case"images_unavailable":return"Reading page images is not available in this view. Ask the AI Tutor about the topic instead.";case"image_rejected":return"That page image could not be read. Try zooming out or another page.";case"rate_limited":return"Too many AI requests at once. Wait a minute, then try again.";case"session_expired":return"Your Claude session expired. Sign in again, then retry.";case"refused":return"Claude could not answer that. Rephrase the question and try again.";case"prompt_too_large":return"That request is too long. Pick fewer chapters or a shorter question.";case"invalid_json":return"The answer came back in an unexpected format. Press the button again.";case"empty_completion":return"No answer came back. Try a simpler request.";default:return"Connection problem while answering. Press the button again.";}}
async function aiStream(out,input,{key="main",tier,chat=false,images}={}){
  if(!SAMPLE&&!WEBAI){out.innerHTML=offMsg();return null;}
  CTL[key]?.abort();const ctl=new AbortController();CTL[key]=ctl;
  out.innerHTML=thinking();showStop(key,true);
  try{const r=await callAI(input,{signal:ctl.signal,tier,chat,images,onText:({text})=>{out.innerHTML=md(text);}});out.innerHTML=md(r.text)+(r.truncated?'<p class="note">The answer was cut short. Ask for a smaller part.</p>':"");return r.text;}
  catch(e){if(e&&e.code==="refused")out.innerHTML="";else out.innerHTML=e&&e.text?md(e.text):"";const m=errMsg(e);if(m)out.insertAdjacentHTML("beforeend",`<p class="notice">${esc(m)}</p>`);return null;}
  finally{showStop(key,false);}
}
async function aiJSON(out,input,{key="json",tier}={}){
  if(!SAMPLE&&!WEBAI){out.innerHTML=offMsg();return null;}
  CTL[key]?.abort();const ctl=new AbortController();CTL[key]=ctl;
  out.innerHTML=thinking("Preparing");showStop(key,true);

  catch(e){const m=errMsg(e);out.innerHTML=m?`<p class="notice">${esc(m)}</p>`:"";return null;}

}
function showStop(key,on){$$(`[data-stop="${key}"]`).forEach(b=>b.hidden=!on);}
const stopBtn=key=>`<button class="btn sm" data-act="stop" data-stop="${key}" hidden>Stop</button>`;
function md(src){
  const lines=esc(src).split(/\r?\n/);let html="",list=null,para=[],tbl=[];
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<em>$2</em>");
  const fP=()=>{if(para.length){html+="<p>"+inl(para.join(" "))+"</p>";para=[];}};
  const fL=()=>{if(list){html+=`<${list.t}>${list.items.map(i=>"<li>"+inl(i)+"</li>").join("")}</${list.t}>`;list=null;}};
  const fT=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\|?[\s:|-]+\|?$/.test(r)).map(r=>r.replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>inl(c.trim())));html+='<div class="tbl"><table>'+rows.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")+"</table></div>";tbl=[];}};
  for(const raw of lines){const l=raw.trim();let m;
    if(l.startsWith("|")){fP();fL();tbl.push(l);continue;}else fT();
    if(!l){fP();fL();continue;}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){fP();fL();const n=Math.min(4,m[1].length+1);html+=`<h${n}>${inl(m[2])}</h${n}>`;continue;}
    if((m=l.match(/^[-*•]\s+(.*)/))){fP();if(!list||list.t!=="ul"){fL();list={t:"ul",items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^\d+[.)]\s+(.*)/))){fP();if(!list||list.t!=="ol"){fL();list={t:"ol",items:[]};}list.items.push(m[1]);continue;}
    if(/^(-{3,}|\*{3,})$/.test(l)){fP();fL();html+="<hr>";continue;}
    fL();para.push(l);}
  fP();fL();fT();return html;
}

let QUIZ_TIMER=null, LASTQ=null;
const PRAISE=["Spot on!","Correct — nice!","Yes! Textbook answer.","Nailed it.","Right, keep going!"];
function runQuiz(box,qs,{timed=0,title="Quiz",onDone,onAnswer}={}){
  clearInterval(QUIZ_TIMER);let i=0,score=0;const ans=[];let left=timed*qs.length;
  const fmt=s=>`${Math.floor(s/60)}:${pad(s%60)}`;
  if(timed){QUIZ_TIMER=setInterval(()=>{left--;const el=$(".timer",box);if(el)el.textContent="⏱ "+fmt(Math.max(0,left));if(left<=0){clearInterval(QUIZ_TIMER);finish();}},1000);}
  function show(){const q=qs[i];
    box.innerHTML=`<div class="card q"><div class="row between"><span class="eyebrow">${esc(title)} · Q${i+1} of ${qs.length}${q.ch&&CH[q.ch]?" · "+esc(SUB[CH[q.ch].s].short+" "+CH[q.ch].n):""}</span>${timed?`<span class="timer">⏱ ${fmt(left)}</span>`:""}</div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(i/qs.length*100)}%"></i></div>
    <h3>${esc(q.q)}</h3><p class="note kbd-hint">Tip: press 1–4 to answer, Enter for next.</p><div class="stack">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" aria-live="polite"></div></div>`;
    $$(".opt",box).forEach(b=>b.onclick=()=>pick(+b.dataset.k));}
  function pick(k){if(ans[i]!=null)return;ans[i]=k;const q=qs[i],ok=k===q.a;if(ok)score++;if(onAnswer)onAnswer(q,ok);
    $$(".opt",box).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong");});
    $(".fb",box).innerHTML=`<div class="explain"><b>${ok?PRAISE[i%PRAISE.length]:"Not quite."}</b> ${esc(q.e||"")}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="qnext">${i<qs.length-1?"Next question":"See results"}</button></div>`;
    $("#qnext",box).onclick=()=>{i++;i<qs.length?show():finish();};$("#qnext",box).focus();}
  function finish(){clearInterval(QUIZ_TIMER);
    const pct=Math.round(score/qs.length*100);const per={};
    qs.forEach((q,k)=>{if(!q.ch)return;per[q.ch]=per[q.ch]||[0,0];per[q.ch][1]++;if(ans[k]===q.a)per[q.ch][0]++;});
    Object.entries(per).forEach(([id,[r,t]])=>{const p=Math.round(r/t*100);const o=S.quiz[id]||{best:0,last:0,n:0};S.quiz[id]={best:Math.max(o.best,p),last:p,n:o.n+1};});
    LASTQ={qs,ans};S.hist.unshift({d:today(),title,score,total:qs.length});S.hist=S.hist.slice(0,30);save();
    if(score)addXP(score*10,`${score} correct`);else save();
    box.innerHTML=`<div class="card stack"><div class="row between"><div><span class="eyebrow">${esc(title)} · result</span><div class="score">${score}/${qs.length}</div><p class="muted">${pct>=80?"Excellent — exam ready on this set.":pct>=50?"Good base. Revise the misses below.":"Revisit the concepts and flowchart, then try again."}</p></div><div class="ring" style="--p:${pct}"><span>${pct}%</span></div></div>
    <details ${pct<100?"open":""}><summary><b>Review answers</b></summary><div class="stack" style="margin-top:10px">${qs.map((q,k)=>`<div class="explain"><b>${ans[k]===q.a?"✓":"✗"} ${esc(q.q)}</b><br>Answer: ${esc(q.o[q.a])}${ans[k]!=null&&ans[k]!==q.a?` · You chose: ${esc(q.o[ans[k]])}`:ans[k]==null?" · Not answered":""}<br><span class="muted">${esc(q.e||"")}</span>${ans[k]!==q.a?`<div class="row" style="margin-top:6px"><button class="btn sm" data-act="q-explain" data-i="${k}">Explain this with AI</button></div><div class="ai-out" id="qx${k}"></div>`:""}</div>`).join("")}</div></details>
    <div class="row"><button class="btn pri" id="qagain">Try again</button>${onDone?'<button class="btn" id="qback">Back</button>':""}</div></div>`;
    $("#qagain",box).onclick=()=>runQuiz(box,shuffle(qs),{timed,title,onDone,onAnswer});if(onDone)$("#qback",box).onclick=onDone;
    if(pct===100)confetti();}
  show();
}

function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=document.createElement("canvas");cv.id="confetti";document.body.appendChild(cv);const x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;const cs=getComputedStyle(document.documentElement);const cols=["--path","--micro","--pharm","--cm","--fmt","--star"].map(v=>cs.getPropertyValue(v).trim());const P=Array.from({length:140},()=>({x:cv.width/2,y:cv.height/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-2,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6+3,a:Math.random()*6}));let f=0;(function step(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore();});if(++f<120)requestAnimationFrame(step);else cv.remove();})();}

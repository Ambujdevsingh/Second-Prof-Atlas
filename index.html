  <p class="notice">Coverage check: chapters follow your seniors' past-paper lists, and gaps against the NMC competency-based (CBME) Phase II syllabus have been filled. Look for the <span class="tag N">NMC</span> tag on added topics.</p>
  <h2>Phase II university exam</h2><div class="grid g3">${EXAM_SUBJ.map(id=>subjCard(SUB[id])).join("")}</div>
  <h2>Taught in Phase II, examined in Phase III Part 1</h2><div class="grid g3">${["cm","fmt"].map(id=>subjCard(SUB[id])).join("")}</div>`;
}
const subjCard=s=>`<a class="subj" href="#s-${s.id}" data-s="${s.id}"><h3>${esc(s.name)}</h3><p class="note" style="position:relative">${esc(s.exam)}</p><p class="note"><b>Books:</b> ${esc(s.books)}</p><div class="bar"><i style="width:${subjPct(s.id)}%"></i></div><span class="note">${s.chapters.filter(c=>chDone(c.id)).length}/${s.chapters.length} chapters done</span></a>`;

function vSubject(sid){const s=SUB[sid];const p=subjPct(sid);
  return `<header class="ch-head" data-s="${sid}"><div class="crumbs"><a href="#subjects">Subjects</a> / ${esc(s.name)}</div><div class="row between"><div class="stack" style="flex:1;min-width:240px"><h1>${esc(s.name)}</h1><p>${esc(s.exam)}</p><p class="note"><b>Reference:</b> ${esc(s.books)}</p></div><div class="ring" style="--p:${p}"><span>${p}%</span></div></div>
  <div class="row"><a class="btn pri" href="#c-${(s.chapters.find(c=>!chDone(c.id))||s.chapters[0]).id}">${p?"Next chapter":"Start chapter 1"}</a><button class="btn" data-act="radar-subj" data-s="${sid}">Exam radar</button><button class="btn" data-act="mock-subj" data-s="${sid}">Mock test</button></div></header>
  ${s.std?`<p class="notice">No past-paper list was uploaded for ${esc(s.name)}, so star ratings here are standard high-yield estimates from the curriculum, not your seniors' list.</p>`:""}
  <section class="stack" data-s="${sid}"><h2>Roadmap</h2><p class="note">Work top to bottom. The bars show how heavily each chapter is asked in exams.</p><div class="trail">${s.chapters.map(c=>{const q=S.quiz[c.id];return `<a class="stop ${chDone(c.id)?"done":""}" href="#c-${c.id}"><span class="node">${chDone(c.id)?"✓":c.n}</span><span class="body"><span class="row between"><b>${esc(c.t)}</b><span class="heat" title="Exam weight">${[1,2,3,4,5].map(k=>`<i class="${k<=heatOf(c)?"on":""}"></i>`).join("")}</span></span><span class="note">${esc(c.paper)} · ${c.topics.length} topics · ${c.topics.filter(t=>t[2]==="L").length} long-answer${q?` · quiz best ${q.best}%`:""}</span><span class="note">${esc(c.topics.slice().sort((a,b)=>b[1]-a[1]).slice(0,3).map(t=>t[0]).join(" · "))}</span></span></a>`;}).join("")}</div></section>`;
}

function vChapter(id){const c=CH[id],s=SUB[c.s];S.lastCh=id;save();
  const i=s.chapters.indexOf(c),prev=s.chapters[i-1],next=s.chapters[i+1];
  POST=()=>renderTab(id);
  return `<header class="ch-head" data-s="${c.s}"><div class="crumbs"><a href="#s-${c.s}">${esc(s.name)}</a> / Chapter ${c.n} · ${esc(c.paper)}</div><h1>${esc(c.t)}</h1>
  <div class="row chprog"><div class="bar" style="flex:1;min-width:160px" aria-label="Concepts understood"><i id="chbar" style="width:${readPct(id)}%;background:var(--sc)"></i></div><span class="note" id="chread">${(S.read[id]||[]).length}/${c.core.length} concepts understood</span></div>
  <div class="row"><span class="chip">${c.topics.length} exam topics</span><span class="chip">${cardPool(id).length} flashcards</span><span class="chip">${quizPool(id).length} MCQs</span>${QB[id]?'<span class="chip" style="color:var(--good)">✓ 100+100 levelled bank</span>':""}${S.quiz[id]?`<span class="chip">Quiz best ${S.quiz[id].best}%</span>`:""}<button class="btn sm ${chDone(id)?"":"pri"}" data-act="done" data-id="${id}">${chDone(id)?"✓ Completed":"Mark chapter complete (+25 XP)"}</button></div></header>
  <div data-s="${c.s}" class="stack"><div class="tabs" role="tablist">${[["learn","Learn"],["sum","Details & Summary"],["flow","Flowchart"],["cards","Flashcards"],["quiz","Quiz"],["ai","AI Lab"]].map(t=>`<button role="tab" data-act="tab" data-t="${t[0]}" class="${CHTAB===t[0]?"on":""}" aria-selected="${CHTAB===t[0]}">${t[1]}</button>`).join("")}</div><div id="tabbody"></div>
  <div class="row between">${prev?`<a class="btn" href="#c-${prev.id}">← ${esc(prev.t)}</a>`:"<span></span>"}${next?`<a class="btn" href="#c-${next.id}">${esc(next.t)} →</a>`:`<a class="btn" href="#s-${c.s}">Back to roadmap</a>`}</div></div>`;
}
function renderTab(id){const c=CH[id],b=$("#tabbody");if(!b)return;clearInterval(QUIZ_TIMER);
  if(CHTAB==="learn"){
    b.innerHTML=`<div class="grid g2" style="align-items:start"><section class="stack"><h2>Core concepts</h2>${syllabusLinks(id)?`<div class="row">${syllabusLinks(id)}</div>`:""}<p class="note">Tick each concept once you can explain it without looking. <span class="term demo">Underlined terms</span> open a definition.</p><ol class="concepts">${c.core.map((x,k)=>{const on=(S.read[id]||[]).includes(k);return `<li class="${on?"got":""}"><span>${linkTerms(x)}</span><button class="tick" data-act="read" data-k="${k}" aria-pressed="${on}" aria-label="Mark concept ${k+1} understood">${on?"✓":""}</button></li>`;}).join("")}</ol>${chapterTerms(c).length?`<div class="card stack termhost"><div class="row between"><h3>Key terms</h3><span class="note">Tap a term for its meaning; tap More for the full explanation</span></div><div class="row">${chapterTerms(c).map(k=>`<button class="chip term" data-act="term" data-t="${esc(k)}">${esc(k)}</button>`).join("")}</div></div>`:""}</section>
    <section class="card stack"><div class="row between"><h2>Exam topics</h2><span class="note">${SUB[c.s].std?"Standard priority":"From past-paper list"}</span></div><p class="note"><b>Answers</b> opens Simplify, Short, Medium and Long model answers${ansCount(id)?` — offline for ${ansCount(id)}/${c.topics.length} topics here`:""}.</p><p class="note"><span class="tag L">LAQ</span> long answer · <span class="tag S">SN</span> short note · <span class="tag D">DIFF</span> difference · <span class="tag N">NMC</span> added from NMC syllabus</p>
    <div>${c.topics.map((t,k)=>`<div class="topic"><span>${starsHTML(t[1])} ${tagHTML(t[2])} ${nmc(t)}<br><b>${esc(t[0])}</b></span><span class="acts"><button class="btn sm star ${isSaved(id,k)?"on":""}" data-act="save" data-c="${id}" data-k="${k}" aria-pressed="${isSaved(id,k)}" title="Save to revision list">${isSaved(id,k)?"★":"☆"}</button><button class="btn sm ${hasAns(id,k)?"pri":""}" data-act="ans-open" data-c="${id}" data-k="${k}" data-u="tai${k}" aria-expanded="false">${hasAns(id,k)?"Answers ✓":"Answers"}</button></span><div class="inline-ai" id="tai${k}"></div></div>`).join("")}</div></section></div>`;
  } else if(CHTAB==="flow"){
    b.innerHTML=`<section class="card stack"><div class="row between"><div><span class="eyebrow">Revision flowchart</span><h2>${esc(c.flow.t)}</h2></div><div class="row"><button class="btn sm" data-act="recall">Recall mode</button><button class="btn sm" data-act="flow-ai">Explain with AI</button></div></div><p class="note" id="recallnote">Recall mode blurs each step. Say the step aloud, then tap to check.</p><div id="flowbox">${flowHTML(c.flow.n)}</div><div class="ai-out" id="flowai"></div>${FLOWS.filter(f=>f.ch===id).length?`<div class="stack"><b>Explained flowcharts for this chapter</b><p class="note">Every step has a written explanation; tap through them one by one.</p><div class="row">${FLOWS.filter(f=>f.ch===id).map(f=>`<a class="chip" href="#fc-${f.id}" style="text-decoration:none;background:var(--ss);color:var(--sc)">${esc(f.t)} →</a>`).join("")}</div></div>`:`<a class="btn sm" href="#fc-ch-${id}">Open in step-by-step viewer</a>`}</section>`;
  } else if(CHTAB==="cards"){
    mountCards(id);
  } else if(CHTAB==="sum"){
    b.innerHTML=summaryTabHTML(id);
  } else if(CHTAB==="quiz"){
    mountQuiz(id);
  } else {
    b.innerHTML=`<section class="card stack"><div class="row between"><h2>AI Lab for this chapter</h2>${langToggle()}</div>
    <div class="grid g3"><div class="field"><label for="labsum">Smart summary</label><select id="labsum"><option value="one-page">One-page chapter summary</option><option value="10 points">10-point rapid revision</option><option value="night-before">Night-before-exam sheet</option><option value="viva">Viva questions with crisp answers</option></select><button class="btn" data-act="lab-sum">Summarise</button></div>
    <div class="field"><label for="labq">Generate questions</label><select id="labq"><option value="short notes">5 short-note questions with answer outlines</option><option value="long answer">2 long-answer questions with model structure</option><option value="case-based">2 clinical case-based questions</option><option value="difference tables">Difference tables asked in exams</option></select><button class="btn" data-act="lab-q">Generate</button></div>
    <div class="field"><label for="labask">Ask about this chapter</label><input id="labask" placeholder="e.g. Why is LAP score low in CML?"><button class="btn" data-act="lab-ask">Ask</button></div></div>
    <div class="row">${stopBtn("lab")}</div><div class="ai-out" id="labout"></div></section>`;
  }
  $$(".tabs [data-t]").forEach(x=>{const on=x.dataset.t===CHTAB;x.classList.toggle("on",on);x.setAttribute("aria-selected",on);});
}

function vRadar(){const s=SUB[RADAR_S];
  let rows=s.chapters.flatMap(c=>c.topics.map((t,k)=>({t,c,k})));
  if(RADAR_T!=="all")rows=rows.filter(r=>r.t[2]===RADAR_T);
  rows.sort((a,b)=>b.t[1]-a.t[1]||a.c.n-b.c.n);
  return `<header class="stack"><span class="eyebrow">Past-paper intelligence</span><h1>Exam Radar</h1><p class="muted">Every exam topic ranked by how often it has been asked, with the answer format. Star ratings for Pathology, Microbiology and Pharmacology come from the senior priority lists you uploaded.</p></header>
  <section class="card stack"><h2>How the 2nd Professional exam is set</h2><div class="grid g3"><div class="stack"><b>Subjects</b><span class="note">Pathology, Microbiology, Pharmacology: two theory papers each plus practical and viva (NMC CBME). Community Medicine and FMT are examined in Phase III Part 1.</span></div><div class="stack"><b>Question formats</b><span class="note">Each paper mixes MCQs, long answer questions (LAQ), short notes (SN), differences and applied/reasoning questions.</span></div><div class="stack"><b>Strategy</b><span class="note">Cover every ★★★★★ LAQ first, then all SN topics with a flowchart or table. Practise writing answers to time.</span></div></div><p class="note">Check the current Era University blueprint and marks distribution with your department; it can change between batches.</p></section>
  <div class="row" role="tablist">${SUBJECTS.map(x=>`<button class="btn sm ${x.id===RADAR_S?"pri":""}" data-act="radar-s" data-s="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="row"><span class="note">Format</span>${[["all","All"],["L","Long answers"],["S","Short notes"],["D","Differences"]].map(x=>`<button class="btn sm ${RADAR_T===x[0]?"pri":""}" data-act="radar-t" data-t="${x[0]}">${x[1]}</button>`).join("")}</div>
  ${s.std?`<p class="notice">No past-paper list was uploaded for ${esc(s.name)}; stars show standard curriculum priority.</p>`:""}
  <section class="card" data-s="${RADAR_S}"><div>${rows.map((r,i)=>`<div class="topic"><span>${starsHTML(r.t[1])} ${tagHTML(r.t[2])} ${nmc(r.t)}<br><b>${esc(r.t[0])}</b><br><a class="note" href="#c-${r.c.id}">${esc(s.short)} ${r.c.n} · ${esc(r.c.t)}</a></span><span class="acts"><button class="btn sm star ${isSaved(r.c.id,r.k)?"on":""}" data-act="save" data-c="${r.c.id}" data-k="${r.k}" aria-pressed="${isSaved(r.c.id,r.k)}" title="Save to revision list">${isSaved(r.c.id,r.k)?"★":"☆"}</button><button class="btn sm ${hasAns(r.c.id,r.k)?"pri":""}" data-act="ans-open" data-c="${r.c.id}" data-k="${r.k}" data-u="rai${i}" aria-expanded="false">${hasAns(r.c.id,r.k)?"Answers ✓":"Answers"}</button></span><div class="inline-ai" id="rai${i}"></div></div>`).join("")||'<p class="note">No topics in this format.</p>'}</div></section>`;
}

function vRoadmap(){
  const phases=[
   ["Phase A · Foundations","Weeks 1–6","General principles that every systemic chapter builds on.",["path1","path2","path3","path4","path5","path6","micro1","micro2","pharm1","pharm2","cm1","cm2","fmt1","fmt2","pharm15","path17","micro13"]],
   ["Phase B · Blood, bugs & drugs I","Weeks 7–14","Haematology, bacteriology and the first drug systems.",["path7","path8","path9","path10","micro3","micro4","micro5","pharm3","pharm4","pharm5","pharm6","pharm13","pharm14","path18","micro11","cm3","cm4","fmt3","fmt4"]],
   ["Phase C · Systems & chemotherapy","Weeks 15–24","Systemic pathology, virology, parasitology, mycology and chemotherapy.",["path11","path12","path13","path14","path15","path16","micro6","micro7","micro8","micro9","micro10","pharm7","pharm8","pharm9","pharm10","pharm11","pharm12","micro12","cm5","cm6","cm7","cm8","cm9","fmt5","fmt6","fmt7","fmt8","fmt9","fmt10","fmt11"]],
   ["Phase D · Revision loop","Last 6–8 weeks","Five-star topics, flowchart recall, flashcards and timed mocks.",[]]];
  return `<header class="stack"><span class="eyebrow">The year at a glance</span><h1>Roadmap to 2nd Prof</h1><p class="muted">A suggested order that keeps the three exam subjects moving together, with Community Medicine and FMT running alongside. Tap any chip to open the chapter.</p></header>
  ${phases.map((p,k)=>`<section class="card stack"><div class="row between"><div><span class="eyebrow">${p[1]}</span><h2>${p[0]}</h2></div><span class="chip">${p[3].length?`${p[3].filter(chDone).length}/${p[3].length} done`:"Revision"}</span></div><p class="note">${p[2]}</p>
  ${p[3].length?`<div class="row">${p[3].map(id=>{const c=CH[id];return `<a class="chip" data-s="${c.s}" href="#c-${id}" style="text-decoration:none;background:var(--ss);color:var(--sc)">${chDone(id)?"✓ ":""}${esc(SUB[c.s].short)} ${c.n}: ${esc(c.t)}</a>`;}).join("")}</div>`:`<div class="grid g3"><div class="stack"><b>1 · Radar sweep</b><span class="note">Write timed answers for every ★★★★★ LAQ in the Exam Radar.</span><a class="btn sm" href="#radar">Open radar</a></div><div class="stack"><b>2 · Flowchart recall</b><span class="note">Use Recall mode on each chapter flowchart; redraw it from memory.</span></div><div class="stack"><b>3 · Mock every 3 days</b><span class="note">Mix chapters across subjects; review every wrong answer with Doubt Resolution.</span><a class="btn sm" href="#mock">Start a mock</a></div></div>`}</section>`).join("")}
  <section class="card stack"><h2>Spaced revision rule</h2><p class="note">Revise each chapter on day 1, day 3, day 7 and day 21 after first study. Each pass is shorter: concepts → flowchart → flashcards → quiz.</p><div style="--sc:var(--accent);--ss:var(--accent-soft)">${flowHTML(["Day 0: Learn tab + flowchart","Day 1: Flashcards","Day 3: Flowchart recall mode","Day 7: Chapter quiz","Day 21: Mock test with mixed chapters"])}</div></section>`;
}

function vStudio(){return `<header class="stack"><span class="eyebrow">Ten AI tools</span><h1>AI Studio</h1><p class="muted">Every tool uses the chapter notes in this app as its source, so answers stay close to your syllabus. Answers use your own Claude account.</p><div class="row">${aiBadge()}${langToggle()}</div></header><div class="grid g3">${TOOLS.map(toolTile).join("")}</div>`;}
const toolHead=(id,extra="")=>{const t=TOOLS.find(x=>x[0]===id);return `<header class="stack"><div class="crumbs note"><a href="#studio">AI Studio</a> / ${t[1]}</div><div class="row between"><h1>${t[1]}</h1>${aiBadge()}</div><p class="muted">${t[2]}</p>${extra}</header>`;};

let TURNS=[];
function vTutor(){POST=()=>drawChat();return `${toolHead("tutor",langToggle())}
 <section class="card stack"><div class="grid g2"><div class="field"><label for="tctx">Ground answers in</label>${chSelect("tctx",{all:true,sel:S.lastCh||""})}</div><label class="check"><input type="checkbox" id="tspeak"> Read answers aloud</label></div>
 <div class="chat" id="chat" aria-live="polite"></div>
 <div class="field"><label for="tq">Your question</label><textarea id="tq" placeholder="e.g. Explain the pathogenesis of atherosclerosis as I should write it in a 10-mark answer"></textarea></div>
 <div class="row"><button class="btn pri" data-act="t-send">Ask Atlas</button>${stopBtn("tutor")}<button class="btn ghost" data-act="t-clear">New conversation</button></div>
 <div class="row">${["Mnemonic for Jones criteria","Difference between exotoxin and endotoxin","Why does digoxin toxicity rise with hypokalaemia?","How to write a short note on DIC"].map(x=>`<button class="chip" data-act="t-chip">${esc(x)}</button>`).join("")}</div></section>`;}
function drawChat(){const el=$("#chat");if(!el)return;el.innerHTML=TURNS.length?TURNS.map(t=>t.role==="user"?`<div class="msg me">${esc(t.content)}</div>`:`<div class="msg bot ai-out">${md(t.content)}</div>`).join(""):`<p class="note">Atlas answers using the chapter you choose. Ask follow-ups; it remembers this conversation until you leave the page.</p>`;}

function vSimplify(){return `${toolHead("simplify",langToggle())}<section class="card stack"><div class="grid g2"><div class="field"><label for="sconc">Concept or topic</label><input id="sconc" placeholder="e.g. Antigenic shift vs drift, Zero-order kinetics, Rigor mortis"></div><div class="field"><label for="slvl">Explain it</label><select id="slvl"><option value="like I'm 12, with an everyday analogy">Like I'm 12 (analogy)</option><option value="for a 2nd-year MBBS student, step by step">Step by step for MBBS</option><option value="as exam-ready points I can reproduce">Exam-ready points</option></select></div></div><div class="field"><label for="sch">Chapter (optional)</label>${chSelect("sch",{all:true})}</div><div class="row"><button class="btn pri" data-act="s-go">Simplify</button>${stopBtn("simp")}</div><div class="ai-out" id="sout"></div></section>`;}
function vQgen(){return `${toolHead("qgen",langToggle())}<section class="card stack"><div class="grid g3"><div class="field"><label for="qch">Chapter</label>${chSelect("qch",{sel:S.lastCh||""})}</div><div class="field"><label for="qtype">Type</label><select id="qtype"><option value="mcq">MCQs (interactive)</option><option value="short notes">Short-note questions + answer outlines</option><option value="long answer">Long-answer questions + model structure</option><option value="viva">Viva voce questions + crisp answers</option><option value="case-based">Clinical case-based questions</option></select></div><div class="field"><label for="qn">How many</label><select id="qn"><option>5</option><option>10</option><option>15</option></select></div></div><div class="field"><label for="qlvl">Difficulty</label><select id="qlvl"><option value="university exam level">University exam</option><option value="NEET-PG level, tougher">NEET-PG level</option><option value="basic recall">Basic recall</option></select></div><div class="row"><button class="btn pri" data-act="q-go">Generate</button>${stopBtn("qgen")}</div><div class="ai-out" id="qout"></div><div id="qquiz"></div></section>`;}
function vSummary(){return `${toolHead("summary",langToggle())}<section class="card stack"><div class="grid g2"><div class="field"><label for="smch">Chapter</label>${chSelect("smch",{sel:S.lastCh||""})}</div><div class="field"><label for="smstyle">Summary style</label><select id="smstyle"><option value="one-page chapter summary with headings">One-page chapter summary</option><option value="10 most important points">10-point rapid revision</option><option value="night-before-exam cheat sheet with mnemonics and tables">Night-before cheat sheet</option><option value="topic-wise summary of each exam topic in 3 lines">Topic-wise 3-liners</option></select></div></div><div class="field"><label for="smtopic">Focus on a topic (optional)</label><input id="smtopic" placeholder="e.g. Only DIC and haemophilia"></div><div class="row"><button class="btn pri" data-act="sm-go">Summarise</button>${stopBtn("sum")}</div><div class="ai-out" id="smout"></div></section>`;}
function vCards(){return `${toolHead("cards",langToggle())}<section class="card stack"><div class="grid g3"><div class="field"><label for="cch">Chapter</label>${chSelect("cch",{sel:S.lastCh||""})}</div><div class="field"><label for="ctopic">Topic focus (optional)</label><input id="ctopic" placeholder="e.g. Tumour markers"></div><div class="field"><label for="cn">Number of cards</label><select id="cn"><option>8</option><option>12</option><option>20</option></select></div></div><div class="row"><button class="btn pri" data-act="c-go">Generate cards</button>${stopBtn("cards")}<button class="btn" data-act="c-bank">Use built-in cards</button></div><div class="ai-out" id="cout"></div><div id="cdeck"></div></section>`;}
let GEN_CARDS=null;
function vMock(){const s=SUB[MOCK_S];return `${toolHead("mock")}<section class="card stack"><div class="row">${SUBJECTS.map(x=>`<button class="btn sm ${x.id===MOCK_S?"pri":""}" data-act="mock-s" data-s="${x.id}">${esc(x.name)}</button>`).join("")}</div>
 <div class="field"><label>Chapters</label><div class="grid g2">${s.chapters.map(c=>`<label class="check"><input type="checkbox" class="mch" value="${c.id}" checked> ${c.n}. ${esc(c.t)}</label>`).join("")}</div><div class="row"><button class="btn sm ghost" data-act="mock-all" data-v="1">Select all</button><button class="btn sm ghost" data-act="mock-all" data-v="0">Clear</button></div></div>
 <div class="grid g3"><div class="field"><label for="mn">Questions</label><select id="mn"><option>10</option><option>20</option><option>30</option></select></div><div class="field"><label for="mt">Time per question</label><select id="mt"><option value="60">60 seconds</option><option value="45">45 seconds</option><option value="90">90 seconds</option><option value="0">Untimed</option></select></div><div class="field"><label for="msrc">Questions from</label><select id="msrc"><option value="ai">AI: fresh questions</option><option value="bank">Built-in bank (instant)</option></select></div></div>
 <div class="row"><button class="btn pri" data-act="mock-go">Start mock test</button>${stopBtn("mock")}</div><div class="ai-out" id="mout"></div></section><div id="mbox"></div>`;}

function weakList(){return ALLCH.map(c=>{const q=S.quiz[c.id];const mastery=q?q.last/100:(chDone(c.id)?.5:0);const w=heatOf(c)*(SUB[c.s].std?.7:1);return {c,q,mastery,score:w*(1-mastery)};}).sort((a,b)=>b.score-a.score);}

function buildPlan({exam,hrs,weak,subs,skip}){
  const start=new Date();start.setHours(0,0,0,0);const end=new Date(exam+"T00:00:00");
  const days=Math.round((end-start)/864e5);if(!(days>=3))return null;
  const rev=Math.max(2,Math.round(days*.15));const studyDays=days-rev;
  const order=[];const lists=subs.map(sid=>SUB[sid].chapters.filter(c=>!(skip&&chDone(c.id))));
  for(let k=0;lists.some(l=>l[k]);k++)lists.forEach(l=>{if(l[k])order.push(l[k]);});
  const wt=c=>(1+starSum(c)/6+c.topics.length*.12)*(c.s===weak?1.5:1)*(SUB[c.s].std?.7:1);
  const W=order.reduce((a,c)=>a+wt(c),0);const H=studyDays*hrs;
  const queue=order.map(c=>({id:c.id,h:Math.max(.5,wt(c)/W*H)}));
  const out=[];let qi=0;
  for(let d=0;d<days;d++){const dt=new Date(start);dt.setDate(dt.getDate()+d);const items=[];
    if(d>=studyDays){const sid=subs[(d-studyDays)%subs.length];items.push({k:"rev",txt:`Revision: ${SUB[sid].name} five-star topics + flowchart recall`,h:hrs-1,s:sid});items.push({k:"mock",txt:`Timed mock test: ${SUB[sid].name}`,h:1,s:sid});}
    else{let left=hrs-.25;if((d+1)%7===0){items.push({k:"mock",txt:"Weekly mixed mock test + review mistakes",h:1});left-=1;}
      while(left>.24&&qi<queue.length){const q=queue[qi];const take=Math.min(left,q.h);items.push({k:"study",id:q.id,h:Math.round(take*4)/4,txt:`${SUB[CH[q.id].s].short} ${CH[q.id].n}: ${CH[q.id].t}`,s:CH[q.id].s});q.h-=take;left-=take;if(q.h<=.01)qi++;}
      if(qi>=queue.length&&left>.24)items.push({k:"rev",txt:"Catch-up / revise weakest chapter",h:Math.round(left*4)/4});
      items.push({k:"cards",txt:"15-min flashcard review of earlier chapters",h:.25});}
    out.push({date:dstr(dt),items:items.map(x=>({...x,done:false}))});}
  return {exam,hrs,weak,subs,skip,days:out,made:today()};
}
function drawPlan(){const v=$("#planview");if(!v)return;const p=S.plan;if(!p){v.innerHTML=`<p class="note">Your plan will appear here: every day until the exam, chapters split by exam weight, weekly mocks and a final revision block.</p>`;return;}
  const t=today();const weeks=[];p.days.forEach((d,i)=>{const w=Math.floor(i/7);(weeks[w]=weeks[w]||[]).push({d,i});});
  const curW=Math.max(0,Math.floor(p.days.findIndex(d=>d.date===t)/7));
  const total=p.days.reduce((a,d)=>a+d.items.length,0),dn=p.days.reduce((a,d)=>a+d.items.filter(x=>x.done).length,0);
  v.innerHTML=`<div class="row between"><h2>Your plan · ${p.days.length} days to ${esc(p.exam)}</h2><span class="chip">${dn}/${total} tasks done</span></div><div class="bar"><i style="width:${total?Math.round(dn/total*100):0}%"></i></div>
  ${weeks.map((w,wi)=>`<details ${wi===curW?"open":""}><summary><b>Week ${wi+1}</b> <span class="note">${esc(w[0].d.date)} → ${esc(w[w.length-1].d.date)}</span></summary>${w.map(({d,i})=>`<div class="day ${d.date===t?"today":""}"><span class="d">${new Date(d.date+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}${d.date===t?"<br><b>TODAY</b>":""}</span><div>${d.items.map((x,j)=>`<label class="task ${x.done?"done":""}" ${x.s?`data-s="${x.s}"`:""}><input type="checkbox" data-act-change="ptask" data-d="${i}" data-j="${j}" ${x.done?"checked":""}><span>${x.s?'<span class="dot" style="display:inline-block;background:var(--sc);margin-right:6px"></span>':""}${esc(x.txt)} <span class="note">· ${x.h}h</span>${x.id?` <a class="note" href="#c-${x.id}">open</a>`:""}</span></label>`).join("")}</div></div>`).join("")}</details>`).join("")}`;
}

function modelAnswerPrompt(c,t){const f=t[2]==="L"?"a 10-mark long answer":t[2]==="D"?"a difference table answer (5 marks)":"a 5-mark short note";return `${RULES()}${ctx(c)}\n\nWrite ${f} on "${t[0]}" exactly as a topper would in the Era University 2nd Prof exam: introduction/definition, then headed sections (etiology, pathogenesis/MOA, features, diagnosis/uses, complications/ADR as relevant), a flowchart or table to draw (show it in text), and 3 marks-fetching keywords in bold at the end. Keep it reproducible in ${t[2]==="L"?"15":"7"} minutes of writing.`;}
async function tutorSend(){const ta=$("#tq");const q=ta.value.trim();if(!q){ta.focus();return;}ta.value="";
  TURNS.push({role:"user",content:q});TURNS=TURNS.slice(-12);if(TURNS[0].role!=="user")TURNS.shift();drawChat();
  const bubble=document.createElement("div");bubble.className="msg bot ai-out";$("#chat").appendChild(bubble);
  const c=CH[$("#tctx").value];
  const t=await aiStream(bubble,[{role:"user",content:RULES()+ctx(c)+"\n\nAnswer the student's questions that follow. Keep answers focused (under 300 words unless asked for more)."},...TURNS],{key:"tutor",chat:true});
  if(t){TURNS.push({role:"assistant",content:t});if($("#tspeak")?.checked)speak(t);}else TURNS.pop();
}
function startMic(btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const note=$("#micnote");
  if(!SR){note.textContent="Voice input is not available in this browser view. Type your question below; the answer will still be read aloud.";$("#vq").focus();return;}
  if(REC){try{REC.stop();}catch(e){}return;}
  try{REC=new SR();REC.lang=$("#vlang").value;REC.interimResults=true;REC.maxAlternatives=1;
    REC.onresult=e=>{$("#vq").value=[...e.results].map(r=>r[0].transcript).join(" ");};
    REC.onerror=e=>{note.textContent=e.error==="not-allowed"||e.error==="service-not-allowed"?"The microphone is blocked in this view. Type your question instead; answers are still read aloud.":"Could not hear clearly. Tap the mic and try again, or type.";};
    REC.onend=()=>{btn.classList.remove("live");REC=null;if($("#vq").value.trim())ACT["v-go"]();};
    REC.start();btn.classList.add("live");note.textContent="Listening… tap again to stop.";}
  catch(e){REC=null;note.textContent="The microphone is not available here. Type your question instead.";}
}

document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(e.key==="Escape"){const d=$("#drawer");if(d&&!d.hidden){ACT.drawer();return;}const r=$("#qres");if(r)r.hidden=true;}
  if(e.target.id==="q"&&["ArrowDown","ArrowUp","Enter"].includes(e.key)){const items=$$("#qres a");if(!items.length)return;let i=items.findIndex(a=>a.classList.contains("act"));
    if(e.key==="Enter"){e.preventDefault();(items[i]||items[0]).click();return;}e.preventDefault();items.forEach(a=>a.classList.remove("act"));i=e.key==="ArrowDown"?(i+1)%items.length:(i-1+items.length)%items.length;items[i].classList.add("act");items[i].scrollIntoView({block:"nearest"});return;}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();$("#q")?.focus();return;}
  const opts=$$(".opt:not([disabled])");if(opts.length){const m={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}[e.key.toLowerCase()];if(m!=null&&opts[m]){e.preventDefault();opts[m].click();return;}}
  if(e.key==="Enter"&&$("#qnext")){e.preventDefault();$("#qnext").click();return;}
  if($("#fc")&&!$("#drawer:not([hidden])")){if(e.key===" "){e.preventDefault();$("#fc").click();}else if(e.key==="ArrowRight")$("#fcnext").click();else if(e.key==="ArrowLeft")$("#fcprev").click();else if(e.key.toLowerCase()==="k")$("#fcgot").click();}
});

/* ============ Flowcharts library ============ */
const FLOWMAP={};FLOWS.forEach(f=>FLOWMAP[f.id]=f);
ALLCH.forEach(c=>{FLOWMAP["ch-"+c.id]={id:"ch-"+c.id,s:c.s,ch:c.id,t:c.flow.t,sum:`Chapter revision flowchart for ${c.t}.`,n:c.flow.n,terms:[],exam:"",chapterFlow:true};});
let FL_S="all", FL_KIND="topic", FL_Q="", FL_SEL=0, FL_NODES=[];
/* flatten nodes in reading order; each item {label, exp} */
function flatFlow(nodes){const out=[];const add=x=>{if(typeof x==="string")out.push({label:x,exp:""});else if(Array.isArray(x))out.push({label:x[0],exp:x[1]||""});};
  const walk=n=>{if(typeof n==="string"||Array.isArray(n))add(n);else if(n.k)add(n.k);else if(n.b)n.b.forEach(col=>col.forEach(walk));};nodes.forEach(walk);return out;}
function flowXHTML(nodes){let i=0;
  const lab=x=>typeof x==="string"?x:Array.isArray(x)?x[0]:x;
  const btn=(x,cls)=>{const k=i++;return `<button class="${cls} fnode" data-act="fsel" data-ni="${k}"><span class="fnum">${k+1}</span><span>${esc(lab(x))}</span></button>`;};
  const node=n=>{if(typeof n==="string"||Array.isArray(n))return btn(n,"fbox");if(n.k)return btn(n.k,"fbox key");
    if(n.b)return `<div class="fbranch">${n.b.map(col=>`<div class="fcol">${col.map((x,j)=>(typeof x==="string"||Array.isArray(x))?btn(x,j===0?"fh":"fl"):x.k?btn(x.k,"fl key"):node(x)).join("")}</div>`).join("")}</div>`;return "";};
  return `<div class="flow xflow">${nodes.map(node).join('<div class="arrow" aria-hidden="true"></div>')}</div>`;}

function vFlowcharts(){
  POST=()=>drawFlowList();
  const topicN=FLOWS.length,chN=ALLCH.length;
  return `<header class="stack"><span class="eyebrow">Visual revision</span><h1>Flowcharts</h1><p class="muted">${topicN} topic flowcharts where every step is explained, plus ${chN} chapter revision flowcharts. Tap any step to read what it means; use Walk-through to go step by step.</p></header>
  <section class="card stack"><div class="row"><div class="search" style="max-width:420px">${ico("search",18)}<input id="flq" type="search" placeholder="Search flowcharts: DIC, HIV, RAAS, hanging…" value="${esc(FL_Q)}" aria-label="Search flowcharts"></div>
  <div class="row" role="group" aria-label="Type"><button class="btn sm ${FL_KIND==="topic"?"pri":""}" data-act="fl-kind" data-k="topic">Explained topic flowcharts (${topicN})</button><button class="btn sm ${FL_KIND==="chapter"?"pri":""}" data-act="fl-kind" data-k="chapter">Chapter flowcharts (${chN})</button></div></div>
  <div class="row" role="group" aria-label="Subject"><button class="btn sm ${FL_S==="all"?"pri":""}" data-act="fl-s" data-s="all">All subjects</button>${SUBJECTS.map(s=>`<button class="btn sm ${FL_S===s.id?"pri":""}" data-act="fl-s" data-s="${s.id}" data-s2="${s.id}">${esc(s.name)}</button>`).join("")}</div></section>
  <div id="fllist" class="stack"></div>`;
}
function drawFlowList(){const box=$("#fllist");if(!box)return;const q=FL_Q.toLowerCase();
  const pool=Object.values(FLOWMAP).filter(f=>(FL_KIND==="chapter")===!!f.chapterFlow).filter(f=>FL_S==="all"||f.s===FL_S)
    .filter(f=>!q||(f.t+" "+f.sum+" "+CH[f.ch].t+" "+flatFlow(f.n).map(x=>x.label).join(" ")+" "+(f.terms||[]).map(t=>t[0]).join(" ")).toLowerCase().includes(q));
  if(!pool.length){box.innerHTML=`<p class="note">No flowcharts match "${esc(FL_Q)}". Try another word, or ask Atlas.</p>`;return;}
  box.innerHTML=SUBJECTS.filter(s=>pool.some(f=>f.s===s.id)).map(s=>`<section class="stack" data-s="${s.id}"><div class="row between"><h2 style="color:var(--sc)">${esc(s.name)}</h2><span class="note">${pool.filter(f=>f.s===s.id).length} flowcharts</span></div><div class="grid g3">${pool.filter(f=>f.s===s.id).map(f=>{const c=CH[f.ch];const steps=flatFlow(f.n).length;return `<a class="flcard" href="#fc-${f.id}"><span class="eyebrow" style="color:var(--sc)">${esc(s.short)} ${c.n} · ${esc(c.t)}</span><b>${esc(f.t)}</b><span class="note">${esc(f.sum)}</span><span class="row" style="gap:6px"><span class="chip">${steps} steps</span>${f.chapterFlow?"":'<span class="chip">Every step explained</span>'}${FA[f.id]?'<span class="chip" style="color:var(--sc)">Exam pack</span>':""}${S.flowDone&&S.flowDone[f.id]?'<span class="chip" style="color:var(--good)">✓ Revised</span>':""}</span><div class="bar thin"><i style="width:${Math.round(flSeen(f.id).size/steps*100)}%;background:var(--sc)"></i></div></a>`;}).join("")}</div></section>`).join("");
}

function vFlow(id){const f=FLOWMAP[id];const c=CH[f.ch],s=SUB[f.s];FL_NODES=flatFlow(f.n);FL_SEL=0;FX_TAB="tip";
  const siblings=Object.values(FLOWMAP).filter(x=>x.ch===f.ch&&x.id!==id);
  POST=()=>flSelect(0,false);
  return `<header class="ch-head" data-s="${f.s}"><div class="crumbs"><a href="#flowcharts">Flowcharts</a> / <a href="#s-${f.s}">${esc(s.name)}</a> / <a href="#c-${c.id}">${esc(c.t)}</a></div><h1>${esc(f.t)}</h1><p>${esc(f.sum)}</p><div id="flprogwrap">${flProgressHTML(id,FL_NODES.length)}</div>
  <div class="row"><button class="btn sm pri" data-act="fl-walk">▶ Walk-through</button><button class="btn sm" data-act="fl-recall">Recall mode</button><button class="btn sm" data-act="fl-done" data-id="${id}">${S.flowDone&&S.flowDone[id]?"✓ Revised":"Mark as revised (+5 XP)"}</button><a class="btn sm" href="#c-${c.id}">Open chapter</a>${FA[id]?'<button class="btn sm" data-act="fl-jump">Exam pack ↓</button>':""}</div></header>
  <div class="flview" data-s="${f.s}">
    <section class="card stack" style="min-width:0"><div class="row between"><span class="eyebrow">Tap any step</span><span class="note">${FL_NODES.length} steps</span></div><div id="flowbox" class="tablewrap">${flowXHTML(f.n)}</div></section>
    <aside class="card stack flpanel" aria-live="polite"><div class="row between"><span class="eyebrow" id="flstepno"></span><div class="row" style="gap:6px"><button class="btn sm" data-act="fl-prev" aria-label="Previous step">←</button><button class="btn sm" data-act="fl-next" aria-label="Next step">→</button></div></div>
      <div class="fldots" id="fldots" role="group" aria-label="Steps">${FL_NODES.map((_,i)=>`<button class="fldot" data-act="fl-dot" data-ni="${i}" aria-label="Step ${i+1}"></button>`).join("")}</div><h3 id="fllabel"></h3><p id="flexp"></p>
      <div class="row"><button class="btn sm" data-act="fl-ai">Explain this step deeper with AI</button>${stopBtn("flai")}</div><div class="ai-out" id="flai"></div>
      <p class="note kbd-hint">Keys: ← → move between steps</p></aside>
  </div>

/* ---- IndexedDB for students' own PDFs (stays in this browser) ---- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("atlas-books",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});}
const MEMBOOKS={};
async function bookPut(id,file){MEMBOOKS[id]=file;try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put({name:file.name,size:file.size,blob:file},id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});return true;}catch(e){return false;}}
async function bookGet(id){if(MEMBOOKS[id])return MEMBOOKS[id];try{const db=await idb();return await new Promise(res=>{const r=db.transaction("files").objectStore("files").get(id);r.onsuccess=()=>res(r.result?r.result.blob:null);r.onerror=()=>res(null);});}catch(e){return null;}}
async function bookDel(id){delete MEMBOOKS[id];try{const db=await idb();db.transaction("files","readwrite").objectStore("files").delete(id);}catch(e){}}
async function bookList(){const out={};try{const db=await idb();await new Promise(res=>{const st=db.transaction("files").objectStore("files");const r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]={name:c.value.name,size:c.value.size};c.continue();}else res();};r.onerror=()=>res();});}catch(e){}Object.entries(MEMBOOKS).forEach(([k,f])=>{if(!out[k])out[k]={name:f.name,size:f.size,session:true};});return out;}

/* ---- pdf.js loader (main-thread worker, CDN scripts only) ---- */
let PDFJS_P=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load "+src));document.head.appendChild(s);});}
function pdfjs(){if(!PDFJS_P){const base=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/`;PDFJS_P=loadScript(base+"pdf.worker.min.js").then(()=>loadScript(base+"pdf.min.js")).then(()=>{const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";return L;}).catch(e=>{PDFJS_P=null;throw e;});}return PDFJS_P;}

function defTab(t){return t[2]==="L"?"l":(t[2]==="S"||t[2]==="D")?"m":"sh";}
function secHTML(sec){const [h,v]=sec;let body;
  if(typeof v==="string")body=`<p>${esc(v)}</p>`;
  else if(Array.isArray(v)&&Array.isArray(v[0]))body=`<div class="tablewrap"><table class="plain anstbl"><thead><tr>${v[0].map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${v.slice(1).map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<td><b>${esc(x)}</b></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  else body=`<ul>${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<h4>${esc(h)}</h4>${body}`;}
function wordsOf(html){return html.replace(/<[^>]+>/g," ").split(/\s+/).filter(Boolean).length;}
function ansBody(a,tab){
  if(tab==="s"){const [idea,ana,pts,hook]=a.s;return `<p class="big">${esc(idea)}</p><div class="analogy"><b>Think of it like this</b><p>${esc(ana)}</p></div><ul>${pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="hook"><b>Memory hook</b> ${esc(hook)}</div>`;}
  if(tab==="sh")return `<p>${esc(a.sh)}</p>`;

  const L=a.l||{};return `${L.i?`<h4>Introduction</h4><p>${esc(L.i)}</p>`:""}${a.m.map(secHTML).join("")}${(L.x||[]).map(secHTML).join("")}${L.f?`<h4>Diagram / flowchart to draw</h4><pre class="diag">${esc(L.f)}</pre>`:""}${L.c?`<h4>Conclusion</h4><p>${esc(L.c)}</p>`:""}`;}
function ansPanel(c,k,uid,tab){const t=CH[c].topics[k];const a=ANS[c+":"+k];

/* ============ Practice engine: levelled flashcards with spaced repetition, adaptive quiz ladder, mistakes bank ============ */
const LV=["","Basic","Intermediate","Advanced","Exam-pattern"];
const LV_CLS=["","lv1","lv2","lv3","lv4"];
const SRS_DAYS=[0,1,3,7,14,30];
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d);};
function ensureP(){S.srs=S.srs||{};S.mist=S.mist||{};S.qa=S.qa||{};}
function cardPool(id){const c=CH[id];const out=[];
  (QB[id]?QB[id].c:[]).forEach((x,i)=>out.push({key:`${id}:c${i}`,lv:x[0],q:x[1],a:x[2],src:"bank"}));
  c.hy.forEach((x,i)=>{const h=hy(x);out.push({key:`${id}:h${i}`,lv:2,q:h.q,a:h.a,src:"core"});});
  (S.custom[id]||[]).forEach((x,i)=>{const h=hy(x);out.push({key:`${id}:x${i}`,lv:2,q:h.q,a:h.a,src:"ai"});});
  return out;}
function quizPool(id){const out=[];
  (QB[id]?QB[id].q:[]).forEach((x,i)=>out.push({key:`${id}:q${i}`,lv:x[0],q:x[1],o:x[2],a:x[3],e:x[4],ch:id}));
  CH[id].mcq.forEach((m,i)=>out.push({key:`${id}:m${i}`,lv:2,q:m[0],o:m[1],a:m[2],e:m[3],ch:id}));
  return out;}
const lvChip=l=>`<span class="lvchip ${LV_CLS[l]}">${LV[l]}</span>`;

/* ---------- Flashcards tab ---------- */
let FC={id:null,mode:"due",lv:0,queue:[],i:0,pool:[]};
function srsStats(pool){ensureP();const t=today();let nw=0,due=0,learn=0,mast=0;pool.forEach(c=>{const s=S.srs[c.key];if(!s)nw++;else{if(s.due<=t)due++;if(s.b>=4)mast++;else learn++;}});return {nw,due,learn,mast,total:pool.length};}
function cardsTabHTML(id){const pool=cardPool(id);const st=srsStats(pool);const banked=!!QB[id];
  return `<section class="card stack"><div class="row between"><div><h2>Flashcards</h2><p class="note">${banked?`${QB[id].c.length} levelled cards + ${pool.length-QB[id].c.length} core/AI cards.`:`${pool.length} core cards. The 100-card levelled bank for this chapter is being written.`} Spaced repetition brings back the cards you find hard.</p></div><button class="btn sm" data-act="more-cards">+ Generate with AI</button></div>
  <div class="srsbar"><div><b>${st.nw}</b><span>New</span></div><div><b>${st.due}</b><span>Due today</span></div><div><b>${st.learn}</b><span>Learning</span></div><div><b>${st.mast}</b><span>Mastered</span></div></div>
  <div class="bar" aria-label="Mastered"><i style="width:${Math.round(st.mast/Math.max(1,st.total)*100)}%;background:var(--good)"></i></div>
  <div class="row" role="group" aria-label="Deck"><span class="note">Deck</span>${[["due","Due + new"],["all","Browse all"],["weak","Weak cards"]].map(m=>`<button class="btn sm ${FC.mode===m[0]?"pri":""}" data-act="fc-mode" data-m="${m[0]}">${m[1]}</button>`).join("")}</div>
  <div class="row" role="group" aria-label="Level"><span class="note">Level</span><button class="btn sm ${!FC.lv?"pri":""}" data-act="fc-lv" data-l="0">All</button>${[1,2,3,4].map(l=>`<button class="btn sm ${FC.lv===l?"pri":""}" data-act="fc-lv" data-l="${l}">${LV[l]} (${pool.filter(c=>c.lv===l).length})</button>`).join("")}</div>
  <div id="deck"></div><div class="ai-out" id="cardai"></div></section>`;}
function buildQueue(id){ensureP();const t=today();let pool=cardPool(id);if(FC.lv)pool=pool.filter(c=>c.lv===FC.lv);
  if(FC.mode==="due"){const due=pool.filter(c=>S.srs[c.key]&&S.srs[c.key].due<=t);const nw=pool.filter(c=>!S.srs[c.key]).sort((a,b)=>a.lv-b.lv).slice(0,20);pool=[...due,...nw];}
  else if(FC.mode==="weak")pool=pool.filter(c=>S.srs[c.key]&&S.srs[c.key].b<=1);
  else pool=pool.slice().sort((a,b)=>a.lv-b.lv);
  FC.pool=pool;FC.queue=FC.mode==="all"?pool.map((_,i)=>i):shuffle(pool.map((_,i)=>i));FC.i=0;}
function drawDeck(){const box=$("#deck");if(!box)return;
  if(!FC.queue.length||FC.i>=FC.queue.length){box.innerHTML=`<div class="card stack" style="align-items:center;text-align:center"><h3>${FC.queue.length?"Session complete 🎉":"Nothing to review here"}</h3><p class="note">${FC.mode==="due"?"All due cards are done for today. Come back tomorrow, or browse all cards.":FC.mode==="weak"?"No weak cards — great work.":"Pick another level."}</p><div class="row"><button class="btn" data-act="fc-mode" data-m="all">Browse all</button><button class="btn" data-act="fc-mode" data-m="due">Due + new</button></div></div>`;return;}
  const c=FC.pool[FC.queue[FC.i]];const s=(S.srs||{})[c.key];
  box.innerHTML=`<div class="deck"><div class="row between" style="width:100%;max-width:620px"><span class="note">Card ${FC.i+1} of ${FC.queue.length}</span><span class="row" style="gap:6px">${lvChip(c.lv)}${c.src!=="bank"?`<span class="chip">${c.src==="ai"?"AI card":"Core card"}</span>`:""}${s?`<span class="chip">Box ${s.b}</span>`:'<span class="chip">New</span>'}</span></div>
  <button class="fcard" id="fc" aria-label="Flashcard, press to flip"><div class="in"><div class="face front"><span class="eyebrow">Question</span>${esc(c.q)}<span class="note">Tap or press Space to reveal</span></div><div class="face back"><span class="eyebrow">Answer</span>${esc(c.a)}</div></div></button>
  <div class="row rate" style="justify-content:center"><button class="btn" id="fcprev" data-act="fc-step" data-d="-1">←</button><button class="btn r1" id="r1" data-act="fc-rate" data-r="1">Again <small>1</small></button><button class="btn r2" id="r2" data-act="fc-rate" data-r="2">Hard <small>2</small></button><button class="btn r3 pri" id="fcgot" data-act="fc-rate" data-r="3">Good <small>3</small></button><button class="btn r4" id="r4" data-act="fc-rate" data-r="4">Easy <small>4</small></button><button class="btn" id="fcnext" data-act="fc-step" data-d="1">→</button></div>
  <p class="note kbd-hint">Keys: Space flip · 1 Again · 2 Hard · 3 Good · 4 Easy · ← → skip</p></div>`;
  $("#fc").onclick=()=>$("#fc").classList.toggle("flip");}
function rateCard(r){ensureP();const c=FC.pool[FC.queue[FC.i]];const s=S.srs[c.key]||{b:0,n:0};let b=s.b;
  if(r===1){b=0;const cur=FC.queue.splice(FC.i,1)[0];FC.queue.splice(Math.min(FC.queue.length,FC.i+3),0,cur);FC.i--;}
  else if(r===2)b=Math.max(1,b);else if(r===3)b=Math.min(5,b+1);else b=Math.min(5,b+2);
  S.srs[c.key]={b,due:addDays(r===1?0:r===2?1:SRS_DAYS[b]),n:(s.n||0)+1};save();if(r>=3){S.xp+=1;touchStreak();save();renderSide();}
  FC.i++;drawDeck();const st=srsStats(cardPool(FC.id));const bar=$(".srsbar");if(bar)bar.innerHTML=`<div><b>${st.nw}</b><span>New</span></div><div><b>${st.due}</b><span>Due today</span></div><div><b>${st.learn}</b><span>Learning</span></div><div><b>${st.mast}</b><span>Mastered</span></div>`;}
function mountCards(id){FC.id=id;$("#tabbody").innerHTML=cardsTabHTML(id);buildQueue(id);drawDeck();}

/* ---------- Quiz tab ---------- */
function qStats(pool){ensureP();let att=0,cor=0;const byLv=[0,0,0,0,0].map(()=>({a:0,c:0}));pool.forEach(q=>{const r=S.qa[q.key];if(r){att++;if(r.c>0&&r.last)cor++;byLv[q.lv].a++;if(r.last)byLv[q.lv].c++;}});return {att,cor,byLv,total:pool.length,mist:pool.filter(q=>S.mist[q.key]).length};}
function quizTabHTML(id){const pool=quizPool(id);const st=qStats(pool);const banked=!!QB[id];
  return `<section class="stack"><div class="card stack"><div class="row between"><div><h2>Quiz</h2><p class="note">${banked?`${QB[id].q.length} levelled MCQs`:`${pool.length} MCQs (the 100-question levelled bank for this chapter is being written)`} · attempted ${st.att}/${st.total} · ${st.mist} in mistakes bank</p></div></div>
  <div class="lvgrid">${[1,2,3,4].map(l=>{const n=pool.filter(q=>q.lv===l).length;const b=st.byLv[l];return `<div class="lvcell ${LV_CLS[l]}"><b>${LV[l]}</b><span>${n} questions</span><span class="note">${b.a?`${Math.round(b.c/b.a*100)}% right`:"Not tried"}</span></div>`;}).join("")}</div>
  <div class="grid g2">
   <div class="mode"><b>🪜 Adaptive ladder</b><span class="note">Starts Basic. 3 right in a row moves you up a level; a miss moves you down and saves it to Mistakes. 20 questions.</span><button class="btn pri" data-act="qz-ladder">Start ladder</button></div>
   <div class="mode"><b>🎯 Level practice</b><span class="note">Drill one level.</span><div class="row"><select id="qzlv" aria-label="Level">${[1,2,3,4].map(l=>`<option value="${l}">${LV[l]}</option>`).join("")}</select><select id="qzn" aria-label="Count"><option value="10">10</option><option value="20">20</option><option value="999">All</option></select><button class="btn" data-act="qz-level">Start</button></div></div>
   <div class="mode"><b>🔁 Mistakes bank (${st.mist})</b><span class="note">Re-test everything you got wrong. Correct answers leave the bank.</span><button class="btn" data-act="qz-mist" ${st.mist?"":"disabled"}>Review mistakes</button></div>
   <div class="mode"><b>📝 Full chapter test</b><span class="note">All ${pool.length} questions, mixed levels.</span><label class="check"><input type="checkbox" id="qztime"> Timed (45 s per question)</label><button class="btn" data-act="qz-full">Start test</button></div>
  </div><div class="row"><button class="btn sm" data-act="ai-quiz">Generate 5 fresh MCQs with AI</button></div></div><div id="quizbox"></div></section>`;}
function recordAns(q,ok){ensureP();const r=S.qa[q.key]||{c:0,w:0};if(ok)r.c++;else r.w++;r.last=ok?1:0;S.qa[q.key]=r;if(!ok)S.mist[q.key]=1;save();}
function mountQuiz(id){$("#tabbody").innerHTML=quizTabHTML(id);}
function startList(qs,opts){const box=$("#quizbox");runQuiz(box,qs,opts);box.scrollIntoView({behavior:"smooth",block:"start"});}
function runLadder(box,pool,n=20){clearInterval(QUIZ_TIMER);let level=1,streak=0,i=0,score=0,top=1;const asked=new Set(),log=[];
  const pick=()=>{for(const d of [0,1,-1,2,-2,3,-3]){const L=level+d;if(L<1||L>4)continue;const cand=pool.filter(q=>q.lv===L&&!asked.has(q.key));if(cand.length){const fresh=cand.filter(q=>!(S.qa[q.key]&&S.qa[q.key].last));return shuffle(fresh.length?fresh:cand)[0];}}return null;};
  function show(){const q=pick();if(!q||i>=n){finish();return;}asked.add(q.key);
    box.innerHTML=`<div class="card q"><div class="row between"><span class="eyebrow">Adaptive ladder · Q${i+1} of ${n}</span><span class="ladder" aria-label="Level ${level}">${[1,2,3,4].map(l=>`<i class="${l<=level?LV_CLS[l]+" on":""}"></i>`).join("")}<b>${LV[level]}</b></span></div>
    <div class="row" style="gap:6px">${lvChip(q.lv)}<span class="note">Streak ${streak}/3</span></div><h3>${esc(q.q)}</h3><p class="note kbd-hint">Tip: press 1–4 to answer, Enter for next.</p>
    <div class="stack">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div><div class="fb" aria-live="polite"></div></div>`;
    $$(".opt",box).forEach(b=>b.onclick=()=>answer(q,+b.dataset.k));}
  function answer(q,k){if($(".opt[disabled]",box))return;const ok=k===q.a;recordAns(q,ok);log.push({q,k,ok});i++;let msg="";
    if(ok){score++;streak++;if(streak>=3&&level<4){level++;streak=0;msg=` ⬆ Level up: ${LV[level]}!`;top=Math.max(top,level);}}else{streak=0;if(level>1){level--;msg=` ⬇ Back to ${LV[level]}.`;}}
    $$(".opt",box).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong");});
    $(".fb",box).innerHTML=`<div class="explain"><b>${ok?"Correct.":"Not quite."}${msg}</b> ${esc(q.e||"")}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="qnext">${i<n?"Next question":"See results"}</button></div>`;$("#qnext",box).onclick=show;$("#qnext",box).focus();}
  function finish(){const tot=log.length;if(!tot){box.innerHTML='<p class="note">No questions available.</p>';return;}const pct=Math.round(score/tot*100);
    const id=log[0].q.ch;const o=S.quiz[id]||{best:0,last:0,n:0};S.quiz[id]={best:Math.max(o.best,pct),last:pct,n:o.n+1};S.hist.unshift({d:today(),title:"Adaptive ladder",score,total:tot});S.hist=S.hist.slice(0,30);save();if(score)addXP(score*10+(top-1)*10,`ladder · reached ${LV[top]}`);
    box.innerHTML=`<div class="card stack"><div class="row between"><div><span class="eyebrow">Adaptive ladder · result</span><div class="score">${score}/${tot}</div><p class="muted">Highest level reached: <b>${LV[top]}</b>. Finished at ${LV[level]}.</p></div><div class="ring" style="--p:${pct}"><span>${pct}%</span></div></div>
    <div class="lvgrid">${[1,2,3,4].map(l=>{const a=log.filter(x=>x.q.lv===l);return `<div class="lvcell ${LV_CLS[l]}"><b>${LV[l]}</b><span>${a.length?`${a.filter(x=>x.ok).length}/${a.length} right`:"—"}</span></div>`;}).join("")}</div>
    <details ${pct<100?"open":""}><summary><b>Review answers</b></summary><div class="stack" style="margin-top:10px">${log.map(x=>`<div class="explain"><b>${x.ok?"✓":"✗"} ${esc(x.q.q)}</b><br>Answer: ${esc(x.q.o[x.q.a])}${x.ok?"":` · You chose: ${esc(x.q.o[x.k])}`}<br><span class="muted">${esc(x.q.e||"")}</span></div>`).join("")}</div></details>
    <div class="row"><button class="btn pri" data-act="qz-ladder">Climb again</button>${log.some(x=>!x.ok)?'<button class="btn" data-act="qz-mist">Review mistakes</button>':""}</div></div>`;if(pct===100)confetti();}
  show();box.scrollIntoView({behavior:"smooth",block:"start"});}

/* ---------- Glossary drill-down ---------- */
const GL_KEYS=(()=>{const all=Object.keys(GLOSS).map(k=>[k,k]).concat(Object.entries(GLOSS_ALIAS));return all.sort((a,b)=>b[0].length-a[0].length);})();
const GL_RE=new RegExp("\\b("+GL_KEYS.map(([k])=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi");
function glossKey(m){const l=m.toLowerCase();return GLOSS[l]?l:GLOSS_ALIAS[l];}
function linkTerms(text){const used=new Set();return esc(text).replace(GL_RE,(m)=>{const k=glossKey(m);if(!k||used.has(k))return m;used.add(k);return `<button class="term" data-act="term" data-t="${esc(k)}">${m}</button>`;});}
function chapterTerms(c){const txt=[...c.core,...c.topics.map(t=>t[0]),...c.hy].join(" ");const set=new Set();(txt.match(GL_RE)||[]).forEach(m=>{const k=glossKey(m);if(k)set.add(k);});return [...set];}
function termBox(k){const g=GLOSS[k];return `<div class="termbox" data-k="${esc(k)}"><div class="row between"><b>${esc(k.replace(/\b\w/g,c=>c.toUpperCase()))}</b><button class="btn sm ghost" data-act="term-close" aria-label="Close">✕</button></div><p>${esc(g[0])}</p><button class="btn sm" data-act="term-more">More ▸</button><p class="more" hidden>${esc(g[1])}</p></div>`;}

Object.assign(ACT,{
 "fc-mode":el=>{FC.mode=el.dataset.m;mountCards(FC.id||location.hash.slice(3));},
 "fc-lv":el=>{FC.lv=+el.dataset.l;mountCards(FC.id||location.hash.slice(3));},
 "fc-rate":el=>{const f=$("#fc");if(f&&!f.classList.contains("flip")){f.classList.add("flip");return;}rateCard(+el.dataset.r);},
 "fc-step":el=>{FC.i=Math.max(0,Math.min(FC.queue.length,FC.i+(+el.dataset.d)));drawDeck();},
 "qz-ladder":()=>{const id=location.hash.slice(3);runLadder($("#quizbox"),quizPool(id));},
 "qz-level":()=>{const id=location.hash.slice(3);const l=+$("#qzlv").value,n=+$("#qzn").value;const qs=shuffle(quizPool(id).filter(q=>q.lv===l)).slice(0,n);if(!qs.length){toast("No questions at this level yet");return;}startList(qs,{title:`${LV[l]} practice`,onAnswer:recordAns});},
 "qz-mist":()=>{const id=location.hash.slice(3);ensureP();const qs=shuffle(quizPool(id).filter(q=>S.mist[q.key]));if(!qs.length){toast("Mistakes bank is empty");return;}startList(qs,{title:"Mistakes bank",onAnswer:(q,ok)=>{recordAns(q,ok);if(ok){delete S.mist[q.key];save();}}});},
 "qz-full":()=>{const id=location.hash.slice(3);const t=$("#qztime").checked?45:0;startList(shuffle(quizPool(id)),{title:"Full chapter test",timed:t,onAnswer:recordAns});},
 term:el=>{const li=el.closest("li,.termhost");if(!li)return;const ex=li.querySelector(".termbox");if(ex&&ex.dataset.k===el.dataset.t){ex.remove();return;}if(ex)ex.remove();li.insertAdjacentHTML("beforeend",termBox(el.dataset.t));},
 "term-more":el=>{const p=el.parentElement.querySelector(".more");p.hidden=!p.hidden;el.textContent=p.hidden?"More ▸":"Less ▴";},
 "term-close":el=>el.closest(".termbox").remove()
});
document.addEventListener("keydown",e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||!$("#r1"))return;if(["1","2","3","4"].includes(e.key)){e.preventDefault();$(`[data-act="fc-rate"][data-r="${e.key}"]`).click();}},true);

/* ============ Flowchart exam packs + viewer polish ============ */
const RQ_T={L:["LAQ","L"],S:["Short note","S"],D:["Difference","D"],V:["Viva","N"]};
function faResolve(f){const fa=FA[f.id];if(!fa)return null;const a=fa.ans&&ANS[fa.ans];
  return {sh:fa.sh||(a&&a.sh)||"",m:fa.m||(a&&a.m)||[],x:(a&&a.l&&a.l.x)||[],li:fa.li||(a&&a.l&&a.l.i)||f.sum,lc:fa.lc||(a&&a.l&&a.l.c)||"",r:fa.r||(a&&a.r)||"",rq:fa.rq||[],fig:a&&a.l&&a.l.f};}
function flowText(nodes){const out=[];const lab=x=>typeof x==="string"?x:Array.isArray(x)?x[0]:x;
  nodes.forEach((n,i)=>{if(typeof n==="string"||Array.isArray(n))out.push(lab(n));else if(n.k)out.push("⇒ "+lab(n.k));else if(n.b)out.push(n.b.map(col=>"["+col.filter(x=>typeof x==="string"||Array.isArray(x)).map(lab).join(" → ")+"]").join("   |   "));});
  return out.join("\n   ↓\n");}
let FX_TAB="tip";
function examPackHTML(f){const P=faResolve(f);
  if(!P)return f.exam?`<section class="card stack expack"><h2>Exam tip</h2><p>${esc(f.exam)}</p></section>`:"";
  return `<section class="card stack expack" data-s="${f.s}" id="expack"><div class="row between"><div><span class="eyebrow">Exam pack · works offline</span><h2>Questions & model answers</h2></div><span class="note">${P.rq.length} related questions · 3 answer lengths</span></div>
  <div class="anstabs" role="tablist">${[["tip","Exam tip & questions"],["sh","Short · 2–3 marks"],["m","Medium · 5 marks"],["l","Long · 10 marks"]].map(t=>`<button role="tab" aria-selected="${FX_TAB===t[0]}" class="${FX_TAB===t[0]?"on":""}" data-act="fx-tab" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>
  <div class="ansbody" id="fxbody">${fxBody(f,P,FX_TAB)}</div>
  <div class="ansfoot"><span class="note"><b>Read more in:</b> ${esc(P.r)}</span><div class="row"><button class="btn sm" data-act="fl-answer">Ask AI for another version</button>${stopBtn("flans")}</div><div class="ai-out" id="flans"></div></div></section>`;}
function fxBody(f,P,tab){const nodes=flatFlow(f.n);
  if(tab==="tip")return `<div class="tipbox"><b>Exam tip</b><p>${esc(f.exam)}</p></div><h4>Related exam questions</h4><p class="note">Try answering in your head first, then reveal the model answer.</p><div class="rqlist">${P.rq.map((q,i)=>`<div class="rq"><button class="rqq" data-act="rq-toggle" aria-expanded="false"><span class="tag ${RQ_T[q[0]][1]}">${RQ_T[q[0]][0]}</span><span>${esc(q[1])}</span><span class="chev" aria-hidden="true">▾</span></button><div class="rqa" hidden><p>${esc(q[2])}</p></div></div>`).join("")}</div>`;
  if(tab==="sh")return `<p>${esc(P.sh)}</p>`;
  if(tab==="m")return P.m.map(secHTML).join("");
  return `<h4>Introduction</h4><p>${esc(P.li)}</p>${P.m.map(secHTML).join("")}${P.x.map(secHTML).join("")}
   <h4>Step-by-step explanation of the flowchart</h4><ol class="walk">${nodes.map(n=>`<li><b>${esc(n.label)}</b>${n.exp?` — ${esc(n.exp)}`:""}</li>`).join("")}</ol>
   ${(f.terms&&f.terms.length)?`<h4>Key terms</h4><ul>${f.terms.map(t=>`<li><b>${esc(t[0])}:</b> ${esc(t[1])}</li>`).join("")}</ul>`:""}
   <h4>Diagram to draw</h4><pre class="diag">${esc(flowText(f.n))}</pre>${P.lc?`<h4>Conclusion</h4><p>${esc(P.lc)}</p>`:""}`;}
function flSeen(id){S.flowSeen=S.flowSeen||{};return new Set(S.flowSeen[id]||[]);}
function flMark(id,i){const s=flSeen(id);s.add(i);S.flowSeen[id]=[...s];save();return s;}
function flProgressHTML(id,n){const s=flSeen(id).size;return `<div class="flprog"><div class="bar"><i style="width:${Math.round(s/n*100)}%;background:var(--sc)"></i></div><span class="note">${s}/${n} steps explored</span></div>`;}
Object.assign(ACT,{
 "fx-tab":el=>{FX_TAB=el.dataset.t;const f=FLOWMAP[location.hash.slice(4)];const P=faResolve(f);$("#fxbody").innerHTML=fxBody(f,P,FX_TAB);$$('#expack [data-act="fx-tab"]').forEach(b=>{const on=b.dataset.t===FX_TAB;b.classList.toggle("on",on);b.setAttribute("aria-selected",on);});},
 "rq-toggle":el=>{const a=el.nextElementSibling;a.hidden=!a.hidden;el.setAttribute("aria-expanded",!a.hidden);el.classList.toggle("open",!a.hidden);},
 "fl-dot":el=>flSelect(+el.dataset.ni)
});

/* ============ Chapter Details & Summary tab ============ */
function staticFlow(nodes){const lab=x=>typeof x==="string"?x:Array.isArray(x)?x[0]:"";let i=0;
  const node=n=>{if(typeof n==="string"||Array.isArray(n))return `<div class="sfbox"><span class="fnum">${++i}</span>${esc(lab(n))}</div>`;
    if(n.k)return `<div class="sfbox key"><span class="fnum">${++i}</span>${esc(lab(n.k))}</div>`;
    if(n.b)return `<div class="sfbranch">${n.b.map(col=>`<div class="sfcol">${col.map((x,j)=>(typeof x==="string"||Array.isArray(x))?`<div class="${j===0?"sfh":"sfl"}"><span class="fnum">${++i}</span>${esc(lab(x))}</div>`:x.k?`<div class="sfl"><span class="fnum">${++i}</span><b>${esc(lab(x.k))}</b></div>`:node(x)).join("")}</div>`).join("")}</div>`;return "";};
  return `<div class="sflow">${nodes.map(node).join('<div class="sfarrow" aria-hidden="true"></div>')}</div>`;}
function priGroups(c){const g={must:[],imp:[],also:[]};c.topics.forEach((t,k)=>{(t[1]>=4||t[2]==="L"?g.must:t[1]>=2?g.imp:g.also).push(k);});return g;}
function summaryTabHTML(id){const c=CH[id],s=SUB[c.s];const sum=CHSUM[id]||[c.flow.t,""];
  const g=priGroups(c);const flows=Object.values(FLOWMAP).filter(f=>f.ch===id).sort((a,b)=>(a.chapterFlow?1:0)-(b.chapterFlow?1:0));
  const nAns=ansCount(id),read=(S.read[id]||[]).length,qb=S.quiz[id];const terms=chapterTerms(c);const docs=syllabusLinks(id);
  const toc=[["sm-ov","Overview"],["sm-pri","Priority topics"],["sm-con","Concepts"],["sm-flow",`Flowcharts (${flows.length})`],["sm-hy","High-yield facts"],terms.length?["sm-terms","Key terms"]:null,docs?["sm-docs","Documents"]:null].filter(Boolean);
  const topicRow=k=>{const t=c.topics[k];const a=ANS[id+":"+k];return `<div class="smtopic"><div class="smt-head"><span>${starsHTML(t[1])} ${tagHTML(t[2])} ${nmc(t)}</span><b>${esc(t[0])}</b></div>
    ${a?`<p class="smt-sh">${esc(a.sh)}</p>`:""}<div class="row"><button class="btn sm ${a?"pri":""}" data-act="ans-open" data-c="${id}" data-k="${k}" data-u="sma${k}" aria-expanded="false">${a?"Full answers (Simplify · Short · Medium · Long)":"Answers"}</button><button class="btn sm star ${isSaved(id,k)?"on":""}" data-act="save" data-c="${id}" data-k="${k}" aria-pressed="${isSaved(id,k)}" title="Save to revision list">${isSaved(id,k)?"★":"☆"}</button></div><div id="sma${k}"></div></div>`;};
  const grp=(key,title,desc,ks)=>ks.length?`<div class="smgroup ${key}"><div class="row between"><h3>${title}</h3><span class="note">${ks.length} topic${ks.length>1?"s":""} · ${desc}</span></div>${ks.map(topicRow).join("")}</div>`:"";
  return `<div class="smwrap" data-s="${c.s}">
  <nav class="smtoc" aria-label="Summary sections">${toc.map(t=>`<button class="chip" data-act="smx-go" data-to="${t[0]}">${t[1]}</button>`).join("")}</nav>
  <section class="smhero" id="sm-ov"><div class="stack" style="gap:10px;min-width:0"><span class="eyebrow">${esc(s.name)} · Chapter ${c.n} · ${esc(c.paper)}</span><h2>${esc(c.t)}</h2><p class="smlead">${esc(sum[0])}</p>${sum[1]?`<div class="smfocus"><b>🎯 ${esc(sum[1])}</b></div>`:""}
   <div class="row"><button class="btn sm pri" data-act="tab" data-t="learn">Start learning</button><button class="btn sm" data-act="tab" data-t="cards">Flashcards</button><button class="btn sm" data-act="tab" data-t="quiz">Quiz</button></div></div>
   <div class="smstats">${[[c.topics.length,"Exam topics"],[c.topics.filter(t=>t[2]==="L").length,"Long answers"],[c.topics.filter(t=>t[2]==="S").length,"Short notes"],[`${nAns}/${c.topics.length}`,"Offline answers"],[flows.length,"Flowcharts"],[cardPool(id).length,"Flashcards"],[quizPool(id).length,"MCQs"],[`${read}/${c.core.length}`,"Concepts ticked"]].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}
   <div class="smheat"><span class="note">Exam weight</span><span class="heat">${[1,2,3,4,5].map(k=>`<i class="${k<=heatOf(c)?"on":""}"></i>`).join("")}</span>${qb?`<span class="note">Quiz best ${qb.best}%</span>`:""}</div></div></section>
  <section class="card stack" id="sm-pri"><div class="row between"><h2>Priority topics</h2><span class="note">${s.std?"Standard curriculum priority":"From your seniors' past-paper list"}</span></div>
   ${grp("must","Must-do","4–5★ or long-answer",g.must)}${grp("imp","Important","2–3★",g.imp)}${grp("also","Also study","Short notes, NMC syllabus and others",g.also)}</section>
  <section class="card stack" id="sm-con"><div class="row between"><h2>Core concepts explained</h2><span class="note">Tap underlined terms for definitions</span></div><ol class="smcon">${c.core.map((x,k)=>`<li><span class="n">${k+1}</span><span>${linkTerms(x)}</span></li>`).join("")}</ol></section>
  <section class="stack" id="sm-flow"><div class="row between"><h2>Major flowcharts</h2><a class="btn sm" href="#flowcharts">All flowcharts</a></div>
   ${flows.map((f,i)=>{const steps=flatFlow(f.n);const hasExp=steps.some(x=>x.exp);return `<details class="card smflow" ${i===0?"open":""}><summary><span class="row between" style="width:100%"><span class="stack" style="gap:2px"><span class="eyebrow">${f.chapterFlow?"Chapter flowchart":"Explained topic flowchart"}${FA[f.id]?" · exam pack":""}</span><b>${esc(f.t)}</b></span><span class="chip">${steps.length} steps</span></span></summary>
    <div class="smflow-in"><div class="tablewrap">${staticFlow(f.n)}</div>${hasExp?`<div class="stack"><h4>What each step means</h4><ol class="walk">${steps.map(x=>`<li><b>${esc(x.label)}</b>${x.exp?` — ${esc(x.exp)}`:""}</li>`).join("")}</ol></div>`:""}
    ${(f.terms&&f.terms.length)?`<div class="row">${f.terms.map(t=>`<span class="chip" title="${esc(t[1])}"><b>${esc(t[0])}</b></span>`).join("")}</div>`:""}
    <div class="row"><a class="btn sm pri" href="#fc-${f.id}">Open interactive viewer${FA[f.id]?" & exam pack":""}</a></div></div></details>`;}).join("")}</section>
  <section class="card stack" id="sm-hy"><h2>High-yield facts</h2><div class="tablewrap"><table class="plain hytbl"><thead><tr><th>Question</th><th>Answer</th></tr></thead><tbody>${c.hy.map(x=>{const h=hy(x);return `<tr><td>${esc(h.q)}</td><td><b>${esc(h.a)}</b></td></tr>`;}).join("")}</tbody></table></div><p class="note">More in the Flashcards tab${QB[id]?` (${QB[id].c.length} levelled cards)`:""}.</p></section>
  ${terms.length?`<section class="card stack termhost" id="sm-terms"><div class="row between"><h2>Key terms</h2><span class="note">Tap for definition · More for details</span></div><div class="row">${terms.map(k=>`<button class="chip term" data-act="term" data-t="${esc(k)}">${esc(k)}</button>`).join("")}</div></section>`:""}
  ${docs?`<section class="card stack" id="sm-docs"><h2>Read in your documents</h2><div class="row">${docs}</div><p class="note">Add your own books in Notes & Books to bookmark pages for this chapter.</p></section>`:""}
  </div>`;}
ACT["smx-go"]=el=>{const t=document.getElementById(el.dataset.to);if(t){const y=t.getBoundingClientRect().top+window.scrollY-70;window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}};

applyFS();mountDrawer();renderSide();route();

</script>

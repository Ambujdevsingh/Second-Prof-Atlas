/* Glossary for tap-to-explain terms. G[term] = [one-line definition, fuller explanation with example & exam relevance]; aliases map other spellings. */
const GLOSS={
"hypertrophy":["Increase in cell size leading to a bigger organ.","Occurs in cells that cannot divide much (heart, skeletal muscle). Physiological: uterus in pregnancy, body-builder's muscle. Pathological: left ventricle in hypertension or aortic stenosis. Driven by mechanical stretch and growth factors that switch on 'fetal' genes (β-myosin, ANP). Exam tip: contrast with hyperplasia; often both occur together (uterus)."],
"hyperplasia":["Increase in the number of cells in an organ.","Needs cells that can divide. Physiological: hormonal (breast at puberty, endometrium) or compensatory (liver after partial hepatectomy). Pathological: excess hormone or growth factor (endometrial hyperplasia, BPH, warts). Pathological hyperplasia can be the soil for cancer (endometrial hyperplasia → carcinoma)."],
"atrophy":["Shrinkage of an organ due to decrease in cell size and number.","Causes: disuse, denervation, reduced blood supply, poor nutrition, loss of hormones, pressure, ageing. Mechanism: less protein synthesis plus more breakdown by the ubiquitin–proteasome system and autophagy. Atrophic cells often contain lipofuscin (brown atrophy)."],
"metaplasia":["Reversible change of one adult cell type into another.","An adaptive substitution by cells better able to withstand stress. Squamous metaplasia: bronchus in smokers, cervix, vitamin A deficiency. Columnar metaplasia: Barrett oesophagus with acid reflux. Arises from reprogramming of stem cells. Persistent metaplasia can progress to dysplasia and cancer."],
"dysplasia":["Disordered growth with atypical cells; a pre-cancerous change.","Features: pleomorphism, large hyperchromatic nuclei, raised N:C ratio, mitoses above the basal layer, loss of polarity. Graded mild/moderate/severe; full-thickness dysplasia = carcinoma in situ. Example: CIN in cervix (detected by Pap smear)."],
"atp depletion":["Fall in cellular energy (ATP), usually from hypoxia.","Effects: Na⁺/K⁺ pump fails (swelling), anaerobic glycolysis rises (lactic acid, low pH), Ca²⁺ pump fails (calcium overload), ribosomes detach (less protein synthesis), misfolded proteins accumulate. Cells with high energy needs (neurons, myocardium) are most vulnerable."],
"mitochondrial damage":["Injury to mitochondria that cuts ATP and triggers death pathways.","Caused by Ca²⁺ overload, ROS and hypoxia. Leads to the mitochondrial permeability transition (loss of membrane potential), ATP failure and leakage of cytochrome c, which starts apoptosis. Amorphous densities in mitochondria on EM mark irreversible injury."],
"ros":["Reactive oxygen species — unstable oxygen-derived free radicals.","Superoxide, hydrogen peroxide and hydroxyl radical. Produced in normal respiration, by leukocytes in inflammation, radiation, drugs (CCl4, paracetamol) and iron (Fenton reaction). They damage membranes (lipid peroxidation), proteins and DNA. Removed by SOD, catalase, glutathione peroxidase and vitamins A, C, E."],
"cell swelling":["Earliest sign of reversible injury: cells take in water.","Due to failure of the ATP-dependent Na⁺/K⁺ pump. Light microscopy shows pale, enlarged cells with small clear vacuoles (hydropic or vacuolar degeneration). Grossly the organ is pale, swollen and heavier."],
"fatty change":["Accumulation of triglyceride droplets inside cells (steatosis).","Mostly in liver, also heart and kidney. Causes: alcohol, obesity, diabetes, starvation, toxins, hypoxia. Shows as clear vacuoles in routine sections; confirmed with Oil Red O or Sudan stains on frozen sections. Usually reversible."],
"coagulative necrosis":["Necrosis where tissue architecture is preserved for days ('ghost cells').","Proteins and enzymes are denatured, so cells are not digested quickly. Typical of ischaemic infarcts of solid organs (heart, kidney, spleen) — except brain. Microscopy: eosinophilic anucleate cells with preserved outlines."],
"liquefactive necrosis":["Necrosis in which dead tissue is digested into a liquid mass.","Seen in bacterial/fungal abscesses (neutrophil enzymes) and in brain infarcts (lipid-rich, enzyme-rich tissue). The liquid is often creamy yellow pus."],
"caseous necrosis":["Cheese-like necrosis typical of tuberculosis.","Friable white-yellow material; microscopically amorphous granular pink debris surrounded by a granuloma (epithelioid cells, Langhans giant cells, lymphocytes). Cell outlines are completely lost."],
"fat necrosis":["Destruction of fat, typically by pancreatic lipases.","In acute pancreatitis lipases split triglycerides; fatty acids combine with calcium (saponification) forming chalky white areas. Traumatic fat necrosis occurs in breast."],
"fibrinoid necrosis":["Immune-related vessel wall damage that looks like fibrin.","Immune complexes and fibrin leak into arterial walls, giving bright pink amorphous material on H&E. Seen in vasculitis (PAN), malignant hypertension and immune complex diseases."],
"apoptosis":["Programmed, tidy self-destruction of single cells.","Energy-dependent; cells shrink, chromatin condenses, apoptotic bodies form and are eaten without inflammation. Intrinsic (mitochondrial) and extrinsic (death receptor) pathways converge on caspases. Physiological (embryo, menstruation) and pathological (DNA damage, viral hepatitis)."],
"bcl-2":["Main anti-apoptotic protein of the mitochondrial pathway.","Keeps the mitochondrial membrane intact by blocking BAX/BAK pores, preventing cytochrome c release. Overexpressed in follicular lymphoma by t(14;18), allowing B cells to escape death."],
"cytochrome c":["Mitochondrial protein whose release starts intrinsic apoptosis.","In the cytosol it binds APAF-1 forming the apoptosome, which activates caspase-9, then executioner caspases 3, 6, 7."],
"caspases":["Protease enzymes that carry out apoptosis.","Initiators: caspase-8 (extrinsic), caspase-9 (intrinsic). Executioners: caspases 3, 6, 7, which cleave the cytoskeleton and activate DNases. Caspase-1 drives pyroptosis (IL-1β release)."],
"dystrophic calcification":["Calcium deposits in dead or damaged tissue with normal serum calcium.","Examples: atheroma, damaged heart valves, caseous TB, infarcts, psammoma bodies. Begins in membrane-bound vesicles of dying cells. Stains: von Kossa (black), Alizarin red."],
"metastatic calcification":["Calcium deposits in normal tissues because blood calcium is high.","Causes of hypercalcaemia: hyperparathyroidism, bone destruction (myeloma, metastases), vitamin D excess, renal failure, milk-alkali syndrome. Prefers lungs, kidneys, gastric mucosa and arteries (alkaline compartments)."],
"hypoxia":["Lack of oxygen to cells; the commonest cause of cell injury.","Causes: ischaemia (loss of blood supply — worst, as nutrients and waste removal also fail), anaemia, CO poisoning, lung disease. Leads to ATP depletion."],
"vasodilatation":["Widening of arterioles, increasing blood flow.","Mediated by histamine, prostaglandins and nitric oxide. Causes redness (rubor) and heat (calor) in inflammation."],
"permeability":["Leakiness of blood vessels allowing proteins and fluid out.","In inflammation mechanisms include endothelial contraction (histamine; immediate transient), direct injury (burns; sustained), leukocyte injury, transcytosis (VEGF) and leaky new vessels. The result is exudate and swelling."],
"exudate":["Protein-rich, cell-rich fluid that leaks in inflammation.","Specific gravity > 1.020, protein > 3 g/dL, contains cells and fibrin, clots. Contrast with transudate (low protein, from pressure imbalance)."],
"transudate":["Low-protein fluid from pressure imbalance, not inflammation.","Specific gravity < 1.012, protein < 3 g/dL, few cells. Seen in heart failure, nephrotic syndrome, cirrhosis."],
"margination":["White cells moving to the edge of the vessel stream.","As blood slows (stasis), leukocytes leave the central axial stream and line up along the endothelium, preparing to roll and adhere."],
"rolling":["Leukocytes tumbling slowly along the endothelium.","Mediated by weak, transient bonds between selectins (E- and P-selectin on endothelium, L-selectin on leukocytes) and their sugar ligands (sialyl-Lewis X)."],
"selectins":["Adhesion molecules that cause leukocyte rolling.","E-selectin (endothelium, induced by IL-1/TNF), P-selectin (endothelium and platelets, from Weibel-Palade bodies), L-selectin (leukocytes). Defective ligand (fucosylation) = LAD-2."],
"integrins":["Leukocyte adhesion molecules causing firm attachment.","LFA-1 and Mac-1 (β2 integrins) bind ICAM-1; VLA-4 binds VCAM-1. Chemokines switch integrins to a high-affinity state. β2 integrin (CD18) defect = LAD-1."],
"icam-1":["Endothelial ligand for leukocyte integrins (LFA-1).","Expression increases with TNF and IL-1, allowing firm adhesion of leukocytes."],
"pecam-1":["CD31 — the molecule for transmigration between endothelial cells.","Leukocytes squeeze through inter-endothelial junctions (diapedesis), mainly in post-capillary venules, guided by PECAM-1."],
"transmigration":["Leukocytes crossing the vessel wall into tissue (diapedesis).","Occurs in post-capillary venules via PECAM-1; leukocytes then pierce the basement membrane using collagenases."],
"chemotaxis":["Directed movement of leukocytes toward a chemical signal.","Chemoattractants: bacterial N-formyl peptides, C5a, LTB4, chemokines like IL-8. They bind G-protein receptors and drive actin polymerisation at the leading edge."],
"phagocytosis":["Engulfing and killing of microbes by neutrophils and macrophages.","Steps: recognition (via opsonins IgG and C3b, mannose and scavenger receptors), engulfment into a phagosome, fusion with lysosome, and killing — mainly by the H2O2–MPO–halide system producing hypochlorous acid."],
"histamine":["Preformed amine from mast cells causing immediate vasodilatation and leak.","Released by IgE cross-linking, C3a/C5a, trauma, cold. Acts on H1 receptors on endothelium within seconds; short-lived. Basis of antihistamine therapy in allergy."],
"leukotrienes":["Lipoxygenase products of arachidonic acid.","LTB4: powerful chemotaxis of neutrophils. LTC4, D4, E4: bronchospasm, increased permeability (important in asthma). Blocked by montelukast (receptor) and zileuton (5-LOX)."],
"pge2":["Prostaglandin E2 — causes pain, fever and vasodilatation.","Made by COX enzymes; acts in the hypothalamus to raise the set point (fever) and sensitises pain receptors. NSAIDs reduce pain and fever by blocking its synthesis."],
"il-1":["Interleukin-1, a key pro-inflammatory cytokine.","Produced by macrophages; activates endothelium, induces fever (via PGE2), acute phase proteins and leukocytosis. Released by the inflammasome (caspase-1)."],
"tnf":["Tumour necrosis factor — central cytokine of inflammation.","From macrophages, T cells and mast cells. Activates endothelium, causes fever, cachexia, septic shock; maintains granulomas (anti-TNF therapy can reactivate TB)."],
"c5a":["Complement fragment that attracts and activates neutrophils.","Also an anaphylatoxin (with C3a) causing mast cell degranulation. Generated in all complement pathways."],
"bradykinin":["Kinin causing increased permeability and pain.","Produced from kininogen by kallikrein; rapidly destroyed by kininase II (ACE). ACE inhibitors raise bradykinin, causing cough and angioedema."],
"granuloma":["A compact cluster of activated macrophages (epithelioid cells).","Often with giant cells and a rim of lymphocytes; may have central caseation. Forms when the body cannot destroy an agent — TB, leprosy, syphilis, fungi, sarcoidosis, foreign bodies. Driven by TH1 cells and IFN-γ."],
"epithelioid cells":["Activated macrophages that look like epithelial cells.","Abundant pale pink cytoplasm, indistinct cell borders, slipper-shaped nuclei; secrete rather than eat. The essential cell of a granuloma."],
"langhans giant cells":["Multinucleate giant cells with nuclei in a horseshoe at the edge.","Formed by fusion of epithelioid macrophages; typical of TB and sarcoidosis. Foreign body giant cells have scattered nuclei."],
"ghon focus":["The first lung lesion of primary TB.","A 1–1.5 cm subpleural caseous focus in the lower part of the upper lobe or upper part of the lower lobe."],
"ghon complex":["Ghon focus plus caseous hilar lymph node in primary TB.","Usually heals by fibrosis and calcification (Ranke complex); in children or immunocompromised it can progress."],
"first intention":["Healing of a clean wound with edges brought together.","Typical surgical incision: minimal granulation tissue, epithelial bridging in 24–48 h, thin linear scar."],
"second intention":["Healing of a large open wound by filling from below.","Abundant granulation tissue, wound contraction by myofibroblasts, larger scar, longer healing time; seen in infected or gaping wounds, ulcers."],
"myofibroblasts":["Fibroblasts with contractile smooth-muscle features.","Contain α-smooth muscle actin; pull wound edges together during healing by second intention; excessive activity causes contractures."],
"granulation tissue":["Young repair tissue of new capillaries and fibroblasts.","Pink, soft and granular on the wound surface; rich in macrophages and oedema. Matures into a collagen scar. Exuberant growth is called proud flesh."]
};

const QB={};
QB.path1={c:[
[1,"Define cell injury.","Changes in a cell when stress exceeds its ability to adapt; may be reversible or irreversible."],
[1,"Commonest cause of cell injury?","Hypoxia (oxygen deprivation)."],
[1,"Define hypertrophy.","Increase in the size of cells, causing an increase in organ size."],
[1,"Define hyperplasia.","Increase in the number of cells in an organ or tissue."],
[1,"Define atrophy.","Reduction in size of an organ or tissue due to decrease in cell size and number."],
[1,"Define metaplasia.","Reversible replacement of one differentiated adult cell type by another."],
[1,"Define dysplasia.","Disordered growth with loss of uniformity and architectural orientation of cells; pre-neoplastic."],
[1,"Earliest light-microscopic change in reversible injury?","Cell swelling (hydropic change)."],
[1,"Two features of reversible injury?","Cell swelling and fatty change."],
[1,"Define necrosis.","Morphological changes after cell death in living tissue, with membrane rupture and inflammation."],
[1,"Define apoptosis.","Programmed, energy-dependent cell death of single cells without inflammation."],
[1,"Nuclear changes in necrosis?","Pyknosis, karyorrhexis, karyolysis."],
[1,"What is pyknosis?","Nuclear shrinkage with increased basophilia."],
[1,"What is karyorrhexis?","Fragmentation of the pyknotic nucleus."],
[1,"What is karyolysis?","Fading of nuclear basophilia due to DNase activity."],
[1,"Commonest type of necrosis?","Coagulative necrosis."],
[1,"Necrosis typical of brain infarct?","Liquefactive necrosis."],
[1,"Necrosis typical of tuberculosis?","Caseous necrosis."],
[1,"Necrosis typical of acute pancreatitis?","Enzymatic fat necrosis."],
[1,"Define gangrene.","Necrosis with superadded putrefaction."],
[1,"Define pathological calcification.","Abnormal deposition of calcium salts in tissues."],
[1,"Name the two types of pathological calcification.","Dystrophic and metastatic."],
[1,"Wear-and-tear pigment?","Lipofuscin."],
[1,"Example of physiological hypertrophy?","Uterus in pregnancy; skeletal muscle in body-builders."],
[1,"Example of physiological hyperplasia?","Breast at puberty and pregnancy; endometrium in menstrual cycle."],
[1,"Example of squamous metaplasia?","Bronchial epithelium in smokers."],
[1,"Example of columnar metaplasia?","Barrett oesophagus."],
[1,"Fatty liver is also called?","Steatosis."],
[1,"Stain for fat on frozen section?","Oil Red O or Sudan III/IV."],
[1,"Commonest cause of fatty liver?","Alcohol."],
[2,"Point of no return in cell injury?","Inability to reverse mitochondrial dysfunction and profound membrane damage."],
[2,"Why does ATP depletion cause cell swelling?","Na⁺/K⁺-ATPase fails, Na⁺ and water enter the cell."],
[2,"Why does pH fall in hypoxic cells?","Anaerobic glycolysis produces lactic acid."],
[2,"Enzymes activated by raised intracellular Ca²⁺?","Phospholipases, proteases, endonucleases and ATPases."],
[2,"Name three reactive oxygen species.","Superoxide (O2•⁻), hydrogen peroxide (H2O2), hydroxyl radical (•OH)."],
[2,"Fenton reaction?","Fe²⁺ + H2O2 → Fe³⁺ + •OH + OH⁻ (generates hydroxyl radical)."],
[2,"Enzymes removing free radicals?","Superoxide dismutase, catalase, glutathione peroxidase."],
[2,"Antioxidant vitamins?","Vitamins A, C and E."],
[2,"Free radical formed from CCl4?","CCl3• (trichloromethyl radical), via cytochrome P450 in liver."],
[2,"Mechanism of fatty liver in CCl4 poisoning?","Reduced apoprotein synthesis so triglycerides cannot be exported."],
[2,"Why does alcohol cause fatty liver?","Increased FFA esterification to triglycerides, reduced oxidation, increased NADH."],
[2,"Macrovesicular vs microvesicular steatosis — examples?","Macro: alcohol, obesity. Micro: acute fatty liver of pregnancy, Reye's syndrome."],
[2,"Why is fat not seen in routine paraffin sections?","Lipids dissolve in alcohol/xylene during processing; seen as clear vacuoles."],
[2,"Tigered effect (thrush-breast heart)?","Patchy fatty change in myocardium in chronic hypoxia/severe anaemia."],
[2,"Features of coagulative necrosis on microscopy?","Preserved cell outlines (ghost cells), eosinophilic cytoplasm, absent nuclei."],
[2,"Why is brain infarct liquefactive?","Brain is rich in lipids and lysosomal enzymes; little connective tissue."],
[2,"Gross appearance of caseous necrosis?","Friable, white-yellow, cheese-like."],
[2,"Fat saponification?","Released fatty acids combine with calcium → chalky white deposits."],
[2,"Where is fibrinoid necrosis seen?","Vessel walls in vasculitis (PAN), malignant hypertension, immune complex disease."],
[2,"Intrinsic apoptotic pathway key event?","Release of cytochrome c from mitochondria."],
[2,"Extrinsic apoptotic pathway initiator caspase?","Caspase-8."],
[2,"Intrinsic pathway initiator caspase?","Caspase-9."],
[2,"Executioner caspases?","Caspases 3, 6 and 7."],
[2,"Anti-apoptotic proteins?","BCL-2, BCL-XL, MCL-1."],
[2,"Pro-apoptotic effectors?","BAX and BAK."],
[2,"Death receptors?","Fas (CD95) and TNF receptor-1."],
[2,"'Eat me' signal on apoptotic cells?","Phosphatidylserine flipped to the outer membrane leaflet."],
[2,"DNA pattern of apoptosis on gel?","Ladder pattern (internucleosomal cleavage, 180–200 bp fragments)."],
[2,"DNA pattern of necrosis on gel?","Smear pattern."],
[2,"Councilman bodies?","Apoptotic hepatocytes in viral hepatitis."],
[2,"Physiological apoptosis examples?","Embryogenesis, menstrual endometrium, thymic deletion, involution of lactating breast."],
[2,"Line of demarcation in dry gangrene is formed by?","Inflammatory reaction and granulation tissue between dead and living tissue."],
[2,"Why is gangrenous tissue black?","Iron sulphide from haemoglobin breakdown by bacteria."],
[2,"Organism of gas gangrene?","Clostridium perfringens."],
[2,"Sites of metastatic calcification?","Lungs, kidneys, gastric mucosa, systemic arteries, pulmonary veins."],
[2,"Why do these sites get metastatic calcification?","They lose acid and have an alkaline internal compartment."],
[2,"Stains for calcium?","von Kossa (black) and Alizarin red S."],
[3,"What are psammoma bodies and where are they seen?","Laminated concentric calcifications; papillary thyroid ca, serous ovarian tumours, meningioma, mesothelioma."],
[3,"Mitochondrial permeability transition?","Opening of a high-conductance channel in the inner mitochondrial membrane causing loss of membrane potential."],
[3,"Ischaemia–reperfusion injury mechanisms?","Increased ROS, Ca²⁺ overload, inflammation, complement activation."],
[3,"Role of p53 in apoptosis?","Senses DNA damage, induces PUMA/NOXA/BAX → intrinsic apoptosis if damage is irreparable."],
[3,"What are BH3-only proteins?","Sensors (BIM, BID, BAD, PUMA, NOXA) that activate BAX/BAK and block BCL-2."],
[3,"What forms the apoptosome?","Cytochrome c + APAF-1 + procaspase-9."],
[3,"Role of FLIP?","Inhibits caspase-8 activation in the extrinsic pathway."],
[3,"What is necroptosis?","Programmed necrosis via RIPK1, RIPK3 and MLKL; caspase-independent."],
[3,"What is pyroptosis?","Inflammasome/caspase-1-mediated death with IL-1β release."],
[3,"What is ferroptosis?","Iron-dependent cell death from lipid peroxidation."],
[3,"Disease with BCL-2 overexpression?","Follicular lymphoma, t(14;18)."],
[3,"Autophagy?","Self-digestion of cell components via autophagic vacuoles fusing with lysosomes; survival response in starvation."],
[3,"Hallmark ultrastructural sign of irreversible injury?","Amorphous flocculent densities in mitochondria."],
[3,"Myelin figures?","Whorled phospholipid masses from damaged membranes."],
[3,"Sequence of metaplasia → cancer in bronchus?","Squamous metaplasia → dysplasia → carcinoma in situ → squamous cell carcinoma."],
[3,"Cancer arising from Barrett oesophagus?","Adenocarcinoma."],
[3,"Which cells cause metaplasia?","Reprogramming of stem/reserve cells, not transformation of differentiated cells."],
[3,"Vitamin linked to squamous metaplasia?","Vitamin A deficiency."],
[3,"Brown atrophy?","Atrophic organ with lipofuscin (heart, liver in elderly/cachexia)."],
[3,"Mechanism of atrophy?","Reduced protein synthesis + increased degradation via ubiquitin-proteasome pathway and autophagy."],
[3,"Cardiac hypertrophy genes switched on?","Fetal genes like β-myosin heavy chain, ANP."],
[3,"Haemosiderin is detected by?","Perls' Prussian blue stain."],
[3,"Hyaline change — two types?","Intracellular (Mallory bodies, Russell bodies) and extracellular (hyaline arteriolosclerosis, amyloid)."],
[4,"Q (exam): Define cell injury; list causes and mechanisms — key words?","Hypoxia, ATP depletion, mitochondrial damage, Ca²⁺ influx, ROS, membrane and DNA damage; reversible vs irreversible."],
[4,"Q (exam): Apoptosis vs necrosis — 4 key differences?","Single cells vs groups; shrinkage vs swelling; intact vs ruptured membrane; no inflammation vs inflammation."],
[4,"Q (exam): Dystrophic vs metastatic calcification — key difference?","Serum calcium: normal in dystrophic (dead tissue), high in metastatic (normal tissue)."],
[4,"Q (exam): Dry vs wet gangrene — the one-line difference?","Dry: arterial occlusion, clear demarcation, slow; wet: venous + infection, no demarcation, rapid, toxaemia."],
[4,"Q (exam): Metaplasia vs dysplasia — key point?","Metaplasia is adaptive change of cell type; dysplasia is disordered pre-neoplastic growth with atypia."],
[4,"Q (exam): Pathogenesis of fatty liver — 4 mechanisms?","↑ FFA delivery, ↓ FFA oxidation, ↑ esterification, ↓ apoprotein/lipoprotein export."],
[4,"Q (NEET-PG pattern): Most reliable indicator of irreversible injury?","Membrane damage (with mitochondrial dysfunction); morphologically nuclear changes."],
[4,"Q (NEET-PG pattern): Caspase common to both apoptotic pathways?","Caspase-3 (executioner)."],
[4,"Q (NEET-PG pattern): Annexin V binds?","Phosphatidylserine on apoptotic cells."],
[4,"Q (NEET-PG pattern): Russell bodies contain?","Immunoglobulin in plasma cells."]],

FA["p-ida"]={sh:"Iron deficiency anaemia is a microcytic hypochromic anaemia due to depleted body iron. It develops in stages: storage depletion (low ferritin), iron-deficient erythropoiesis (low serum iron, high TIBC, transferrin saturation < 16%) and frank anaemia. Commonest causes in India are nutritional deficiency, hookworm and menstrual or GI blood loss. Smear shows microcytic hypochromic cells and pencil cells; ferritin is the best single test.",
m:[["Etiology",["Increased loss: hookworm, menorrhagia, GI bleeding (peptic ulcer, piles, cancer)","Increased demand: pregnancy, infancy, adolescence","Decreased intake: vegetarian diet poor in haem iron","Malabsorption: celiac disease, gastrectomy, achlorhydria"]],
["Clinical features",["Fatigue, pallor, breathlessness, palpitations","Koilonychia, angular cheilitis, glossitis, pica","Plummer-Vinson syndrome: dysphagia with oesophageal webs"]],
["Lab diagnosis",["Hb ↓, MCV < 80 fL, MCH ↓, MCHC ↓, RDW ↑","Smear: microcytic hypochromic RBCs, anisopoikilocytosis, pencil cells","Serum ferritin ↓ (< 15 µg/L), serum iron ↓, TIBC ↑, transferrin saturation ↓","Bone marrow: absent stainable iron (Perls stain)","Find the cause: stool for occult blood and ova"]]],
li:"Iron deficiency is the commonest cause of anaemia worldwide and in India, particularly in women and children.",
lc:"Iron deficiency anaemia develops in predictable stages; serum ferritin identifies it early and the underlying cause must always be sought.",r:R_PATH+" — Anaemias",
rq:[["D","Iron deficiency anaemia vs β-thalassaemia trait.","IDA: ferritin ↓, TIBC ↑, RDW ↑, Mentzer index > 13, HbA2 normal/low. Thal trait: ferritin normal, RBC count high, RDW normal, Mentzer < 13, HbA2 > 3.5%."],
["V","Best single test for iron deficiency?","Serum ferritin."],
["S","Plummer-Vinson syndrome.","Triad of iron deficiency anaemia, dysphagia due to oesophageal webs and glossitis; premalignant for post-cricoid carcinoma; mostly middle-aged women."],
["S","Response to oral iron therapy.","Reticulocytosis in 5–10 days, Hb rises ~1 g/dL per week; continue 3–6 months after Hb normalises to refill stores."]]};
FA["p-b12"]={sh:"Megaloblastic anaemia results from impaired DNA synthesis due to vitamin B12 or folate deficiency, causing nuclear–cytoplasmic asynchrony. B12 needs intrinsic factor and the terminal ileum for absorption; causes include pernicious anaemia, gastrectomy, ileal disease, fish tapeworm and vegan diet. Blood shows macro-ovalocytes, hypersegmented neutrophils and pancytopenia; marrow shows megaloblasts. B12 (not folate) deficiency causes subacute combined degeneration of the cord.",
m:[["Pathogenesis",["B12 is a cofactor converting methyl-THF to THF (methionine synthase) and methylmalonyl-CoA to succinyl-CoA","Without it, folate is trapped → ↓ thymidine → impaired DNA synthesis","Nuclear maturation lags behind cytoplasm → large cells (megaloblasts)","Ineffective erythropoiesis → intramedullary haemolysis (↑ LDH, ↑ indirect bilirubin)","↑ Methylmalonic acid → myelin damage (B12 only)"]],
["Blood & marrow",["MCV > 100 fL, macro-ovalocytes, anisopoikilocytosis","Hypersegmented neutrophils (earliest sign)","Pancytopenia","Marrow: hypercellular, megaloblasts, giant metamyelocytes"]],
["Diagnosis",["Serum B12 and red-cell folate","Raised homocysteine (both) and methylmalonic acid (B12)","Anti-intrinsic factor and anti-parietal cell antibodies (pernicious anaemia)"]]],
li:"Megaloblastic anaemias are macrocytic anaemias caused by defective DNA synthesis, most often due to deficiency of vitamin B12 or folic acid.",
lc:"Recognising B12 deficiency is important because its neurological damage may become permanent and giving folate alone can worsen it.",r:R_PATH+" — Megaloblastic anaemias",
rq:[["D","B12 vs folate deficiency.","Both: megaloblastic anaemia, ↑ homocysteine. B12 only: neurological signs (SACD), ↑ methylmalonic acid, stores last years. Folate: no neuro signs, stores last months, common in pregnancy, alcohol."],
["V","Earliest peripheral smear sign of megaloblastic anaemia?","Hypersegmented neutrophils (≥ 5% with 5 lobes or any with 6)."],
["S","Pernicious anaemia.","Autoimmune atrophic gastritis of body/fundus with loss of parietal cells and intrinsic factor; anti-IF and anti-parietal antibodies; B12 deficiency; risk of gastric carcinoma."],
["S","Why should folate not be given alone in B12 deficiency?","It may correct the anaemia but allow neurological damage (SACD) to progress."]]};
FA["p-dic"]={sh:"Disseminated intravascular coagulation is an acquired thrombohaemorrhagic disorder in which widespread activation of coagulation forms microthrombi and consumes platelets and clotting factors, with secondary fibrinolysis causing bleeding. Triggers: obstetric complications, sepsis, APL, trauma, burns, snake bite, malignancy. Labs: ↓ platelets, ↑ PT, ↑ aPTT, ↓ fibrinogen, ↑ D-dimer, schistocytes.",
m:[["Causes",["Release of tissue factor: abruptio placentae, retained dead fetus, amniotic fluid embolism, APL, mucin-secreting adenocarcinoma, trauma, burns","Endothelial injury: Gram-negative sepsis, meningococcaemia, heat stroke, snake bite, immune complexes"]],
["Pathogenesis",["Excess thrombin → microthrombi → ischaemic organ damage","Consumption of platelets, fibrinogen, factors V, VIII → bleeding","Plasmin activation → FDPs/D-dimer with anticoagulant action","RBCs sheared → microangiopathic haemolytic anaemia"]],
["Lab findings",["Thrombocytopenia","Prolonged PT, aPTT, thrombin time","Low fibrinogen","Raised D-dimer and FDP","Schistocytes on smear"]]],
li:"DIC is not a disease in itself but a complication of many serious conditions.",
lc:"DIC combines thrombosis and bleeding; treatment targets the trigger plus replacement of platelets and factors.",r:R_PATH+" — Bleeding disorders",
rq:[["V","Most useful test for DIC?","D-dimer along with platelets, PT, aPTT and fibrinogen."],
["S","Causes of DIC in obstetrics.","Abruptio placentae, amniotic fluid embolism, retained dead fetus, septic abortion, eclampsia."],
["D","DIC vs TTP.","Both: thrombocytopenia, schistocytes. DIC: ↑ PT/aPTT, ↓ fibrinogen, ↑ D-dimer. TTP: normal PT/aPTT, ADAMTS13 deficiency, neurological and renal involvement."],
["S","Morphology of DIC.","Microthrombi in kidneys (cortical necrosis), brain, lungs, adrenals (Waterhouse-Friderichsen), placenta; haemorrhages in skin and serosa."]]};
FA["p-mi"]={sh:"Myocardial infarction is death of cardiac muscle from prolonged ischaemia, usually due to thrombosis on a disrupted atherosclerotic plaque. Irreversible injury begins after 20–40 minutes, starting subendocardially. Morphology evolves: coagulative necrosis (4–12 h), neutrophils (1–3 d), macrophages and softening (3–7 d), granulation tissue (1–2 wk), scar (2–8 wk). Markers: troponin I/T (most specific), CK-MB. Complications: arrhythmia, failure, rupture, aneurysm, thrombus, Dressler syndrome.",
m:[["Pathogenesis",["Atherosclerotic plaque disruption → platelet aggregation → occlusive thrombus","Ischaemia → ATP loss → contractility stops in 60 s","Irreversible damage after 20–40 min; wavefront from subendocardium outward","Reperfusion (PCI, thrombolysis) salvages myocardium but can cause reperfusion injury"]],
["Morphology by time",[["Time","Gross","Microscopy"],["0–12 h","None","Wavy fibres, early coagulative necrosis"],["12–24 h","Dark mottling","Contraction bands, early neutrophils"],["1–3 d","Mottled yellow-tan","Neutrophils, coagulative necrosis"],["3–7 d","Yellow, soft","Macrophages remove dead cells (rupture risk)"],["1–2 wk","Red-grey margins","Granulation tissue"],["2–8 wk","Grey-white scar","Collagen"]]],
["Cardiac markers",["Troponin I/T: rise 3–4 h, peak 24–48 h, stay 7–10 days (most specific)","CK-MB: rise 3–4 h, peak 24 h, normal by 48–72 h (re-infarction)","Myoglobin: earliest but non-specific"]]],
li:"Ischaemic heart disease is the leading cause of death worldwide; acute MI is its most important form.",
lc:"The timeline of morphological change explains both the diagnosis and the complications of MI.",r:R_PATH+" — Heart",
rq:[["V","Most specific marker of MI?","Cardiac troponin I/T."],
["S","Complications of MI.","Arrhythmias, LV failure, cardiogenic shock, myocardial rupture (3–7 d), papillary muscle rupture, mural thrombus and embolism, ventricular aneurysm, pericarditis, Dressler syndrome."],
["V","When is the infarct most likely to rupture?","3–7 days, when macrophages remove necrotic tissue and the wall is softest."],
["L","Define atherosclerosis; describe its etiopathogenesis and complications.","Response-to-injury hypothesis: endothelial injury, lipid accumulation and oxidation, monocyte entry, foam cells, platelets, smooth muscle proliferation; complications rupture, thrombosis, aneurysm, embolism."]]};
FA["p-rhd"]={sh:"Rheumatic fever is an acute immune-mediated multisystem disease occurring 2–3 weeks after group A streptococcal pharyngitis, due to cross-reactivity of anti-M protein antibodies and T cells with host tissues (molecular mimicry). Acute carditis shows Aschoff bodies with Anitschkow cells and verrucous vegetations; chronic RHD causes valvular fibrosis, most often mitral stenosis (fish-mouth valve). Diagnosis by Jones criteria.",
m:[["Pathogenesis",["Group A β-haemolytic streptococcal pharyngitis","Antibodies and CD4 T cells against M protein cross-react with cardiac myosin and valve glycoproteins","Genetic susceptibility","Recurrent infections → progressive valve damage"]],
["Acute rheumatic carditis (pancarditis)",["Myocardium: Aschoff bodies (fibrinoid necrosis, lymphocytes, Anitschkow caterpillar cells, Aschoff giant cells)","Endocardium: small warty vegetations along lines of closure; MacCallum plaques in left atrium","Pericardium: fibrinous 'bread-and-butter' pericarditis"]],
["Chronic RHD",["Mitral (commonest) > aortic valve","Leaflet thickening, commissural fusion, chordae shortening → fish-mouth/button-hole stenosis","Complications: AF, left atrial thrombi, embolism, CHF, infective endocarditis"]],
["Jones criteria (major)",["Carditis, migratory polyarthritis, Sydenham chorea, erythema marginatum, subcutaneous nodules (with evidence of preceding streptococcal infection)"]]],
li:"Rheumatic heart disease remains a major cause of acquired heart disease in young Indians.",
lc:"RHD is preventable: prompt treatment of strep throat and penicillin prophylaxis after an attack stop recurrences.",r:R_PATH+" — Heart",
rq:[["V","Pathognomonic lesion of rheumatic carditis?","Aschoff body."],
["S","Jones criteria.","Major: carditis, polyarthritis, chorea, erythema marginatum, subcutaneous nodules. Minor: fever, arthralgia, raised ESR/CRP, prolonged PR interval. Plus evidence of strep infection (ASO, throat culture)."],
["S","Morphology of chronic RHD of mitral valve.","Thick fibrotic leaflets, fused commissures, short thick fused chordae, calcification → fish-mouth stenosis; dilated left atrium with thrombi."],
["D","Vegetations in rheumatic fever vs infective endocarditis.","RF: small, warty, firm, along lines of closure, non-destructive. IE: large, friable, bulky, destructive, contain organisms, embolise."]]};
FA["p-cirrhosis"]={sh:"Cirrhosis is a diffuse process of hepatic fibrosis with conversion of normal architecture into structurally abnormal regenerative nodules. Causes: alcohol, chronic HBV/HCV, NAFLD, biliary disease, haemochromatosis, Wilson disease. Activated stellate cells lay down collagen. Classified as micronodular (< 3 mm) or macronodular (> 3 mm). Complications: portal hypertension (varices, ascites, splenomegaly), liver failure, hepatic encephalopathy, hepatocellular carcinoma.",
m:[["Pathogenesis",["Chronic hepatocyte injury and death","Kupffer cells and inflammatory cells release TGF-β, PDGF, TNF","Activated stellate (Ito) cells become myofibroblasts → collagen I and III in space of Disse","Capillarisation of sinusoids impairs exchange","Bridging fibrous septa + regenerative nodules; vascular shunts"]],
["Classification",["Morphological: micronodular (alcohol), macronodular (post-viral), mixed","Etiological: alcoholic, post-hepatitic, biliary, metabolic (Wilson, haemochromatosis, α1-AT), cryptogenic"]],
["Portal hypertension consequences",["Oesophageal varices (haematemesis)","Ascites","Congestive splenomegaly, hypersplenism","Caput medusae, haemorrhoids","Hepatic encephalopathy (portosystemic shunting)"]],
["Lab diagnosis",["LFT: ↓ albumin, ↑ bilirubin, ↑ PT/INR, AST/ALT variable","Thrombocytopenia","Imaging (USG, elastography), liver biopsy (gold standard)","Etiology tests: HBsAg, anti-HCV, ceruloplasmin, ferritin"]]],
li:"Cirrhosis is the end stage of many chronic liver diseases and among the top causes of death worldwide.",
lc:"Cirrhosis results from fibrosis and regeneration; its complications stem from portal hypertension and failing liver function.",r:R_PATH+" — Liver",
rq:[["V","Main cell producing collagen in cirrhosis?","Hepatic stellate (Ito) cell."],
["S","Causes of portal hypertension.","Prehepatic: portal vein thrombosis. Intrahepatic: cirrhosis (commonest), schistosomiasis, non-cirrhotic portal fibrosis. Post-hepatic: Budd-Chiari, constrictive pericarditis, right heart failure."],
["D","Micronodular vs macronodular cirrhosis.","Micro: nodules < 3 mm, uniform, alcohol, early. Macro: > 3 mm, variable, post-viral; alcoholic cirrhosis may become macronodular later."],
["S","Mallory-Denk bodies.","Eosinophilic intracytoplasmic aggregates of damaged keratin filaments in hepatocytes; alcoholic hepatitis, NASH, Wilson disease."]]};
FA["p-nephrotic"]={sh:"Nephrotic syndrome is massive proteinuria (> 3.5 g/day in adults), hypoalbuminaemia (< 3 g/dL), generalised oedema, hyperlipidaemia and lipiduria due to increased glomerular permeability. Primary causes: minimal change disease (commonest in children), membranous nephropathy, FSGS, MPGN. Secondary: diabetes, amyloidosis, SLE. Complications: infections, thrombosis (renal vein), protein malnutrition.",
m:[["Pathophysiology",["Injury to podocytes/GBM → loss of size and charge barrier → proteinuria","Hypoalbuminaemia → ↓ oncotic pressure → oedema; RAAS activation → Na⁺ retention","Hepatic lipoprotein synthesis ↑ → hyperlipidaemia; lipiduria (oval fat bodies)","Loss of antithrombin III and immunoglobulins → thrombosis, infections"]],
["Causes",[["Category","Examples"],["Children","Minimal change disease (85%)"],["Adults primary","Membranous nephropathy, FSGS, MPGN"],["Secondary","Diabetic nephropathy, amyloidosis, SLE, HBV/HCV, HIV, drugs (NSAIDs, gold)"]]],
["Minimal change disease",["Normal glomeruli on light microscopy","Effacement of podocyte foot processes on EM","Selective proteinuria; excellent steroid response"]]],
li:"Nephrotic syndrome is a clinical complex caused by glomerular diseases that increase permeability to plasma proteins.",
lc:"Nephrotic syndrome is defined by heavy proteinuria; its consequences follow from loss of albumin and other plasma proteins.",r:R_PATH+" — Kidney",
rq:[["D","Nephritic vs nephrotic syndrome.","Nephritic: haematuria with RBC casts, hypertension, oliguria, mild proteinuria (< 3.5 g), azotaemia. Nephrotic: proteinuria > 3.5 g, hypoalbuminaemia, oedema, hyperlipidaemia, lipiduria."],
["V","Commonest cause of nephrotic syndrome in children?","Minimal change disease."],
["S","Membranous nephropathy.","Commonest primary cause in adults; anti-PLA2R antibodies; subepithelial deposits with 'spikes' on silver stain; granular IgG and C3; may be secondary to SLE, HBV, drugs, tumours."],
["V","Why does thrombosis occur in nephrotic syndrome?","Urinary loss of antithrombin III, increased fibrinogen and haemoconcentration."]]};
FA["p-dm"]={ans:"path16:4",rq:[

["S","Morphology of diabetic nephropathy.","GBM thickening, diffuse mesangial sclerosis, nodular glomerulosclerosis (Kimmelstiel-Wilson), hyaline arteriolosclerosis of afferent and efferent arterioles, pyelonephritis, papillary necrosis."],

m:[["Classification",["Type 1 (5–10%): autoimmune (anti-GAD, anti-islet), HLA-DR3/DR4","Type 2 (90%): insulin resistance + β-cell failure, obesity","Other: MODY, pancreatic disease, endocrinopathies (Cushing, acromegaly), drugs (steroids)","Gestational diabetes"]],
["Pathogenesis of complications",["Advanced glycation end-products crosslink proteins, activate RAGE → inflammation","Polyol pathway: aldose reductase → sorbitol → osmotic injury (nerves, lens), ↓ NADPH","Protein kinase C activation → VEGF, TGF-β, PAI-1","Oxidative stress, hexosamine pathway"]],
["Morphology",["Pancreas: insulitis (T1), amyloid in islets (T2)","Vessels: accelerated atherosclerosis, hyaline arteriolosclerosis","Kidney: GBM thickening, Kimmelstiel-Wilson nodules, papillary necrosis","Eye: retinopathy (non-proliferative → proliferative), cataract","Nerves: symmetric sensory polyneuropathy, autonomic neuropathy"]],
["Clinical features & complications",["Polyuria, polydipsia, polyphagia, weight loss (T1)","Acute: DKA (T1), hyperosmolar hyperglycaemic state (T2), hypoglycaemia","Chronic: MI (commonest cause of death), stroke, renal failure, blindness, foot ulcers, infections"]]],
li:"Diabetes affects over 100 million Indians; its burden lies mainly in long-term vascular complications.",
lc:"Diabetes is a disease of glucose but its damage is vascular; glycaemic control reduces microvascular complications.",r:R_PATH+" — Endocrine pancreas",
rq:[["S","Pathogenesis of type 2 diabetes.","Insulin resistance (obesity, visceral fat, FFAs, adipokines, inflammation) plus β-cell dysfunction (glucotoxicity, lipotoxicity, islet amyloid); strong genetic predisposition."],
["S","Morphology of diabetic nephropathy.","GBM thickening, diffuse mesangial sclerosis, nodular glomerulosclerosis (Kimmelstiel-Wilson), hyaline arteriolosclerosis of afferent and efferent arterioles, pyelonephritis, papillary necrosis."],
["V","Diagnostic criteria of diabetes?","FPG ≥ 126 mg/dL, 2-h OGTT ≥ 200 mg/dL, HbA1c ≥ 6.5%, or random ≥ 200 mg/dL with symptoms."],
["D","Type 1 vs type 2 diabetes.","T1: autoimmune, young, lean, absolute insulin deficiency, ketosis-prone. T2: insulin resistance + β-cell dysfunction, older, obese, relative deficiency, HHS, strong genetics."]]};

FA["m-pathogenesis"]={sh:"Bacterial pathogenesis is the process by which bacteria cause disease: transmission and entry, adhesion (pili, adhesins), colonisation and multiplication (siderophores), invasion (enzymes), evasion of host defences (capsule, IgA protease, protein A, antigenic variation, intracellular survival) and tissue damage by exotoxins, endotoxin and the host immune response. Outcome depends on infective dose, virulence and host immunity.",
m:[["Virulence factors",["Adhesins: pili/fimbriae (E. coli, gonococcus), lipoteichoic acid (Strep)","Capsule: anti-phagocytic (pneumococcus, Klebsiella, Hib, meningococcus)","Enzymes: hyaluronidase, collagenase, coagulase, streptokinase, lecithinase","IgA protease: Neisseria, H. influenzae, pneumococcus","Toxins: exotoxins and endotoxin","Intracellular survival: M. tuberculosis, Salmonella, Listeria","Antigenic variation: gonococcal pili"]],
["Exotoxin vs endotoxin",[["Feature","Exotoxin","Endotoxin"],["Source","Gram + and Gram −, secreted","Gram − outer membrane (LPS)"],["Nature","Protein","Lipopolysaccharide (lipid A)"],["Heat","Labile (mostly)","Stable"],["Toxoid","Yes","No"],["Action","Specific (neurotoxin, enterotoxin)","Fever, shock, DIC"],["Example","Diphtheria, tetanus, cholera","E. coli, Salmonella, meningococcus"]]]],
li:"Pathogenicity is the ability to cause disease; virulence is its degree, determined by bacterial factors and host defences.",
lc:"Understanding virulence factors explains disease patterns and is the basis of vaccines (toxoids, capsular vaccines).",r:R_MICRO+" — Bacterial pathogenicity",
rq:[["D","Exotoxin vs endotoxin.","Exotoxin: protein, secreted, heat-labile, highly antigenic, toxoid possible, specific action. Endotoxin: LPS of Gram-negative wall, heat-stable, weakly antigenic, no toxoid, non-specific (fever, shock)."],
["V","Toxins produced by lysogenic conversion?","Diphtheria toxin, cholera toxin, botulinum toxins C and D, streptococcal erythrogenic toxin, Shiga-like toxin."],
["S","Superantigens.","Toxins (TSST-1, staph enterotoxins, SPE) that bind MHC-II and TCR Vβ outside the groove, activating up to 20% of T cells → cytokine storm, toxic shock."],
["V","Koch's postulates — one limitation.","Some organisms cannot be cultured (M. leprae, T. pallidum); asymptomatic carriers exist."]]};

FA["m-hbv"]={sh:"Hepatitis B virus is a partially double-stranded DNA hepadnavirus (Dane particle, 42 nm) spread by blood, sexual and perinatal routes. Markers: HBsAg (first, current infection), HBeAg and HBV DNA (replication, infectivity), IgM anti-HBc (acute and window period), IgG anti-HBc (past/chronic), anti-HBs (immunity; alone after vaccination). Chronic infection (HBsAg > 6 months) risks cirrhosis and HCC; prevention is by vaccination and HBIG.",
m:[["Virus & transmission",["Hepadnavirus; Dane particle with HBsAg envelope, HBcAg core, partially dsDNA, DNA polymerase with reverse transcriptase activity","Spread: blood/needles, sexual, perinatal (90% of infected neonates become chronic)"]],
["Serological markers",[["Marker","Meaning"],["HBsAg","Current infection (acute or chronic)"],["HBeAg","High replication, infectivity"],["IgM anti-HBc","Acute infection; only marker in window period"],["IgG anti-HBc","Past or chronic infection"],["Anti-HBs","Immunity (recovery or vaccination)"],["HBV DNA","Viral load, replication"]]],
["Outcomes",["Acute hepatitis → recovery (most adults)","Fulminant hepatitis (< 1%)","Chronic carrier → chronic hepatitis → cirrhosis → hepatocellular carcinoma"]],
["Prevention",["Recombinant HBsAg vaccine: birth dose + 6, 10, 14 weeks (pentavalent)","HBIG + vaccine for newborns of HBsAg-positive mothers and after needle-stick"]]],
li:"Hepatitis B is a major cause of chronic liver disease and liver cancer in India.",
lc:"Reading the serological pattern tells whether infection is acute, chronic, resolved or vaccine-induced.",r:R_MICRO+" — Hepatitis viruses",
rq:[["V","Only marker positive in the window period?","IgM anti-HBc."],
["D","Hepatitis A vs hepatitis B.","HAV: RNA picornavirus, faeco-oral, short incubation (2–6 wk), no chronicity or carrier state. HBV: DNA hepadnavirus, parenteral/sexual/perinatal, long incubation (1–6 months), chronicity, cirrhosis, HCC."],
["S","Interpret: HBsAg −, anti-HBc +, anti-HBs +.","Recovered from past HBV infection with natural immunity."],
["V","Marker of high infectivity?","HBeAg (and high HBV DNA)."]]};
FA["m-cholera"]={sh:"Cholera is an acute diarrhoeal disease caused by toxigenic Vibrio cholerae O1/O139, acquired from contaminated water. The organism is acid-sensitive (high infective dose), penetrates mucus by darting motility and mucinase, adheres via toxin co-regulated pilus and secretes cholera toxin. The B subunit binds GM1; the A subunit ADP-ribosylates Gs, raising cAMP, causing chloride secretion and copious rice-water stools. Treatment is rehydration (ORS, Ringer lactate).",
m:[["Organism",["Gram-negative comma-shaped, darting motility, oxidase positive","Serogroups O1 (classical, El Tor) and O139","Transport: VR medium, Cary-Blair; enrichment: alkaline peptone water; selective: TCBS (yellow colonies)"]],
["Pathogenesis",["Ingestion of 10⁸ organisms (fewer with achlorhydria)","Mucinase and motility help reach the epithelium","TCP-mediated adhesion; no invasion","Cholera toxin (1A + 5B) → GM1 binding → ADP-ribosylation of Gs → adenylate cyclase on → ↑ cAMP","CFTR chloride secretion, ↓ NaCl absorption → isotonic fluid loss"]],
["Lab diagnosis",["Stool: hanging drop (darting motility, inhibited by specific antiserum)","Culture on TCBS; biochemical tests; slide agglutination","Rapid antigen tests"]]],
li:"Cholera is the prototype of toxin-mediated secretory diarrhoea and remains endemic in parts of India.",
lc:"Because glucose-coupled Na⁺ absorption remains intact, oral rehydration therapy saves most lives.",r:R_MICRO+" — Vibrio",
rq:[["D","Classical vs El Tor vibrios.","El Tor: haemolytic, VP positive, agglutinates chick RBCs, polymyxin B resistant, resistant to Mukerjee group IV phage. Classical: the opposite."],
["V","Selective medium for V. cholerae?","TCBS agar (yellow sucrose-fermenting colonies)."],
["S","Why does ORS work in cholera?","Na⁺–glucose co-transport (SGLT1) is not affected by cholera toxin, so glucose carries sodium and water back into the cells."],
["V","Receptor for cholera toxin?","GM1 ganglioside."]]};
FA["m-rabies"]={sh:"Rabies is a fatal viral encephalitis caused by a bullet-shaped rhabdovirus transmitted mainly by dog bites. The virus multiplies in muscle at the wound, enters peripheral nerves via acetylcholine receptors and travels by retrograde axonal transport to the CNS, then centrifugally to salivary glands. Negri bodies are diagnostic. Clinical rabies (hydrophobia) is almost always fatal, so prevention by wound washing, vaccine and rabies immunoglobulin per WHO category is crucial.",
m:[["Virus",["Rhabdovirus, Lyssavirus; bullet-shaped, enveloped, ssRNA; glycoprotein G spikes","Street virus (wild) vs fixed virus (adapted, used for vaccines)"]],
["Pathogenesis",["Bite → local replication in muscle (incubation 1–3 months; shorter for head/face)","Binds nicotinic ACh receptors → enters nerves → retrograde transport to CNS","Encephalitis: brainstem, hippocampus, cerebellum; Negri bodies","Spread to salivary glands, skin, cornea"]],
["Lab diagnosis",["Antemortem: corneal impression smear and nuchal skin biopsy (DFA), saliva RT-PCR, antibodies in CSF","Postmortem: Negri bodies (Seller's stain), FAT on brain (gold standard)"]],
["Post-exposure prophylaxis",["Wash wound with soap and running water for 15 min; antiseptic","Cell-culture vaccine: IM Essen (0, 3, 7, 14, 28) or ID Thai Red Cross (0, 3, 7, 28)","RIG infiltrated into the wound for category III","Do not suture immediately"]]],
li:"India accounts for about a third of global rabies deaths, almost all from dog bites.",
lc:"Rabies is 100% preventable but almost 100% fatal once symptoms appear.",r:R_MICRO+" — Rabies virus",
rq:[["V","Shape of rabies virus?","Bullet-shaped."],
["S","Negri bodies.","Eosinophilic, round cytoplasmic inclusions with basophilic inner granules in neurons of hippocampus (Ammon's horn) and Purkinje cells; stained with Seller's stain."],
["S","WHO categories of animal exposure.","I: touching, licks on intact skin — no PEP. II: nibbling, minor scratches without bleeding — wound care + vaccine. III: bites/scratches with bleeding, licks on broken skin or mucosa — wound care + vaccine + RIG."],
["V","Gold standard postmortem test?","Direct fluorescent antibody test on brain tissue."]]};
FA["m-typhoid"]={sh:"Enteric fever is a systemic infection by Salmonella Typhi/Paratyphi acquired from contaminated food or water. Bacilli invade M cells of Peyer's patches, multiply in macrophages of the reticuloendothelial system, cause primary and secondary bacteraemia, seed the gall bladder and re-infect Peyer's patches, causing longitudinal ulcers that may perforate in the third week. Diagnosis by week: blood culture (1st), Widal (2nd), stool (3rd), urine (4th); bone marrow culture is most sensitive.",
m:[["Organism",["Gram-negative motile bacillus, non-lactose fermenter, H2S positive","Antigens: O (somatic), H (flagellar), Vi (capsular)"]],
["Pathogenesis",["Ingestion → survives stomach acid → invades M cells → mesenteric nodes","Primary bacteraemia → liver, spleen, marrow (incubation 7–14 days)","Secondary bacteraemia → fever, rose spots, splenomegaly","Gall bladder seeding → re-infection of Peyer's patches → ulceration","Carrier state: gall bladder (especially with gallstones)"]],
["Lab diagnosis",["Blood culture in first week (most useful)","Bone marrow culture: most sensitive, even after antibiotics","Widal: rising titre of O and H antibodies from second week","Stool and urine culture later; carriers by stool/bile culture, Vi antibodies"]]],
li:"Typhoid remains common in India, increasingly with fluoroquinolone resistance.",
lc:"The systemic and intracellular nature of typhoid explains its clinical course and the sequence of diagnostic tests.",r:R_MICRO+" — Salmonella",
rq:[["S","Widal test.","Tube agglutination detecting antibodies to O and H antigens of S. Typhi and Paratyphi; significant if rising titre in paired sera or O ≥ 1:160 in endemic areas; false positives from vaccination, past infection, anamnestic reaction."],
["V","Most sensitive specimen in enteric fever?","Bone marrow culture."],
["D","Typhoid ulcer vs tubercular ulcer of intestine.","Typhoid: longitudinal, over Peyer's patches, may perforate, no fibrosis/stricture. TB: transverse (girdle), undermined edges, heals with fibrosis and stricture."],
["S","Typhoid carrier.","Person excreting bacilli for > 1 year after infection, usually from gall bladder; source of outbreaks (Typhoid Mary); detected by stool/bile culture, Vi antibodies; treated with prolonged antibiotics or cholecystectomy."]]};
FA["m-immune"]={sh:"On first exposure, antigen is captured by dendritic cells and presented on MHC-II to CD4 helper T cells (and on MHC-I to CD8 cells). Helper T cells activate B cells, which become plasma cells secreting first IgM then IgG after class switching. Memory B and T cells persist. A second exposure produces a faster, larger, longer-lasting, higher-affinity IgG response (secondary or anamnestic response), the basis of booster doses.",
m:[["Primary vs secondary response",[["Feature","Primary","Secondary"],["Lag period","Long (1–2 weeks)","Short (2–3 days)"],["Main antibody","IgM","IgG"],["Titre","Low","High"],["Duration","Short","Long"],["Affinity","Low","High (affinity maturation)"],["Cells responding","Naive B cells","Memory B cells"]]],
["Steps",["Antigen capture and processing by APCs","Presentation with MHC-II (extracellular antigens) or MHC-I (intracellular)","T-cell activation with co-stimulation (B7–CD28)","TH1 (IFN-γ: cell-mediated), TH2 (IL-4, IL-5: humoral), TH17 (IL-17)","B-cell activation, germinal centre, class switching, plasma cells","Memory cells"]]],
li:"Adaptive immunity is specific and has memory; its two arms are humoral (B cells) and cell-mediated (T cells).",
lc:"Memory cells are why vaccines and booster doses protect.",r:R_MICRO+" — Immune response",
rq:[["D","Primary vs secondary immune response.","See table: lag, antibody class, titre, duration, affinity."],
["D","T cells vs B cells.","T: thymus, TCR, recognise processed peptide with MHC, cell-mediated immunity, CD3. B: bone marrow, BCR (surface Ig), recognise native antigen, humoral immunity, CD19/20, become plasma cells."],
["V","Which antibody appears first in a primary response?","IgM."],
["S","Monoclonal antibodies.","Antibodies from a single clone produced by hybridoma technology (B cell + myeloma, HAT selection; Köhler & Milstein). Uses: diagnostics (ELISA, IHC, flow cytometry), therapy (rituximab, trastuzumab, infliximab)."]]};
FA["m-dengue"]={sh:"Dengue is an arboviral disease caused by dengue virus serotypes 1–4 (Flavivirus) transmitted by Aedes aegypti. It has febrile, critical and recovery phases. Severe dengue (plasma leakage, shock, bleeding, organ damage) is more common in secondary infection with a different serotype due to antibody-dependent enhancement. Diagnosis: NS1 antigen or RT-PCR in the first 5 days; IgM ELISA after day 5. Management is supportive with careful fluids; avoid NSAIDs.",
m:[["Virus & vector",["Flavivirus, ssRNA, four serotypes (DENV 1–4)","Aedes aegypti: day-biting, breeds in clean stored water, urban"]],
["Pathogenesis of severe dengue",["Secondary infection with a different serotype","Non-neutralising antibodies enhance viral entry into Fc-receptor cells (ADE)","Cytokine storm, complement activation, NS1-mediated endothelial dysfunction","Plasma leakage (rising haematocrit), thrombocytopenia, coagulopathy"]],
["WHO classification",["Dengue without warning signs","Dengue with warning signs: abdominal pain, persistent vomiting, fluid accumulation, mucosal bleed, lethargy, liver > 2 cm, rising HCT with falling platelets","Severe dengue: shock, severe bleeding, severe organ involvement"]],
["Lab diagnosis",["NS1 antigen ELISA / rapid test (days 1–5)","RT-PCR (early)","IgM capture ELISA (after day 5); IgG high in secondary infection","CBC: leukopenia, thrombocytopenia, rising haematocrit"]]],
li:"Dengue is the fastest-spreading mosquito-borne viral disease and is endemic throughout India.",
lc:"Recognising warning signs during the critical phase and giving judicious fluids prevents dengue deaths.",r:R_MICRO+" — Arboviruses",
rq:[["V","Test of choice on day 2 of fever?","NS1 antigen."],
["S","Antibody-dependent enhancement.","Pre-existing non-neutralising antibodies from a previous serotype bind the new virus and help it enter monocytes via Fc receptors, increasing viral load and severity."],
["S","Arboviruses of public health importance in India.","Dengue, chikungunya (Aedes), Japanese encephalitis (Culex), Kyasanur Forest disease (ticks), Zika (Aedes), West Nile."],
["V","Why avoid NSAIDs in dengue?","They worsen bleeding and platelet dysfunction; use paracetamol."]]};

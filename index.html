core:["Benzodiazepines ↑ frequency of GABA-A Cl⁻ channel opening (barbiturates ↑ duration; at high doses act directly). BZDs: wider safety margin, less enzyme induction, less dependence, specific antagonist (flumazenil). Uses: anxiety, insomnia, status epilepticus, alcohol withdrawal, pre-anaesthesia.","Antiepileptics: GTCS (valproate, phenytoin, carbamazepine), absence (ethosuximide, valproate), myoclonic (valproate), partial (carbamazepine, oxcarbazepine), infantile spasms (ACTH, vigabatrin). Phenytoin: gum hypertrophy, hirsutism, zero-order kinetics, fetal hydantoin. Valproate: hepatotoxicity, neural tube defects, weight gain. Carbamazepine: SJS (HLA-B*1502), hyponatraemia, enzyme inducer.","Status epilepticus: IV lorazepam (or diazepam/midazolam) → IV phenytoin/fosphenytoin or valproate or levetiracetam → anaesthesia (propofol, thiopentone).","Parkinsonism: levodopa + carbidopa (peripheral decarboxylase inhibitor ↓ dose, nausea, arrhythmia; pyridoxine interaction avoided), dopamine agonists (pramipexole, ropinirole), MAO-B inhibitors (selegiline, rasagiline), COMT inhibitors (entacapone), amantadine, anticholinergics (trihexyphenidyl; drug-induced parkinsonism). Long-term: wearing-off and on-off phenomena, dyskinesia.","Antipsychotics: typical (chlorpromazine, haloperidol; D2 block → EPS, hyperprolactinaemia) vs atypical (clozapine, olanzapine, risperidone, quetiapine, aripiprazole; 5-HT2A + D2 → fewer EPS, metabolic syndrome). Clozapine: refractory schizophrenia; agranulocytosis, seizures. NMS treated with dantrolene/bromocriptine.","Lithium: narrow therapeutic range 0.6–1.2 mEq/L; ADR tremor, hypothyroidism, nephrogenic DI, Ebstein anomaly; thiazides/NSAIDs raise levels.","Morphine: μ-agonist; analgesia, euphoria, respiratory depression, miosis, constipation, emesis, histamine release. Uses: severe pain, MI, acute LVF (pulmonary oedema). Contraindicated in head injury, bronchial asthma. Naloxone reverses toxicity (triad: coma, pinpoint pupils, respiratory depression)."],
flow:{t:"Status epilepticus protocol",n:["Seizure > 5 min or recurrent without recovery","ABC, O₂, check glucose (give thiamine + dextrose if low)","0–10 min: IV lorazepam 0.1 mg/kg (or diazepam / IM midazolam)","10–30 min: IV fosphenytoin / phenytoin 20 mg/kg OR valproate OR levetiracetam","Still seizing (refractory): ICU, intubate",{k:"Anaesthetic infusion: midazolam / propofol / thiopentone with EEG monitoring"}]},
hy:["BZD vs barbiturate on GABA-A?::BZD ↑ frequency; barbiturate ↑ duration of Cl⁻ channel opening","BZD antagonist?::Flumazenil","Antidote of methanol poisoning?::Fomepizole (or ethanol) + haemodialysis + folinic acid; NaHCO3 for acidosis","Antiepileptic with gingival hyperplasia?::Phenytoin","Drug of choice for absence seizures?::Ethosuximide (valproate if mixed)","Why carbidopa with levodopa?::Inhibits peripheral dopa decarboxylase → more levodopa reaches brain, fewer side effects","Antipsychotic with agranulocytosis risk?::Clozapine (monitor counts)","Drug for neuroleptic malignant syndrome?::Dantrolene / bromocriptine","Therapeutic range of lithium?::0.6–1.2 mEq/L","Opioid antagonist for overdose?::Naloxone","SSRIs example and ADR?::Fluoxetine, sertraline; sexual dysfunction, GI upset, serotonin syndrome with MAOIs"],
mcq:[["Benzodiazepines act by increasing:",["Duration of Cl⁻ channel opening","Frequency of Cl⁻ channel opening","Glutamate release","Na⁺ channel block"],1,"BZDs increase the frequency; barbiturates the duration."],["Drug of choice for absence seizures:",["Phenytoin","Carbamazepine","Ethosuximide","Phenobarbitone"],2,"Ethosuximide blocks T-type Ca²⁺ channels."],["Triad of coma, pinpoint pupils and respiratory depression is treated with:",["Flumazenil","Naloxone","Atropine","Physostigmine"],1,"This is opioid toxicity."]]},

{id:"pharm7", t:"Cardiovascular & Renal Drugs", paper:"Paper II",
topics:[["ACE inhibitors: drugs, ADR, MOA, uses",0,"S"],["ARBs: drugs, ADR, MOA, uses",0,"S"],["Cardiac glycosides; drugs for CHF; PA, MOA, ADR, uses of digitalis; vasodilators in CHF (hydralazine)",4,"L"],["Antiarrhythmic drugs: classification; lignocaine, amiodarone, verapamil",0,"S"],["Antianginal drugs: classification; MOA, ADR, uses of nitrates and CCBs",4,""],["Nicorandil (K⁺ channel opener)",0,"S"],["Drug therapy in MI",4,""],["Antihypertensives: classification; β-blockers/thiazides; guidelines; hypertensive emergency; HTN in pregnancy",5,"L"],["Diuretics: classification",0,""],["Furosemide / thiazide: MOA, ADR, uses",0,"S"],["Spironolactone: K⁺-sparing diuretic",0,"S"],["Mannitol: osmotic diuretic",0,"S"]],
core:["ACE inhibitors (enalapril, ramipril, lisinopril): ↓ angiotensin II and ↑ bradykinin. Uses: HTN, CHF, post-MI, diabetic nephropathy. ADR: dry cough, angioedema, hyperkalaemia, first-dose hypotension; contraindicated in pregnancy and bilateral renal artery stenosis. ARBs (losartan, telmisartan) have no cough.","CHF: diuretics (symptom relief), ACEI/ARB/ARNI (sacubitril-valsartan), β-blockers, spironolactone, SGLT2 inhibitors (mortality benefit); digoxin for symptoms/AF; hydralazine + nitrate.","Digoxin: inhibits Na⁺/K⁺-ATPase → ↑ intracellular Ca²⁺ → positive inotropy; vagal → ↓ AV conduction. Narrow therapeutic index. Toxicity ↑ with hypokalaemia; signs: nausea, xanthopsia, bigeminy, any arrhythmia. Treat: stop drug, K⁺, lignocaine/phenytoin, digoxin-specific Fab.","Antiarrhythmics (Vaughan-Williams): I Na⁺ block (IA quinidine, IB lignocaine, IC flecainide), II β-blockers, III K⁺ block (amiodarone, sotalol), IV CCB (verapamil, diltiazem). Amiodarone ADR: pulmonary fibrosis, thyroid dysfunction, corneal deposits, photosensitivity.","Nitrates: release NO → ↑ cGMP → venodilatation (↓ preload). ADR: headache, tolerance (nitrate-free interval). CCBs: dihydropyridines (amlodipine, nifedipine: vascular) vs non-DHP (verapamil, diltiazem: cardiac).","Acute MI (MONA-BASH): Morphine, O2 if hypoxic, Nitrates, Aspirin + clopidogrel/ticagrelor, β-blocker, ACE inhibitor, Statin, Heparin; reperfusion by PCI or thrombolysis (streptokinase, tenecteplase, alteplase) within 12 h.","HTN in pregnancy: methyldopa, labetalol, nifedipine; avoid ACEI/ARB. Hypertensive emergency: IV labetalol, nitroprusside, nicardipine, esmolol; reduce BP by ≤25% in first hour.","Diuretics: loop (furosemide: Na-K-2Cl in thick ascending limb; high ceiling; ototoxicity, hypokalaemia), thiazides (DCT; hyperglycaemia, hyperuricaemia, hypokalaemia), K⁺-sparing (spironolactone: aldosterone antagonist, gynaecomastia), osmotic (mannitol: cerebral oedema, glaucoma), carbonic anhydrase inhibitors (acetazolamide)."],
flow:{t:"Choosing an antihypertensive",n:["Confirmed hypertension + lifestyle change",{b:[["Diabetes / CKD with proteinuria","ACE inhibitor or ARB"],["Elderly / black / isolated systolic","CCB (amlodipine) or thiazide"],["Post-MI / angina / HF","β-blocker + ACEI"],["Pregnancy","Methyldopa / labetalol / nifedipine (no ACEI)"],["BPH","α1-blocker add-on"]]},"Not controlled → ACEI/ARB + CCB + thiazide",{k:"Resistant HTN → add spironolactone"}]},
hy:["Dry cough with ACE inhibitors is due to?::Accumulation of bradykinin (and substance P)","Antihypertensives safe in pregnancy?::Methyldopa, labetalol, nifedipine","Antidote for digoxin toxicity?::Digoxin-specific Fab antibody fragments","Electrolyte that predisposes to digoxin toxicity?::Hypokalaemia","Antiarrhythmic causing pulmonary fibrosis and thyroid dysfunction?::Amiodarone","Drug of choice for PSVT termination?::Adenosine (IV bolus)","Most potent diuretic class?::Loop diuretics (furosemide)","Diuretic causing gynaecomastia?::Spironolactone","Nitrate tolerance is avoided by?::Nitrate-free interval of 8–12 h","Nicorandil MOA?::K⁺-ATP channel opener + nitrate-like NO donor"],
mcq:[["Dry cough is a side effect of:",["Losartan","Enalapril","Amlodipine","Atenolol"],1,"ACE inhibitors raise bradykinin; ARBs do not."],["Digoxin inhibits:",["Na⁺/K⁺-ATPase","Ca²⁺ channels","β1 receptors","PDE-3"],0,"This raises intracellular Ca²⁺ through Na⁺/Ca²⁺ exchange."],["Antihypertensive contraindicated in pregnancy:",["Methyldopa","Labetalol","Enalapril","Nifedipine"],2,"ACE inhibitors cause fetal renal damage."]]},

{id:"pharm8", t:"Drugs Affecting Blood", paper:"Paper II",
topics:[["Oral / parenteral iron: uses",0,""],["Acute iron poisoning",0,""],["Folic acid",0,""],["Vitamin K",0,""],["Anticoagulants: classification; MOA, ADR, uses of heparin and warfarin; LMWH",4,""],["Streptokinase",0,"S"],["Antiplatelet drugs: classify; uses, ADR, MOA of aspirin and clopidogrel",0,""],["GP IIb/IIIa receptor antagonists",0,"S"],["Hypolipidaemic drugs: classify; MOA, ADR, uses of statins (atorvastatin)",0,""]],
core:["Oral iron (ferrous sulphate, 200 mg/day elemental in deficiency; continue 3–6 months after Hb normal). Parenteral (iron sucrose, ferric carboxymaltose, iron dextran) for intolerance, malabsorption, late pregnancy. Acute iron poisoning: desferrioxamine.","Heparin: activates antithrombin III → inactivates thrombin (IIa) and Xa; monitored by aPTT; antidote protamine sulphate; ADR bleeding, HIT, osteoporosis. LMWH (enoxaparin): mainly anti-Xa, SC, predictable, no routine monitoring, less HIT.","Warfarin: vitamin K antagonist (VKORC1) → ↓ II, VII, IX, X; monitor INR (target 2–3); antidote vitamin K (± FFP/PCC); teratogenic; many interactions. New oral anticoagulants: dabigatran (thrombin), rivaroxaban/apixaban (Xa).","Fibrinolytics: streptokinase (antigenic, allergy, hypotension), alteplase, tenecteplase. Antidote: tranexamic acid.","Antiplatelets: aspirin (COX-1), clopidogrel/prasugrel/ticagrelor (P2Y12 ADP receptor), GP IIb/IIIa blockers (abciximab, eptifibatide, tirofiban), dipyridamole/cilostazol (PDE).","Statins: HMG-CoA reductase inhibitors → ↑ LDL receptors → ↓ LDL. Given at night (short-acting). ADR: myopathy/rhabdomyolysis (↑ with fibrates, macrolides, azoles), hepatotoxicity; contraindicated in pregnancy. Others: ezetimibe, fibrates (↓ TG), niacin (flushing), PCSK9 inhibitors."],
flow:{t:"Heparin vs warfarin at a glance",n:["Need anticoagulation",{b:[["Rapid onset needed (DVT/PE start, ACS, pregnancy)","Heparin / LMWH","Acts via antithrombin III","Monitor aPTT (UFH)","Antidote: protamine","Safe in pregnancy"],["Long-term oral","Warfarin","Vitamin K antagonist (II, VII, IX, X)","Monitor INR 2–3","Antidote: vitamin K, FFP/PCC","Teratogenic"]]},{k:"Overlap heparin with warfarin for ≥5 days until INR therapeutic for 2 days"}]},
hy:["Antidote for heparin?::Protamine sulphate","Antidote for warfarin?::Vitamin K1 (phytonadione); FFP or PCC for urgent reversal","Lab test to monitor warfarin?::PT / INR","Anticoagulant safe in pregnancy?::Heparin / LMWH","Clopidogrel MOA?::Irreversible P2Y12 (ADP) receptor blockade","Antidote for acute iron poisoning?::Desferrioxamine","Statin ADR to warn patient about?::Muscle pain (myopathy, rhabdomyolysis)","Antidote of streptokinase-induced bleeding?::Tranexamic acid / ε-aminocaproic acid","Why folic acid in pregnancy?::Prevents neural tube defects (400 µg; 4–5 mg if high risk)"],
mcq:[["Heparin acts by:",["Inhibiting vitamin K epoxide reductase","Activating antithrombin III","Blocking P2Y12","Activating plasminogen"],1,"Heparin accelerates antithrombin's inactivation of thrombin and Xa."],["Antidote for warfarin overdose:",["Protamine","Vitamin K","Desferrioxamine","Naloxone"],1,"Vitamin K restores synthesis of clotting factors."],["Statins inhibit:",["Lipoprotein lipase","HMG-CoA reductase","PCSK9","Cholesterol absorption"],1,"They block the rate-limiting enzyme of cholesterol synthesis."]]},

core:["PPIs (omeprazole, pantoprazole): irreversibly inhibit H⁺/K⁺-ATPase; prodrug activated in acid; take 30 min before breakfast. ADR: hypomagnesaemia, B12 deficiency, fractures, C. difficile, ↑ pneumonia risk.","H. pylori triple therapy (14 days): PPI + clarithromycin + amoxicillin (or metronidazole). Quadruple: PPI + bismuth + tetracycline + metronidazole.","GERD: lifestyle (raise head end, avoid late meals), PPIs most effective, H2 blockers, prokinetics, antacids.","Antiemetics: 5-HT3 antagonists (ondansetron: chemotherapy, post-op; QT prolongation), D2 blockers (metoclopramide: also prokinetic; EPS; domperidone does not cross BBB), H1 blockers (promethazine, motion sickness), anticholinergic (hyoscine: motion sickness), NK1 antagonist (aprepitant), dexamethasone.","Low-osmolarity WHO ORS (245 mOsm/L): Na 75, Cl 65, K 20, citrate 10, glucose 75 mmol/L; works via SGLT1 glucose-sodium co-transport. Add zinc 20 mg/day for 14 days in children (10 mg <6 months).","Racecadotril: enkephalinase inhibitor → antisecretory antidiarrhoeal without affecting motility. Loperamide: opioid, reduces motility (avoid in dysentery and in young children)."],
flow:{t:"Peptic ulcer management",n:["Dyspepsia / confirmed peptic ulcer","Test for H. pylori (urea breath test, stool antigen, biopsy urease)",{b:[["H. pylori positive","Triple therapy 14 days: PPI + clarithromycin + amoxicillin","Confirm eradication after 4 weeks"],["NSAID-induced","Stop NSAID","PPI 8 weeks","If NSAID must continue: PPI / misoprostol cover"]]},{k:"Bleeding ulcer: IV PPI + endoscopic therapy"}]},
hy:["PPI MOA?::Irreversible inhibition of H⁺/K⁺-ATPase (proton pump)","Antiemetic of choice for chemotherapy-induced vomiting?::Ondansetron (5-HT3) ± aprepitant + dexamethasone","D2 antiemetic not crossing BBB?::Domperidone","Drug for motion sickness?::Hyoscine (scopolamine) or promethazine","Osmolarity of low-osmolar ORS?::245 mOsm/L","Zinc dose in childhood diarrhoea?::20 mg/day for 14 days (10 mg if <6 months)","Racecadotril MOA?::Enkephalinase inhibitor (antisecretory)","PG analogue that protects gastric mucosa?::Misoprostol (contraindicated in pregnancy)"],
mcq:[["Ondansetron blocks:",["D2 receptors","5-HT3 receptors","H1 receptors","NK1 receptors"],1,"5-HT3 antagonism at CTZ and vagal afferents."],["Total osmolarity of WHO low-osmolar ORS:",["311","245","200","290"],1,"Reduced osmolarity ORS is 245 mOsm/L."],["Racecadotril acts by inhibiting:",["Enkephalinase","Opioid receptors","Cl⁻ channels directly","Gut motility"],0,"It protects endogenous enkephalins, which reduce secretion."]]},

core:["By mechanism: cell wall synthesis (β-lactams, vancomycin), protein synthesis 30S (aminoglycosides, tetracyclines) and 50S (macrolides, chloramphenicol, clindamycin, linezolid), DNA gyrase (fluoroquinolones), folate synthesis (sulfonamides, trimethoprim), membrane (polymyxins), RNA polymerase (rifampicin).","Penicillin G: drug of choice for syphilis, streptococcal infections; ADR hypersensitivity (anaphylaxis — test dose), Jarisch-Herxheimer reaction. Amoxicillin + clavulanic acid extends spectrum to β-lactamase producers.","Cephalosporins: 1st (cefazolin: surgical prophylaxis), 2nd (cefuroxime), 3rd (ceftriaxone: meningitis, typhoid, gonorrhoea; ceftazidime: Pseudomonas), 4th (cefepime), 5th (ceftaroline: MRSA).","Aminoglycosides (gentamicin, amikacin): concentration-dependent killing, post-antibiotic effect, once-daily dosing; ototoxicity and nephrotoxicity, NM blockade; ineffective against anaerobes.","Tetracyclines (doxycycline): rickettsia, chlamydia, cholera, brucella, acne; ADR teeth discolouration and bone deposition (avoid <8 y, pregnancy), photosensitivity, Fanconi syndrome with outdated drug. Chloramphenicol: gray baby syndrome, aplastic anaemia.","Fluoroquinolones (ciprofloxacin, levofloxacin): DNA gyrase/topoisomerase IV; tendinitis, QT prolongation, cartilage damage in children. Vancomycin: MRSA, oral for C. difficile; red man syndrome (slow infusion), nephrotoxicity.","Typhoid: ceftriaxone (severe), azithromycin (uncomplicated), cefixime; fluoroquinolone resistance common in India. Uncomplicated UTI: nitrofurantoin, fosfomycin, cotrimoxazole (if local resistance low)."],

{id:"pharm11", t:"Antimicrobials II: TB, Fungal, Viral, Malaria, Parasites", paper:"Paper II · Chemotherapy",
topics:[["Antitubercular drugs: classification; isoniazid & rifampicin MOA, ADR, uses; doses; category regimens; MDR-TB; MAC",4,"L"],["Antifungal drugs: classification; amphotericin B, griseofulvin, ketoconazole",4,"L"],["Antiviral drugs: classification; acyclovir, zidovudine; first & second line ART; PEP; perinatal prophylaxis",4,"L"],["Antimalarial drugs: classification, objectives; chloroquine, mefloquine, primaquine; ACT regimens",4,"L"],["Antiamoebic drugs: metronidazole",0,""],["Anthelmintics: mebendazole, albendazole; DEC, ivermectin, praziquantel",0,"S"]],
core:["First-line TB (NTEP, daily FDC): intensive phase 2 months HRZE, continuation 4 months HRE (6 months total). Isoniazid: mycolic acid synthesis inhibitor; ADR peripheral neuropathy (give pyridoxine), hepatitis. Rifampicin: RNA polymerase; orange urine, hepatitis, flu-like syndrome, enzyme induction. Pyrazinamide: hyperuricaemia, hepatotoxicity. Ethambutol: optic neuritis (red-green colour vision).","MDR-TB: resistance to at least H and R. Current all-oral regimens include bedaquiline, linezolid, levofloxacin/moxifloxacin, clofazimine, cycloserine (BPaLM/longer regimens per national guidelines).","Antifungals: polyenes (amphotericin B binds ergosterol → pores; nephrotoxicity, infusion reactions; liposomal form less toxic), azoles (inhibit ergosterol synthesis via 14-α demethylase; ketoconazole: enzyme inhibitor, gynaecomastia), griseofulvin (dermatophytes, binds microtubules; take with fatty meal), echinocandins (caspofungin), terbinafine (squalene epoxidase).","Antivirals: acyclovir (guanosine analogue, activated by viral thymidine kinase; HSV, VZV). HIV ART: NRTIs (zidovudine → anaemia; tenofovir → renal; lamivudine), NNRTIs (efavirenz, nevirapine), integrase inhibitors (dolutegravir), protease inhibitors. India first-line: TLD (tenofovir + lamivudine + dolutegravir).","HIV PEP: start within 72 h (ideally 2 h), 28 days of TLD. PMTCT: lifelong ART for mother; infant nevirapine prophylaxis.","Antimalarials: chloroquine (vivax blood schizonticide; heme polymerisation inhibition; retinopathy), primaquine (radical cure of vivax: hypnozoites, 0.25 mg/kg × 14 d; single dose gametocidal for falciparum; haemolysis in G6PD deficiency), ACT for falciparum (India: artesunate + sulfadoxine-pyrimethamine; NE states: artemether-lumefantrine). Severe malaria: IV artesunate.","Metronidazole: amoebiasis, giardiasis, trichomoniasis, anaerobes, C. difficile; metallic taste, disulfiram-like reaction. Albendazole: broad-spectrum (ascaris, hookworm, neurocysticercosis); ivermectin (strongyloides, filaria, scabies); praziquantel (tapeworms, flukes); DEC (filariasis)."],
flow:{t:"Drug-sensitive TB treatment (adult, NTEP)",n:["Microbiologically or clinically diagnosed TB + UDST / CBNAAT",{b:[["Rifampicin sensitive","Intensive phase: H R Z E × 2 months","Continuation phase: H R E × 4 months","Pyridoxine with INH","Monitor LFT, vision, sputum"],["Rifampicin resistant","Refer for DST & LPA","MDR/RR-TB regimen (bedaquiline, linezolid, FQ…)"]]},{k:"Weight-band daily fixed-dose combinations; DOT/99DOTS adherence support"}]},
hy:["INH neuropathy prevention?::Pyridoxine (vitamin B6) 10–25 mg/day","Anti-TB drug causing optic neuritis?::Ethambutol (red-green colour blindness)","Anti-TB drug causing orange-red urine?::Rifampicin","Drug for radical cure of P. vivax?::Primaquine (check G6PD)","Treatment of severe malaria?::IV artesunate","ACT in most of India?::Artesunate + sulfadoxine-pyrimethamine (AS+SP)","Acyclovir activation enzyme?::Viral thymidine kinase","Zidovudine major ADR?::Bone marrow suppression (anaemia)","Time window for HIV PEP?::Within 72 hours, best within 2 hours; 28 days","Amphotericin B major ADR?::Nephrotoxicity (hypokalaemia, hypomagnesaemia)","Griseofulvin absorption increases with?::Fatty meal","Drug of choice for neurocysticercosis?::Albendazole (with steroids)"],

{id:"pharm12", t:"Anticancer, Immunosuppressants & Miscellaneous", paper:"Paper II",
topics:[["Anticancer drugs: classification; cisplatin, methotrexate",0,""],["Immunosuppressants: classification; cyclosporine",0,""],["Chelating agents: BAL, CaNa2 EDTA, penicillamine, desferrioxamine",2,""],["Vitamins A and C",2,""],["Vaccines: BCG",2,""]],
core:["Anticancer classes: alkylating agents (cyclophosphamide – haemorrhagic cystitis, prevented by mesna; cisplatin), antimetabolites (methotrexate, 5-FU, 6-MP), plant alkaloids (vincristine – neuropathy; vinblastine; paclitaxel; etoposide), antibiotics (doxorubicin – cardiotoxicity; bleomycin – pulmonary fibrosis), targeted (imatinib, trastuzumab, rituximab), hormonal (tamoxifen, letrozole).","Cisplatin: cross-links DNA; nephrotoxicity (prevent by hydration, amifostine), ototoxicity, severe vomiting (ondansetron + aprepitant), neuropathy.","Methotrexate: inhibits dihydrofolate reductase; uses ALL, choriocarcinoma, RA (weekly), psoriasis, ectopic pregnancy; ADR myelosuppression, mucositis, hepatotoxicity; rescue with folinic acid (leucovorin).","Cyclosporine: binds cyclophilin → inhibits calcineurin → ↓ IL-2 transcription; uses transplant, psoriasis; ADR nephrotoxicity, hypertension, gum hyperplasia, hirsutism. Tacrolimus binds FKBP-12.","Chelators: BAL/dimercaprol (arsenic, mercury, lead with EDTA; contraindicated in iron, cadmium), CaNa2 EDTA (lead), penicillamine (copper – Wilson; lead), desferrioxamine (iron), succimer (lead in children).","Vitamin A: night blindness, xerophthalmia (India: 1 lakh IU at 9 months, then 2 lakh IU every 6 months till 5 years); excess → raised ICP, teratogen. Vitamin C: scurvy, ↑ iron absorption.","BCG: live attenuated M. bovis (Danish 1331 strain), 0.05 mL intradermal at birth (0.1 mL after 4 weeks), left upper arm; protects against severe forms (TB meningitis, miliary) in children."],

{id:"cm1", t:"Concepts of Health & Disease", paper:"Paper I",

core:["WHO (1948): health is a state of complete physical, mental and social well-being and not merely the absence of disease or infirmity. Dimensions: physical, mental, social, spiritual, emotional, vocational.","Natural history: pre-pathogenesis (agent–host–environment triad) → pathogenesis (early, discernible, advanced disease) → recovery, disability or death.","Levels of prevention: primordial (prevent risk factors, e.g. no smoking norms), primary (health promotion + specific protection, e.g. immunisation), secondary (early diagnosis & treatment, e.g. screening), tertiary (disability limitation & rehabilitation).","Indicators: mortality (crude death rate, IMR — best indicator of health status of a community, MMR), morbidity, disability (DALY, QALY, HALE), nutritional, health care delivery, socio-economic. HDI = life expectancy + education + GNI per capita.","Iceberg phenomenon: visible clinical cases are the tip; the hidden mass of subclinical/undiagnosed cases is larger (e.g. hypertension, diabetes)."],

{id:"cm2", t:"Epidemiology & Screening", paper:"Paper I",
topics:[["Measures of disease frequency: incidence, prevalence",4,"S"],["Descriptive, analytical and experimental studies",5,"L"],["Case-control vs cohort study",5,"D"],["Randomised controlled trial; bias & blinding",4,"L"],["Association and causation (Bradford Hill criteria)",3,"S"],["Screening: sensitivity, specificity, PPV, NPV",5,"S"],["Investigation of an epidemic",4,"L"]],
core:["Prevalence = Incidence × Duration. Incidence measures risk; prevalence measures disease burden.","Case-control: starts with outcome, looks back at exposure; measures odds ratio; quick, cheap, good for rare diseases; recall bias. Cohort: starts with exposure, follows for outcome; relative risk and attributable risk; good for rare exposures; costly, loss to follow-up.","RCT: gold standard of evidence; randomisation removes selection bias and confounders; blinding (single, double, triple) removes observer/participant bias.","Screening test: sensitivity = TP/(TP+FN) (true positive rate); specificity = TN/(TN+FP); PPV depends on prevalence (↑ prevalence → ↑ PPV).","Bradford Hill criteria: strength, consistency, specificity, temporality (the only essential one), biological gradient, plausibility, coherence, experiment, analogy.","Epidemic investigation steps: verify diagnosis → confirm epidemic → define population at risk → rapid search for cases → data analysis (time, place, person) → formulate & test hypothesis → evaluate ecological factors → further investigation → report → control measures."],
flow:{t:"Pick the study design",n:["What is your starting point?",{b:[["Start with disease (cases) & controls","Look back at exposure","Case-control → Odds ratio"],["Start with exposure","Follow forward for disease","Cohort → Relative risk, Attributable risk"],["Investigator assigns intervention randomly","Experimental","RCT → Efficacy"],["Snapshot of population at one time","Cross-sectional → Prevalence"]]}]},
hy:["Formula linking prevalence and incidence?::P = I × D","Measure of association in case-control study?::Odds ratio","Measure of association in cohort study?::Relative risk (and attributable risk)","Sensitivity definition?::Ability to correctly identify those with disease = TP/(TP+FN)","PPV changes with?::Prevalence of disease","Only essential Bradford Hill criterion?::Temporality (cause precedes effect)","Double blinding means?::Neither participants nor investigators know group allocation"],
mcq:[["Odds ratio is calculated in:",["Cohort study","Case-control study","RCT","Ecological study"],1,"Case-control studies cannot give incidence, so odds ratio estimates RR."],["Positive predictive value of a test increases with:",["Decreasing prevalence","Increasing prevalence","Increasing sample size","Blinding"],1,"With more true cases, a positive result is more likely to be true."]]},

core:["Mean (affected by extremes), median (best for skewed data), mode (most frequent). Dispersion: range, SD (most used), variance, coefficient of variation (compares variability).","Normal curve: bell-shaped, mean = median = mode; ±1 SD = 68%, ±2 SD = 95%, ±3 SD = 99.7%.","Sampling: simple random, systematic, stratified (heterogeneous population), cluster (immunisation coverage 30×7), multistage.","Tests: t-test (compare 2 means, small samples), ANOVA (>2 means), chi-square (proportions / qualitative data), correlation (r) and regression.","Type I (α) error: rejecting a true null hypothesis (false positive); type II (β) error: accepting a false null (false negative). Power = 1 − β. p < 0.05 conventionally significant.","Diagrams: histogram (continuous quantitative, no gaps), bar (qualitative/discrete), pie (proportions), line (trends over time), frequency polygon, scatter (correlation)."],
flow:{t:"Choose a test of significance",n:["What kind of data?",{b:[["Qualitative (proportions)","Chi-square test","(Fisher exact if small)"],["Quantitative, 2 groups","Unpaired t-test (independent)","Paired t-test (before-after)"],["Quantitative, > 2 groups","ANOVA"],["Relationship between 2 variables","Correlation (r), regression"]]}]},
hy:["Best measure of central tendency for skewed data?::Median","Area within mean ± 2 SD?::95%","Cluster sampling used in?::Immunisation coverage evaluation (30 clusters × 7 children)","Test for comparing proportions?::Chi-square test","Type I error is also called?::α error (false positive)","Diagram for continuous frequency distribution?::Histogram"],
mcq:[["Chi-square test is used for:",["Comparing two means","Qualitative data/proportions","Correlation","Regression"],1,"Chi-square tests association between categorical variables."],["In a normal distribution, mean ± 1 SD covers:",["50%","68%","95%","99.7%"],1,"About 68% of values."]]},

core:["From 1 July 2024: Bharatiya Nyaya Sanhita (BNS) replaced IPC, Bharatiya Nagarik Suraksha Sanhita (BNSS) replaced CrPC, Bharatiya Sakshya Adhiniyam (BSA) replaced the Indian Evidence Act.","Inquest: police inquest (old CrPC 174 → BNSS 194) is the commonest in India; magistrate inquest (old CrPC 176 → BNSS 196) for custodial deaths, dowry deaths within 7 years of marriage, exhumation, deaths in police/psychiatric custody.","Dying declaration (old IEA 32 → BSA 26): statement by a dying person about the cause of death; recorded preferably by a magistrate, can be recorded by a doctor; no oath, no cross-examination; doctor certifies compos mentis. Dying deposition: recorded by magistrate in presence of accused with oath and cross-examination — more weight.","Order of examination of witness: examination-in-chief → cross-examination (leading questions allowed) → re-examination. Leading questions are not allowed in examination-in-chief.","Subpoena is a court document compelling attendance; criminal courts take precedence over civil courts. Conduct money is the fee for a witness in civil cases."],

hy:["Commonest inquest in India?::Police inquest","Inquest for custodial death?::Magistrate inquest","Section replacing CrPC 174 (police inquest)?::BNSS 194","Section replacing IEA 32 (dying declaration)?::BSA 26","Leading questions are allowed in?::Cross-examination (not in examination-in-chief)","Dying deposition is more valuable because?::Recorded on oath by magistrate with cross-examination by accused"],

{id:"fmt2", t:"Medical Ethics, Consent & Negligence", paper:"Forensic Medicine",
topics:[["NMC and professional misconduct (infamous conduct)",4,"S"],["Consent: types, informed consent, age of consent",5,"L"],["Medical negligence: civil & criminal; res ipsa loquitur",5,"L"],["Privileged communication",4,"S"],["Euthanasia; advance directives",3,"S"],["Consumer Protection Act and medical services",3,"S"]],
core:["Consent: implied (e.g. coming to OPD), expressed (oral or written), informed (nature, risks, alternatives explained). Age of valid consent for medical examination/treatment: 18 years; for minors, parent/guardian consents; in emergencies treatment can proceed without consent (doctrine of necessity).","Medical negligence = duty of care + dereliction (breach) + direct causation + damage (4 Ds). Civil negligence → compensation; criminal negligence (gross) → BNS 106 (old IPC 304A).","Res ipsa loquitur: 'the thing speaks for itself' — e.g. swab left in abdomen; the burden shifts to the doctor.","Privileged communication: doctor may disclose confidential information in the interest of society/person (e.g. notifiable diseases, a colour-blind driver, threat to spouse) to the proper authority only.","Professional misconduct (NMC): adultery with patient, unethical advertising, issuing false certificates, sex determination, fee-splitting, conviction for an offence involving moral turpitude.","Passive euthanasia is permitted in India with advance directive/living will (Common Cause vs Union of India, 2018); active euthanasia is illegal."],
flow:{t:"Proving medical negligence (4 Ds)",n:["Allegation of negligence","Duty: a doctor-patient relationship existed","Dereliction: breach of standard of care (Bolam test: reasonable competent doctor)","Direct causation: breach directly caused harm","Damage: actual injury/loss",{b:[["Simple lack of care","Civil negligence → compensation (Consumer court)"],["Gross recklessness","Criminal negligence → BNS 106 (old IPC 304A)"]]}]},
hy:["Four Ds of negligence?::Duty, Dereliction, Direct causation, Damage","Res ipsa loquitur means?::The thing speaks for itself","Age for valid consent for treatment?::18 years","Bolam test?::Standard of a reasonable body of competent practitioners","Passive euthanasia legal in India since?::2018 (Common Cause judgment)","Causing death by negligence section now?::BNS 106 (old IPC 304A)"],
mcq:[["A forgotten swab in the abdomen is an example of:",["Contributory negligence","Res ipsa loquitur","Therapeutic privilege","Novus actus"],1,"The fact itself proves negligence."],["Which is NOT one of the 4 Ds of negligence?",["Duty","Damage","Diagnosis","Direct causation"],2,"Duty, Dereliction, Direct causation, Damage."]]},

core:["Age by teeth: temporary teeth erupt 6–24 months (20 teeth); permanent teeth begin at 6 years (first molar); third molar 17–25 years. Gustafson's method estimates age in adults from regressive changes (attrition, periodontosis, secondary dentine, cementum apposition, root resorption, root transparency — most reliable).","Age by ossification: important medico-legal ages 7, 12, 14, 16, 18, 21; e.g. elbow fusion ~14–16 y, iliac crest ~18–20 y, medial clavicle ~21–22 y. Skull sutures for older age (unreliable).","Sex from pelvis (most reliable bone): female — wider subpubic angle (>90°), wider sciatic notch, preauricular sulcus, broader shallow pelvis. Skull is second best.","Dactylography (Galton system): loops (commonest, ~67%), whorls, arches (least common), composites. Fingerprints are unique, even in identical twins. Poroscopy (Locard) studies sweat pores.","DNA profiling uses STRs; useful for paternity disputes, mutilated remains, sexual assault."],
flow:{t:"Age estimation toolkit",n:["Unknown individual",{b:[["0–2 years","Temporary tooth eruption, ossification centres"],["6–25 years","Permanent teeth eruption, epiphyseal fusion on X-ray"],["Adults","Gustafson's dental method, pubic symphysis changes"],["Elderly","Skull suture closure, osteoporosis (less reliable)"]]},{k:"Report an age RANGE, not a single figure"}]},
hy:["Most reliable bone for sex determination?::Pelvis","Commonest fingerprint pattern?::Loops","Gustafson's method is used for?::Age estimation in adults from teeth","Most reliable criterion in Gustafson's method?::Root transparency","Number of temporary teeth?::20","First permanent tooth to erupt?::First molar (6 years)","Fingerprints differ in identical twins?::Yes (DNA does not)"],
mcq:[["Most reliable bone for determining sex:",["Skull","Pelvis","Femur","Sternum"],1,"Pelvis shows the most marked sexual dimorphism."],["Commonest fingerprint pattern:",["Arch","Whorl","Loop","Composite"],2,"Loops form about two-thirds of patterns."]]},

{id:"fmt4", t:"Thanatology: Death & Post-mortem Changes", paper:"Forensic Medicine",
topics:[["Somatic vs molecular death; brain death",4,"S"],["Signs of death",3,"S"],["Post-mortem lividity (hypostasis)",5,"S"],["Rigor mortis vs cadaveric spasm",5,"D"],["Decomposition; adipocere; mummification",5,"S"],["Estimation of time since death",5,"L"],["Post-mortem examination & exhumation",3,"S"]],
core:["Somatic (clinical) death: irreversible loss of brain, heart and lung function. Molecular (cellular) death follows over hours.","Algor mortis: body cools ~0.4–0.6 °C per hour in temperate conditions (Indian estimate ~0.5–1 °F/h); rectal temperature is used.","Livor mortis (hypostasis): starts 1–2 h, fixed by 6–8 h; colour clues — cherry-red (CO, cyanide bright red), chocolate/brown (nitrites, methaemoglobin), dark (asphyxia).","Rigor mortis: starts 1–2 h, in heart first (involuntary), then eyelids, face, neck, limbs (Nysten's rule: proximal to distal, top to bottom); lasts ~24 h in Indian summer; due to ATP depletion. Cadaveric spasm: instantaneous rigidity of a group of muscles at the moment of death (e.g. weapon gripped in suicide) — cannot be simulated.","Decomposition: greenish discoloration of right iliac fossa (caecum) first at 12–18 h, marbling, bloating, maggots. Adipocere (saponification, moist conditions), mummification (dry, hot conditions).","Time since death combines temperature, lividity, rigor, decomposition, stomach contents, entomology, vitreous potassium."],
flow:{t:"Approximate timeline after death (Indian conditions)",n:["0–1 h: primary flaccidity, cooling begins","1–2 h: rigor starts (heart → eyelids → face); lividity appears","6–8 h: lividity fixed; rigor fully developed by ~12 h","12–18 h: greenish discoloration of right iliac fossa","18–24 h: rigor passes off (summer); marbling","24–48 h: bloating, foul gases, maggots",{k:"Adipocere (weeks, moist) or mummification (dry, hot) may follow"}]},
hy:["First muscle to show rigor mortis?::Myocardium (heart); eyelids first among voluntary","Cause of rigor mortis?::ATP depletion → actin-myosin bridges fixed","Cherry-red post-mortem lividity?::Carbon monoxide poisoning","Chocolate-brown lividity?::Nitrite/chlorate/aniline poisoning (methaemoglobin)","Cadaveric spasm significance?::Indicates the last act of the person (e.g. suicide weapon in hand)","First external sign of decomposition?::Greenish discoloration of right iliac fossa","Adipocere forms in?::Moist, warm environment (hydrolysis/hydrogenation of fat)"],
mcq:[["Cherry-red colour of hypostasis is seen in:",["Cyanide","Carbon monoxide","Nitrite","Hypothermia"],1,"Carboxyhaemoglobin gives cherry-red lividity (cyanide: bright red)."],["Rigor mortis is first seen in:",["Lower limbs","Eyelids (voluntary) / myocardium","Fingers","Neck"],1,"Myocardium first; among voluntary muscles the eyelids."]]},

{id:"fmt5", t:"Mechanical Injuries & Firearms", paper:"Forensic Medicine",
topics:[["Abrasion, contusion, laceration, incised & stab wounds",5,"L"],["Ante-mortem vs post-mortem wounds",4,"D"],["Age of a bruise (colour changes)",4,"S"],["Firearm injuries: entry vs exit; range of fire",5,"L"],["Grievous hurt (BNS 116, old IPC 320)",5,"S"],["Head injury: skull fractures, extradural vs subdural haematoma",4,"S"],["Thermal injuries: burns, Rule of nines; scalds",3,"S"]],
core:["Abrasion: loss of superficial epidermis; shows direction (heaping) and pattern. Contusion (bruise): ruptured vessels beneath intact skin. Laceration: tear by blunt force with irregular margins, tissue bridges. Incised wound: sharp edge, clean margins, length > depth, no tissue bridges. Stab: depth > length.","Colour changes of bruise: red (fresh), blue (1–3 d), bluish-black to brown (4 d, haemosiderin), greenish (5–6 d, biliverdin), yellow (7–12 d, bilirubin), normal (2 wk).","Firearm entry wound: smaller, inverted margins, abrasion collar, grease/dirt collar; with close range: burning, blackening (smoke), tattooing (unburnt powder). Exit: larger, everted, no collar. Contact wound on skull: stellate (cruciate) with muzzle imprint.","Grievous hurt (BNS 116): emasculation, permanent loss of sight or hearing, loss/impairment of a limb or joint, permanent disfigurement of head or face, fracture or dislocation of bone or tooth, hurt endangering life or causing severe bodily pain or inability to follow ordinary pursuits for 15 days (20 days under old IPC 320).","EDH: middle meningeal artery, lucid interval, biconvex on CT. SDH: bridging veins, crescentic, elderly/alcoholics, shaken baby.","Burns: Rule of nines (adult): head 9, each upper limb 9, front trunk 18, back trunk 18, each lower limb 18, perineum 1. Ante-mortem burns: vital reaction, carboxyhaemoglobin in blood, soot in airways."],
flow:{t:"Recognise the wound",n:["Wound examined",{b:[["Superficial, epidermis only","Abrasion"],["Intact skin, bleeding beneath","Contusion"],["Irregular margins, tissue bridges, blunt force","Laceration"],["Clean margins, length > depth","Incised wound"],["Depth > length","Stab wound"],["Round, inverted, abrasion collar","Firearm entry"]]},{k:"Vital reaction (swelling, inflammation, clotting) proves an ante-mortem wound"}]},
hy:["Tissue bridges are seen in?::Lacerations (not in incised wounds)","Colour of bruise at 7–12 days?::Yellow (bilirubin)","Abrasion collar is seen at?::Firearm entry wound","Tattooing in firearm wounds is due to?::Unburnt / partially burnt gunpowder particles","Lucid interval is classical of?::Extradural haematoma","Rule of nines: each lower limb?::18%","Grievous hurt section now?::BNS 116 (old IPC 320)","Hinge fracture of skull base?::Motorcyclist's fracture"],
mcq:[["A wound with clean-cut margins and no tissue bridges:",["Laceration","Incised wound","Contusion","Abrasion"],1,"Sharp-edged weapons cut all tissues cleanly."],["Lucid interval is typical of:",["Subdural haematoma","Extradural haematoma","Subarachnoid haemorrhage","Concussion"],1,"Arterial EDH often follows a lucid interval."]]},

{id:"fmt6", t:"Asphyxial Deaths", paper:"Forensic Medicine",
topics:[["Hanging: typical vs atypical; signs",5,"L"],["Hanging vs strangulation",5,"D"],["Throttling & smothering",3,"S"],["Drowning: wet vs dry; diatom test",5,"L"],["Traumatic asphyxia; choking; café coronary",3,"S"]],
core:["General asphyxial signs: cyanosis, petechial (Tardieu) spots, congestion, fluid dark blood, oedema of lungs.","Hanging: suspension by a ligature with body weight as constricting force; mostly suicidal. Ligature mark is oblique, high above thyroid, non-continuous (gap at knot), parchment-like; dribbling of saliva from the angle of mouth opposite the knot is a sure sign of ante-mortem hanging; fracture of hyoid is uncommon.","Strangulation (ligature): constricting force other than body weight; mostly homicidal. Mark is horizontal, at or below thyroid, continuous, with bruising; fracture of thyroid cartilage common; signs of struggle.","Throttling: manual strangulation — fingernail abrasions, bruises on neck; hyoid fracture (inward compression).","Drowning: froth at nose and mouth (fine, white, persistent — vital sign), cadaveric spasm with weeds in hand, emphysema aquosum, water in stomach. Diatom test on bone marrow (femur) is a confirmatory test for ante-mortem drowning.","Café coronary: food bolus obstructing the larynx in an intoxicated person during a meal."],
flow:{t:"Hanging vs ligature strangulation",n:["Ligature mark on neck",{b:[["Hanging","Oblique, above thyroid cartilage","Incomplete (gap at knot)","Parchment, little bruising","Salivary dribbling","Usually suicidal"],["Ligature strangulation","Horizontal, at/below thyroid","Complete, encircling","Bruising, abrasions, struggle marks","Thyroid cartilage fracture","Usually homicidal"]]}]},
hy:["Surest sign of ante-mortem hanging?::Dribbling of saliva","Hyoid fracture is more common in?::Throttling","Confirmatory test for ante-mortem drowning?::Diatom test (bone marrow of femur)","Fine persistent froth at mouth & nose?::Drowning (ante-mortem)","Tardieu spots?::Petechial haemorrhages in asphyxia","Café coronary?::Choking on food bolus, often while intoxicated"],
mcq:[["Oblique non-continuous ligature mark above the thyroid suggests:",["Throttling","Hanging","Ligature strangulation","Smothering"],1,"Classic hanging mark."],["Diatom test is useful in:",["Hanging","Drowning","Burns","Poisoning"],1,"Diatoms in bone marrow show water was inhaled while alive."]]},

{id:"fmt7", t:"Sexual Offences & Infant Deaths", paper:"Forensic Medicine",
topics:[["Rape: definition (BNS 63/64), examination of victim & accused",5,"L"],["POCSO Act",4,"S"],["Signs of virginity & defloration (two-finger test is banned)",3,"S"],["Unnatural sexual offences & sexual perversions",3,"S"],["Infanticide: live birth signs; hydrostatic test",5,"L"],["Battered baby syndrome (child abuse)",4,"S"]],
core:["Rape is defined under BNS 63 and punished under BNS 64 (old IPC 375/376). Consent of a girl below 18 years is not valid.","Examination of survivor: informed consent, female attendant, history, injuries, collection of samples (swabs, clothing), 'two-finger test' is banned (Supreme Court 2013; reiterated 2022) — must not be done. Free medical treatment is mandatory in all hospitals; inform police (mandatory reporting).","POCSO Act 2012: protects children below 18 from sexual offences; mandatory reporting by doctors; child-friendly procedures.","Infanticide: live birth signs — expanded chest, lungs fill thoracic cavity, crepitant lungs, hydrostatic (float) test positive (also gives false positives in putrefaction), air in stomach & middle ear (Wreden's test).","Battered baby (Caffey) syndrome: multiple fractures of different ages, metaphyseal 'bucket-handle' fractures, subdural haematoma, retinal haemorrhages (shaken baby)."],
flow:{t:"Was the baby born alive?",n:["Body of newborn",{b:[["Chest examination","Barrel-shaped chest, lungs fill cavity"],["Lungs","Spongy, crepitant, marbled"],["Hydrostatic test","Pieces float → respiration occurred (exclude putrefaction)"],["Stomach & middle ear","Air present (Breslau's, Wreden's tests)"]]},{k:"Live birth + signs of violence → infanticide (homicide)"}]},
hy:["Section defining rape now?::BNS 63 (punishment BNS 64; old IPC 375/376)","Two-finger test status?::Banned by Supreme Court","POCSO applies to age?::Below 18 years","Hydrostatic test is for?::Proving respiration (live birth)","False positive hydrostatic test occurs with?::Putrefaction, artificial respiration","Battered baby syndrome X-ray?::Multiple fractures of different ages, metaphyseal corner fractures"],
mcq:[["The two-finger test in sexual assault examination is:",["Mandatory","Optional","Banned","Only for minors"],2,"It is unscientific and violates dignity; banned by the Supreme Court."],["Hydrostatic test proves:",["Age of fetus","Respiration after birth","Cause of death","Sex of infant"],1,"Aerated lungs float."]]},

{id:"fmt8", t:"General Toxicology", paper:"Toxicology",
topics:[["Classification of poisons; diagnosis of poisoning",4,"S"],["Duties of doctor in suspected poisoning",5,"S"],["Gastric lavage: indications & contraindications",5,"S"],["Universal antidote & specific antidotes",5,"S"],["Preservation of viscera for chemical analysis",5,"L"],["Enhanced elimination: forced diuresis, haemodialysis",3,""]],
core:["Duties of a doctor: treat the patient first, inform police in suspected homicidal poisoning, preserve evidence (vomitus, gastric lavage, blood, urine), record dying declaration if needed, maintain records.","Gastric lavage: within 1 h of ingestion of life-threatening poison; contraindicated in corrosives (except carbolic acid), kerosene/hydrocarbons, convulsions, unprotected airway. Activated charcoal (1 g/kg) adsorbs most poisons (not alcohols, iron, lithium, acids/alkalis).","Universal antidote (historical): activated charcoal 2 parts, magnesium oxide 1 part, tannic acid 1 part.","Viscera preservation: stomach with contents, small intestine (30 cm) with contents, liver (500 g), kidneys (half each), blood (10 mL), urine; preservative saturated sodium chloride (not for corrosive acids / volatile poisons); rectified spirit (not for alcohol, kerosene, phenol, phosphorus, paraldehyde). Send to FSL with seal.","Specific antidotes: atropine + PAM (OP), naloxone (opioids), flumazenil (BZD), N-acetylcysteine (paracetamol), fomepizole/ethanol (methanol, ethylene glycol), hydroxocobalamin/sodium nitrite + thiosulphate (cyanide), methylene blue (methaemoglobinaemia), desferrioxamine (iron), BAL (arsenic), ASV (snake bite), physostigmine (datura/atropine), vitamin K (warfarin)."],
flow:{t:"Approach to a poisoned patient",n:["Patient with suspected poisoning","Stabilise ABC; check glucose; decontaminate skin/eyes","Identify toxidrome (cholinergic, anticholinergic, opioid, sympathomimetic)",{b:[["Within 1 h, airway safe, not corrosive/hydrocarbon","Gastric lavage / activated charcoal"],["Specific antidote available","Give antidote"],["Dialysable poison (methanol, lithium, salicylates)","Haemodialysis"]]},"Preserve samples; inform police if medico-legal",{k:"Treatment of the patient always comes before medico-legal duties"}]},
hy:["Preservative of choice for viscera in most poisons?::Saturated common salt (NaCl) solution","Rectified spirit is NOT used for?::Alcohol, kerosene, phenol, phosphorus, paraldehyde, acetic acid","Gastric lavage contraindicated in?::Corrosives (except carbolic acid), hydrocarbons, convulsing patient","Antidote for cyanide?::Hydroxocobalamin / sodium nitrite + sodium thiosulphate","Antidote for datura (anticholinergic) poisoning?::Physostigmine","Antidote for methaemoglobinaemia?::Methylene blue"],
mcq:[["Gastric lavage is contraindicated in:",["OP poisoning","Kerosene poisoning","Barbiturate poisoning","Paracetamol overdose"],1,"Risk of aspiration pneumonitis with hydrocarbons."],["Antidote for methanol poisoning:",["Atropine","Fomepizole","Naloxone","Flumazenil"],1,"Fomepizole (or ethanol) inhibits alcohol dehydrogenase."]]},

{id:"fmt9", t:"Specific Poisons", paper:"Toxicology",
topics:[["Organophosphorus poisoning",5,"L"],["Aluminium phosphide (celphos)",5,"S"],["Methanol & ethanol",5,"S"],["Snake bite: neurotoxic vs vasculotoxic; ASV",5,"L"],["Datura & other deliriants",4,"S"],["Arsenic (acute & chronic)",4,"S"],["Lead poisoning",4,"S"],["Corrosives: sulphuric acid, carbolic acid",4,"S"],["Opium, cannabis, cocaine",3,"S"],["Abrus precatorius & plant poisons",3,"S"]],
core:["OP: irreversible AChE inhibition; muscarinic (SLUDGE, miosis, bronchorrhoea), nicotinic (fasciculations, weakness), CNS effects; intermediate syndrome (24–96 h, proximal weakness, respiratory failure). Treatment: atropine + pralidoxime. Serum/RBC cholinesterase is diagnostic.","Aluminium phosphide (celphos): releases phosphine gas with moisture; garlic odour, refractory shock, metabolic acidosis; no specific antidote; silver nitrate paper test turns black. High fatality.","Methanol: metabolised to formic acid → metabolic acidosis, optic neuritis/blindness. Treat: fomepizole or ethanol, sodium bicarbonate, folinic acid, haemodialysis.","Snakes: neurotoxic (cobra, krait — ptosis, respiratory paralysis; krait bite painless at night) vs vasculotoxic/haemotoxic (Russell's viper, saw-scaled viper — bleeding, 20-minute whole-blood clotting test positive). Polyvalent ASV (Big Four); neostigmine + atropine for cobra neurotoxicity.","Datura: anticholinergic — dry mouth, dilated pupils, hot dry skin, delirium ('dry as bone, red as beet, blind as bat, mad as hatter'); used in road poisoning/robbery. Antidote: physostigmine.","Arsenic: acute — rice-water stools, garlic odour; chronic — raindrop pigmentation, Mees' lines, hyperkeratosis; arsenic is detected in hair and nails even after burial. Lead: abdominal colic, Burton's line, wrist/foot drop, basophilic stippling, ↑ ALA in urine; chelation with CaNa2 EDTA.","Carbolic acid (phenol): white leathery mucosa, green urine (carboluria), gastric lavage allowed (exception among corrosives). Abrus precatorius (rati seeds): abrin; used to make 'sui' (needles) for cattle poisoning."],
flow:{t:"Snake bite: which snake?",n:["Snake bite patient",{b:[["Ptosis, ophthalmoplegia, respiratory paralysis, little local swelling","Neurotoxic: cobra / krait","ASV + neostigmine/atropine (cobra) + ventilation"],["Local swelling, bleeding, 20WBCT positive, renal failure","Vasculotoxic: Russell's / saw-scaled viper","ASV, dialysis if AKI"]]},{k:"Do not use tourniquet, incision or suction; immobilise limb and transport"}]},
hy:["20-minute whole blood clotting test?::Detects vasculotoxic (viper) envenomation if blood does not clot","Painless bite at night with abdominal pain and paralysis?::Common krait","Silver nitrate paper turns black?::Phosphine (aluminium phosphide)","Raindrop pigmentation and Mees' lines?::Chronic arsenic poisoning","Burton's line?::Blue line on gums in lead poisoning","Basophilic stippling of RBCs?::Lead poisoning","Green urine?::Carbolic acid (phenol) poisoning","Methanol causes blindness via?::Formic acid damage to optic nerve/retina","Big Four snakes of India?::Cobra, common krait, Russell's viper, saw-scaled viper"],
mcq:[["The 20WBCT is used in snake bite to detect:",["Neurotoxicity","Coagulopathy","Myotoxicity","Nephrotoxicity"],1,"Unclotted blood at 20 min indicates viper envenomation."],["Garlic odour, refractory shock and silver nitrate test blackening suggest:",["OP","Aluminium phosphide","Arsenic","Cyanide"],1,"Phosphine gas from celphos blackens silver nitrate paper."]]}
]});

{id:"path17",t:"Clinical Pathology & Blood Banking",paper:"Paper I · Practical-oriented",
topics:[["Urine examination: physical, chemical, microscopic",0,"S","N"],["Urinary casts and crystals",0,"S","N"],["CSF examination in meningitis",0,"S","N"],["Body fluids: transudate vs exudate",0,"D","N"],["Semen analysis (WHO reference values)",0,"S","N"],["ABO & Rh blood grouping, cross-matching",0,"S","N"],["Blood components & indications",0,"S","N"],["Bone marrow aspiration vs biopsy",0,"D","N"],["ESR, PCV, reticulocyte count, RBC indices",0,"S","N"],["Peripheral smear: preparation & stains",0,"","N"]],
core:["Urine routine: physical (volume, colour, SG), chemical (protein by heat-acetic acid / sulphosalicylic acid, sugar by Benedict's, ketones by Rothera's, bile salts by Hay's, bile pigment by Fouchet's, blood by benzidine), microscopy (cells, casts, crystals).","Casts: RBC casts (glomerulonephritis), WBC casts (pyelonephritis), muddy-brown granular (ATN), waxy (chronic renal failure), fatty / oval fat bodies (nephrotic), hyaline (normal, concentrated urine).","Transudate: protein <3 g/dL, fluid:serum protein <0.5, LDH ratio <0.6, few cells (CHF, cirrhosis, nephrotic). Exudate: Light's criteria positive (infection, malignancy, TB).","Semen (WHO 2021 lower reference): volume ≥1.4 mL, concentration ≥16 million/mL, total motility ≥42%, progressive ≥30%, normal forms ≥4%.","Blood bank: forward (cell) and reverse (serum) grouping; major cross-match = donor cells + recipient serum. Components: PRBC (anaemia, 42 days in SAGM at 2–6 °C), platelets (22 °C with agitation, 5 days), FFP (−30 °C, 1 year; coagulopathy), cryoprecipitate (fibrinogen, VIII, vWF).","Bone marrow aspiration (cytology; posterior superior iliac spine; Salah/Klima needle) vs trephine biopsy (architecture, cellularity, fibrosis, infiltration; Jamshidi needle). Dry tap: myelofibrosis, hairy cell leukaemia, packed marrow.","ESR by Westergren (more accurate) and Wintrobe; raised in infections, TB, myeloma, pregnancy; low in polycythaemia, sickle cell, CHF."],
flow:{t:"Safe blood transfusion pathway",n:["Request form + recipient sample (2 identifiers)","ABO & Rh grouping: forward + reverse","Antibody screen",{b:[["Major cross-match","Donor RBC + recipient serum","Saline, albumin, AHG phases"],["Component choice","PRBC: anaemia","Platelets: thrombocytopenia bleeding","FFP: coagulopathy","Cryo: low fibrinogen"]]},"Bedside check: identity, unit, expiry",{k:"Monitor 15 min, then periodically: stop at once if fever, rigors, hypotension, haemoglobinuria"}]},
hy:["Test for ketone bodies in urine?::Rothera's test (nitroprusside)","Test for bile salts in urine?::Hay's sulphur test","RBC casts indicate?::Glomerulonephritis (nephritic)","WBC casts indicate?::Pyelonephritis / interstitial nephritis","Storage temperature of platelets?::20–24 °C with continuous agitation, up to 5 days","Cryoprecipitate contains?::Fibrinogen, factor VIII, vWF, factor XIII","Shelf life of PRBC in SAGM?::42 days at 2–6 °C","Site of bone marrow aspiration in adults?::Posterior superior iliac spine (sternum alternative)","Light's criterion of exudate?::Fluid:serum protein >0.5, LDH ratio >0.6 or fluid LDH >2/3 upper limit","Most accurate ESR method?::Westergren"],
mcq:[["Waxy casts in urine suggest:",["Acute GN","Chronic renal failure","Pyelonephritis","Normal urine"],1,"Waxy casts form in very slow tubular flow, typical of chronic renal failure."],["Major cross-match tests:",["Donor serum + recipient cells","Donor cells + recipient serum","Recipient cells + recipient serum","Donor cells + donor serum"],1,"It detects recipient antibodies against donor red cells."],["Fluid with protein ratio 0.7 to serum is:",["Transudate","Exudate","Chylous","Normal"],1,"A fluid:serum protein ratio above 0.5 meets Light's criteria for exudate."]]},
{id:"path18",t:"Infections, Environment & Nutrition",paper:"Paper I · General",
topics:[["Leprosy: pathology & classification (Ridley-Jopling)",0,"S","N"],["Typhoid fever pathology",0,"S","N"],["Malaria pathology (spleen, brain, kidney)",0,"","N"],["Fungal infections in tissue (mucormycosis, candida)",0,"","N"],["Obesity & metabolic syndrome",0,"S","N"],["Vitamin deficiencies: A, D, B12, C",0,"S","N"],["Effects of smoking and alcohol",0,"S","N"],["Radiation injury",0,"","N"]],
core:["Leprosy (Ridley-Jopling): TT – BT – BB – BL – LL. Tuberculoid = strong cell-mediated immunity, well-formed epithelioid granulomas, few bacilli, nerve thickening. Lepromatous = weak CMI, foamy macrophages (lepra/Virchow cells) packed with bacilli (globi), clear subepidermal Grenz zone.","Typhoid: Peyer's patch hyperplasia → longitudinal ulcers, typhoid nodules (macrophage aggregates) in liver, Zenker's degeneration of muscles, splenomegaly; perforation in 3rd week.","Malaria: haemozoin (malarial pigment) in macrophages, splenomegaly; cerebral malaria with sequestration of parasitised RBCs in cerebral capillaries and ring haemorrhages; blackwater fever (massive intravascular haemolysis).","Mucormycosis: broad aseptate ribbon-like hyphae branching at right angles, angioinvasion → infarction; risk with diabetic ketoacidosis and steroids (post-COVID surge in India).","Vitamin A: night blindness, xerophthalmia, Bitot's spots, squamous metaplasia. Vitamin D: rickets (children: rachitic rosary, craniotabes, Harrison sulcus), osteomalacia (adults). Vitamin C: scurvy (defective collagen hydroxylation → perifollicular haemorrhage, bleeding gums, subperiosteal haemorrhage).","Smoking: lung cancer, COPD, atherosclerosis, cancers of oral cavity, larynx, oesophagus, bladder, pancreas. Alcohol: fatty liver → alcoholic hepatitis (Mallory bodies) → cirrhosis; Wernicke-Korsakoff, cardiomyopathy, pancreatitis."],
flow:{t:"Leprosy spectrum (Ridley-Jopling)",n:["Infection with M. leprae → host cell-mediated immunity decides",{b:[["High CMI","Tuberculoid (TT)","Epithelioid granulomas","Bacilli rare","Lepromin +"],["Intermediate","Borderline (BT, BB, BL)","Unstable, reactions common"],["Low CMI","Lepromatous (LL)","Foamy lepra cells, globi","Grenz zone","Lepromin −"]]}]},
hy:["Virchow (lepra) cells?::Foamy macrophages full of M. leprae in lepromatous leprosy","Grenz zone?::Clear subepidermal band in lepromatous leprosy","Zenker's degeneration?::Hyaline degeneration of skeletal muscle (rectus abdominis) in typhoid","Malarial pigment?::Haemozoin","Mucor hyphae?::Broad, aseptate, right-angle branching","Bitot's spots?::Vitamin A deficiency (keratinised conjunctival patches)","Rachitic rosary?::Swelling of costochondral junctions in rickets","Scurvy defect?::Impaired hydroxylation of proline/lysine in collagen"],
mcq:[["Grenz zone is characteristic of:",["Tuberculoid leprosy","Lepromatous leprosy","Sarcoidosis","Syphilis"],1,"A clear zone separates the epidermis from the foamy macrophage infiltrate in LL."],["Broad aseptate hyphae with right-angle branching:",["Aspergillus","Mucor","Candida","Histoplasma"],1,"Mucorales have ribbon-like, pauciseptate hyphae."],["Perifollicular haemorrhages and bleeding gums:",["Vitamin A deficiency","Vitamin C deficiency","Vitamin D deficiency","Vitamin K deficiency"],1,"Scurvy weakens collagen in vessel walls."]]});

core:["Rickettsiae: obligate intracellular, arthropod-borne. Scrub typhus (Orientia tsutsugamushi, trombiculid mite larva/chigger) is common in India: fever, eschar, lymphadenopathy, pneumonitis, meningoencephalitis. Diagnosis: IgM ELISA (best), Weil-Felix OX-K (old). Drug: doxycycline / azithromycin.","Leptospira: thin, tightly coiled with hooked ends; rodent urine contaminated water (floods, paddy fields). Weil disease = jaundice + renal failure + haemorrhage. Diagnosis: MAT (reference), IgM ELISA, dark-ground microscopy, culture in EMJH medium. Drug: penicillin/doxycycline.","Listeria: Gram-positive rods, tumbling motility at 25 °C, cold enrichment, grows at 4 °C (refrigerated food); neonatal meningitis, pregnancy, immunocompromised. Ampicillin; cephalosporins ineffective.","Actinomyces israelii: anaerobic, normal oral flora; cervicofacial 'lumpy jaw' with sinuses and sulphur granules; not acid-fast; penicillin. Nocardia: aerobic, partially (modified) acid-fast, pulmonary & brain abscess in immunocompromised; cotrimoxazole.","Anaerobes: foul-smelling pus, gas, abscesses (lung, brain, intra-abdominal); Bacteroides fragilis commonest; collect in anaerobic transport; metronidazole, clindamycin.","Zoonoses: bacterial (plague, anthrax, brucellosis, leptospirosis, Q fever), viral (rabies, KFD, Nipah, JE), parasitic (hydatid, toxoplasma, taeniasis, leishmaniasis), fungal (dermatophytes)."],
flow:{t:"Fever with eschar or after flood exposure",n:["Acute febrile illness",{b:[["Eschar + lymphadenopathy","Scrub typhus","IgM ELISA","Doxycycline"],["Flood / rodent exposure, calf pain, conjunctival suffusion","Leptospirosis","MAT / IgM ELISA","Penicillin / doxycycline"],["Animal handler, undulant fever","Brucellosis","Blood culture (biphasic), SAT","Doxycycline + rifampicin"]]}]},

{id:"micro12",t:"Other Viruses & Emerging Infections",paper:"Paper II",
topics:[["Measles, mumps, rubella",0,"S","N"],["Rotavirus & norovirus (viral gastroenteritis)",0,"S","N"],["Poxviruses (smallpox, mpox)",0,"","N"],["Human papillomavirus",0,"S","N"],["Hepatitis C, D and E",0,"S","N"],["SARS-CoV-2 / COVID-19",0,"S","N"],["Emerging infections: Nipah, Zika, chikungunya, KFD, Ebola",0,"S","N"],["Prions",0,"S","N"]],
core:["Measles (paramyxovirus): Koplik spots, maculopapular rash, Warthin-Finkeldey giant cells; complications pneumonia, SSPE; MR vaccine at 9–12 and 16–24 months. Mumps: parotitis, orchitis, aseptic meningitis. Rubella: mild rash, but congenital rubella syndrome (cataract, PDA, deafness) in first trimester.","Rotavirus: commonest cause of severe diarrhoea in children <5 y; double-shelled 'wheel' appearance; vaccine in UIP. Norovirus: outbreaks in all ages (cruise ships, hostels).","HPV: types 6/11 – genital warts; 16/18 – cervical, anal, oropharyngeal cancer. Vaccines: quadrivalent, 9-valent; India's indigenous qHPV (Cervavac). Recommended for girls 9–14 years.","HCV: RNA flavivirus, blood-borne, ~75% become chronic → cirrhosis, HCC; treated with direct-acting antivirals (sofosbuvir-based). HDV: defective, needs HBsAg (co-infection or superinfection). HEV: faeco-oral, epidemics, high mortality in pregnancy.","SARS-CoV-2: β-coronavirus, spike protein binds ACE2; diagnosis by RT-PCR (gold standard), rapid antigen test; variants of concern (Delta, Omicron).","Emerging: Nipah (fruit bats, Kerala outbreaks, encephalitis, high fatality), Zika & chikungunya (Aedes), KFD (ticks, Karnataka, monkeys), Ebola (haemorrhagic fever). Prions: misfolded protein (PrPˢᶜ) → spongiform encephalopathy (CJD, kuru); resist routine sterilisation."],
flow:{t:"Hepatitis viruses at a glance",n:["Viral hepatitis",{b:[["Faeco-oral","HAV: no chronicity","HEV: dangerous in pregnancy"],["Blood/sexual/perinatal","HBV: DNA, chronic, HCC","HCV: most become chronic","HDV: needs HBV"]]},{k:"Vaccines exist for HAV and HBV (HBV vaccine also prevents HDV)"}]},

{id:"micro13",t:"Infection Control, HAI & AMR",paper:"Paper II · Applied",
topics:[["Healthcare-associated infections: CAUTI, CLABSI, VAP, SSI",0,"L","N"],["Hand hygiene: WHO 5 moments, steps",0,"S","N"],["Standard & transmission-based precautions",0,"S","N"],["Needle-stick injury management",0,"S","N"],["Antimicrobial resistance: mechanisms",0,"S","N"],["Antimicrobial stewardship",0,"S","N"],["ESBL, CRE, MRSA, VRE",0,"","N"],["Biomedical waste management (microbiology view)",0,"S","N"]],
core:["HAI: infection appearing ≥48 h after admission, not incubating at admission. Commonest types: CAUTI, CLABSI, VAP, SSI; organisms: MRSA, Klebsiella, Acinetobacter, Pseudomonas, Candida.","WHO 5 moments of hand hygiene: before touching a patient, before clean/aseptic procedure, after body fluid exposure risk, after touching a patient, after touching patient surroundings. Alcohol rub 20–30 s; soap & water 40–60 s (and for C. difficile, visibly soiled hands).","Standard precautions apply to every patient: hand hygiene, PPE, safe injection, respiratory etiquette, sharps and waste safety. Transmission-based: contact, droplet (>5 µm, surgical mask), airborne (<5 µm, N95, negative-pressure room – TB, measles, varicella).","Needle-stick injury: wash with soap & water (do not squeeze/scrub), report, test source & HCW (HIV, HBV, HCV), HIV PEP within 72 h (best within 2 h) for 28 days; HBV vaccine ± HBIG by immunity status.","AMR mechanisms: enzymatic inactivation (β-lactamases: ESBL, carbapenemases like NDM-1), altered target (PBP2a in MRSA, D-Ala-D-Lac in VRE), reduced permeability (porin loss), efflux pumps; spread by plasmids, transposons, integrons.","Stewardship: right drug, dose, route, duration; culture before antibiotics; de-escalation; India's AWaRe categorisation (Access, Watch, Reserve) and Kerala/ICMR AMSP; Chennai Declaration; NAP-AMR 2017."],
flow:{t:"After a needle-stick injury",n:["Needle-stick / sharps injury","Wash with soap and running water; do not squeeze or apply bleach","Report to the occupational health / casualty officer","Assess exposure and source status (HIV, HBsAg, HCV)",{b:[["HIV risk","Start PEP (TLD) within 72 h, ideally 2 h, for 28 days"],["HBV","Vaccine ± HBIG according to HCW anti-HBs status"],["HCV","Baseline tests, follow-up; no PEP"]]},{k:"Follow-up testing at 6 weeks, 3 and 6 months; counselling"}]},

{id:"pharm13",t:"General Anaesthetics & Pre-anaesthetic Medication",paper:"Paper I",
topics:[["Stages of general anaesthesia (Guedel)",0,"S","N"],["Inhalational anaesthetics: N2O, isoflurane, sevoflurane; MAC",0,"S","N"],["IV anaesthetics: propofol, thiopentone, ketamine, etomidate",0,"L","N"],["Pre-anaesthetic medication",0,"S","N"],["Balanced anaesthesia & dissociative anaesthesia",0,"S","N"]],
core:["Guedel's stages (ether): I analgesia, II delirium/excitement, III surgical anaesthesia (4 planes), IV medullary paralysis. Modern agents pass stage II quickly.","MAC (minimum alveolar concentration) = alveolar concentration preventing movement in 50% of patients to a skin incision; lower MAC = more potent (halothane most potent among older agents, N2O least, MAC ~105%). Blood:gas partition coefficient ↓ → faster induction and recovery (desflurane, N2O, sevoflurane).","Sevoflurane: pleasant, non-irritant → inhalational induction in children. Isoflurane: maintenance. Halothane: hepatitis, arrhythmias with adrenaline. N2O: good analgesia, weak anaesthetic, diffusion hypoxia (give 100% O2 at end), B12 inactivation with prolonged use.","Propofol: commonest IV induction agent, rapid smooth recovery, antiemetic, pain on injection, hypotension; used for day-care and ICU sedation. Thiopentone: ultra-short (redistribution), contraindicated in porphyria. Ketamine: dissociative anaesthesia, NMDA antagonist, raises BP & HR, bronchodilator (asthma, shock), emergence hallucinations. Etomidate: cardiovascularly stable, adrenal suppression.","Pre-anaesthetic medication aims: relieve anxiety (BZD: midazolam), analgesia (opioids), reduce secretions & vagal reflexes (glycopyrrolate/atropine), prevent aspiration (H2 blocker/PPI, metoclopramide), prevent PONV (ondansetron).","Balanced anaesthesia combines IV induction + inhalational maintenance + opioid analgesia + muscle relaxant, so each drug is used at a lower, safer dose."],
flow:{t:"Choosing an induction agent",n:["Patient for general anaesthesia",{b:[["Routine adult, day-care","Propofol"],["Shock / hypotension / asthma","Ketamine"],["Cardiac instability","Etomidate"],["Child, needle-phobic","Sevoflurane inhalational induction"],["Porphyria","Avoid thiopentone"]]},{k:"Maintain with isoflurane/sevoflurane + opioid + muscle relaxant (balanced anaesthesia)"}]},
hy:["MAC definition?::Alveolar concentration preventing movement to incision in 50% of patients","Agent of choice for inhalational induction in children?::Sevoflurane","Diffusion hypoxia is caused by?::Nitrous oxide at the end of anaesthesia","IV anaesthetic preferred in hypotension/asthma?::Ketamine","Dissociative anaesthesia?::Ketamine (NMDA antagonist)","Thiopentone short action is due to?::Redistribution from brain to muscle and fat","Anaesthetic contraindicated in porphyria?::Thiopentone (barbiturates)","Antisialagogue in pre-medication?::Glycopyrrolate"],
mcq:[["IV anaesthetic that raises blood pressure and is a bronchodilator:",["Propofol","Thiopentone","Ketamine","Etomidate"],2,"Ketamine has sympathomimetic effects."],["Diffusion hypoxia is associated with:",["Halothane","Nitrous oxide","Sevoflurane","Propofol"],1,"N2O floods the alveoli on discontinuation, diluting oxygen."],["Lower MAC value means:",["Lower potency","Higher potency","Faster recovery","Lower solubility"],1,"Less drug is needed for the same effect."]]},
{id:"pharm14",t:"Endocrine II: Insulin, Pituitary, Uterus & Bone",paper:"Paper I",
topics:[["Insulin preparations: classification & uses",0,"L","N"],["Hypoglycaemia: causes & management",0,"S","N"],["Newer antidiabetics: DPP-4, SGLT2, GLP-1",0,"S","N"],["Pituitary & hypothalamic drugs: GH, octreotide, desmopressin",0,"S","N"],["Oxytocin & uterine stimulants (ergometrine, misoprostol, carboprost)",0,"S","N"],["Estrogens, progestins & androgens",0,"S","N"],["Calcium, vitamin D, PTH (teriparatide), calcitonin",0,"S","N"]],
core:["Insulins: rapid-acting (lispro, aspart, glulisine; with meals), short-acting (regular; only one given IV — DKA), intermediate (NPH; cloudy), long-acting (glargine, detemir, degludec; basal, peakless). ADR: hypoglycaemia, lipodystrophy, weight gain, hypokalaemia.","Hypoglycaemia: conscious → 15–20 g oral glucose; unconscious → IV 25–50% dextrose; or glucagon 1 mg IM/SC. β-blockers mask symptoms.","DPP-4 inhibitors (sitagliptin, teneligliptin): weight neutral, no hypoglycaemia. SGLT2 inhibitors (dapagliflozin, empagliflozin): glycosuria, cardiorenal protection; genital infections, euglycaemic DKA. GLP-1 agonists (liraglutide, semaglutide): weight loss, injectable/oral.","Octreotide (somatostatin analogue): acromegaly, carcinoid, variceal bleeding. Desmopressin (V2): central diabetes insipidus, nocturnal enuresis, haemophilia A / vWD. Vasopressin (V1): variceal bleeding, vasodilatory shock.","Oxytocin: labour induction/augmentation, PPH (drug of choice), breast milk ejection; ADR water intoxication, uterine hyperstimulation. Ergometrine: PPH (contraindicated in hypertension/eclampsia, not for induction). Misoprostol: PPH, medical abortion with mifepristone, cervical ripening. Carboprost (15-methyl PGF2α): refractory PPH (avoid in asthma).","Bone: calcium + vitamin D (cholecalciferol; calcitriol in renal failure), bisphosphonates, teriparatide (intermittent PTH → anabolic), denosumab (RANKL antibody), calcitonin (hypercalcaemia, Paget)."],
flow:{t:"Management of postpartum haemorrhage (drugs)",n:["Active management of third stage: oxytocin 10 IU IM after delivery","PPH diagnosed → call for help, IV access, fluids",{b:[["First line","Oxytocin infusion"],["If no hypertension","Ergometrine / methylergometrine"],["Next","Carboprost IM (avoid in asthma)"],["Also","Misoprostol; tranexamic acid within 3 h"]]},{k:"Persistent bleeding → balloon tamponade / surgical measures"}]},
hy:["Only insulin given IV?::Regular (soluble) insulin","Peakless basal insulins?::Glargine, detemir, degludec","Antidiabetic causing euglycaemic DKA?::SGLT2 inhibitors","Drug of choice for central diabetes insipidus?::Desmopressin","Drug of choice for PPH?::Oxytocin","Ergometrine contraindication?::Hypertension / pre-eclampsia, induction of labour","Carboprost should be avoided in?::Bronchial asthma","Anabolic bone drug?::Teriparatide (intermittent PTH)","Octreotide uses?::Acromegaly, carcinoid syndrome, variceal bleeding"],
mcq:[["The only insulin that can be given intravenously:",["Glargine","NPH","Regular insulin","Detemir"],2,"Regular insulin is used as IV infusion in DKA."],["Drug of choice for central diabetes insipidus:",["Vasopressin","Desmopressin","Thiazide","Chlorpropamide"],1,"Desmopressin is a selective V2 agonist with long action."],["Ergometrine is contraindicated in:",["PPH","Pre-eclampsia","Post-abortal bleeding","Uterine atony"],1,"It causes vasoconstriction and raises BP."]]},
{id:"pharm15",t:"Clinical & Special Pharmacology",paper:"Paper I/II",
topics:[["New drug development & phases of clinical trials",0,"L","N"],["Essential medicines concept (NLEM); P-drug",0,"S","N"],["Prescription writing & rational prescribing",0,"S","N"],["Drugs in pregnancy, lactation, children, elderly",0,"S","N"],["Therapeutic drug monitoring",0,"S","N"],["Antiseptics & disinfectants",0,"S","N"],["Drugs for skin & eye (topical, mydriatics)",0,"","N"],["Vaccines, sera & immunoglobulins",0,"S","N"],["OTC drugs, generic vs branded, pharmacoeconomics",0,"","N"]],
core:["Drug development: discovery → preclinical (animal pharmacology/toxicology) → IND/CTA → Phase I (healthy volunteers, safety, PK; 20–80), Phase II (patients, efficacy & dose; 100s), Phase III (large RCTs vs standard; 1000s) → approval (CDSCO, New Drugs & Clinical Trials Rules 2019) → Phase IV (post-marketing surveillance).","Essential medicines: satisfy priority health needs, selected on efficacy, safety, cost; WHO list and India's NLEM (latest 2022). P-drug (personal drug) chosen by a doctor for a common condition by efficacy, safety, suitability, cost.","A prescription: superscription (Rx), inscription (drug, strength, form), subscription (dispensing instructions), transcription/signa (directions to patient), plus doctor's name, registration number, signature, date. Write generic names in CAPITAL letters (NMC).","Pregnancy: avoid ACEI/ARBs, warfarin, statins, tetracyclines, valproate, isotretinoin, methotrexate. Safe: penicillins, cephalosporins, paracetamol, insulin, methyldopa, labetalol. Elderly: start low, go slow; Beers criteria. Children: dose by body weight / surface area.","TDM is useful for drugs with narrow therapeutic index and variable kinetics: digoxin, lithium, phenytoin, aminoglycosides, vancomycin, cyclosporine, theophylline.","Antiseptics (living tissue) vs disinfectants (inanimate): alcohol 70%, chlorhexidine, povidone-iodine (iodophor), hydrogen peroxide, chlorine (hypochlorite), glutaraldehyde, phenol, cetrimide, potassium permanganate, gentian violet."],
flow:{t:"Phases of a new drug",n:["Drug discovery & lead optimisation","Preclinical: animal pharmacology & toxicology","Regulatory permission (CDSCO) + ethics committee approval",{b:[["Phase I","Healthy volunteers","Safety, PK, max tolerated dose"],["Phase II","Small patient groups","Efficacy, dose range"],["Phase III","Large RCTs","Confirm efficacy vs standard"]]},"Marketing approval",{k:"Phase IV: post-marketing surveillance, rare ADRs, new uses"}]},
hy:["Phase I trial subjects?::Healthy volunteers (patients for toxic drugs like anticancers)","Phase IV is?::Post-marketing surveillance","Indian drug regulator?::CDSCO (headed by DCGI)","India's essential medicines list?::NLEM (latest 2022)","Drugs needing TDM?::Digoxin, lithium, phenytoin, aminoglycosides, vancomycin, cyclosporine","Antiseptic preferred for surgical scrub?::Chlorhexidine / povidone-iodine","Most effective concentration of alcohol as antiseptic?::70% (ethanol 60–80%)","Teratogen causing phocomelia?::Thalidomide"],
mcq:[["Phase III clinical trials are done on:",["Animals","Healthy volunteers","Large number of patients","After marketing"],2,"Phase III confirms efficacy in large randomised trials."],["Therapeutic drug monitoring is most useful for:",["Penicillin","Lithium","Paracetamol","Omeprazole"],1,"Lithium has a narrow therapeutic range."],["Generic names should be written in prescriptions in:",["Small letters","Capital letters","Brand form","Latin"],1,"NMC guidance: legible, preferably capital letters."]]});

/* one call path for both hosts: Claude app (sample) or a website (/api/ai) */
async function callAI(input,{signal,onText,tier,chat}={}){
  if(SAMPLE){const o={signal};if(onText)o.onText=onText;if(tier)o.modelTier=tier;if(chat)o.cache=false;return SAMPLE(input,o);}
  const messages=typeof input==="string"?[{role:"user",content:input}]:input;
  let r;try{r=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages}),signal});}
  catch(e){throw {code:signal&&signal.aborted?"cancelled":"upstream_error"};}
  if(!r.ok)throw {code:r.status===429?"rate_limited":r.status===413?"prompt_too_large":"upstream_error"};
  const rd=r.body.getReader(),dec=new TextDecoder();let text="";
  try{for(;;){const {done,value}=await rd.read();if(done)break;const d=dec.decode(value,{stream:true});if(d){text+=d;onText&&onText({text,delta:d});}}}
  catch(e){throw {code:signal&&signal.aborted?"cancelled":"upstream_error",text};}
  if(!text.trim())throw {code:"empty_completion"};
  return {text,truncated:false};
}
function parseJSONish(t){try{return JSON.parse(t);}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1]);}catch(e){}}const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}throw {code:"invalid_json",text:t};}

Style: short headings, bullet points, **bold** key terms, a mnemonic or flow (A → B → C) when it helps, and an "Exam tip" line on how to write it in the paper (LAQ / short note / viva). ${S.lang==="hinglish"?"Write in friendly Hinglish (Hindi-English mix in Roman script); keep all medical terms in English.":"Write in clear, simple English."} Use markdown; no HTML.`;

function errMsg(e){switch(e&&e.code){case"cancelled":return"";case"not_granted":case"sampling_disabled":case"not_declared":case"capability_disabled":case"capability_removed":return"AI is not allowed for this page right now. Allow Claude for this page to use the AI tools.";case"rate_limited":return"Too many AI requests at once. Wait a minute, then try again.";case"session_expired":return"Your Claude session expired. Sign in again, then retry.";case"refused":return"Claude could not answer that. Rephrase the question and try again.";case"prompt_too_large":return"That request is too long. Pick fewer chapters or a shorter question.";case"invalid_json":return"The answer came back in an unexpected format. Press the button again.";case"empty_completion":return"No answer came back. Try a simpler request.";default:return"Connection problem while answering. Press the button again.";}}
async function aiStream(out,input,{key="main",tier,chat=false}={}){
  if(!SAMPLE&&!WEBAI){out.innerHTML=offMsg();return null;}
  CTL[key]?.abort();const ctl=new AbortController();CTL[key]=ctl;
  out.innerHTML=thinking();showStop(key,true);
  try{const r=await callAI(input,{signal:ctl.signal,tier,chat,onText:({text})=>{out.innerHTML=md(text);}});out.innerHTML=md(r.text)+(r.truncated?'<p class="note">The answer was cut short. Ask for a smaller part.</p>':"");return r.text;}
  catch(e){if(e&&e.code==="refused")out.innerHTML="";else out.innerHTML=e&&e.text?md(e.text):"";const m=errMsg(e);if(m)out.insertAdjacentHTML("beforeend",`<p class="notice">${esc(m)}</p>`);return null;}
  finally{showStop(key,false);}
}
async function aiJSON(out,input,{key="json",tier}={}){
  if(!SAMPLE&&!WEBAI){out.innerHTML=offMsg();return null;}
  CTL[key]?.abort();const ctl=new AbortController();CTL[key]=ctl;
  out.innerHTML=thinking("Preparing");showStop(key,true);
  try{let v;if(SAMPLE){const opts={signal:ctl.signal,cache:false};if(tier)opts.modelTier=tier;v=await SAMPLE.json(input,opts);}else{const r=await callAI(input+"\n\nReply with the JSON value only, no prose.",{signal:ctl.signal});v=parseJSONish(r.text);}out.innerHTML="";return v;}
  catch(e){const m=errMsg(e);out.innerHTML=m?`<p class="notice">${esc(m)}</p>`:"";return null;}
  finally{showStop(key,false);}
